                        actions: `<button onclick="openAddSettingModal('${key}')" class="px-3 py-1.5 ${addCls} rounded-xl text-xs font-semibold transition"><i class="fa-solid fa-plus"></i> ${addLabel}</button>`,
                        body: `
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 col-flow" style="--rows: ${Math.ceil(settings[key].length / 2)}" data-sort-list="set:${key}">
                                ${settings[key].map((w, idx) => `
                                    <div data-sort-item data-id="${esc(w.id || idx)}" class="rounded-2xl border flex items-stretch overflow-hidden shadow-xs" style="background-color: ${esc(w.color)}; color: ${esc(w.fontColor)}">
                                        ${gripHandle('rounded-r-xl', 'bg-black/10 text-current')}
                                        <div class="flex-1 min-w-0 p-3 flex items-center justify-between gap-2">
                                            <span class="font-bold text-sm">${esc(w.name)}</span>
                                            <div class="flex items-center space-x-2">
                                                <button onclick="openEditSettingModal('${key}', ${idx})" class="p-1.5 bg-white/80 rounded-lg hover:bg-white text-xs text-slate-700"><i class="fa-solid fa-pen"></i></button>
                                                <button onclick="deleteSettingItem('${key}', ${idx})" class="p-1.5 bg-white/80 rounded-lg hover:bg-white text-xs text-rose-600"><i class="fa-solid fa-trash"></i></button>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            ${key === 'tags' ? renderAutoTagSettings(settings) : ''}`
                    })).join('')}

                    ${settingsCard('colorcodes', {
                        title: 'Treatment Code',
                        icon: '<i class="fa-solid fa-paintbrush text-blue-400"></i>',
                        actions: `<button onclick="openAddColorCodeModal()" class="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-xl text-xs font-semibold transition"><i class="fa-solid fa-plus"></i> Add Code</button>`,
                        body: `
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 col-flow" style="--rows: ${Math.ceil(settings.colorCodes.length / 2)}" data-sort-list="set:colorCodes">
                                ${settings.colorCodes.map((c, idx) => `
                                    <div data-sort-item data-id="${esc(c.id || idx)}" class="rounded-2xl border border-slate-200 bg-slate-50 flex items-stretch overflow-hidden shadow-xs">
                                        ${gripHandle('rounded-r-xl', 'bg-slate-200/70 text-slate-400')}
                                        <div class="flex-1 min-w-0 p-3 flex items-center justify-between gap-2">
                                        <span class="font-bold text-sm" style="color: ${esc(c.color)}">${esc(c.name)}</span>
                                        <div class="flex items-center space-x-2">
                                            <button onclick="openEditColorCodeModal(${idx})" class="p-1.5 bg-white border border-slate-200 rounded-lg hover:bg-slate-100 text-xs text-slate-700"><i class="fa-solid fa-pen"></i></button>
                                            <button onclick="deleteColorCodeItem(${idx})" class="p-1.5 bg-white border border-slate-200 rounded-lg hover:bg-slate-100 text-xs text-rose-600"><i class="fa-solid fa-trash"></i></button>
                                        </div>
                                    </div>
                                    </div>
                                `).join('')}
                            </div>`
                    })}

                    <div class="flex justify-center pt-6 pb-10">
                        <button onclick="openWipeModal()" class="px-6 py-2.5 rounded-2xl bg-white border-2 border-rose-300 text-rose-700 hover:bg-rose-50 text-sm font-bold flex items-center gap-2 transition shadow-sm">
                            <i class="fa-solid fa-triangle-exclamation"></i> Wipe data
                        </button>
                    </div>
                </div>
            `;
        }

        /* ---- Wipe data (Settings, bottom) ----
           Patient records only: patients, day lists, list ink and box states. Everything: also settings,
           colours, lab settings, appearance - the app starts as new. Each choice needs a second tap. */
        let wipeArmed = null, wipeTimer = null;
        function openWipeModal() {
            wipeArmed = null;
            renderWipeModal();
        }
        function renderWipeModal() {
            const btn = (kind, label, sub) => `<button onclick="wipeData('${kind}')" class="w-full px-4 py-3 rounded-2xl text-left border-2 transition ${wipeArmed === kind ? 'bg-rose-600 border-rose-600 text-white' : 'bg-white border-rose-200 text-rose-700 hover:bg-rose-50'}">
                    <span class="block text-sm font-bold">${wipeArmed === kind ? '<i class="fa-solid fa-hand-pointer"></i> Tap again to wipe' : label}</span>
                    <span class="block text-xs ${wipeArmed === kind ? 'text-white/85' : 'text-slate-500'}">${sub}</span></button>`;
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50" onclick="if (event.target === this) closeModal()">
                    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-4 border-t-4 border-rose-500">
                        <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation text-rose-500"></i> Are you sure?</h3>

                        <div class="space-y-2">
                            ${btn('patients', 'Wipe patient records only', 'Patients, lists, notes and ink. Your settings stay.')}
                            ${btn('all', 'Wipe everything, including settings', 'The app starts as new on this device.')}

        function wipeData(kind) {
            if (wipeArmed !== kind) {
                wipeArmed = kind; renderWipeModal();
                clearTimeout(wipeTimer); wipeTimer = setTimeout(() => { wipeArmed = null; if (document.getElementById('modal-container').innerHTML.includes('Are you sure?')) renderWipeModal(); }, 4000);
                return;
            }
            clearTimeout(wipeTimer); wipeArmed = null;
            BIG_KEYS.forEach(k => Store.remove(k));
            try { localStorage.removeItem(STORAGE_PREFIX + 'all_patients'); localStorage.removeItem(STORAGE_PREFIX + 'daily_records'); } catch (e) {}
            if (kind === 'all') {
                try {
                    Object.keys(localStorage).filter(k => k.startsWith(STORAGE_PREFIX) && k !== STORAGE_PREFIX + 'idb').forEach(k => localStorage.removeItem(k));
                } catch (e) {}
            }
            BigStore.flush();
            closeModal();
            showToast(kind === 'all' ? 'Everything wiped' : 'Patient records wiped');
            setTimeout(() => { if (kind === 'all') location.reload(); else { activePatientId = null; renderApp(); } }, 400);
        }

        // the investigations box and every investigation card.
        function recordAnyOpen(p, note, isConsult) {
            const memoOpen = ['daily', 'emr', 'summary'].some(k => !memoCollapsed[k]) &&
                ((note && (note.memo || '').trim()) || (p.emrMemo || '').trim() || String((getDayInfo(p, curKey()) || {}).caseSummary || '').trim());
            const cards = (note && note.investigations) || [];
            return !isMedicalBgCollapsed || !!memoOpen || !invBoxCollapsed || cards.some(x => !x.collapsed) || !coreCollapsed.issues || !coreCollapsed.plan || !coreCollapsed.details;
        }
        function setRecordCollapsed(collapse) {
            isMedicalBgCollapsed = collapse;
            memoCollapsed = { daily: collapse, emr: collapse, summary: collapse };
            invBoxCollapsed = collapse;
            dcPlanCollapsed = collapse;
            coreCollapsed = { issues: collapse, plan: collapse, details: collapse, pads: collapse };
            ['issues', 'plan', 'details', 'pads'].forEach(k => noteCoreChoice(k, collapse));
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === activePatientId);
            const note = p && p.days && p.days[curKey()];
            ['medbg', 'memo:daily', 'memo:emr', 'memo:summary', 'inv', 'dcplan'].forEach(k => noteViewChoice(k, !collapse));
            if (note && note.investigations) {
                note.investigations.forEach(x => { x.collapsed = collapse; noteViewChoice('card:' + x.id, !collapse); });
                Store.savePatients(allPatients);
            }
            renderApp();

        /* Collapsible boxes in a patient's entry: everything is open the first time an entry is opened.
           After you leave it, it comes back collapsed - except the boxes you opened yourself, which stay open.
           Remembered per entry on this device ("entry_view"). */
        let viewEntryKey = null;
        function noteViewChoice(item, open) {
            if (!viewEntryKey) return;
            const all = Store.get('entry_view', {});
            const v = all[viewEntryKey] || (all[viewEntryKey] = { open: [] });
            v.open = (v.open || []).filter(x => x !== item);
            if (open) v.open.push(item);
            Store.set('entry_view', all);
        }
        // Returns true if card open/closed states changed (the caller saves).
        function applyEntryView(p, key) {
            const id = p.id + '|' + key;
            const all = Store.get('entry_view', {});
            const v = all[id];
            const first = !v;
            const isOpen = (item) => first || (v.open || []).includes(item);
            isMedicalBgCollapsed = !isOpen('medbg');
            memoCollapsed = { daily: !isOpen('memo:daily'), emr: !isOpen('memo:emr'), summary: !isOpen('memo:summary') };
            invBoxCollapsed = !isOpen('inv');
            dcPlanCollapsed = !isOpen('dcplan');
            const closed = (v && v.closed) || [];
            coreCollapsed = { issues: closed.includes('issues'), plan: closed.includes('plan'), details: closed.includes('details'), pads: closed.includes('pads') };
            if (first) {
                all[id] = { open: [] };
                const keys = Object.keys(all);
                if (keys.length > 800) keys.slice(0, keys.length - 800).forEach(k => delete all[k]); // keep it small
                Store.set('entry_view', all);
            }
            let changed = false;
            const note = p.days && p.days[key];
            (note && note.investigations || []).forEach(x => {
                const c = !isOpen('card:' + x.id);
                if (!!x.collapsed !== c) { x.collapsed = c; changed = true; }
            });
            return changed;
        }

        // Copies this list's patients (with their whole entry) to tomorrow's same list, adding to what's there.
        function addAllToTomorrow(type = 'inpatient') {
            const cfg = LIST_CFG[type] || LIST_CFG.inpatient;
            const records = Store.getDailyRecords();
            const today = records[currentViewDate];
            if (!today || !(today[cfg.idsKey] || []).length) { showToast('Nothing to copy from this day.'); return; }
            const tomorrowStr = addDays(currentViewDate, 1);
            const tomorrow = getOrCreateDay(records, tomorrowStr);
            const allPatients = Store.getPatients();
            let skipped = 0;
            (today[cfg.idsKey] || []).forEach(id => {
                const p = allPatients.find(x => x.id === id);
                if (!p) return;
                const dcNote = getDayNote(p, entryKey(currentViewDate, type));
                if (dcNote && dcNote.discharge && dcNote.discharge.skipTomorrow) { skipped++; return; } // discharged
                mergeEntry(p, entryKey(currentViewDate, type), entryKey(tomorrowStr, type));
                if (!tomorrow[cfg.idsKey].includes(id)) tomorrow[cfg.idsKey].push(id);
            });
            const lk = physListKey(type);
            (today[lk] || []).forEach(dr => { if (!tomorrow[lk].includes(dr)) tomorrow[lk].push(dr); });
            Store.saveDailyRecords(records);
            Store.savePatients(allPatients);
            currentViewDate = tomorrowStr;
            renderApp();
            showToast(`Copied to ${fmtDate(tomorrowStr)}${skipped ? ` (${skipped} discharged left out)` : ''}`);
        }

                const type = currentRoute === 'inpatient' ? 'inpatient' : currentRoute === 'consult' ? 'consult' : currentEntryType;

                const shown = displayTags({ id: patientId }, p.tags, currentViewDate, type).some(isNewTag);

                p.tags = (p.tags || []).filter(t => !isNewTag(t) && t !== 'new@' + key && t !== '!new@' + key);
                if (shown && auto) p.tags.push('!new@' + key);
                if (!shown && !auto) p.tags.push('new@' + key);
                Store.savePatients(allPatients);
                renderApp();
                return;
            }
            if (p) {
                if (!p.tags) p.tags = [];
                const idx = p.tags.indexOf(tagName);
                if (idx > -1) {

        // Copies today's unfinished Post D/C follow-ups to tomorrow (skipping ones already there).
        function addPostDcToTomorrow() {
            const records = Store.getDailyRecords();
            const today = records[currentViewDate];
            if (!today || !(today.postDc || []).length) return;
            const tomorrowStr = addDays(currentViewDate, 1);
            const tomorrow = getOrCreateDay(records, tomorrowStr);
            const existing = new Set(tomorrow.postDc.map(i => (i.text || '').trim()));
            let added = 0;
            today.postDc.forEach(item => {
                const text = (item.text || '').trim();
                if (!item.completed && text && !existing.has(text)) {
                    tomorrow.postDc.push({ text: item.text, completed: false });
                    existing.add(text);
                    added++;
                }
            });
            Store.saveDailyRecords(records);
            showToast(added
                ? `${added} follow-up${added === 1 ? '' : 's'} added to ${fmtDate(tomorrowStr)}`
                : `Nothing to add — unfinished follow-ups are already on ${fmtDate(tomorrowStr)}`);
        }

        // From All Patients: put the patient on TODAY's inpatient or consult list.
        // Only name, MRN, gender, age and medical background come along (plus the EMR memo, which is
        // always shared). Everything else starts empty and is flagged with a red (!) until filled in.
        // The day's notes (issues, plan, investigations) start empty.
        function copyPatientToList(patientId, listType) {
            const date = todayStr();
            const records = Store.getDailyRecords();
            const day = getOrCreateDay(records, date);
            const target = listType === 'consult' ? day.consultIds : day.inpatientIds;
            const label = listType === 'consult' ? 'consult' : 'inpatient';
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === patientId);
            if (!p) return;
            if (target.includes(patientId)) {
                showToast(`${p.name} is already on today's ${label} list.`);
                return;
            }
            // A fresh, separate entry for this list (an entry on the other list today is left untouched).
            const key = entryKey(date, listType);
            const last = latestInfoExcept(p, key);
            if (!p.dayInfo) p.dayInfo = {};
            p.dayInfo[key] = normalizeInfo({
                age: last.age,
                medicalBackground: clone(last.medicalBackground),
                // Admitted on / consult date = the day they're added (can be changed in the record)
                ...(listType === 'consult' ? { consultDate: date } : { admissionDate: date })
            });
            if (p.days) delete p.days[key];
            if (p.labs) delete p.labs[key];
            delete day.careFlags[careKey(patientId, listType)];
            gcImages(p);
            target.push(patientId);
            Store.saveDailyRecords(records);
            Store.savePatients(allPatients);
            currentViewDate = date;
            router.navigate(listType === 'consult' ? 'consult' : 'inpatient');
            showToast(`${p.name} added to today's ${label} list`);
        }

                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-1">Room</label>
                                    <input type="text" id="modal-pat-room" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="Room">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-1">Bed</label>
                                    <input type="text" id="modal-pat-bed" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="Bed">

                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-1">Goals of Care</label>
                                    <select id="modal-pat-goc" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                                        ${settings.goalsOfCare.map(g => `<option value="${esc(g.name)}">${esc(g.name)}</option>`).join('')}
                                    </select>

                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-1">${isConsult ? 'Primary Team' : 'Physician Name'}</label>
                                    <input type="text" id="modal-pat-physician" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="${isConsult ? 'e.g. Cardiology' : 'e.g. Ahmed'}">
                                </div>
                                ${isConsult ? `
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-1">Physician Name</label>
                                    <input type="text" id="modal-pat-consultant" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="e.g. Ahmed">
                                </div>` : ''}
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">${isConsult ? 'Consult Date' : 'Admitted on'}</label>
                                ${dateField(currentViewDate, '', { id: 'modal-pat-date', cls: 'w-full justify-between px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm' })}
                            </div>
                        </div>
                        <div class="flex justify-end space-x-2 pt-2">
                            <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-sm font-medium">Cancel</button>
                            <button onclick="submitAddPatient('${listType === 'consult' ? 'consult' : 'inpatient'}')" class="px-4 py-2 ${listType === 'consult' ? 'bg-indigo-600 hover:bg-indigo-700' : 'bg-orange-600 hover:bg-orange-700'} text-white rounded-xl text-sm font-medium">Add Patient</button>
                        </div>
                    </div>
                </div>
            `;
            const nameInput = document.getElementById('modal-pat-name');
            if (nameInput) nameInput.focus();
        }

        // While typing a ward in the Add Patient form, show that ward's colours when the name matches Settings.
        function previewWardColor(input) {
            const v = input.value.trim().toLowerCase();
            const w = Store.getSettings().wards.find(w => w.name.toLowerCase() === v);
            input.style.backgroundColor = w ? w.color : '';
            input.style.color = w ? (w.fontColor || '') : '';
        }

        /* ---------- Same MRN = same patient? ---------- */
        let mrnLink = null; // { mrn, patientId, decided: null | 'yes' | 'no', re: null | 'yes' | 'no' (readmission / reconsult) }
        let addPatientListType = 'inpatient';

        function findPatientByMrn(mrn) {
            const m = String(mrn || '').trim().toLowerCase();
            if (!m) return null;
            return Store.getPatients().find(p => String(p.mrn || '').trim().toLowerCase() === m) || null;
        }

        // Shows the "Is this the same patient?" question when the typed MRN is already registered.
        function checkMrnMatch(force = false) {
            const box = document.getElementById('modal-mrn-match');
            const mrn = ((document.getElementById('modal-pat-mrn') || {}).value || '').trim();
            if (!box) return;
            const match = findPatientByMrn(mrn);
            if (!match) { mrnLink = null; box.className = 'hidden'; box.innerHTML = ''; return; }
            if (!mrnLink || mrnLink.mrn !== mrn || mrnLink.patientId !== match.id) mrnLink = { mrn, patientId: match.id, decided: null, re: null, toc: null, listType: addPatientListType };
            if (mrnLink.decided === 'yes') {
                const info = latestInfo(match);
                const isC = mrnLink.listType === 'consult';
                const newKey = entryKey(currentViewDate, isC ? 'consult' : 'inpatient');
                const anyKey = latestEncounterKey(match, newKey);
                // on the inpatient list, a patient last seen as a consult: accepted transfer of care?
                const tocKey = !isC && anyKey && keyType(anyKey) === 'consult' ? anyKey : null;
                const askBtns = (fn, yes) => `<div class="flex gap-2 flex-wrap">
                                   <button onclick="${fn}('yes')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold">${yes}</button>
                                   <button onclick="${fn}('no')" class="px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-50 rounded-lg text-xs font-semibold">No</button></div>`;
                const askBox = (inner) => `<div class="mt-2 rounded-lg bg-amber-50 border-2 ${force ? 'border-amber-400' : 'border-amber-200'} p-2 text-amber-900 space-y-2">${inner}</div>`;
                const tocQ = !tocKey ? '' : mrnLink.toc === 'yes'
                    ? `<div class="mt-2 rounded-lg bg-white/70 border border-emerald-300 p-2"><i class="fa-solid fa-right-left"></i> <strong>Transfer of care</strong>: their ${esc(encounterLabel(tocKey))} will be brought in, tagged <strong>${esc(tocTagName())}</strong>. <button onclick="answerToc(null)" class="underline ml-1">Change</button></div>`
                    : mrnLink.toc === 'no'
                        ? `<div class="mt-2 text-emerald-800/80">Not a transfer of care. <button onclick="answerToc(null)" class="underline">Change</button></div>`
                        : askBox(`<div><i class="fa-solid fa-circle-question"></i> <strong>Is this an accepted transfer of care?</strong> Their last encounter: <strong>${esc(encounterLabel(tocKey))}</strong>.</div>${askBtns('answerToc', 'Yes, accepted TOC')}`);
                const lastKey = tocKey ? (mrnLink.toc === 'no' ? latestEncounterKeyOf(match, newKey, 'inpatient') : null) : anyKey;
                const what = isC ? 'recent reconsult' : 'recent readmission';
                const reQ = !lastKey ? '' : mrnLink.re === 'yes'
                    ? `<div class="mt-2 rounded-lg bg-white/70 border border-emerald-300 p-2"><i class="fa-solid fa-rotate-right"></i> <strong>${isC ? 'Reconsult' : 'Readmission'}</strong>: their last ${esc(encounterLabel(lastKey))} (issues, plan, investigations) will be brought in, tagged <strong>${esc(reTagName(isC ? 'consult' : 'inpatient'))}</strong>. <button onclick="answerReadmit(null)" class="underline ml-1">Change</button></div>`
                    : mrnLink.re === 'no'
                        ? `<div class="mt-2 text-emerald-800/80">Not a ${what}: added as usual. <button onclick="answerReadmit(null)" class="underline">Change</button></div>`
                        : askBox(`<div><i class="fa-solid fa-circle-question"></i> <strong>Is this a ${what}?</strong> Their last ${isC ? '' : 'inpatient '}encounter: <strong>${esc(encounterLabel(lastKey))}</strong>.</div>${askBtns('answerReadmit', 'Yes, bring their last entry')}`);
                box.className = 'rounded-xl border border-emerald-200 bg-emerald-50 p-3 text-xs text-emerald-900';
                box.innerHTML = `<i class="fa-solid fa-link"></i> Using <strong>${esc(match.name)}</strong>'s last available record. Updating current care information required. <button onclick="answerMrnMatch('no')" class="underline ml-1">Undo</button>${tocQ}${reQ}`;
                return;
            }
            if (mrnLink.decided === 'no') {
                box.className = 'text-[calc(11px*var(--ts,1))] text-slate-500';
                box.innerHTML = `Will be added as a separate patient (same MRN as ${esc(match.name)}). <button onclick="answerMrnMatch(null)" class="underline">Change</button>`;
                return;
            }
            const info = latestInfo(match);
            box.className = `rounded-xl border-2 ${force ? 'border-amber-400' : 'border-amber-200'} bg-amber-50 p-3 text-sm text-amber-900 space-y-2`;
            box.innerHTML = `
                <div><i class="fa-solid fa-circle-question"></i> MRN <strong>${esc(mrn)}</strong> is already registered to <strong>${esc(match.name)}</strong>
                    (${esc(match.gender || 'M')}${info.goalsOfCare ? ', ' + esc(info.goalsOfCare) : ''}). <strong>Is this the same patient?</strong></div>
                <div class="flex gap-2">
                    <button onclick="answerMrnMatch('yes')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold">Yes, use their record</button>
                    <button onclick="answerMrnMatch('no')" class="px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-50 rounded-lg text-xs font-semibold">No, new patient</button>
                </div>`;
        }

        function answerReadmit(answer) { if (!mrnLink) return; mrnLink.re = answer; checkMrnMatch(); }
        function answerToc(answer) { if (!mrnLink) return; mrnLink.toc = answer; mrnLink.re = null; checkMrnMatch(); }
        function answerMrnMatch(answer) {
            if (!mrnLink) return;
            mrnLink.decided = answer;
            if (answer !== 'yes') { mrnLink.re = null; mrnLink.toc = null; }
            if (answer === 'yes') {
                const p = Store.getPatients().find(x => x.id === mrnLink.patientId);
                if (p) {
                    const info = latestInfo(p);
                    const set = (id, v) => { const el = document.getElementById(id); if (el && v) el.value = v; };
                    set('modal-pat-name', p.name);
                    set('modal-pat-gender', p.gender || 'M');
                    set('modal-pat-goc', info.goalsOfCare);
                    if (p.dob) {
                        set('modal-pat-dob', p.dob);
                        const t = document.querySelector('#modal-pat-dob') && document.querySelector('#modal-pat-dob').parentElement.querySelector('.date-field-text');
                        if (t) t.value = fmtDate(p.dob);
                    }
                }
            }
            checkMrnMatch();
        }

        // A patient's most recent entry (inpatient or consult), other than the one being created.
        function latestEncounterKey(p, exceptKey) {
            const keys = [...new Set([...Object.keys(p.dayInfo || {}), ...Object.keys(p.days || {})])].filter(k => k !== exceptKey);
            keys.sort((a, b) => keyDate(a) < keyDate(b) ? -1 : keyDate(a) > keyDate(b) ? 1 : 0);
            return keys.length ? keys[keys.length - 1] : null;
        }
        const encounterLabel = (k) => `${keyType(k) === 'consult' ? 'consult' : 'inpatient'} entry of ${fmtDate(keyDate(k))}`;
        function tocTagName() {
            const t = (Store.getSettings().tags || []).find(t => String(t.name).toLowerCase().replace(/[^a-z]/g, '') === 'toc');
            return t ? t.name : 'TOC';
        }
        // latest entry of one list type (inpatient / consult)
        function latestEncounterKeyOf(p, exceptKey, type) {
            const keys = [...new Set([...Object.keys(p.dayInfo || {}), ...Object.keys(p.days || {})])].filter(k => k !== exceptKey && keyType(k) === type).sort();
            return keys.length ? keys[keys.length - 1] : null;
        }
        function reTagName(type) {
            const want = type === 'consult' ? 'recnslt' : 'readm';
            const t = (Store.getSettings().tags || []).find(t => String(t.name).toLowerCase().replace(/[^a-z]/g, '') === want);
            return t ? t.name : (type === 'consult' ? 'ReCnslt' : 'ReAdm');
        }
        // Adds a new entry for an existing patient (same MRN, answered "yes").
        // Readmission / reconsult: their latest entry (issues, plan, investigations…) comes with it, tagged ReAdm / ReCnslt.
        // copy: null, or { key: entry to bring in, tag: tag name, toc: true for a transfer of care }
        function addEntryForExistingPatient(patientId, listType, fields, copy = null) {
            const type = listType === 'consult' ? 'consult' : 'inpatient';
            const date = currentViewDate;
            const key = entryKey(date, type);
            const records = Store.getDailyRecords();
            const day = getOrCreateDay(records, date);
            const list = type === 'consult' ? day.consultIds : day.inpatientIds;
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === patientId);
            if (!p) return;
            if (list.includes(patientId)) {
                closeModal();
                showToast(`${p.name} is already on this ${type} list.`);
                return;
            }
            const last = latestInfoExcept(p, key);
            const lastKey = copy ? copy.key : null;
            p.name = fields.name || p.name;
            p.gender = fields.gender || p.gender;
            p.dob = fields.dob || p.dob || '';
            if (!p.dayInfo) p.dayInfo = {};
            p.dayInfo[key] = normalizeInfo({ ...fields.info, medicalBackground: clone(last.medicalBackground), tags: [] });
            if (p.days) delete p.days[key];
            if (p.labs) delete p.labs[key];
            delete day.careFlags[careKey(patientId, type)];
            if (lastKey) {
                const srcInfo = getDayInfo(p, lastKey);
                mergeEntry(p, lastKey, key);
                p.dayInfo[key].tags = [copy.tag]; // old day-to-day tags don't carry over; the readmission / TOC tag does
                // from a consult to our own list: our physician was the consultant (the consult's "physician" is the primary team)
                if (copy.toc) tocConvert(p, key, fields.info.physician, srcInfo.physician);
            }
            list.push(patientId);
            Store.savePatients(allPatients);
            Store.saveDailyRecords(records);
            mrnLink = null;
            closeModal();
            renderApp();
            showToast(lastKey ? `${p.name} added as ${copy.toc ? 'a transfer of care' : type === 'consult' ? 'a reconsult' : 'a readmission'}, with their ${encounterLabel(lastKey)}` : `${p.name} added from their existing record`);
        }

        function submitAddPatient(listType) {
            const val = (id) => {
                const el = document.getElementById(id);
                return el ? el.value.trim() : '';
            };

            const name = val('modal-pat-name');
            if (!name) {
                const err = document.getElementById('modal-pat-name-error');
                const input = document.getElementById('modal-pat-name');
                if (err) err.classList.remove('hidden');
                if (input) { input.classList.add('border-rose-400'); input.focus(); }
                return;
            }

            // Blank fields stay blank. Nothing is filled in automatically.
            const drName = val('modal-pat-physician');
            const consultantName = listType === 'consult' ? val('modal-pat-consultant') : '';

            // Same MRN as a registered patient? Ask first; "yes" adds an entry to that patient.
            const match = findPatientByMrn(val('modal-pat-mrn'));
            if (match && !(mrnLink && mrnLink.patientId === match.id && mrnLink.decided)) {
                checkMrnMatch(true);
                const box = document.getElementById('modal-mrn-match');
                if (box) box.scrollIntoView({ block: 'center', behavior: 'smooth' });
                return;
            }
            if (match && mrnLink.decided === 'yes') {
                const isC = listType === 'consult';
                const newKey = entryKey(currentViewDate, isC ? 'consult' : 'inpatient');
                const anyKey = latestEncounterKey(match, newKey);
                const tocKey = !isC && anyKey && keyType(anyKey) === 'consult' ? anyKey : null;
                const reKey = tocKey ? (mrnLink.toc === 'no' ? latestEncounterKeyOf(match, newKey, 'inpatient') : null) : anyKey;
                const ask = () => { checkMrnMatch(true); const box = document.getElementById('modal-mrn-match'); if (box) box.scrollIntoView({ block: 'center', behavior: 'smooth' }); };
                if (tocKey && !mrnLink.toc) { ask(); return; }
                if (reKey && !mrnLink.re) { ask(); return; }
                const copy = tocKey && mrnLink.toc === 'yes' ? { key: tocKey, tag: tocTagName(), toc: true }
                    : reKey && mrnLink.re === 'yes' ? { key: reKey, tag: reTagName(isC ? 'consult' : 'inpatient') } : null;
                addEntryForExistingPatient(match.id, listType, {
                    name,
                    gender: val('modal-pat-gender') || 'M',
                    dob: val('modal-pat-dob'),
                    info: {
                        ward: canonicalWard(val('modal-pat-ward')),
                        room: val('modal-pat-room'),
                        bed: val('modal-pat-bed'),
                        goalsOfCare: val('modal-pat-goc'),
                        physician: drName,
                        consultant: consultantName,
                        admissionDate: isC ? '' : (val('modal-pat-date') || currentViewDate),
                        consultDate: isC ? (val('modal-pat-date') || currentViewDate) : ''
                    }
                }, copy);
                return;
            }

            const newId = 'p_' + Date.now();
            const newPatient = {
                id: newId,
                name: name,
                mrn: val('modal-pat-mrn'),
                gender: val('modal-pat-gender') || 'M',
                dob: val('modal-pat-dob'),
                emrMemo: '',
                days: {},
                dayInfo: {
                    [entryKey(currentViewDate, listType === 'consult' ? 'consult' : 'inpatient')]: normalizeInfo({
                        ward: canonicalWard(val('modal-pat-ward')),
                        room: val('modal-pat-room'),
                        bed: val('modal-pat-bed'),
                        goalsOfCare: val('modal-pat-goc'),
                        physician: drName,
                        consultant: consultantName,
                        // Inpatients: admitted on. Consults: consult date (admitted on can be filled in later).
                        admissionDate: listType === 'consult' ? '' : (val('modal-pat-date') || currentViewDate),
                        consultDate: listType === 'consult' ? (val('modal-pat-date') || currentViewDate) : '',
                        tags: []
                    })
                }
            };

            const allPatients = Store.getPatients();
            allPatients.push(newPatient);
            Store.savePatients(allPatients);

            const records = Store.getDailyRecords();
            const day = getOrCreateDay(records, currentViewDate);
            if (listType === 'inpatient') {
                day.inpatientIds.push(newId);
            } else {
                day.consultIds.push(newId);
            }
            Store.saveDailyRecords(records);
            closeModal();
            renderApp();
        }

        function openDeletePatientModal(patientId) {
            const p = Store.getPatients().find(x => x.id === patientId);
            if (!p) return;
            showConfirm({
                title: 'Delete Patient',
                messageHtml: `Are you sure you want to delete <strong>${esc(p.name)}</strong>? This removes the patient from every day's list and cannot be undone.`,
                confirmLabel: 'Delete',
                onConfirm: () => confirmDeletePatient(patientId)
            });
        }

        function confirmDeletePatient(patientId) {
            const allPatients = Store.getPatients();
            const updatedPatients = allPatients.filter(p => p.id !== patientId);
            Store.savePatients(updatedPatients);

            const records = Store.getDailyRecords();
            Object.keys(records).forEach(date => {
                const day = records[date];
                if (day.inpatientIds) day.inpatientIds = day.inpatientIds.filter(id => id !== patientId);
                if (day.consultIds) day.consultIds = day.consultIds.filter(id => id !== patientId);
                if (day.careFlags) { delete day.careFlags[patientId]; delete day.careFlags[patientId + '@c']; }
            });
            Store.saveDailyRecords(records);
            closeModal();
            renderApp();
        }

           ========================================================= */

        function submitAddSetting(category) {
            const nameEl = document.getElementById('modal-set-name');
            const colorEl = document.getElementById('modal-set-color');
            const fontColorEl = document.getElementById('modal-set-fontcolor');
            if (!nameEl || !colorEl) return;
            const name = nameEl.value.trim();
            const color = colorEl.value;
            const fontColor = fontColorEl ? fontColorEl.value : '#1e293b';
            if (!name) return;

            const settings = Store.getSettings();
            if (!settings[category]) settings[category] = [];
            settings[category].push({ id: 's_' + Date.now(), name, color, fontColor });
            Store.saveSettings(settings);
            closeModal();
            renderApp();
        }

        function openEditSettingModal(category, idx) {
            const settings = Store.getSettings();
            const item = settings[category][idx];
            if (!item) return;
            const container = document.getElementById('modal-container');
            if (!container) return;

            container.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-4">
                        <h3 class="text-lg font-bold text-slate-800">Edit ${esc(category)}</h3>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">Name</label>
                                <input type="text" id="modal-edit-set-name" value="${esc(item.name)}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">Background Color</label>
                                <input type="color" id="modal-edit-set-color" value="${esc(item.color || '#e0f2fe')}" class="w-full h-10 rounded-xl border border-slate-200 p-1 bg-slate-50 cursor-pointer">
                            </div>

                                <label class="block text-xs font-medium text-slate-500 mb-1">Font Color Mode</label>

        /* =========================================================
           BACKUP: export / import (optional password encryption)
           ========================================================= */

        const textEnc = new TextEncoder();
        const textDec = new TextDecoder();

        function cryptoAvailable() {
            return !!(window.crypto && window.crypto.subtle && window.isSecureContext !== false);
        }

        function bufToB64(buf) {
            const bytes = new Uint8Array(buf);
            let s = '';
            for (let i = 0; i < bytes.length; i += 0x8000) {
                s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            }
            return btoa(s);
        }

        function b64ToBuf(b64) {
            const s = atob(b64);
            const bytes = new Uint8Array(s.length);
            for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
            return bytes;
        }

        async function deriveKey(password, salt) {
            const base = await crypto.subtle.importKey('raw', textEnc.encode(password), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' },
                base,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function encryptJson(obj, password) {
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const key = await deriveKey(password, salt);
            const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, textEnc.encode(JSON.stringify(obj)));
            return { salt: bufToB64(salt), iv: bufToB64(iv), ciphertext: bufToB64(ct) };
        }

        async function decryptJson(payload, password) {
            const key = await deriveKey(password, b64ToBuf(payload.salt));
            const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBuf(payload.iv) }, key, b64ToBuf(payload.ciphertext));
            return JSON.parse(textDec.decode(pt));
        }

        function collectBackupData() {
            const data = {};
            BACKUP_KEYS.forEach(k => {
                try {
                    const raw = Store.raw(k);
                    if (raw !== null) data[k] = JSON.parse(raw);
                } catch(e) {}
            });
            // Include current (possibly unsaved first-run) values so the backup is never empty.
            if (!data.settings) data.settings = Store.getSettings();
            if (!data.all_patients) data.all_patients = Store.getPatients();
            if (!data.daily_records) data.daily_records = Store.getDailyRecords();
            return data;
        }

        // Keeps only the chosen days: those days' lists, and those patients' entries for those days.
        function filterBackupToDays(data, from, to) {
            const inRange = (k) => { const d = keyDate(k); return d >= from && d <= to; };
            const records = {};
            Object.keys(data.daily_records || {}).filter(inRange).forEach(d => { records[d] = clone(data.daily_records[d]); });
            const listed = new Set();
            Object.entries(records).forEach(([d, r]) => {
                (r.inpatientIds || []).forEach(id => listed.add(id));
                (r.consultIds || []).forEach(id => listed.add(id));
            });
            const patients = (data.all_patients || []).filter(p => listed.has(p.id)).map(p => {
                const q = clone(p);
                ['dayInfo', 'days', 'labs'].forEach(bag => {
                    if (!q[bag]) return;
                    Object.keys(q[bag]).forEach(k => { if (!inRange(k)) delete q[bag][k]; });
                });
                // Make sure every exported entry carries its details (they may have been inherited from an earlier day).
                if (!q.dayInfo) q.dayInfo = {};
                Object.entries(records).forEach(([d, r]) => {
                    if ((r.inpatientIds || []).includes(p.id) && !q.dayInfo[d]) q.dayInfo[d] = getDayInfo(p, d);
                    if ((r.consultIds || []).includes(p.id) && !q.dayInfo[d + '@c']) q.dayInfo[d + '@c'] = getDayInfo(p, d + '@c');
                });
                gcImages(q);
                return q;
            });
            return { ...data, all_patients: patients, daily_records: records, scope: { from, to } };
        }

        async function submitExport() {
            const pwEl = document.getElementById('modal-export-pw');
            const pw2El = document.getElementById('modal-export-pw2');
            const pw = pwEl ? pwEl.value : '';
            const pw2 = pw2El ? pw2El.value : '';

                showModalError('modal-export-error', 'The two passwords do not match.');
                return;
            }

            const btn = document.getElementById('modal-export-btn');
            if (btn) btn.disabled = true;

            const exportedAt = new Date().toISOString();
            let data = collectBackupData();
            const incBox = document.getElementById('exp-settings');
            if (incBox && !incBox.checked) {
                SETTINGS_KEYS.forEach(k => { delete data[k]; });
                data.noSettings = true;
            }
            let suffix = '';
            if (exportScope !== 'all') {
                const val = (id) => (document.getElementById(id) || {}).value || '';
                let from = exportScope === 'day' ? val('exp-day') : val('exp-from');
                let to = exportScope === 'day' ? val('exp-day') : val('exp-to');
                if (!from || !to) { showModalError('modal-export-error', 'Please choose the date(s) to export.'); if (btn) btn.disabled = false; return; }
                if (from > to) [from, to] = [to, from];
                data = filterBackupToDays(data, from, to);
                if (!data.all_patients.length) { showModalError('modal-export-error', 'No patients are on the lists for those dates.'); if (btn) btn.disabled = false; return; }
                suffix = from === to ? `-day-${from}` : `-${from}-to-${to}`;
            }
            let file;
            try {
                if (pw) {
                    file = { app: 'RoundMaster', format: 1, exportedAt, encrypted: true, ...(await encryptJson(data, pw)) };
                } else {
                    file = { app: 'RoundMaster', format: 1, exportedAt, encrypted: false, data };
                }
            } catch(e) {
                showModalError('modal-export-error', 'Could not create the backup file.');
                if (btn) btn.disabled = false;
                return;
            }

            const blob = new Blob([JSON.stringify(file)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            // File name: RM.Ex-YYYY-MM-DD-HHMM (date and 24-hour time of the export)
            const now = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            a.download = `RM.Ex-${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 2000);

            if (exportScope === 'all') Store.set('last_backup', exportedAt);
            exportScope = 'all';
            closeModal();
            renderApp();
        }

        function triggerImport() {
            const input = document.getElementById('import-file-input');
            if (input) input.click();
        }

        let pendingImport = null;

        function handleImportFile(input) {
            const file = input.files && input.files[0];
            input.value = '';
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                let parsed;
                try {
                    // Read by content, not by file name: some phones save the backup as .txt, .bin or with no extension.
                    let text = String(reader.result || '').replace(/^\uFEFF/, '').trim();
                    const i = text.indexOf('{'), j = text.lastIndexOf('}');
                    if (i > 0 || (j >= 0 && j < text.length - 1)) text = text.slice(i, j + 1);
                    parsed = JSON.parse(text);
                } catch(e) {
                    alert('This file is not a valid RoundMaster backup.');
                    return;
                }
                if (!parsed || parsed.app !== 'RoundMaster') {
                    alert('This file is not a RoundMaster backup.');
                    return;
                }
                if (parsed.encrypted) {
                    openImportPasswordModal(parsed);
                } else {
                    confirmImport(parsed.data, parsed.exportedAt);
                }
            };
            reader.onerror = () => alert('Could not read the file.');
            reader.readAsText(file);
        }

        function openImportPasswordModal(parsed) {
            if (!cryptoAvailable()) {
                alert('This backup is password-protected, but this browser cannot decrypt it. Try opening RoundMaster in an up-to-date Chrome, Edge, Safari or Firefox.');
                return;
            }
            pendingImport = parsed;
            const container = document.getElementById('modal-container');
            if (!container) return;
            container.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-4">
                        <h3 class="text-lg font-bold text-slate-800">Enter Backup Password</h3>
                        <p class="text-xs text-slate-500">This backup from ${esc(formatDateTime(parsed.exportedAt))} is password-protected.</p>
                        <input type="password" id="modal-import-pw" autocomplete="current-password" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="Password">
                        <p id="modal-import-error" class="hidden text-xs text-rose-600"></p>
                        <div class="flex justify-end space-x-2 pt-2">
                            <button onclick="pendingImport = null; closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-sm">Cancel</button>
                            <button id="modal-import-btn" onclick="submitImportPassword()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium">Unlock</button>
                        </div>
                    </div>
                </div>
            `;
            const pwInput = document.getElementById('modal-import-pw');
            if (pwInput) pwInput.focus();
        }

        async function submitImportPassword() {
            if (!pendingImport) return;
            const pwEl = document.getElementById('modal-import-pw');
            const pw = pwEl ? pwEl.value : '';
            const btn = document.getElementById('modal-import-btn');
            if (btn) btn.disabled = true;
            try {
                const data = await decryptJson(pendingImport, pw);
                const exportedAt = pendingImport.exportedAt;
                pendingImport = null;
                confirmImport(data, exportedAt);
            } catch(e) {
                showModalError('modal-import-error', 'Wrong password, or the file is damaged.');
                if (btn) btn.disabled = false;
            }
        }

        function isValidBackupData(d) {
            if (!d || typeof d !== 'object') return false;
            if (d.all_patients !== undefined && !Array.isArray(d.all_patients)) return false;
            if (d.daily_records !== undefined && (typeof d.daily_records !== 'object' || Array.isArray(d.daily_records))) return false;
            if (d.settings !== undefined && typeof d.settings !== 'object') return false;
            return true;
        }

        let pendingImportData = null;
        function confirmImport(data, exportedAt) {
            if (!isValidBackupData(data)) {
                alert('This backup file is damaged or in an unknown format. Nothing was changed.');
                return;
            }
            pendingImportData = data;
            const count = Array.isArray(data.all_patients) ? data.all_patients.length : 0;
            const scope = data.scope ? (data.scope.from === data.scope.to ? `for ${fmtDate(data.scope.from)}` : `for ${fmtDate(data.scope.from)} – ${fmtDate(data.scope.to)}`) : '(full backup)';
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4">
                        <h3 class="text-lg font-bold text-slate-800">Import backup</h3>
                        <p class="text-xs text-slate-500">From <strong>${esc(formatDateTime(exportedAt))}</strong> · ${count} patient${count === 1 ? '' : 's'} ${esc(scope)}</p>
                        <button onclick="runImport('add')" class="w-full text-left p-3 rounded-2xl border-2 border-emerald-200 bg-emerald-50 hover:bg-emerald-100 transition">
                            <span class="block font-bold text-emerald-800 text-sm"><i class="fa-solid fa-plus"></i> Add to my data</span>
                            <span class="block text-[calc(11px*var(--ts,1))] text-emerald-900/70 mt-0.5">Keeps everything you have. New patients and entries are added; patients are matched by MRN. Entries you already have for the same day stay as yours.</span>
                        </button>
                        <button onclick="runImport('replace')" class="w-full text-left p-3 rounded-2xl border-2 border-rose-200 bg-rose-50 hover:bg-rose-100 transition">
                            <span class="block font-bold text-rose-700 text-sm"><i class="fa-solid fa-arrows-rotate"></i> Replace my data</span>
                            <span class="block text-[calc(11px*var(--ts,1))] text-rose-900/70 mt-0.5">Deletes everything on this device and uses the backup instead. Export your current data first if you might need it.</span>
                        </button>
                        ${data.noSettings ? `<p class="text-[calc(11px*var(--ts,1))] text-slate-400">This file has no settings; yours stay as they are.</p>` : data.scope ? `
                            <div class="p-3 rounded-2xl border border-slate-200 bg-slate-50">
                                <label class="flex items-center justify-between gap-3 cursor-pointer">
                                    <span class="text-xs font-semibold text-slate-700">Also import settings</span>
                                    <input type="checkbox" id="imp-settings" onchange="document.getElementById('imp-settings-warn').classList.toggle('hidden', !this.checked)" class="w-5 h-5 accent-amber-600">
                                </label>
                                <p class="text-[calc(11px*var(--ts,1))] text-slate-400 mt-1">Off: only patients and lists are imported; your settings stay as they are.</p>
                                <p id="imp-settings-warn" class="hidden text-[calc(11px*var(--ts,1))] font-semibold text-amber-700 mt-1.5"><i class="fa-solid fa-triangle-exclamation"></i> Your wards, goals of care, tags, colour codes, investigation sets, physician colours and appearance will be replaced by the ones in this file.</p>
                            </div>` : `<p class="text-[calc(11px*var(--ts,1))] text-slate-400">A full backup includes settings.</p>`}
                        <div class="flex justify-end"><button onclick="pendingImportData = null; closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-sm">Cancel</button></div>
                    </div>
                </div>`;
        }
        // Settings carried by a backup (everything except patients and lists).
        const SETTINGS_KEYS = ['settings', 'physician_colors_v2', 'physician_color_pins', 'lab_settings', 'theme', 'card_scale', 'text_scale', 'settings_closed'];
        function runImport(mode) {
            const data = pendingImportData;
            const box = document.getElementById('imp-settings');
            // Full backups always bring their settings; one-day / date-range files only when ticked.
            const withSettings = !!data && !data.noSettings && (!data.scope || !!(box && box.checked));
            pendingImportData = null;
            closeModal();
            if (!data) return;
            if (mode === 'replace') applyImport(data, withSettings);
            else mergeImport(data, withSettings ? (data.scope ? 'replace' : 'merge') : 'none');
        }

        // "Add": merges a backup into what's already here.
        // settingsMode: 'merge' (full backup: add what you don't have), 'replace' (overwrite with the file's), 'none'.
        function mergeImport(data, settingsMode = 'merge') {
            const local = Store.getPatients();
            const records = Store.getDailyRecords();
            const idMap = {};
            let newPatients = 0, newEntries = 0;
            const mrnKey = (m) => String(m || '').trim().toLowerCase();
            (data.all_patients || []).forEach(ip => {
                let lp = local.find(x => x.id === ip.id) || (mrnKey(ip.mrn) && local.find(x => mrnKey(x.mrn) === mrnKey(ip.mrn)));
                if (!lp) {
                    const copy = clone(ip);
                    if (local.some(x => x.id === copy.id)) copy.id = 'p_' + Date.now() + Math.random().toString(36).slice(2, 6);
                    local.push(copy);
                    idMap[ip.id] = copy.id;
                    newPatients++;
                    newEntries += Object.keys(copy.dayInfo || {}).length;
                    return;
                }
                idMap[ip.id] = lp.id;
                ['mrn', 'dob', 'emrMemo', 'gender'].forEach(f => { if (!String(lp[f] || '').trim() && ip[f]) lp[f] = ip[f]; });
                ['dayInfo', 'days'].forEach(bag => {
                    Object.entries(ip[bag] || {}).forEach(([k, v]) => {
                        if (!lp[bag]) lp[bag] = {};
                        if (!lp[bag][k]) { lp[bag][k] = clone(v); if (bag === 'dayInfo') newEntries++; }
                    });
                });
                Object.entries(ip.labs || {}).forEach(([k, vals]) => {
                    if (!lp.labs) lp.labs = {};
                    if (!lp.labs[k]) lp.labs[k] = {};
                    Object.entries(vals).forEach(([lk, lv]) => { if (lp.labs[k][lk] === undefined) lp.labs[k][lk] = lv; });
                });
                Object.entries(ip.images || {}).forEach(([imgId, src]) => {
                    if (!lp.images) lp.images = {};
                    if (!lp.images[imgId]) lp.images[imgId] = src;
                });
                Object.entries(ip.recs || {}).forEach(([t, list]) => {
                    const mine = patientRecs(lp, t);
                    (list || []).forEach(r => { if (!mine.some(x => x.id === r.id)) mine.push(clone(r)); });
                });
            });
            Object.entries(data.daily_records || {}).forEach(([date, r]) => {
                const day = getOrCreateDay(records, date);
                const map = (id) => idMap[id] || id;
                (r.inpatientIds || []).map(map).forEach(id => { if (!day.inpatientIds.includes(id)) day.inpatientIds.push(id); });
                (r.consultIds || []).map(map).forEach(id => { if (!day.consultIds.includes(id)) day.consultIds.push(id); });
                (r.physicians || []).forEach(d => { if (!day.physicians.includes(d)) day.physicians.push(d); });
                (r.consultPhysicians || []).forEach(d => { if (!day.consultPhysicians.includes(d)) day.consultPhysicians.push(d); });
                (r.postDc || []).forEach(item => { if (!day.postDc.some(x => (x.text || '').trim() === (item.text || '').trim())) day.postDc.push(clone(item)); });
                Object.entries(r.careFlags || {}).forEach(([k, v]) => {
                    const isC = k.endsWith('@c');
                    const nk = map(isC ? k.slice(0, -2) : k) + (isC ? '@c' : '');
                    if (!day.careFlags[nk]) day.careFlags[nk] = clone(v);
                });
            });
            if (settingsMode === 'replace') {
                SETTINGS_KEYS.forEach(k => { if (data[k] !== undefined) Store.set(k, data[k]); });
                settingsClosed = null;
                try { applyTheme(); applyCardScale(); applyTextScale(); } catch (e) {}
            }
            // Settings: add wards, goals of care, tags and colour codes you don't have yet.
            if (settingsMode === 'merge' && data.settings) {
                const st = Store.getSettings();
                ['wards', 'goalsOfCare', 'tags', 'colorCodes'].forEach(cat => {
                    (data.settings[cat] || []).forEach(item => {
                        if (!(st[cat] || []).some(x => x.name.toLowerCase() === String(item.name || '').toLowerCase())) (st[cat] = st[cat] || []).push(clone(item));
                    });
                });
                Store.saveSettings(st);
            }
            // Investigation sets: add your sets you don't have yet; keep your own edits, units and layout.
            if (settingsMode === 'merge' && data.lab_settings) {
                saveLabSettings(ls => {
                    const inc = data.lab_settings;
                    (inc.customSets || []).forEach(cs => {
                        if (!(ls.customSets || []).some(x => x.id === cs.id)) (ls.customSets = ls.customSets || []).push(clone(cs));
                    });
                    Object.entries(inc.units || {}).forEach(([k, v]) => { if (ls.units[k] === undefined) ls.units[k] = v; });
                    Object.entries(inc.overrides || {}).forEach(([k, v]) => { if (ls.overrides[k] === undefined) ls.overrides[k] = clone(v); });
                    Object.entries(inc.sets || {}).forEach(([k, v]) => { if (!ls.sets) ls.sets = {}; if (ls.sets[k] === undefined) ls.sets[k] = clone(v); });
                    if (!ls.layout && inc.layout) ls.layout = clone(inc.layout);
                });
            }
            if (settingsMode === 'merge' && data.physician_colors_v2) {
                const prefs = Store.get(PCOLOR_KEY, {});
                Object.entries(data.physician_colors_v2).forEach(([k, v]) => { if (prefs[k] === undefined) prefs[k] = v; });
                Store.set(PCOLOR_KEY, prefs);
            }
            Store.savePatients(local);
            try { migrateRecs(); } catch (e) {}
            Store.saveDailyRecords(records);
            renderApp();
            alert(`Added ${newPatients} new patient${newPatients === 1 ? '' : 's'} and ${newEntries} entr${newEntries === 1 ? 'y' : 'ies'}. Nothing you already had was changed.`);
        }

        function applyImport(data, withSettings = true) {
            let ok = true;
            BACKUP_KEYS.forEach(k => {
                if (!withSettings && SETTINGS_KEYS.includes(k)) return; // keep this device's settings
                try {
                    if (data[k] !== undefined) {
                        if (!Store.set(k, data[k])) ok = false;
                    } else {
                        Store.remove(k);
                    }
                } catch(e) { ok = false; }
            });
            try { migrateConsultEntries(); } catch (e) {}
            try { migrateRecs(); } catch (e) {}
            settingsClosed = null;
            try { applyTheme(); applyCardScale(); applyTextScale(); } catch (e) {}
            currentViewDate = todayStr();
            activePatientId = null;
            renderApp();
            alert(ok ? 'Backup restored.' : 'The backup was only partly restored because browser storage is full or blocked.');
        }

        /* =========================================================
           STARTUP
           ========================================================= */

        // Ask the browser not to clear RoundMaster's data automatically when space runs low.
        async function requestPersistentStorage() {
            try {
                if (navigator.storage && navigator.storage.persist) {
                    storagePersisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
                }
                if (navigator.storage && navigator.storage.estimate) storageEstimate = await navigator.storage.estimate();
            } catch(e) {
                storagePersisted = null;
            }
            if (currentRoute === 'settings' || (currentRoute === 'home' && storageFill() >= 0.8)) renderApp();
        }

        // One-time update: earlier versions stored consult entries under the plain date (shared with the
        // inpatient entry). Give each consult entry its own key; its date becomes the consult date.
        function migrateConsultEntries() {
            if (Store.get('entry_split_v1', false)) return;
            const records = Store.getDailyRecords();
            const allPatients = Store.getPatients();
            let changed = false;
            Object.keys(records).forEach(date => {
                const day = records[date] || {};
                (day.consultIds || []).forEach(id => {
                    const p = allPatients.find(x => x.id === id);
                    if (!p) return;
                    const ck = date + '@c';
                    const alsoInpatient = (day.inpatientIds || []).includes(id);
                    const move = (bag) => {
                        if (!p[bag] || !p[bag][date] || p[bag][ck]) return;
                        p[bag][ck] = clone(p[bag][date]);
                        if (!alsoInpatient) delete p[bag][date];
                        changed = true;
                    };
                    move('dayInfo'); move('days'); move('labs');
                    if (p.dayInfo && p.dayInfo[ck] && !p.dayInfo[ck].consultDate) {
                        p.dayInfo[ck].consultDate = p.dayInfo[ck].admissionDate || '';
                        p.dayInfo[ck].admissionDate = '';
                    }
                    if (day.careFlags && day.careFlags[id] && !day.careFlags[id + '@c']) {
                        day.careFlags[id + '@c'] = clone(day.careFlags[id]);
                        if (!alsoInpatient) delete day.careFlags[id];
                        changed = true;
                    }
                });
            });
            if (changed) {
                Store.savePatients(allPatients);
                Store.saveDailyRecords(records);
            }
            Store.set('entry_split_v1', true);
        }

        /* =========================================================
           COLOUR PICKER
           Replaces the browser's colour chooser on Android and computers (iPhone / iPad keep theirs):
           shade square, hue bar, eyedropper (where supported), R G B boxes and a Hex box.
           ========================================================= */
        const cpHex2rgb = (h) => { const m = /^#?([0-9a-f]{6})$/i.exec(String(h).trim()) || /^#?([0-9a-f]{3})$/i.exec(String(h).trim()); if (!m) return null; let x = m[1]; if (x.length === 3) x = x.split('').map(c => c + c).join(''); return [0, 2, 4].map(i => parseInt(x.slice(i, i + 2), 16)); };
        const cpRgb2hex = (r, g, b) => '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
        function cpRgb2hsv(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
            let h = 0;
            if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
            return [((h * 60) + 360) % 360, mx ? d / mx : 0, mx];
        }
        function cpHsv2rgb(h, s, v) {
            const f = (n) => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
            return [f(5) * 255, f(3) * 255, f(1) * 255];
        }
        let cpState = null;
        function openColorPicker(input) {
            const rgb = cpHex2rgb(input.value) || [224, 242, 254];
            const [h, sv, v] = cpRgb2hsv(...rgb);
            cpState = { input, h, s: sv, v };
            const st = Store.getSettings();
            const used = [...new Set([...(st.wards || []), ...(st.goalsOfCare || []), ...(st.tags || []), ...(st.colorCodes || [])].map(x => String(x.color || '').toLowerCase()).filter(c => /^#[0-9a-f]{6}$/.test(c)))].slice(0, 18);
            const box = document.createElement('div');
            box.id = 'color-picker';
            box.className = 'fixed inset-0 z-[60] flex items-center justify-center p-3 bg-slate-900/40';
            box.innerHTML = `
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-[300px] p-3 space-y-3" onclick="event.stopPropagation()">
                    <div class="cp-sv" id="cp-sv"><div class="cp-knob" id="cp-sv-knob"></div></div>
                    <div class="flex items-center gap-3">
                        ${window.EyeDropper ? `<button type="button" onclick="cpEyedrop()" class="w-8 h-8 shrink-0 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600" title="Pick a colour from the screen"><i class="fa-solid fa-eye-dropper"></i></button>` : ''}
                        <div id="cp-preview" class="w-8 h-8 shrink-0 rounded-full border border-slate-200"></div>
                        <div class="cp-hue flex-1" id="cp-hue"><div class="cp-knob" id="cp-hue-knob"></div></div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-center">
                        ${['R', 'G', 'B'].map((c, i) => `<label class="block"><input id="cp-${c}" type="text" inputmode="numeric" maxlength="3" class="cp-num" oninput="cpFromRgb()"><span class="block text-[11px] font-semibold text-slate-500 mt-0.5">${c}</span></label>`).join('')}
                    </div>
                    <label class="block text-center"><input id="cp-hex" type="text" maxlength="7" autocomplete="off" autocapitalize="off" spellcheck="false" class="cp-num uppercase tracking-wider" oninput="cpFromHex()"><span class="block text-[11px] font-semibold text-slate-500 mt-0.5">HEX</span></label>
                    ${used.length ? `<div class="flex flex-wrap gap-1.5 justify-center">${used.map(c => `<button type="button" onclick="cpSetHex('${c}')" class="w-6 h-6 rounded-full border border-slate-200" style="background:${c}" title="${c}"></button>`).join('')}</div>` : ''}
                    <div class="flex justify-end gap-2 pt-1">
                        <button type="button" onclick="closeColorPicker(false)" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-medium text-slate-700">Cancel</button>
                        <button type="button" onclick="closeColorPicker(true)" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold">OK</button>
                    </div>
                </div>`;
            box.addEventListener('click', () => closeColorPicker(false));
            document.body.appendChild(box);
            const drag = (el, onMove) => {
                el.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    try { el.setPointerCapture(e.pointerId); } catch (err) {}
                    const move = (ev) => { const r = el.getBoundingClientRect(); onMove(Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)), Math.max(0, Math.min(1, (ev.clientY - r.top) / r.height))); };
                    move(e);
                    const up = () => { el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); };
                    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
                });
            };
            drag(document.getElementById('cp-sv'), (x, y) => { cpState.s = x; cpState.v = 1 - y; cpPaint(); });
            drag(document.getElementById('cp-hue'), (x) => { cpState.h = x * 359.9; cpPaint(); });
            cpPaint();
        }
        // Redraw; `skip` = the box being typed in (so typing isn't overwritten)
        function cpPaint(skip) {
            const { h, s, v } = cpState;
