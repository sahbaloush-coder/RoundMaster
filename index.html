                        <div class="flex items-stretch gap-3 flex-wrap">
                            <div class="bg-slate-50 px-4 py-2.5 rounded-xl border border-slate-200/70 flex flex-col items-center justify-center min-w-[90px]">
                                <span class="block mb-1 text-[calc(12px*var(--ts,1))] font-semibold text-slate-500">Age</span>
                                <span class="text-[calc(17px*var(--ts,1))] font-bold text-slate-800">${esc(ageText({ ...info, dob: p.dob }, todayStr()) || '-')}</span>
                            </div>
                            <div class="bg-slate-50 px-4 py-2.5 rounded-xl border border-slate-200/70 flex flex-col items-center justify-center min-w-[90px]">
                                <span class="block mb-1 text-[calc(12px*var(--ts,1))] font-semibold text-slate-500">Gender</span>
                                <span class="px-2 py-0.5 rounded text-[calc(15px*var(--ts,1))] font-bold ${genderBg}">${esc(p.gender || 'M')}</span>
                            </div>
                            <div class="px-4 py-2.5 rounded-xl border border-slate-200/70 flex flex-col items-center justify-center min-w-[110px]" style="background-color: ${esc(gocBg)}; color: ${esc(gocColor)}">
                                <span class="block mb-1 text-[calc(12px*var(--ts,1))] font-semibold opacity-75">Goals of Care</span>
                                <span class="text-[calc(15px*var(--ts,1))] font-bold">${esc(info.goalsOfCare || '-')}</span>
                            </div>
                        </div>
                    </div>

                    ${renderEmrMemoBox(p, false, false) || `
                        <div><button onclick="openEmrMemoModal(${pid})" class="px-3 py-1.5 bg-pink-50 hover:bg-pink-100 text-pink-700 border border-pink-200 rounded-xl text-xs font-semibold transition inline-flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> EMR memo</button></div>
                    `}

                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="font-bold text-slate-800 text-sm">Medical Background</h3>
                            ${asOf ? `<span class="text-[calc(11px*var(--ts,1))] text-slate-400">Last documented ${esc(fmtDate(asOf))}</span>` : ''}
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            ${info.medicalBackground.length === 0 ? '<p class="text-xs text-slate-400 italic">No medical background recorded.</p>' : ''}
                            ${info.medicalBackground.map(mb => `
                                <div class="p-3 rounded-xl border text-xs ${mb.starred ? 'bg-yellow-100 border-yellow-300' : 'bg-slate-50 border-slate-100'}">
                                    <div class="font-semibold text-slate-800">${mb.starred ? '<i class="fa-solid fa-star text-yellow-500 mr-1"></i>' : ''}${esc(mb.condition || '-')}</div>
                                    ${mb.treatment ? `<div class="text-slate-600 mt-0.5">${esc(mb.treatment)}</div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
                            <h3 class="font-bold text-slate-800 text-sm">Encounters</h3>
                            <div class="flex items-center gap-3 text-[calc(11px*var(--ts,1))] font-semibold text-slate-500">
                                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full ${LIST_TYPE_STYLE.Inpatient.dot}"></span>Inpatient</span>
                                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full ${LIST_TYPE_STYLE.Consult.dot}"></span>Consult</span>

                            </div>
                        </div>
                        ${groups.length === 0 ? '<p class="text-xs text-slate-400 italic">Not on any list yet.</p>' : `
                            <div class="flex flex-wrap gap-2">
                                ${groups.map((g, i) => {
                                    const st = LIST_TYPE_STYLE[typeOf(g)];
                                    const first = g.dates[0], last = g.dates[g.dates.length - 1];
                                    const label = first === last ? fmtDate(first) : `${fmtDate(first)} → ${fmtDate(last)}`;
                                    return `
                                        <button onclick="selectEncounter(${i})" class="px-4 py-2 rounded-xl border text-sm font-semibold transition ${i === profileEncounterIdx ? st.active : st.chip}" title="${g.dates.length} day${g.dates.length === 1 ? '' : 's'}">
                                            <i class="fa-solid ${g.type === 'consult' ? 'fa-user-doctor' : 'fa-bed-pulse'} mr-1"></i>${esc(label)} <span class="opacity-70 font-medium text-xs ml-1">(${g.dates.length}d)</span>
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                            ${openGroup ? `
                                <div class="mt-3 pt-3 border-t border-slate-100 flex flex-wrap gap-2">
                                    ${openGroup.dates.slice().reverse().map(d => {
                                        const t = typeOf(openGroup);
                                        const st = LIST_TYPE_STYLE[t];
                                        return `
                                            <button onclick="router.navigate('patient_file', { patientId: ${pid}, date: ${jsArg(d)}, type: '${openGroup.type}' })" class="px-3 py-1.5 rounded-xl border text-xs font-semibold transition ${st.chip}">
                                                ${esc(fmtDate(d))} <span class="opacity-70 font-medium">· ${esc(t)}</span>
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                            ` : ''}
                        `}
                    </div>
                </div>
            `;
        }

        /* ---------- Investigation Sets (Settings): components, units & normal ranges ---------- */
        let openLabGroups = {};
        function toggleLabGroup(g) { openLabGroups[g] = !openLabGroups[g]; renderApp(); }

        // A set is referred to by its type ('cbc') or, for sets you made, 'cs:<id>'.
        function getSetRows(ref) {
            return ref.startsWith('cs:') ? clone((customSet(ref.slice(3)) || {}).rows || []) : currentSetRows(ref);
        }
        function saveSetRows(ref, rows) {
            saveLabSettings(s => {
                if (ref.startsWith('cs:')) {
                    const cs = (s.customSets || []).find(x => x.id === ref.slice(3));
                    if (cs) cs.rows = rows;
                } else {
                    if (!s.sets) s.sets = {};
                    s.sets[ref] = rows;
                }
            });
        }
        function deleteSetComponent(ref, k) {
            saveSetRows(ref, getSetRows(ref).filter(r => r.k !== k));
            renderApp();
        }
        function resetBuiltInSet(type) {
            showConfirm({ title: `Reset ${INV_TYPES[type].title}?`, messageHtml: 'The set goes back to its original components. Cards already added are not changed.', confirmLabel: 'Reset', onConfirm: () => {
                saveLabSettings(s => { if (s.sets) delete s.sets[type]; });
                renderApp();
            } });
        }
        function deleteCustomSet(id) {
            const cs = customSet(id);
            if (!cs) return;
            showConfirm({ title: `Delete "${cs.title}"?`, messageHtml: 'It will no longer be offered when adding investigations. Cards already added keep their rows and values.', confirmLabel: 'Delete', onConfirm: () => {
                saveLabSettings(s => { s.customSets = (s.customSets || []).filter(x => x.id !== id); });
                renderApp();
            } });
        }

        function setGroupHtml(ref, def, rows, extraActions) {
            const th = INV_THEMES[def.theme] || INV_THEMES.gray;
            const open = !!openLabGroups[ref];
            const type = ref.startsWith('cs:') ? 'custom' : ref;
            const rowHtml = (r) => {
                const key = labKey(type, r.k);
                const builtInRange = type !== 'custom' && !r.own && LAB_REF[key];
                let rangeHtml;
                if (r.calc) {
                    rangeHtml = `<span class="text-[calc(11px*var(--ts,1))] text-slate-400 italic">calculated</span>`;
                } else if (builtInRange) {
                    const refs = LAB_REF[key];
                    const sel = labUnitIndex(key);
                    rangeHtml = refs.map((rf, i) => {
                        const isSel = i === sel;
                        const rm = labRange(key, 'M', i);
                        const rfF = refs[i].loF !== undefined ? labRange(key, 'F', i) : null;
                        const txt = (rangeText({ ...rm, u: '' }) || 'no range') + (rfF ? ` · F ${rangeText({ ...rfF, u: '' })}` : '');
                        return `
                            <span class="inline-flex items-stretch rounded-lg border text-[calc(11px*var(--ts,1))] overflow-hidden ${isSel ? 'border-indigo-400 bg-indigo-50' : 'border-slate-200 bg-white'}">
                                <button onclick="setLabUnit('${key}', ${i})" class="px-2 py-1 font-semibold ${isSel ? 'text-indigo-700' : 'text-slate-500'}" title="${refs.length > 1 ? 'Use this unit' : ''}">
                                    ${refs.length > 1 ? `<i class="fa-${isSel ? 'solid fa-circle-dot' : 'regular fa-circle'} text-[calc(9px*var(--ts,1))] mr-1"></i>` : ''}${esc(rf.u || 'no unit')}
                                </button>
                                <button onclick="openLabRangeEditor('${key}', ${i})" class="px-2 py-1 border-l ${isSel ? 'border-indigo-200' : 'border-slate-200'} text-slate-600 hover:bg-white" title="Tap to edit the range">
                                    ${esc(txt)} <i class="fa-solid fa-pen text-[calc(8px*var(--ts,1))] opacity-50 ml-0.5"></i>
                                </button>
                            </span>`;
                    }).join('');
                } else {
                    const rg = ownRange(r);
                    const txt = [r.unit || 'no unit', rg ? rangeText({ ...rg, u: '' }) : 'no range'].join(' · ');
                    rangeHtml = `<button onclick="openComponentEditor(${jsArg(ref)}, ${jsArg(r.k)})" class="px-2 py-1 rounded-lg border border-slate-200 bg-white text-[calc(11px*var(--ts,1))] text-slate-600 hover:bg-slate-50">${esc(txt)} <i class="fa-solid fa-pen text-[calc(8px*var(--ts,1))] opacity-50 ml-0.5"></i></button>`;
                }
                return `
                    <div class="flex items-center gap-2 px-3 py-2">
                        <span class="w-20 shrink-0 text-xs font-bold text-slate-700 break-words">${esc(r.label)}</span>
                        <div class="flex flex-wrap gap-1.5 flex-1 min-w-0">${rangeHtml}</div>
                        <button onclick="deleteSetComponent(${jsArg(ref)}, ${jsArg(r.k)})" class="shrink-0 text-slate-300 hover:text-rose-500 px-1" title="Remove from this set (new cards only)"><i class="fa-solid fa-xmark text-xs"></i></button>
                    </div>`;
            };
            return `
                <div data-sort-item data-id="${esc(ref)}" class="flex rounded-2xl border overflow-hidden bg-white" style="border-color: ${th.border}">
                ${gripHandle('rounded-r-2xl', { bg: th.border + '66', fg: th.icon })}
                <div class="flex-1 min-w-0">
                    <button onclick="toggleLabGroup(${esc(JSON.stringify(ref))})" class="w-full flex items-center justify-between px-3 py-2 text-sm font-bold" style="background-color: ${th.head}; color: ${th.text}">
                        <span class="flex items-center gap-2 min-w-0"><i class="fa-solid ${def.icon}" style="color: ${th.icon}"></i><span class="truncate">${esc(def.title)}</span><span class="text-[calc(11px*var(--ts,1))] font-semibold opacity-60">(${rows.length})</span></span>
                        <i class="fa-solid fa-chevron-${open ? 'up' : 'down'} text-xs"></i>
                    </button>
                    ${open ? `
                        <div class="divide-y divide-slate-100">
                            ${rows.length ? rows.map(rowHtml).join('') : '<p class="px-3 py-2 text-xs text-slate-400 italic">No components.</p>'}
                        </div>
                        <div class="flex items-center justify-between gap-2 flex-wrap px-3 py-2 border-t border-slate-100 bg-slate-50/60">
                            <button onclick="openComponentEditor(${jsArg(ref)}, null)" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-white border border-slate-200 text-slate-700 hover:bg-slate-100"><i class="fa-solid fa-plus"></i> Add component</button>
                            <div class="flex items-center gap-1">${extraActions || ''}</div>
                        </div>
                    ` : ''}
                </div>
            </div>`;
        }

        // Order of the cards in Settings and in the "Add Investigation" window: built-in types by
        // name ('cbc') and your sets as 'cs:<id>'. Saved in lab_settings.order; new ones go at the end.
        // Sections the cards are grouped in (Settings and the Add window). Cards can be dragged between them.
        // Saved in lab_settings.layout = { daily: [...], acute: [...], ... }.
        const SET_SECTIONS = [['daily', 'Daily'], ['acute', 'Acute'], ['infections', 'Infections'], ['others', 'Others'], ['misc', 'Miscellaneous'], ['mine', 'My sets']];
        const DEFAULT_LAYOUT = {
            daily: ['vitals', 'io', 'cbc', 'lytes', 'glucose'],
            acute: ['critical', 'gas', 'coag'],
            infections: ['inflammation', 'cultures', 'ua', 'pcr'],
            others: ['bone', 'liver', 'iron', 'endocrine', 'ulytes'],
            misc: ['labs', 'text', 'image'],
            mine: []
        };
        const DEFAULT_SECTION = {};
        Object.entries(DEFAULT_LAYOUT).forEach(([sec, list]) => list.forEach(t => { DEFAULT_SECTION[t] = sec; }));
        function invSetLayout() {
            const all = [...INV_ORDER, ...customSets().map(cs => 'cs:' + cs.id)];
            const ls = Store.get('lab_settings', {});
            const saved = clone(ls.layout || {});
            // Layouts saved before "Miscellaneous" existed: Other Labs, Free Text and Image move there.
            if (ls.layout && !ls.layout.misc) Object.keys(saved).forEach(k => { saved[k] = (saved[k] || []).filter(r => !['labs', 'text', 'image'].includes(r)); });
            const oldOrder = ls.order || []; // order saved before sections existed
            const layout = {};
            const placed = new Set();
            SET_SECTIONS.forEach(([key]) => {
                layout[key] = (saved[key] || []).filter(r => all.includes(r) && !placed.has(r));
                layout[key].forEach(r => placed.add(r));
            });
            const defOrder = SET_SECTIONS.flatMap(([k]) => DEFAULT_LAYOUT[k]);
            const rank = (r) => { const i = oldOrder.indexOf(r); if (i >= 0) return i; const d = defOrder.indexOf(r); return 999 + (d < 0 ? 500 + all.indexOf(r) : d); };
            all.filter(r => !placed.has(r)).sort((a, b) => rank(a) - rank(b)).forEach(r => {
                layout[r.startsWith('cs:') ? 'mine' : (DEFAULT_SECTION[r] || 'others')].push(r);
            });
            return layout;
        }
        function invSetOrder() {
            const layout = invSetLayout();
            return SET_SECTIONS.flatMap(([key]) => layout[key]);
        }
        function saveInvSetLayout(layout) {
            saveLabSettings(s => { s.layout = layout; delete s.order; });
        }

        function renderLabSettingsBox() {
            const edited = editedSets();
            const itemHtml = (ref) => {
                if (ref.startsWith('cs:')) {
                    const cs = customSet(ref.slice(3));
                    return setGroupHtml(ref, { title: cs.title, icon: 'fa-table-list', theme: 'gray' }, cs.rows || [],
                        `<button onclick="openSetEditor(${jsArg(cs.id)})" class="px-2 py-1 text-[calc(11px*var(--ts,1))] font-semibold text-slate-500 hover:text-slate-800"><i class="fa-solid fa-pen"></i> Rename</button>
                         <button onclick="deleteCustomSet(${jsArg(cs.id)})" class="px-2 py-1 text-[calc(11px*var(--ts,1))] font-semibold text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i> Delete</button>`);
                }
                if (TABLE_TYPES.includes(ref)) {
                    return setGroupHtml(ref, INV_TYPES[ref], currentSetRows(ref),
                        edited[ref] ? `<button onclick="resetBuiltInSet('${ref}')" class="px-2 py-1 text-[calc(11px*var(--ts,1))] font-semibold text-slate-500 hover:text-slate-800">Reset</button>` : '');
                }
                // Cards without components (cultures, PCR, notes...) - only their place in the order.
                const d = INV_TYPES[ref], th = INV_THEMES[d.theme] || INV_THEMES.gray;
                return `
                    <div data-sort-item data-id="${esc(ref)}" class="flex rounded-2xl border overflow-hidden bg-white" style="border-color: ${th.border}">
                        ${gripHandle('rounded-r-2xl', { bg: th.border + '66', fg: th.icon })}
                        <div class="flex-1 min-w-0 flex items-center gap-2 px-3 py-2 text-sm font-bold" style="background-color: ${th.head}; color: ${th.text}">
                            <i class="fa-solid ${d.icon}" style="color: ${th.icon}"></i>${esc(d.title)}
                        </div>
                    </div>`;
            };
            const layout = invSetLayout();
            const sections = SET_SECTIONS.map(([key, label]) => `
                <div>
                    <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">${label}</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2 items-start min-h-[2.75rem] rounded-2xl ${layout[key].length ? '' : 'border-2 border-dashed border-slate-200'}" data-sort-list="invsets" data-sort-group="invsets" data-section="${key}">
                        ${layout[key].map(itemHtml).join('')}
                        ${layout[key].length ? '' : `<p class="col-span-full text-[calc(11px*var(--ts,1))] text-slate-400 italic px-3 py-3">${key === 'mine' ? 'Use "New set", or drag a set here.' : 'Drag sets here.'}</p>`}
                    </div>
                </div>`).join('');
            const on = labSettings().useRanges;
            const toggle = `
                <button onclick="toggleUseRanges()" class="flex items-center gap-2 text-xs font-semibold ${on ? 'text-indigo-700' : 'text-slate-500'}" title="Colour values outside the normal range">
                    Use ranges
                    <span class="relative inline-block w-10 h-6 rounded-full transition ${on ? 'bg-indigo-600' : 'bg-slate-300'}">
                        <span class="absolute top-0.5 ${on ? 'left-[18px]' : 'left-0.5'} w-5 h-5 rounded-full bg-white shadow transition-all"></span>
                    </span>
                </button>
                <button onclick="openSetEditor(null)" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold transition"><i class="fa-solid fa-plus"></i> New set</button>`;
            return settingsCard('invsets', {
                title: 'Investigation Sets',
                icon: '<i class="fa-solid fa-microscope text-cyan-600"></i>',
                actions: toggle,
                body: `<div class="space-y-4">${sections}</div>`
            });
        }

        /* Component editor: name, unit, low, high (for components you added, or ones without a built-in range). */
        function openComponentEditor(ref, k) {
            const rows = getSetRows(ref);
            const r = k ? rows.find(x => x.k === k) : null;
            if (k && !r) return;
            const setTitle = ref.startsWith('cs:') ? (customSet(ref.slice(3)) || {}).title : INV_TYPES[ref].title;
            const val = (v) => (v === null || v === undefined) ? '' : esc(String(v));
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50" onclick="if (event.target === this) closeModal()">
                    <div class="bg-white rounded-3xl p-5 max-w-sm w-full shadow-2xl space-y-4">
                        <h3 class="text-base font-bold text-slate-800">${r ? 'Edit component' : 'Add component'} <span class="text-slate-400 font-semibold">· ${esc(setTitle || '')}</span></h3>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="block col-span-2"><span class="block text-[calc(11px*var(--ts,1))] font-medium text-slate-500 mb-1">Name</span>
                                <input id="ce-name" type="text" value="${val(r && r.label)}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="e.g. Amylase"></label>
                            <label class="block col-span-2"><span class="block text-[calc(11px*var(--ts,1))] font-medium text-slate-500 mb-1">Unit</span>
                                <input id="ce-unit" type="text" value="${val(r && r.unit)}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="e.g. U/L"></label>
                            <label class="block"><span class="block text-[calc(11px*var(--ts,1))] font-medium text-slate-500 mb-1">Low</span>
                                <input id="ce-lo" type="text" inputmode="decimal" value="${val(r && r.lo)}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="none"></label>
                            <label class="block"><span class="block text-[calc(11px*var(--ts,1))] font-medium text-slate-500 mb-1">High</span>
                                <input id="ce-hi" type="text" inputmode="decimal" value="${val(r && r.hi)}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="none"></label>
                        </div>
                        <p class="text-[calc(11px*var(--ts,1))] text-slate-400">Leave Low or High empty for no limit.</p>
                        <div class="flex justify-end gap-2">
                            <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-sm">Cancel</button>
                            <button onclick="saveComponent(${jsArg(ref)}, ${jsArg(k || '')})" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium">Save</button>
                        </div>
                    </div>
                </div>`;
            const el = document.getElementById('ce-name');
            if (el) el.focus();
        }
        // Reads a number box: null = empty, undefined = not a number.
        function readNumBox(el) {
            const t = String(el ? el.value : '').trim().replace(',', '.');
            if (t === '') return null;
            const n = parseFloat(t);
            return isNaN(n) ? undefined : n;
        }
        function saveComponent(ref, k) {
            const name = document.getElementById('ce-name').value.trim();
            if (!name) { document.getElementById('ce-name').focus(); return; }
            const unit = document.getElementById('ce-unit').value.trim();
            const lo = readNumBox(document.getElementById('ce-lo')), hi = readNumBox(document.getElementById('ce-hi'));
            if (lo === undefined || hi === undefined) { showToast('Please enter numbers only for Low and High'); return; }
            const rows = getSetRows(ref);
            if (k) {
                const r = rows.find(x => x.k === k);
                if (r) Object.assign(r, { label: name, unit, lo, hi });
            } else {
                if (rows.some(x => normLab(x.label) === normLab(name))) { showToast(`${name} is already in this set`); return; }
                rows.push({ k: 'u' + Date.now().toString(36), label: name, unit, lo, hi, own: true });
            }
            saveSetRows(ref, rows);
            openLabGroups[ref] = true;
            closeModal();
            renderApp();
        }

        /* New set (or rename one): a name and its components. */
        function setEditorRowHtml() {
            const inp = (cls, ph, mode = 'text') => `<input type="text" inputmode="${mode}" class="${cls} min-w-0 px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs" placeholder="${ph}">`;
            return `<div class="se-row grid grid-cols-[1fr_4.5rem_3.5rem_3.5rem_1.2rem] gap-1.5 items-center">
                ${inp('se-name', 'Lab name')}${inp('se-unit', 'Unit')}${inp('se-lo', 'Low', 'decimal')}${inp('se-hi', 'High', 'decimal')}
                <button onclick="this.parentElement.remove()" class="text-slate-300 hover:text-rose-500" title="Remove"><i class="fa-solid fa-xmark text-xs"></i></button>
            </div>`;
        }
        function addSetEditorRow() {
            const box = document.getElementById('se-rows');
            if (!box) return;
            box.insertAdjacentHTML('beforeend', setEditorRowHtml());
            const names = box.querySelectorAll('.se-name');
            names[names.length - 1].focus();
        }
        function openSetEditor(id, addAfter = false) {
            const cs = id ? customSet(id) : null;
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 overflow-y-auto" onclick="if (event.target === this) closeModal()">
                    <div class="bg-white rounded-3xl p-5 max-w-md w-full shadow-2xl space-y-4 my-8">
                        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-table-list text-slate-400"></i> ${cs ? 'Rename set' : 'New investigation set'}</h3>

        function saveSetEditor(id, addAfter) {
            const title = document.getElementById('se-title').value.trim();

            if (id) {
                saveLabSettings(s => { const cs = (s.customSets || []).find(x => x.id === id); if (cs) cs.title = title; });
                closeModal();
                renderApp();
                return;
            }
            const rows = [];
            let bad = false;
            document.querySelectorAll('#se-rows .se-row').forEach((row, i) => {
                const name = row.querySelector('.se-name').value.trim();
                if (!name) return;
                const lo = readNumBox(row.querySelector('.se-lo')), hi = readNumBox(row.querySelector('.se-hi'));
                if (lo === undefined || hi === undefined) bad = true;
                if (rows.some(x => normLab(x.label) === normLab(name))) return;
                rows.push({ k: 'c' + i + Date.now().toString(36), label: name, unit: row.querySelector('.se-unit').value.trim(), lo: lo ?? null, hi: hi ?? null, own: true });
            });
            if (bad) { showToast('Please enter numbers only for Low and High'); return; }
            const newId = 'cs_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
            saveLabSettings(s => { s.customSets = [...(s.customSets || []), { id: newId, title, rows }]; });

        function recordAnyOpen(p, note, isConsult) {

                ((note && (note.memo || '').trim()) || (p.emrMemo || '').trim() || String((getDayInfo(p, curKey()) || {}).caseSummary || '').trim());

        function setRecordCollapsed(collapse) {
            isMedicalBgCollapsed = collapse;

            invBoxCollapsed = collapse;
            dcPlanCollapsed = collapse;
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === activePatientId);
            const note = p && p.days && p.days[curKey()];
            ['medbg', 'memo:daily', 'memo:emr', 'memo:summary', 'inv', 'dcplan'].forEach(k => noteViewChoice(k, !collapse));
            if (note && note.investigations) {
                note.investigations.forEach(x => { x.collapsed = collapse; noteViewChoice('card:' + x.id, !collapse); });
                Store.savePatients(allPatients);
            }
            renderApp();
        }

        /* Collapsible boxes in a patient's entry: everything is open the first time an entry is opened.
           After you leave it, it comes back collapsed - except the boxes you opened yourself, which stay open.
           Remembered per entry on this device ("entry_view"). */
        let viewEntryKey = null;
        function noteViewChoice(item, open) {
            if (!viewEntryKey) return;
            const all = Store.get('entry_view', {});
            const v = all[viewEntryKey] || (all[viewEntryKey] = { open: [] });
            v.open = (v.open || []).filter(x => x !== item);
            if (open) v.open.push(item);
            Store.set('entry_view', all);
        }
        // Returns true if card open/closed states changed (the caller saves).
        function applyEntryView(p, key) {
            const id = p.id + '|' + key;
            const all = Store.get('entry_view', {});
            const v = all[id];
            const first = !v;
            const isOpen = (item) => first || (v.open || []).includes(item);
            isMedicalBgCollapsed = !isOpen('medbg');
            memoCollapsed = { daily: !isOpen('memo:daily'), emr: !isOpen('memo:emr'), summary: !isOpen('memo:summary') };
            invBoxCollapsed = !isOpen('inv');
            dcPlanCollapsed = !isOpen('dcplan');
            if (first) {
                all[id] = { open: [] };
                const keys = Object.keys(all);
                if (keys.length > 800) keys.slice(0, keys.length - 800).forEach(k => delete all[k]); // keep it small
                Store.set('entry_view', all);
            }
            let changed = false;
            const note = p.days && p.days[key];
            (note && note.investigations || []).forEach(x => {
                const c = !isOpen('card:' + x.id);
                if (!!x.collapsed !== c) { x.collapsed = c; changed = true; }
            });
            return changed;
        }

        function addAllToTomorrow(type = 'inpatient') {
            const cfg = LIST_CFG[type] || LIST_CFG.inpatient;
            const records = Store.getDailyRecords();
            const today = records[currentViewDate];
            if (!today || !(today[cfg.idsKey] || []).length) { showToast('Nothing to copy from this day.'); return; }
            const tomorrowStr = addDays(currentViewDate, 1);
            const tomorrow = getOrCreateDay(records, tomorrowStr);
            const allPatients = Store.getPatients();
            let skipped = 0;
            (today[cfg.idsKey] || []).forEach(id => {
                const p = allPatients.find(x => x.id === id);
                if (!p) return;
                const dcNote = getDayNote(p, entryKey(currentViewDate, type));
                if (dcNote && dcNote.discharge && dcNote.discharge.skipTomorrow) { skipped++; return; } // discharged
                mergeEntry(p, entryKey(currentViewDate, type), entryKey(tomorrowStr, type));
                if (!tomorrow[cfg.idsKey].includes(id)) tomorrow[cfg.idsKey].push(id);
            });
            const lk = physListKey(type);
            (today[lk] || []).forEach(dr => { if (!tomorrow[lk].includes(dr)) tomorrow[lk].push(dr); });
            Store.saveDailyRecords(records);
            Store.savePatients(allPatients);
            currentViewDate = tomorrowStr;
            renderApp();
            showToast(`Copied to ${fmtDate(tomorrowStr)}${skipped ? ` (${skipped} discharged left out)` : ''}`);
        }

        // Copies today's unfinished Post D/C follow-ups to tomorrow (skipping ones already there).
        function addPostDcToTomorrow() {
            const records = Store.getDailyRecords();
            const today = records[currentViewDate];
            if (!today || !(today.postDc || []).length) return;
            const tomorrowStr = addDays(currentViewDate, 1);
            const tomorrow = getOrCreateDay(records, tomorrowStr);
            const existing = new Set(tomorrow.postDc.map(i => (i.text || '').trim()));
            let added = 0;
            today.postDc.forEach(item => {
                const text = (item.text || '').trim();
                if (!item.completed && text && !existing.has(text)) {
                    tomorrow.postDc.push({ text: item.text, completed: false });
                    existing.add(text);
                    added++;
                }
            });
            Store.saveDailyRecords(records);
            showToast(added
                ? `${added} follow-up${added === 1 ? '' : 's'} added to ${fmtDate(tomorrowStr)}`
                : `Nothing to add — unfinished follow-ups are already on ${fmtDate(tomorrowStr)}`);
        }

        // From All Patients: put the patient on TODAY's inpatient or consult list.
        // Only name, MRN, gender, age and medical background come along (plus the EMR memo, which is
        // always shared). Everything else starts empty and is flagged with a red (!) until filled in.
        // The day's notes (issues, plan, investigations) start empty.
        function copyPatientToList(patientId, listType) {
            const date = todayStr();
            const records = Store.getDailyRecords();
            const day = getOrCreateDay(records, date);
            const target = listType === 'consult' ? day.consultIds : day.inpatientIds;
            const label = listType === 'consult' ? 'consult' : 'inpatient';
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === patientId);
            if (!p) return;
            if (target.includes(patientId)) {
                showToast(`${p.name} is already on today's ${label} list.`);
                return;
            }
            // A fresh, separate entry for this list (an entry on the other list today is left untouched).
            const key = entryKey(date, listType);
            const last = latestInfoExcept(p, key);
            if (!p.dayInfo) p.dayInfo = {};
            p.dayInfo[key] = normalizeInfo({
                age: last.age,
                medicalBackground: clone(last.medicalBackground),
                // Admitted on / consult date = the day they're added (can be changed in the record)
                ...(listType === 'consult' ? { consultDate: date } : { admissionDate: date })
            });
            if (p.days) delete p.days[key];
            if (p.labs) delete p.labs[key];
            delete day.careFlags[careKey(patientId, listType)];
            gcImages(p);
            target.push(patientId);
            Store.saveDailyRecords(records);
            Store.savePatients(allPatients);
            currentViewDate = date;
            router.navigate(listType === 'consult' ? 'consult' : 'inpatient');
            showToast(`${p.name} added to today's ${label} list`);
        }

        // Shows the "Is this the same patient?" question when the typed MRN is already registered.
        function checkMrnMatch(force = false) {
            const box = document.getElementById('modal-mrn-match');
            const mrn = ((document.getElementById('modal-pat-mrn') || {}).value || '').trim();
            if (!box) return;
            const match = findPatientByMrn(mrn);
            if (!match) { mrnLink = null; box.className = 'hidden'; box.innerHTML = ''; return; }
            if (!mrnLink || mrnLink.mrn !== mrn || mrnLink.patientId !== match.id) mrnLink = { mrn, patientId: match.id, decided: null };
            if (mrnLink.decided === 'yes') {
                const info = latestInfo(match);
                box.className = 'rounded-xl border border-emerald-200 bg-emerald-50 p-3 text-xs text-emerald-900';
                box.innerHTML = `<i class="fa-solid fa-link"></i> Using <strong>${esc(match.name)}</strong>'s record: name, gender, date of birth, goals of care and ${info.medicalBackground.length} medical background item${info.medicalBackground.length === 1 ? '' : 's'} are brought in. Fill in this entry's location, date and physician / primary team. <button onclick="answerMrnMatch('no')" class="underline ml-1">Undo</button>`;
                return;
            }
            if (mrnLink.decided === 'no') {
                box.className = 'text-[calc(11px*var(--ts,1))] text-slate-500';
                box.innerHTML = `Will be added as a separate patient (same MRN as ${esc(match.name)}). <button onclick="answerMrnMatch(null)" class="underline">Change</button>`;
                return;
            }
            const info = latestInfo(match);
            box.className = `rounded-xl border-2 ${force ? 'border-amber-400' : 'border-amber-200'} bg-amber-50 p-3 text-sm text-amber-900 space-y-2`;

        function answerMrnMatch(answer) {
            if (!mrnLink) return;
            mrnLink.decided = answer;
            if (answer === 'yes') {
                const p = Store.getPatients().find(x => x.id === mrnLink.patientId);
                if (p) {
                    const info = latestInfo(p);
                    const set = (id, v) => { const el = document.getElementById(id); if (el && v) el.value = v; };
                    set('modal-pat-name', p.name);
                    set('modal-pat-gender', p.gender || 'M');
                    set('modal-pat-goc', info.goalsOfCare);
                    if (p.dob) {
                        set('modal-pat-dob', p.dob);
                        const t = document.querySelector('#modal-pat-dob') && document.querySelector('#modal-pat-dob').parentElement.querySelector('.date-field-text');

        // Adds a new entry for an existing patient (same MRN, answered "yes").
        function addEntryForExistingPatient(patientId, listType, fields) {
            const type = listType === 'consult' ? 'consult' : 'inpatient';
            const date = currentViewDate;
            const key = entryKey(date, type);
            const records = Store.getDailyRecords();
            const day = getOrCreateDay(records, date);
            const list = type === 'consult' ? day.consultIds : day.inpatientIds;
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === patientId);
            if (!p) return;
            if (list.includes(patientId)) {
                closeModal();
                showToast(`${p.name} is already on this ${type} list.`);
                return;
            }
            const last = latestInfoExcept(p, key);
            p.name = fields.name || p.name;
            p.gender = fields.gender || p.gender;
            p.dob = fields.dob || p.dob || '';
            if (!p.dayInfo) p.dayInfo = {};
            p.dayInfo[key] = normalizeInfo({ ...fields.info, medicalBackground: clone(last.medicalBackground), tags: [] });
            if (p.days) delete p.days[key];
            if (p.labs) delete p.labs[key];
            delete day.careFlags[careKey(patientId, type)];
            list.push(patientId);
            Store.savePatients(allPatients);
            Store.saveDailyRecords(records);
            mrnLink = null;
            closeModal();
            renderApp();
            showToast(`${p.name} added from their existing record`);
        }

        function submitAddPatient(listType) {
            const val = (id) => {
                const el = document.getElementById(id);
                return el ? el.value.trim() : '';
            };

            const name = val('modal-pat-name');
            if (!name) {
                const err = document.getElementById('modal-pat-name-error');
                const input = document.getElementById('modal-pat-name');
                if (err) err.classList.remove('hidden');
                if (input) { input.classList.add('border-rose-400'); input.focus(); }
                return;
            }

            // Blank fields stay blank. Nothing is filled in automatically.
            const drName = val('modal-pat-physician');
            const consultantName = listType === 'consult' ? val('modal-pat-consultant') : '';

            // Same MRN as a registered patient? Ask first; "yes" adds an entry to that patient.
            const match = findPatientByMrn(val('modal-pat-mrn'));
            if (match && !(mrnLink && mrnLink.patientId === match.id && mrnLink.decided)) {
                checkMrnMatch(true);
                const box = document.getElementById('modal-mrn-match');
                if (box) box.scrollIntoView({ block: 'center', behavior: 'smooth' });
                return;
            }
            if (match && mrnLink.decided === 'yes') {
                const isC = listType === 'consult';
                addEntryForExistingPatient(match.id, listType, {
                    name,
                    gender: val('modal-pat-gender') || 'M',
                    dob: val('modal-pat-dob'),
                    info: {
                        ward: canonicalWard(val('modal-pat-ward')),
                        room: val('modal-pat-room'),
                        bed: val('modal-pat-bed'),
                        goalsOfCare: val('modal-pat-goc'),
                        physician: drName,
                        consultant: consultantName,
                        admissionDate: isC ? '' : (val('modal-pat-date') || currentViewDate),
                        consultDate: isC ? (val('modal-pat-date') || currentViewDate) : ''
                    }
                });
                return;
            }

            const newId = 'p_' + Date.now();
            const newPatient = {
                id: newId,
                name: name,
                mrn: val('modal-pat-mrn'),
                gender: val('modal-pat-gender') || 'M',
                dob: val('modal-pat-dob'),
                emrMemo: '',
                days: {},
                dayInfo: {
                    [entryKey(currentViewDate, listType === 'consult' ? 'consult' : 'inpatient')]: normalizeInfo({
                        ward: canonicalWard(val('modal-pat-ward')),
                        room: val('modal-pat-room'),
                        bed: val('modal-pat-bed'),
                        goalsOfCare: val('modal-pat-goc'),
                        physician: drName,
                        consultant: consultantName,
                        // Inpatients: admitted on. Consults: consult date (admitted on can be filled in later).
                        admissionDate: listType === 'consult' ? '' : (val('modal-pat-date') || currentViewDate),
                        consultDate: listType === 'consult' ? (val('modal-pat-date') || currentViewDate) : '',
                        tags: []
                    })
                }
            };

            const allPatients = Store.getPatients();
            allPatients.push(newPatient);
            Store.savePatients(allPatients);

            const records = Store.getDailyRecords();
            const day = getOrCreateDay(records, currentViewDate);
            if (listType === 'inpatient') {
                day.inpatientIds.push(newId);
            } else {
                day.consultIds.push(newId);
            }
            Store.saveDailyRecords(records);
            closeModal();
            renderApp();
        }

        function openDeletePatientModal(patientId) {
            const p = Store.getPatients().find(x => x.id === patientId);

            showConfirm({

                messageHtml: `Are you sure you want to delete <strong>${esc(p.name)}</strong>? This removes the patient from every day's list and cannot be undone.`,

        function confirmDeletePatient(patientId) {
            const allPatients = Store.getPatients();
            const updatedPatients = allPatients.filter(p => p.id !== patientId);
            Store.savePatients(updatedPatients);

            const records = Store.getDailyRecords();
            Object.keys(records).forEach(date => {
                const day = records[date];
                if (day.inpatientIds) day.inpatientIds = day.inpatientIds.filter(id => id !== patientId);
                if (day.consultIds) day.consultIds = day.consultIds.filter(id => id !== patientId);
                if (day.careFlags) { delete day.careFlags[patientId]; delete day.careFlags[patientId + '@c']; }
            });
            Store.saveDailyRecords(records);
            closeModal();
            renderApp();
        }

            const nameEl = document.getElementById('modal-edit-set-name');

            const fontColorEl = document.getElementById('modal-edit-set-fontcolor');

            const settings = Store.getSettings();
            if (settings[category] && settings[category][idx]) {
                const oldName = settings[category][idx].name;
                // A rename also updates every patient day that uses the old name
                if (oldName !== name && ['tags', 'wards', 'goalsOfCare'].includes(category)) {
                    const all = Store.getPatients();
                    const field = category === 'tags' ? 'tags' : category === 'wards' ? 'ward' : 'goalsOfCare';

                    }));
                    Store.savePatients(all);
                }
                settings[category][idx].name = name;
                settings[category][idx].color = color;
                if (fontColorEl) settings[category][idx].fontColor = fontColor;
                Store.saveSettings(settings);
            }
            closeModal();
            renderApp();
        }

        // Removes a physician for this day. Their inpatients become unassigned (flagged with a red !).
        function removePhysicianFromList(drName, type = 'inpatient') {
            const day = readDay(currentViewDate);
            const allPatients = Store.getPatients();
            const key = entryKey(currentViewDate, type), field = physField(type), lk = physListKey(type);
            const theirs = (type === 'consult' ? day.consultIds : day.inpatientIds).filter(id => {
                const p = allPatients.find(x => x.id === id);
                return p && (getDayInfo(p, key)[field] || '').trim() === drName;
            });
            const doRemove = () => {
                const records = Store.getDailyRecords();
                const d = getOrCreateDay(records, currentViewDate);
                d[lk] = d[lk].filter(x => x !== drName);
                Store.saveDailyRecords(records);
                const all = Store.getPatients();
                theirs.forEach(id => {
                    const info = infoFor(all, id, key);
                    if (info) info[field] = '';
                });
                Store.savePatients(all);
                renderApp();
            };
            if (theirs.length) {
                showConfirm({
                    title: 'Remove physician?',
                    messageHtml: `<strong>${esc(drName)}</strong> has ${theirs.length} patient${theirs.length === 1 ? '' : 's'} on this day. They will become unassigned and flagged to assign a physician.`,
                    confirmLabel: 'Remove',
                    onConfirm: doRemove
                });
            } else {
                doRemove();
            }
        }

        /* =========================================================
           BACKUP: export / import (optional password encryption)
           ========================================================= */

        const textEnc = new TextEncoder();
        const textDec = new TextDecoder();

        function cryptoAvailable() {
            return !!(window.crypto && window.crypto.subtle && window.isSecureContext !== false);
        }

        function bufToB64(buf) {
            const bytes = new Uint8Array(buf);
            let s = '';
            for (let i = 0; i < bytes.length; i += 0x8000) {
                s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            }
            return btoa(s);
        }

        function b64ToBuf(b64) {
            const s = atob(b64);
            const bytes = new Uint8Array(s.length);
            for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
            return bytes;
        }

        async function deriveKey(password, salt) {
            const base = await crypto.subtle.importKey('raw', textEnc.encode(password), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' },
                base,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function encryptJson(obj, password) {
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const key = await deriveKey(password, salt);
            const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, textEnc.encode(JSON.stringify(obj)));
            return { salt: bufToB64(salt), iv: bufToB64(iv), ciphertext: bufToB64(ct) };
        }

        async function decryptJson(payload, password) {
            const key = await deriveKey(password, b64ToBuf(payload.salt));
            const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBuf(payload.iv) }, key, b64ToBuf(payload.ciphertext));
            return JSON.parse(textDec.decode(pt));
        }

        function collectBackupData() {
            const data = {};
            BACKUP_KEYS.forEach(k => {
                try {
                    const raw = localStorage.getItem(STORAGE_PREFIX + k);
                    if (raw !== null) data[k] = JSON.parse(raw);
                } catch(e) {}
            });
            // Include current (possibly unsaved first-run) values so the backup is never empty.
            if (!data.settings) data.settings = Store.getSettings();
            if (!data.all_patients) data.all_patients = Store.getPatients();
            if (!data.daily_records) data.daily_records = Store.getDailyRecords();
            return data;
        }

        let exportScope = 'all';
        function setExportScope(v) {

        // Keeps only the chosen days: those days' lists, and those patients' entries for those days.
        function filterBackupToDays(data, from, to) {
            const inRange = (k) => { const d = keyDate(k); return d >= from && d <= to; };
            const records = {};
            Object.keys(data.daily_records || {}).filter(inRange).forEach(d => { records[d] = clone(data.daily_records[d]); });
            const listed = new Set();
            Object.entries(records).forEach(([d, r]) => {
                (r.inpatientIds || []).forEach(id => listed.add(id));
                (r.consultIds || []).forEach(id => listed.add(id));
            });
            const patients = (data.all_patients || []).filter(p => listed.has(p.id)).map(p => {
                const q = clone(p);
                ['dayInfo', 'days', 'labs'].forEach(bag => {
                    if (!q[bag]) return;
                    Object.keys(q[bag]).forEach(k => { if (!inRange(k)) delete q[bag][k]; });
                });
                // Make sure every exported entry carries its details (they may have been inherited from an earlier day).
                if (!q.dayInfo) q.dayInfo = {};
                Object.entries(records).forEach(([d, r]) => {
                    if ((r.inpatientIds || []).includes(p.id) && !q.dayInfo[d]) q.dayInfo[d] = getDayInfo(p, d);
                    if ((r.consultIds || []).includes(p.id) && !q.dayInfo[d + '@c']) q.dayInfo[d + '@c'] = getDayInfo(p, d + '@c');
                });
                gcImages(q);
                return q;
            });
            return { ...data, all_patients: patients, daily_records: records, scope: { from, to } };
        }

        function showModalError(id, msg) {

        async function submitExport() {
            const pwEl = document.getElementById('modal-export-pw');
            const pw2El = document.getElementById('modal-export-pw2');
            const pw = pwEl ? pwEl.value : '';
            const pw2 = pw2El ? pw2El.value : '';
            if (pw !== pw2) {
                showModalError('modal-export-error', 'The two passwords do not match.');
                return;
            }

            const btn = document.getElementById('modal-export-btn');
            if (btn) btn.disabled = true;

            const exportedAt = new Date().toISOString();
            let data = collectBackupData();
            const incBox = document.getElementById('exp-settings');
            if (incBox && !incBox.checked) {
                SETTINGS_KEYS.forEach(k => { delete data[k]; });
                data.noSettings = true;
            }
            let suffix = '';
            if (exportScope !== 'all') {
                const val = (id) => (document.getElementById(id) || {}).value || '';
                let from = exportScope === 'day' ? val('exp-day') : val('exp-from');
                let to = exportScope === 'day' ? val('exp-day') : val('exp-to');
                if (!from || !to) { showModalError('modal-export-error', 'Please choose the date(s) to export.'); if (btn) btn.disabled = false; return; }
                if (from > to) [from, to] = [to, from];
                data = filterBackupToDays(data, from, to);
                if (!data.all_patients.length) { showModalError('modal-export-error', 'No patients are on the lists for those dates.'); if (btn) btn.disabled = false; return; }
                suffix = from === to ? `-day-${from}` : `-${from}-to-${to}`;
            }
            let file;
            try {
                if (pw) {
                    file = { app: 'RoundMaster', format: 1, exportedAt, encrypted: true, ...(await encryptJson(data, pw)) };
                } else {
                    file = { app: 'RoundMaster', format: 1, exportedAt, encrypted: false, data };
                }
            } catch(e) {
                showModalError('modal-export-error', 'Could not create the backup file.');
                if (btn) btn.disabled = false;
                return;
            }

            const blob = new Blob([JSON.stringify(file)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            // File name: RM.Ex-YYYY-MM-DD-HHMM (date and 24-hour time of the export)
            const now = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            a.download = `RM.Ex-${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 2000);

            if (exportScope === 'all') Store.set('last_backup', exportedAt);
            exportScope = 'all';
            closeModal();
            renderApp();
        }

        function triggerImport() {

        let pendingImport = null;

        function handleImportFile(input) {
            const file = input.files && input.files[0];
            input.value = '';
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                let parsed;
                try {
                    // Read by content, not by file name: some phones save the backup as .txt, .bin or with no extension.
                    let text = String(reader.result || '').replace(/^\uFEFF/, '').trim();
                    const i = text.indexOf('{'), j = text.lastIndexOf('}');
                    if (i > 0 || (j >= 0 && j < text.length - 1)) text = text.slice(i, j + 1);
                    parsed = JSON.parse(text);
                } catch(e) {
                    alert('This file is not a valid RoundMaster backup.');
                    return;
                }
                if (!parsed || parsed.app !== 'RoundMaster') {
                    alert('This file is not a RoundMaster backup.');
                    return;
                }
                if (parsed.encrypted) {
                    openImportPasswordModal(parsed);
                } else {
                    confirmImport(parsed.data, parsed.exportedAt);
                }
            };
            reader.onerror = () => alert('Could not read the file.');
            reader.readAsText(file);
        }

        function openImportPasswordModal(parsed) {

        async function submitImportPassword() {
            if (!pendingImport) return;
