                if (!d.started && Math.hypot(e.clientX - d.start[0], e.clientY - d.start[1]) >= 3) {
                    d.started = true;
                    const now = Date.now();
                    if (now - inkZoneToastAt > 1500) { inkZoneToastAt = now; showToast("Ink can't be added here"); }
                }
                return;
            }
            if (d.kind === 'eraser') inkEraserCursor(e.clientX, e.clientY, true);
            if (!d.started) {
                if (Math.hypot(e.clientX - d.start[0], e.clientY - d.start[1]) < 3) return; // still a tap
                d.started = true;
                window.getSelection().removeAllRanges();
            }
            e.preventDefault();
            if (d.kind === 'move') {
                const p = pageXY(e.clientX, e.clientY);
                d.dx = p[0] - d.p0[0]; d.dy = p[1] - d.p0[1];
                inkLayout({ ids: new Set(inkSel.ids), dx: d.dx, dy: d.dy });
                return;
            }
            const evs = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
            evs.forEach(ce => {
                const pt = pageXY(ce.clientX, ce.clientY);
                if (d.kind === 'eraser') { inkEraseAt(pt[0], pt[1]); return; }
                const last = d.pts[d.pts.length - 1];
                if (Math.hypot(pt[0] - last[0], pt[1] - last[1]) >= 0.8) { d.pts.push(pt); d.prs.push(ce.pressure || 0.5); }
            });
            if (d.kind !== 'eraser') inkLivePaint();
        }, { capture: true, passive: false });
        const stopNextClick = () => {
            const stopClick = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
            document.addEventListener('click', stopClick, { capture: true, once: true });
            setTimeout(() => document.removeEventListener('click', stopClick, true), 250);
        };
        const inkEnd = (e) => {
            if (!inkDraw || e.pointerId !== inkDraw.id) return;
            const d = inkDraw;
            inkDraw = null;
            if (d.kind === 'blocked') return;
            cancelAnimationFrame(inkLiveRaf);
            const ov = inkOverlay(false);
            if (ov) ov.querySelector('.ink-live').innerHTML = '';
            const hlL = inkHlLayer(false); if (hlL) hlL.querySelector('.ink-live').innerHTML = '';
            if (d.kind === 'eraser') { inkEraserCursor(0, 0, e.pointerType === 'pen' && e.type !== 'pointercancel'); if (d.before) inkPushSnap(d.before); }
            if (d.kind === 'move') {
                if (d.started && inkSel) {
                    // drop: the selected ink becomes one scribble, attached where it now sits (to a word if near one)
                    const before = inkSnap();
                    const all = inkAll();
                    const note = inkNote(all);
                    const g = Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
                    const items = inkSel.ids.map(id => inkAbs(d.root, note, id)).filter(Boolean)
                        .map(it => ({ ...it, st: { ...it.st, g }, abs: it.abs.map(([x, y]) => [x + d.dx, y + d.dy]) }));
                    if (items.length) { inkReanchor(d.root, note, items); inkSaveAll(all); inkPushSnap(before); }
                }
                stopNextClick();
                inkLayout(); inkShowToolbar();
                return;
            }
            if (d.started) {
                stopNextClick(); // a drawn stroke must not also click what it ended on
                if (d.kind === 'pen' && d.pts.length && !(d.st.hl && inkTextHighlight(d.root, d))) inkSave(d.root, d);
                if (d.kind === 'lasso' && d.pts.length > 2) {
                    const poly = d.pts;
                    const ids = inkExpandGroups(inkCache.filter(c => !c.thl).filter(c => c.pts.filter(pt => inside(pt, poly)).length >= Math.max(1, c.pts.length * 0.5)).map(c => c.id));
                    inkSel = ids.length ? { entry: inkEntry(), ids } : null;
                    if (!ids.length) showToast('Nothing selected - circle some ink');
                }
            } else if (d.kind === 'lasso') {
                // lasso tool: tapping a scribble selects all of it
                const [tx, ty] = d.pts[0];
                const hit = inkCache.filter(c => !c.thl).find(c => c.pts.some(([x, y]) => Math.hypot(x - tx, y - ty) <= c.w / 2 + 10));
                inkSel = hit ? { entry: inkEntry(), ids: inkExpandGroups([hit.id]) } : null;
                if (hit) stopNextClick();
            } else if (d.kind === 'pen' && inkDotOk(d)) {
                // a quick tap while writing or just after (the dot on an i, a full stop) is a dot, not a tap -
                // unless it is the pencil bouncing on the line it just drew
                stopNextClick();
                inkSave(d.root, d);
            }
            inkLayout();
            inkShowToolbar();
        };
        document.addEventListener('pointerup', inkEnd, true);
        document.addEventListener('pointercancel', inkEnd, true);
        document.addEventListener('pointerleave', (e) => { if (e.pointerType === 'pen' && !inkDraw) inkEraserCursor(0, 0, false); }, true);
        // The pencil must not scroll the page or select text while drawing (fingers still scroll)
        document.addEventListener('touchmove', (e) => {
            if (!inkRoot()) return;
            const pen = [...e.touches].some(t => t.touchType === 'stylus');
            if (pen && !(e.target.closest && e.target.closest(TYPING_SEL + ', #modal-container'))) e.preventDefault();
        }, { passive: false });
        document.addEventListener('selectstart', (e) => { if (inkDraw && inkDraw.started) e.preventDefault(); }, true);
        window.addEventListener('resize', inkLayoutSoon);
        window.addEventListener('resize', () => inkFabPlace());
        // Two-finger tap = Undo (on pages with ink)
        (() => {
            let t2 = null;
            document.addEventListener('touchstart', (e) => {
                if (!inkRoot()) { t2 = null; return; }
                if (e.touches.length === 2) t2 = { t: Date.now(), pts: [...e.touches].map(q => [q.clientX, q.clientY]), moved: false, ok: true };
                else if (e.touches.length > 2) t2 = null;
            }, { passive: true });
            document.addEventListener('touchmove', (e) => {
                if (!t2) return;
                [...e.touches].forEach((q, i) => { const p0 = t2.pts[i]; if (p0 && Math.hypot(q.clientX - p0[0], q.clientY - p0[1]) > 12) t2.moved = true; });
            }, { passive: true });
            document.addEventListener('touchend', (e) => {
                if (!t2 || e.touches.length) return;
                const g = t2; t2 = null;
                if (!g.moved && Date.now() - g.t < 350 && inkUndoLast()) showToast('Undone');
            }, { passive: true });
        })();
        window.addEventListener('resize', () => requestAnimationFrame(() => { fitListBar(); fitBoxHeaders(); }));
        try { new ResizeObserver(() => inkLayoutSoon()).observe(document.getElementById('main-view')); } catch (e) {}

        window.onload = async function() {
            try { await BigStore.ready(); } catch (e) { return; }
            // New install (or after "Wipe everything"): start with the default set-up
            try {
                if (localStorage.getItem(STORAGE_PREFIX + 'settings') === null) {
                    Store.set('settings', DEFAULT_SETTINGS);
                    Object.entries(DEFAULT_BUNDLE).forEach(([k, v]) => { if (localStorage.getItem(STORAGE_PREFIX + k) === null) Store.set(k, v); });
                }
            } catch (e) {}
            applyTheme();
            applyCardScale(); applyTextScale();
            try { fixEndorseSpelling(); } catch (e) { console.error(e); }
            try { history.replaceState(navState(), ''); } catch (e) {}
            try { migrateConsultEntries(); } catch (e) { console.error(e); }
            try { migrateRecs(); } catch (e) { console.error(e); }
            // One-time move of old shared notes into per-day notes, saved immediately.
            try {
                const raw = Store.raw('all_patients');
                if (raw && /"(activeIssues|resolvedIssues|plan|memo)"\s*:/.test(raw) &&
                    JSON.parse(raw).some(p => ['activeIssues', 'resolvedIssues', 'plan', 'memo'].some(k => p[k] !== undefined))) {
                    Store.savePatients(Store.getPatients());
                }
            } catch(e) {}
            renderApp();
            requestPersistentStorage();
        };
    </script>
<script>
        if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
        }
        // Self-check: are the install files (needed to install the app / show its icon) on the server?
        if (/^https?:$/.test(location.protocol)) {
            window.addEventListener('load', () => setTimeout(async () => {
                const need = ['app-v2.webmanifest', 'rm-heart-180.png', 'rm-heart-192.png', 'rm-heart-512.png', 'rm-heart-maskable-512.png', 'sw.js'];
                const missing = [];
                for (const f of need) {
                    try { const r = await fetch(f + '?check=' + Date.now(), { cache: 'no-store' }); if (!r.ok) missing.push(f); } catch (e) { return; } // offline: skip
                }
                if (!missing.length) return;
                const bar = document.createElement('div');
                bar.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;background:#7f1d1d;color:#fff;padding:10px 14px;border-radius:12px;font:13px/1.4 system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.3)';
                bar.innerHTML = '<b>Install files missing on the server:</b> ' + missing.join(', ') + '. Upload them to the main folder of the GitHub repository (next to index.html). <span style="float:right;cursor:pointer;font-weight:700" onclick="this.parentNode.remove()">✕</span>';
                document.body.appendChild(bar);
            }, 1500));
        }
    </script>
