    <script>
        // Apply the saved appearance (light / dark / match device) before the page paints.
        // Device orientation (not the visible area, which shrinks when the on-screen keyboard opens)
        function rmOrientation() {
            var land;
            try {
                if (screen.orientation && screen.orientation.type) land = screen.orientation.type.indexOf('landscape') === 0;
                else if (typeof window.orientation === 'number') land = Math.abs(window.orientation) === 90;
            } catch (e) {}
            if (land === undefined) land = window.innerWidth > window.innerHeight;
            document.documentElement.classList.toggle('is-land', land);
            // Phones (shorter screen side under 600px): tighter spacing everywhere
            var sw = Math.min(screen.width || 9999, screen.height || 9999);
            document.documentElement.classList.toggle('is-phone', sw < 600);
        }
        rmOrientation();
        try { if (screen.orientation) screen.orientation.addEventListener('change', rmOrientation); } catch (e) {}
        window.addEventListener('orientationchange', function () { setTimeout(rmOrientation, 50); });
        window.addEventListener('resize', rmOrientation);
        try { var ts = JSON.parse(localStorage.getItem('roundmaster_text_scale') || '1'); if (ts && ts !== 1) document.documentElement.style.setProperty('--ts', String(ts)); } catch (e) {}
        try {
            var t = JSON.parse(localStorage.getItem('roundmaster_theme') || '"light"');
            if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        } catch (e) {}
    </script>

        .issues-plan-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; align-items: start; }
        /* Side by side: landscape phones / tablets / desktops, and portrait iPad Air / Pro (≥ 800px wide).

        @media (min-width: 800px) { .issues-plan-grid { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); } }
        @media (min-width: 640px) { html.is-land .issues-plan-grid { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); } }

        /* Investigations: 3 per row on wide landscape screens, 2 on tablets / portrait, 1 on phones */

        .inv-board { position: relative; min-height: 1px; }
        .inv-board > .inv-card { position: absolute; box-sizing: border-box; }
        .inv-drop-marker { position: absolute; height: 4px; border-radius: 4px; background: #6366f1; pointer-events: none; z-index: 45; }
        [data-sort-item].swap-target { outline: 3px dashed #6366f1; outline-offset: 2px; }
        [data-sort-item].swap-dragging { opacity: 0.9; z-index: 40; position: relative; box-shadow: 0 16px 32px rgba(15, 23, 42, 0.25); pointer-events: none; }

        /* Active Issues / Consult Details: the opposite of the app's theme (dark box in light mode, light in dark mode) */

        /* Card size (Settings → Appearance): scales the main content boxes */
        :root { --card-scale: 1; --ts: 1; }
        /* Text size (Settings → Appearance): scales only the text, everywhere */
        body { font-size: calc(16px * var(--ts, 1)); }

        /* Clickable read-only items that open inline editing */
        .edit-trigger { cursor: text; }
        .edit-trigger:hover { background-color: #f8fafc; }

        /* ===== Dark mode =====
           The whole page is inverted and hue-shifted back, so every colour keeps its identity
           (ward, tag, physician and card colours) while backgrounds go dark and text goes light.
           Photos are inverted back so they look normal. */
        html.dark { filter: invert(1) hue-rotate(180deg); background-color: #fff; }
        html.dark img, html.dark video { filter: invert(1) hue-rotate(180deg); }
        /* Softer, slightly blue-tinted darks instead of pure black */
        html.dark body { background-color: #e9edf3 !important; }

        html.dark [class*="shadow"] { box-shadow: none !important; }

    <script>
        /* =========================================================
           HELPERS: escaping and local dates
           ========================================================= */

        // Escape any user-entered text before putting it into HTML.
        function esc(s) {
            return String(s ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Safely pass a text value as an argument inside onclick="fn(...)".
        function jsArg(s) {
            return esc(JSON.stringify(String(s ?? '')));
        }

        // Dates are handled in the device's local time zone (not UTC).
        function toLocalDateStr(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }
        function todayStr() {
            return toLocalDateStr(new Date());
        }
        function parseLocalDate(s) {
            const [y, m, d] = String(s).split('-').map(Number);
            return new Date(y, (m || 1) - 1, d || 1);
        }
        function addDays(dateStr, n) {
            const d = parseLocalDate(dateStr);
            d.setDate(d.getDate() + n);
            return toLocalDateStr(d);
        }
        function daysBetween(fromStr, toStr) {
            return Math.round((parseLocalDate(toStr) - parseLocalDate(fromStr)) / 86400000);
        }
        function admissionDayNumber(p) {
            return Math.abs(daysBetween(p.admissionDate || currentViewDate, currentViewDate));
        }
        function formatDateTime(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            if (isNaN(d)) return '-';
            const hh = String(d.getHours()).padStart(2, '0');
            const mm = String(d.getMinutes()).padStart(2, '0');
            return `${fmtDate(toLocalDateStr(d))} ${hh}:${mm}`;
        }

            ],

            autoTags: { endorse: 't6', done: 't7' },
            colorCodes: [
                { id: 'c1', name: 'Antibiotics', color: '#661daf' },
                { id: 'c2', name: 'Diuretics', color: '#e8bd21' },
                { id: 'c3', name: 'Fluid', color: '#1692d0' },

        // Lab units chosen by default (index into each lab's unit list, see LAB_REF).
        const DEFAULT_LAB_UNITS = {
            'lytes.cr': 1, 'lytes.alb': 1, 'glucose.fasting': 1, 'glucose.g1': 1, 'glucose.g2': 1, 'glucose.g3': 1,
            'inflammation.crp': 1, 'bone.ca': 1, 'bone.phos': 1, 'bone.mg': 1
        };

        const STORAGE_PREFIX = 'roundmaster_';
        // Everything a backup carries: patients, lists, settings, physician colours, lab units/ranges, appearance.
        const BACKUP_KEYS = ['settings', 'all_patients', 'daily_records', 'physician_colors_v2', 'physician_color_pins', 'lab_settings', 'theme', 'card_scale', 'text_scale', 'settings_closed', 'entry_split_v1'];
        let saveErrorShown = false;

        const Store = {
            get(key, defaultValue) {
                try {
                    const val = localStorage.getItem(STORAGE_PREFIX + key);
                    return val ? JSON.parse(val) : defaultValue;
                } catch(e) {
                    return defaultValue;
                }
            },
            set(key, value) {
                try {
                    localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
                    return true;
                } catch(e) {
                    if (!saveErrorShown) {
                        saveErrorShown = true;
                        alert('RoundMaster could not save your changes. Browser storage may be full or blocked. Go to Settings and export a backup now.');
                    }
                    return false;
                }
            },
            getSettings() {
                const st = this.get('settings', DEFAULT_SETTINGS);
                if (st && !st.autoTags) st.autoTags = guessAutoTags(st.tags || []);
                return st;
            },
            saveSettings(settings) {
                this.set('settings', settings);
            },
            getPatients() {
                const list = this.getRawPatients();
                let records = null;
                const getRecords = () => records || (records = this.getDailyRecords());
                list.forEach(p => {
                    migratePatientNotes(p, getRecords);
                    ensureMedBgIds(p);
                });
                return list;
            },
            getRawPatients() {
                return this.get('all_patients', []);
            },
            savePatients(patients) {
                this.set('all_patients', patients);
            },
            getDailyRecords() {
                return this.get('daily_records', {});
            },
            saveDailyRecords(records) {
                this.set('daily_records', records);
            }
        };

        // A day's record. Created only when something is written to that day.
        function emptyDay() {
            return { inpatientIds: [], consultIds: [], postDc: [], physicians: [], consultPhysicians: [], careFlags: {} };
        }
        function getOrCreateDay(records, date) {
            if (!records[date]) records[date] = emptyDay();
            const d = records[date];
            if (!d.inpatientIds) d.inpatientIds = [];
            if (!d.consultIds) d.consultIds = [];
            if (!d.postDc) d.postDc = [];
            if (!d.physicians) d.physicians = [];
            if (!d.consultPhysicians) d.consultPhysicians = [];
            if (!d.careFlags) d.careFlags = {};
            return d;
        }
        // Read a day without saving anything (viewing an empty day does not create it).
        function readDay(date) {
            return getOrCreateDay(Store.getDailyRecords(), date);
        }

        /* =========================================================
           ENTRIES
           A patient can have an inpatient entry and a consult entry on the same day.
           They are completely separate. Each is stored under its own key:
             inpatient entry -> "YYYY-MM-DD"      consult entry -> "YYYY-MM-DD@c"
           (patient.dayInfo, patient.days, patient.labs and Daily Care all use this key.)
           ========================================================= */

        let currentEntryType = 'inpatient'; // which entry the record page / list page is working on
        function entryKey(date, type) { return type === 'consult' ? date + '@c' : date; }
        function keyDate(key) { return String(key).slice(0, 10); }
        function keyType(key) { return String(key).endsWith('@c') ? 'consult' : 'inpatient'; }
        function curKey() { return entryKey(currentViewDate, currentEntryType); }
        function sameTypeKeys(obj, key) {
            const t = keyType(key);
            return Object.keys(obj || {}).filter(k => keyType(k) === t);
        }
        function careKey(patientId, type) { return type === 'consult' ? patientId + '@c' : patientId; }

        /* =========================================================
           PER-DAY PATIENT NOTES
           Each patient keeps one note per day in patient.days[date]:
           { activeIssues, resolvedIssues, plan, memo }.
           Demographics, location, goals of care, physician, tags and
           medical background stay on the patient and are shared by all days.
           ========================================================= */

        function emptyNote() {
            return { activeIssues: [], resolvedIssues: [], plan: [], memo: '', investigations: [] };
        }

        // Read-only: the note for a date, or null if none was written that day.
        function getDayNote(p, date) {
            return (p && p.days && p.days[date]) || null;
        }

        // For editing: returns that day's note, creating it if needed.
        function dayNoteFor(allPatients, patientId, date = curKey()) {
            const p = allPatients.find(x => x.id === patientId);
            if (!p) return null;
            if (!p.days) p.days = {};
            if (!p.days[date]) p.days[date] = emptyNote();
            return p.days[date];
        }

        function noteHasContent(n) {
            return !!n && (
                (n.activeIssues || []).length > 0 ||
                (n.resolvedIssues || []).length > 0 ||
                (n.plan || []).length > 0 ||
                (n.dcPlan || []).length > 0 ||
                !!n.discharge ||
                (n.investigations || []).length > 0 ||
                (n.memo || '').trim() !== ''
            );
        }

        // Entry keys (same type as `key`) that have notes.
        function noteDates(p, key) {
            return sameTypeKeys((p && p.days) || {}, key).filter(d => noteHasContent(p.days[d])).sort();
        }
        function previousNoteDate(p, key) {
            const ds = noteDates(p, key).filter(d => d < key);
            return ds.length ? ds[ds.length - 1] : null;
        }

        // Dates are shown as DD/MM/YYYY (full) or DD/MM (short, see fmtMD).
        function fmtDate(dateStr) {
            if (!dateStr) return '';
            const m = String(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})/);
            return m ? `${m[3]}/${m[2]}/${m[1]}` : String(dateStr);
        }
        function formatDisplayDate(dateStr) {
            return fmtDate(dateStr);
        }

        // Date box: type the date as DD/MM/YYYY (slashes are added automatically) or tap the calendar button.
        // or tap the calendar button. onchangeJs runs with `this` = the hidden date input (use this.value).
        function dateField(value, onchangeJs, { id = '', cls = '', placeholder = 'DD/MM/YYYY', textAttrs = '' } = {}) {
            return `
                <span class="date-field ${cls}">
                    <input type="text" class="date-field-text" value="${esc(value ? fmtDate(value) : '')}" placeholder="${esc(placeholder)}"
                        inputmode="numeric" autocomplete="off" ${textAttrs}
                        oninput="dateTyping(this, event)" onblur="dateCommit(this)"
                        onkeydown="if (event.key === 'Enter') { event.preventDefault(); this.blur(); }">
                    <button type="button" class="date-cal-btn" onclick="openDatePicker(this)" title="Pick from calendar"><i class="fa-regular fa-calendar"></i></button>
                    <input type="date" class="date-field-native" tabindex="-1" ${id ? `id="${esc(id)}"` : ''} value="${esc(value || '')}"
                        onchange="this.parentElement.querySelector('.date-field-text').value = fmtDate(this.value); ${onchangeJs || ''}">
                </span>
            `;
        }

        // Reads a typed date: DD/MM/YYYY or DDMMYYYY (also YYYY/MM/DD; /, - or . separators). '' = empty, null = invalid.
        function parseTypedDate(text) {
            const t = String(text || '').trim();
            if (!t) return '';
            let m, y, mo, d;
            if ((m = t.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
            else if ((m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/))) { d = +m[1]; mo = +m[2]; y = +m[3]; }
            else if ((m = t.match(/^(\d{2})(\d{2})(\d{4})$/)) && +m[3] >= 1900) { d = +m[1]; mo = +m[2]; y = +m[3]; }
            else if ((m = t.match(/^(\d{4})(\d{2})(\d{2})$/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
            else return null;
            const dt = new Date(y, mo - 1, d);
            if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d || y < 1900 || y > 2100) return null;
            return toLocalDateStr(dt);
        }

        // Adds the slashes while typing day-first digits (e.g. 15031956 -> 15/03/1956).
        function dateTyping(el, e) {
            if (e && e.inputType && e.inputType.startsWith('delete')) return;
            const v = el.value;
            if (!/^[\d\/]*$/.test(v)) return;
            if (v.includes('/') && v.split('/')[0].length !== 2) return; // typing it your own way: left as typed
            const digits = v.replace(/\D/g, '').slice(0, 8);
            let out = digits.slice(0, 2);
            if (digits.length > 2) out += '/' + digits.slice(2, 4);
            if (digits.length > 4) out += '/' + digits.slice(4, 8);
            if (digits.length === 2 || digits.length === 4) out += '/';
            el.value = out;
        }

        // When leaving the box: save a valid date, or put the old one back.
        function dateCommit(el) {
            const wrap = el.parentElement;
            const native = wrap.querySelector('.date-field-native');
            const iso = parseTypedDate(el.value);
            if (iso === null) {
                el.value = native.value ? fmtDate(native.value) : '';
                wrap.classList.add('date-invalid');
                setTimeout(() => wrap.classList.remove('date-invalid'), 1500);
                showToast('Please type the date as DD/MM/YYYY');
                return;
            }
            el.value = iso ? fmtDate(iso) : '';
            if (iso !== native.value) {
                native.value = iso;
                native.dispatchEvent(new Event('change', { bubbles: true }));
            }
        }

        function openDatePicker(btn) {
            const native = btn.parentElement.querySelector('.date-field-native');
            try { native.showPicker(); } catch (e) { native.style.pointerEvents = 'auto'; native.focus(); native.click(); native.style.pointerEvents = ''; }
        }

        // Copies the most recent earlier day's active issues and unfinished plan items into today.
        function copyNoteFromPrevious(patientId) {
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === patientId);
            if (!p) return;
            const prev = previousNoteDate(p, curKey());
            if (!prev) return;
            normalizeImages(p);
            const src = p.days[prev];
            const note = dayNoteFor(allPatients, patientId);
            const stamp = Date.now();
            note.activeIssues = (src.activeIssues || []).map((ai, i) => ({
                id: 'ai_' + stamp + '_' + i,
                issue: ai.issue,
                treatments: (ai.treatments || []).map(t => ({ text: shiftCourseText(t.text, daysBetween(keyDate(prev), currentViewDate)), color: t.color }))
            }));
            note.plan = (src.plan || []).filter(pl => !pl.completed).map((pl, i) => ({
                id: 'pl_' + stamp + '_' + i,
                text: pl.text,
                completed: false
            }));
            note.dcPlan = (src.dcPlan || []).filter(pl => !pl.completed).map((pl, i) => ({
                id: 'dc_' + stamp + '_' + i,
                text: pl.text,
                completed: false
            }));
            if (src.impression && !note.impression) note.impression = src.impression;
            if (!note.investigations) note.investigations = [];
            mergeInvestigationPanels(src.investigations || [], note.investigations);
            Store.savePatients(allPatients);
            renderApp();
        }

        function startBlankNote(patientId) {
            const allPatients = Store.getPatients();
            dayNoteFor(allPatients, patientId);
            Store.savePatients(allPatients);
            renderApp();
        }

        function goToNoteDate(date) {
            if (date) {
                currentViewDate = date;
                renderApp();
            }
        }

        /* =========================================================
           PER-DAY PATIENT DETAILS
           Only name, MRN, gender and the EMR memo live on the patient.
           Everything else is recorded per day in patient.dayInfo[date].
           ========================================================= */

        const DAY_INFO_FIELDS = ['age', 'ward', 'room', 'bed', 'goalsOfCare', 'physician', 'consultant', 'admissionDate', 'consultDate', 'tags', 'medicalBackground', 'caseSummary'];

        function clone(obj) {
            return JSON.parse(JSON.stringify(obj));
        }

        function normalizeInfo(src) {
            const s = src || {};
            return {
                age: s.age || '',
                ward: s.ward || '',
                room: s.room || '',
                bed: s.bed || '',
                goalsOfCare: s.goalsOfCare || '',
                physician: s.physician || '',      // inpatient: physician · consult: primary team
                consultant: s.consultant || '',    // consult: the physician (colours the card)
                admissionDate: s.admissionDate || '',
                consultDate: s.consultDate || '',
                tags: Array.isArray(s.tags) ? s.tags : (s.tag ? [s.tag] : []),
                medicalBackground: Array.isArray(s.medicalBackground) ? s.medicalBackground : [],
                caseSummary: s.caseSummary || ''
            };
        }

        // Details for an entry: its own record, else the latest earlier entry of the same type,
        // else older-version fields.
        function getDayInfo(p, date) {
            const di = (p && p.dayInfo) || {};
            if (di[date]) return normalizeInfo(di[date]);
            const earlier = sameTypeKeys(di, date).filter(d => d < date).sort();
            if (earlier.length) return normalizeInfo(di[earlier[earlier.length - 1]]);
            return normalizeInfo(p);
        }

        // The last documented details (used by All Patients).
        function latestInfo(p) {
            const di = (p && p.dayInfo) || {};
            const dates = Object.keys(di).sort();
            return dates.length ? normalizeInfo(di[dates[dates.length - 1]]) : normalizeInfo(p);
        }
        function latestInfoDate(p) {
            const dates = Object.keys((p && p.dayInfo) || {}).sort();
            return dates.length ? dates[dates.length - 1] : null;
        }

        // For editing: that day's details, created from the effective values if missing.
        function infoFor(allPatients, patientId, date = curKey()) {
            const p = allPatients.find(x => x.id === patientId);
            if (!p) return null;
            if (!p.dayInfo) p.dayInfo = {};
            if (!p.dayInfo[date]) p.dayInfo[date] = clone(getDayInfo(p, date));
            return p.dayInfo[date];
        }

        // The patient as seen on a given date (shared fields + that day's details).
        function effectivePatient(p, date) {
            return { ...p, ...getDayInfo(p, date) };
        }

        // Dates on which the patient appears on a list (one type, or either when type is omitted).
        function listedDates(patientId, type) {
            const records = Store.getDailyRecords();
            return Object.keys(records).filter(d => {
                const r = records[d];
                if (!r) return false;
                const inpt = (r.inpatientIds || []).includes(patientId);
                const cons = (r.consultIds || []).includes(patientId);
                return type === 'inpatient' ? inpt : type === 'consult' ? cons : (inpt || cons);
            }).sort();
        }
        // Every entry the patient has: [{ date, type, key }], oldest first.
        function listedEntries(patientId) {
            const out = [];
            listedDates(patientId, 'inpatient').forEach(d => out.push({ date: d, type: 'inpatient', key: d }));
            listedDates(patientId, 'consult').forEach(d => out.push({ date: d, type: 'consult', key: d + '@c' }));
            return out.sort((a, b) => a.date === b.date ? (a.type === 'inpatient' ? -1 : 1) : (a.date < b.date ? -1 : 1));
        }
        function listTypeOn(patientId, date) {
            const day = readDay(date);
            if (day.inpatientIds.includes(patientId)) return 'Inpatient';
            if (day.consultIds.includes(patientId)) return 'Consult';
            return '';
        }

        // "Add All to Tomorrow": the whole entry goes with the card, and is ADDED to whatever the
        // destination day already has — nothing there is wiped.
        //  - Details: empty fields are filled in; filled ones are kept. Tags and background are combined.
        //  - Daily record: issues / consult details, resolved items, unfinished plan items and trend tables
        //    are added if not already there (matched by title/text). The daily memo stays with its own day.
        function mergeEntry(p, fromDate, toDate) {
            const norm = (t) => String(t || '').trim().toLowerCase();
            normalizeImages(p);
            if (!p.dayInfo) p.dayInfo = {};
            const src = getDayInfo(p, fromDate);
            // "Done" belongs to one day's Daily Care, so it isn't copied to the next day.
            const doneName = autoTagName(Store.getSettings(), 'done');
            if (!p.dayInfo[toDate]) {
                p.dayInfo[toDate] = clone(src);
                if (doneName) p.dayInfo[toDate].tags = (p.dayInfo[toDate].tags || []).filter(t => t !== doneName);
                if (p.dayInfo[toDate].autoTagState) delete p.dayInfo[toDate].autoTagState.done;
            } else {
                const dst = p.dayInfo[toDate];
                ['age', 'ward', 'room', 'bed', 'goalsOfCare', 'physician', 'consultant', 'admissionDate', 'consultDate', 'caseSummary'].forEach(f => {
                    if (!String(dst[f] || '').trim() && src[f]) dst[f] = src[f];
                });
                dst.tags = [...new Set([...(dst.tags || []), ...(src.tags || []).filter(t => !isNewTag(t) && !isNewMarker(t) && t !== doneName)])];
                const have = new Set((dst.medicalBackground || []).map(m => m.id));
                dst.medicalBackground = starredFirst([...(dst.medicalBackground || []), ...clone(src.medicalBackground).filter(m => !have.has(m.id))]);
            }

            const note = getDayNote(p, fromDate);
            if (!note) return;
            if (!p.days) p.days = {};
            const dst = p.days[toDate] || (p.days[toDate] = emptyNote());
            ['activeIssues', 'resolvedIssues', 'plan', 'investigations'].forEach(k => { if (!Array.isArray(dst[k])) dst[k] = []; });

            (note.activeIssues || []).forEach(ai => {
                // Treatment courses (D#/n) move on by the number of days between the entries.
                const dd = daysBetween(keyDate(fromDate), keyDate(toDate));
                const shifted = (t) => ({ ...clone(t), text: shiftCourseText(t.text, dd) });
                const ex = dst.activeIssues.find(x => norm(x.issue) === norm(ai.issue));
                if (!ex) { dst.activeIssues.push({ ...clone(ai), treatments: (ai.treatments || []).map(shifted) }); return; }
                if (!Array.isArray(ex.treatments)) ex.treatments = [];
                (ai.treatments || []).forEach(t => {
                    if (norm(t.text) && !ex.treatments.some(x => courseStrip(x.text) === courseStrip(t.text))) ex.treatments.push(shifted(t));
                });
            });
            (note.resolvedIssues || []).forEach(ri => {
                const known = [...dst.resolvedIssues, ...dst.activeIssues].some(x => norm(x.issue) === norm(ri.issue));
                if (!known) dst.resolvedIssues.push(clone(ri));
            });
            (note.plan || []).filter(pl => !pl.completed).forEach(pl => {
                if (!dst.plan.some(x => norm(x.text) === norm(pl.text))) dst.plan.push({ ...clone(pl), completed: false });
            });
            if (!Array.isArray(dst.dcPlan)) dst.dcPlan = [];
            (note.dcPlan || []).filter(pl => !pl.completed).forEach(pl => {
                if (!dst.dcPlan.some(x => norm(x.text) === norm(pl.text))) dst.dcPlan.push({ ...clone(pl), completed: false });
            });
            mergeInvestigationPanels(note.investigations || [], dst.investigations);
            // Consult impression carries over (unless the next day already has its own)
            if (String(note.impression || '').trim() && !String(dst.impression || '').trim()) dst.impression = note.impression;
        }

        // When a patient is taken off a list, that entry's details and notes are deleted too, so nothing
        // stale reappears if they are put back later. The other list's entry (if any) is untouched.
        function removeDayDataIfUnlisted(p, records, date, type = 'inpatient') {
            const day = records[date];
            const listKey = type === 'consult' ? 'consultIds' : 'inpatientIds';
            if (day && (day[listKey] || []).includes(p.id)) return;
            const key = entryKey(date, type);
            if (p.dayInfo) delete p.dayInfo[key];
            if (p.days) delete p.days[key];
            if (p.labs) delete p.labs[key];
            if (day && day.careFlags) delete day.careFlags[careKey(p.id, type)];
            gcImages(p);
        }

        // The All Patients reference data, ignoring one date (used when that date is being overwritten).
        function latestInfoExcept(p, exceptDate) {
            const di = (p && p.dayInfo) || {};
            const dates = Object.keys(di).filter(d => d !== exceptDate).sort();
            return dates.length ? normalizeInfo(di[dates[dates.length - 1]]) : normalizeInfo(p);
        }

        // Details that should be filled in for an entry.
        const REQUIRED_DETAILS = [
            ['ward', 'Ward'], ['room', 'Room'], ['bed', 'Bed'], ['physician', 'Physician'],
            ['admissionDate', 'Admitted on'], ['dob', 'Date of birth'], ['goalsOfCare', 'Goals of care']
        ];
        const REQUIRED_DETAILS_CONSULT = [
            ['ward', 'Ward'], ['room', 'Room'], ['bed', 'Bed'], ['physician', 'Primary team'], ['consultant', 'Physician'],
            ['consultDate', 'Consult date'], ['dob', 'Date of birth'], ['goalsOfCare', 'Goals of care']
        ];
        function requiredFor(isConsult) { return isConsult ? REQUIRED_DETAILS_CONSULT : REQUIRED_DETAILS; }
        function missingDetails(p, isConsult = false) {
            return requiredFor(isConsult).filter(([f]) => !String(p[f] || '').trim()).map(([, label]) => label);
        }
        const MISSING_MARK = `<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-rose-500 text-white text-[calc(11px*var(--ts,1))] font-black align-middle" title="Missing — please fill in">!</span>`;
        // Shows the value, or a red (!) when it's empty.
        function orMissing(v) {
            return String(v || '').trim() ? esc(v) : MISSING_MARK;
        }

        // "New" is automatic: shown on an entry when the patient wasn't on the same list the day before,
        // and gone the next day. Any stored "New" tag is ignored.
        function isNewTag(name) { return String(name || '').trim().toLowerCase() === 'new'; }
        function isNewEntry(patientId, date, type) {
            const prev = Store.getDailyRecords()[addDays(date, -1)];
            const listKey = type === 'consult' ? 'consultIds' : 'inpatientIds';
            return !(prev && (prev[listKey] || []).includes(patientId));
        }
        // "New" is shown automatically on a patient's first day on a list. It can also be ticked on or off
        // by hand for one entry: saved as the markers "new@<entry>" / "!new@<entry>", so it never carries over.
        function isNewMarker(t) { return /^!?new@/i.test(String(t || '')); }
        /* ---------- Automatic tags ----------
           Endorse: added when a Plan or Discharge Plan line contains "endorse".
           Done:    added when every Daily Care box is ticked.
           Each is added once, when its condition becomes true. Unticking / editing never removes it,
           and if you remove the tag yourself it stays off (until the condition turns false and true again). */
        const AUTO_TAG_RULES = {
            endorse: { label: 'Endorse', desc: 'A Plan or Discharge Plan line contains the word "endorse"' },
            done: { label: 'Done', desc: 'All Daily Care boxes are ticked' }
        };
        // One-time fix: the tag first saved as "Endrose" is "Endorse" (settings and every patient day).
        function fixEndorseSpelling() {
            const st = Store.getSettings();
            const bad = (st.tags || []).filter(t => /^\s*endrose\s*$/i.test(t.name));
            if (!bad.length) return;
            const names = bad.map(t => t.name);
            bad.forEach(t => { t.name = 'Endorse'; });
            Store.saveSettings(st);
            const all = Store.getPatients();
            all.forEach(p => Object.values(p.dayInfo || {}).forEach(info => {
                if (Array.isArray(info.tags)) info.tags = [...new Set(info.tags.map(t => names.includes(t) ? 'Endorse' : t))];
            }));
            Store.savePatients(all);
        }
        function guessAutoTags(tags) {
            const letters = (n) => String(n || '').toLowerCase().replace(/[^a-z]/g, '');
            const find = (names) => { const t = tags.find(t => names.includes(letters(t.name))); return t ? t.id : null; };
            return { endorse: find(['endorse', 'endrose', 'endorsed']), done: find(['done']) };
        }
        function autoTagName(settings, rule) {
            const id = (settings.autoTags || {})[rule];
            const t = id && settings.tags.find(x => x.id === id);
            return t ? t.name : null;
        }
        const ENDORSE_RE = /endorse/i;
        function autoTagConditions(p, key, careFlags) {
            const note = getDayNote(p, key) || {};
            const endorse = [...(note.plan || []), ...(note.dcPlan || [])].some(pl => ENDORSE_RE.test(pl.text || ''));
            const need = keyType(key) === 'consult' ? ['reviewDone', 'planDone'] : ['vitalsDone', 'labsDone', 'planDone'];
            const f = careFlags || {};
            return { endorse, done: need.every(k => f[k]) };
        }
        // Checks the patients on the lists for the day being viewed (and the open record); saves only if something changed.
        function runAutoTags() {
            const settings = Store.getSettings();
            if (!autoTagName(settings, 'endorse') && !autoTagName(settings, 'done')) return;
            const records = Store.getDailyRecords();
            const day = records[currentViewDate] || {};
            const pairs = [];
            (day.inpatientIds || []).forEach(id => pairs.push([id, 'inpatient']));
            (day.consultIds || []).forEach(id => pairs.push([id, 'consult']));
            if (currentRoute === 'patient_file' && activePatientId && !pairs.some(([id, t]) => id === activePatientId && t === currentEntryType)) pairs.push([activePatientId, currentEntryType]);
            if (!pairs.length) return;
            const allPatients = Store.getPatients();
            let changed = false;
            pairs.forEach(([id, type]) => {
                const p = allPatients.find(x => x.id === id);
                if (!p) return;
                const key = entryKey(currentViewDate, type);
                if (!getDayNote(p, key) && !(p.dayInfo || {})[key]) return;
                const cond = autoTagConditions(p, key, (day.careFlags || {})[careKey(id, type)]);
                const info = infoFor(allPatients, id, key);
                const state = info.autoTagState || {};
                Object.keys(AUTO_TAG_RULES).forEach(rule => {
                    const name = autoTagName(settings, rule);
                    const now = !!cond[rule];
                    if (name && now && !state[rule] && !(info.tags || []).includes(name)) { info.tags = [...(info.tags || []), name]; changed = true; }
                    if (!!state[rule] !== now) { state[rule] = now; changed = true; }
                });
                info.autoTagState = state;
            });
            if (changed) Store.savePatients(allPatients);
        }

        function displayTags(p, tags, date, type) {
            const key = entryKey(date, type);
            const list = tags || [];
            const own = list.filter(t => !isNewTag(t) && !isNewMarker(t));
            const auto = isNewEntry(p.id, date, type) && !list.includes('!new@' + key);
            const manual = list.includes('new@' + key);
            if (!auto && !manual) return own;
            const newName = (Store.getSettings().tags.find(t => isNewTag(t.name)) || { name: 'New' }).name;
            return [newName, ...own];
        }

        // Age is worked out from the date of birth (saved once on the patient), as of the day being viewed.
        // Patients saved before DOB existed fall back to their old recorded age until a DOB is entered.
        function ageFromDob(dob, onDate) {
            if (!dob) return null;
            const b = parseLocalDate(dob), d = parseLocalDate(onDate || todayStr());
            let years = d.getFullYear() - b.getFullYear();
            if (d.getMonth() < b.getMonth() || (d.getMonth() === b.getMonth() && d.getDate() < b.getDate())) years--;
            if (years >= 1) return `${years} YO`;
            let months = (d.getFullYear() - b.getFullYear()) * 12 + d.getMonth() - b.getMonth() - (d.getDate() < b.getDate() ? 1 : 0);
            return `${Math.max(0, months)} mo`;
        }
        function ageText(p, onDate) {
            if (p && p.dob) return ageFromDob(p.dob, onDate);
            return p && p.age ? `${p.age} YO` : '';
        }

        // Starred (highlighted) background entries always sit at the top, keeping their order.
        function starredFirst(list) {
            return [...list.filter(m => m.starred), ...list.filter(m => !m.starred)];
        }

        // Older versions kept one shared note on the patient. Move it into a single day:
        // the latest day (up to today) the patient was on a list, otherwise today.
        function migratePatientNotes(p, getRecords) {
            const legacyKeys = ['activeIssues', 'resolvedIssues', 'plan', 'memo'];
            if (!legacyKeys.some(k => p[k] !== undefined)) return false;
            if (!p.days) p.days = {};
            const today = todayStr();
            const records = getRecords();
            const listedDates = Object.keys(records).filter(d => d <= today && records[d] &&
                ((records[d].inpatientIds || []).includes(p.id) || (records[d].consultIds || []).includes(p.id))).sort();
            const date = listedDates.length ? listedDates[listedDates.length - 1] : today;
            if (!p.days[date]) {
                p.days[date] = {
                    activeIssues: p.activeIssues || [],
                    resolvedIssues: p.resolvedIssues || [],
                    plan: p.plan || [],
                    memo: p.memo || ''
                };
            }
            legacyKeys.forEach(k => delete p[k]);
            return true;
        }

        /* =========================================================
           APP STATE + ROUTER
           ========================================================= */

        let currentRoute = 'home';
        let currentViewDate = todayStr();
        let activePatientId = null;
        let isEditingMode = false;
        let isMedicalBgCollapsed = false;
        let editingTile = null; // patient record: which single detail box is being edited ('room', 'name', 'tags'...)
        let profileEncounterIdx = 0; // which encounter is expanded on the All Patients record (0 = most recent)
        let storagePersisted = null; // true / false / null (unsupported or unknown)

        // Browser / Android back button: every page change is a history step, so Back returns to the
        // previous page instead of leaving the app. Back with a pop-up open just closes the pop-up.
        function navState() {
            return { rm: 1, route: currentRoute, date: currentViewDate, patientId: activePatientId, type: currentEntryType };
        }
        let navFromHistory = false;
        window.addEventListener('popstate', (e) => {
            if (document.getElementById('color-picker')) {
                closeColorPicker(false);
                try { history.pushState(navState(), ''); } catch (err) {}
                return;
            }
            const container = document.getElementById('modal-container');
            if (container && container.innerHTML.trim()) {
                if (typeof dcDraft !== 'undefined') dcDraft = null;
                closeModal();
                try { history.pushState(navState(), ''); } catch (err) {}
                return;
            }
            const st = e.state;
            if (!st || !st.rm) return;
            navFromHistory = true;
            try {
                router.navigate(st.route, { date: st.date, patientId: st.patientId, type: st.type });
            } finally { navFromHistory = false; }
        });

        const router = {
            navigate(route, params = {}) {
                const fromRoute = currentRoute, fromPid = activePatientId;
                if (editing) { cleanupEditing(); editing = null; }
                if (route === 'patient_profile') profileEncounterIdx = -1;
                editingTile = (params && params.editTile) || null;
                if (params && params.type) currentEntryType = params.type;
                currentRoute = route;
                if (params && params.date) currentViewDate = params.date;
                if (params && params.patientId) activePatientId = params.patientId;
                window.scrollTo(0, 0);
                renderApp();
                if (!navFromHistory) {
                    try {
                        const same = fromRoute === route && fromPid === activePatientId;
                        if (same) history.replaceState(navState(), '');
                        else history.pushState(navState(), '');
                    } catch (err) {}
                }
            }
        };

        function closeModal() {
            const container = document.getElementById('modal-container');
            if (container) container.innerHTML = '';
        }

        function renderApp() {
            const main = document.getElementById('main-view');
            if (!main) return;
            physicianColorCache = {}; // recalculated from the latest lists on every redraw
            // Keep the page where it is: hold the old height while the new content goes in.
            const keepY = window.scrollY;
            if (currentRoute !== 'patient_file') viewEntryKey = null; // leaving the entry resets its boxes
            main.style.minHeight = main.offsetHeight + 'px';
            closeModal();
            try { fixEndorseSpelling(); runAutoTags(); } catch (e) { console.error(e); }

            switch(currentRoute) {
                case 'home':
                    main.innerHTML = renderHomeView();
                    break;
                case 'inpatient':
                    main.innerHTML = renderInpatientView();
                    break;
                case 'consult':
                    main.innerHTML = renderConsultView();
                    break;
                case 'all_patients':
                    main.innerHTML = renderAllPatientsView();
                    break;
                case 'patient_file':
                    main.innerHTML = renderPatientFileView();
                    break;
                case 'patient_profile':
                    main.innerHTML = renderPatientProfileView();
                    break;
                case 'settings':
                    main.innerHTML = renderSettingsView();
                    break;
                default:
                    main.innerHTML = renderHomeView();
            }

            document.querySelectorAll('textarea.cult-input, textarea.auto-grow').forEach(autoGrow);
            layoutInvestigations();
            watchInvCards();
            document.querySelectorAll('.inv-board img').forEach(img => { if (!img.complete) img.addEventListener('load', layoutInvestigations, { once: true }); });
            main.style.minHeight = '';
            if (Math.abs(window.scrollY - keepY) > 1) window.scrollTo(0, keepY);

            // Details: focus the single box being edited.
            if (editingTile) {
                const el = document.querySelector('[data-tile-input]');
                if (el) {
                    el.focus();
                    if (el.select && el.tagName === 'INPUT' && el.type !== 'number') el.select();
                }
            }

            // Put the cursor in the item that was just opened for editing.
            if (pendingFocus) {
                const box = document.querySelector('[data-editing]');
                let el = null;
                if (box) {
                    el = pendingFocus === '@lastTreatment'
                        ? [...box.querySelectorAll('[data-treatment]')].pop()
                        : box.querySelector(pendingFocus);
                }
                pendingFocus = null;
                if (el) {
                    el.focus();
                    if (el.setSelectionRange && typeof el.value === 'string') el.setSelectionRange(el.value.length, el.value.length);
                }
            }
        }

        /* =========================================================
           GENERIC CONFIRM DIALOG
           ========================================================= */

        let pendingConfirmAction = null;

        // messageHtml must already be escaped by the caller.
        function showConfirm({ title, messageHtml, confirmLabel = 'Confirm', onConfirm }) {
            const container = document.getElementById('modal-container');
            if (!container) return;
            pendingConfirmAction = onConfirm;
            container.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-4 text-center">
                        <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center mx-auto text-xl">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800">${esc(title)}</h3>
                        <p class="text-xs text-slate-500">${messageHtml}</p>
                        <div class="flex justify-center space-x-2 pt-2">
                            <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-sm font-medium">Cancel</button>
                            <button onclick="runPendingConfirm()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-sm font-medium">${esc(confirmLabel)}</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function runPendingConfirm() {
            const fn = pendingConfirmAction;
            pendingConfirmAction = null;
            closeModal();
            if (fn) fn();
        }

        /* =========================================================
           TOAST
           ========================================================= */

        function showToast(msg) {
            let t = document.getElementById('toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'toast';
                t.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-slate-900 text-white text-sm px-4 py-2.5 rounded-xl shadow-lg transition-opacity duration-300 pointer-events-none';
                document.body.appendChild(t);
            }
            t.textContent = msg;
            t.style.opacity = '1';
            clearTimeout(t._hide);
            t._hide = setTimeout(() => { t.style.opacity = '0'; }, 2600);
        }

        /* =========================================================
           DRAG AND DROP REORDERING (mouse + touch, via pointer events)
           Markup: a container with data-sort-list="<key>" (and data-patient-id),
           children with data-sort-item (and data-id), each with a .drag-handle.
           ========================================================= */

        // Drag handle: always on the right edge of its box, tinted in that box's colour.
        // theme: Tailwind classes for background + icon colour, or {bg, fg} colours.
        function gripHandle(round = 'rounded-r-xl', theme = 'bg-slate-100 text-slate-400') {
            const isObj = theme && typeof theme === 'object';
            const cls = isObj ? '' : theme;
            const style = isObj ? `style="background-color: ${theme.bg}; color: ${theme.fg}"` : '';
            return `<div class="drag-handle order-last flex items-center justify-center w-7 sm:w-8 shrink-0 self-stretch opacity-80 hover:opacity-100 transition ${round.replace(/rounded-l/g, 'rounded-r')} ${cls}" ${style} title="Drag to reorder"><i class="fa-solid fa-grip-lines"></i></div>`;
        }

        let dragState = null;

        function sortItemsOf(list) {
            return [...list.children].filter(el => el.hasAttribute('data-sort-item'));
        }

        document.addEventListener('pointerdown', (e) => {
            const handle = e.target.closest('.drag-handle');
            if (!handle || (e.pointerType === 'mouse' && e.button !== 0)) return;
            const item = handle.closest('[data-sort-item]');
            const list = item && item.closest('[data-sort-list]');
            if (!list) return;
            e.preventDefault();
            if (editing) { cleanupEditing(); editing = null; }
            if (list.hasAttribute('data-board')) {
                // Board mode: the card follows your finger; a blue line shows where it will land.
                dragState = { board: true, list, item, drop: null, pointerId: e.pointerId, x0: e.clientX, y0: e.clientY, sy0: window.scrollY, marker: null };
                item.classList.add('swap-dragging');
                document.body.classList.add('is-dragging');
                try { handle.setPointerCapture(e.pointerId); } catch (err) {}
                return;
            }
            const items = sortItemsOf(list);
            dragState = { list, item, from: items.indexOf(item), pointerId: e.pointerId, moved: false };
            item.classList.add('dragging');
            document.body.classList.add('is-dragging');
            try { handle.setPointerCapture(e.pointerId); } catch (err) {}
        });

        document.addEventListener('pointermove', (e) => {
            if (!dragState || e.pointerId !== dragState.pointerId) return;
            e.preventDefault();
            if (dragState.board) {
                const ds = dragState;
                const z = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-scale')) || 1;
                ds.item.style.transform = `translate(${(e.clientX - ds.x0) / z}px, ${(e.clientY - ds.y0 + (window.scrollY - ds.sy0)) / z}px)`;
                const br = ds.list.getBoundingClientRect();
                const n = invColumnCount();
                const col = Math.max(0, Math.min(n - 1, Math.floor(((e.clientX - br.left) / br.width) * n)));
                // Cards in that column (excluding the one being moved), top to bottom.
                const inCol = [...ds.list.querySelectorAll(':scope > .inv-card')].filter(c => {
                    if (c === ds.item) return false;
                    const cc = +c.dataset.col, sp = +c.dataset.span || 1;
                    return col >= cc && col < cc + sp;
                }).sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);
                const before = inCol.find(c => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; }) || null;
                ds.drop = { col, beforeId: before ? before.getAttribute('data-id') : null };
                // Drop marker (in the board's own, un-zoomed coordinates)
                if (!ds.marker) { ds.marker = document.createElement('div'); ds.marker.className = 'inv-drop-marker'; ds.list.appendChild(ds.marker); }
                const W = ds.list.clientWidth, colW = (W - INV_GAP * (n - 1)) / n;
                let y;
                if (before) y = parseFloat(before.style.top) - INV_GAP / 2 - 2;
                else {
                    const last = inCol[inCol.length - 1];
                    y = last ? parseFloat(last.style.top) + last.offsetHeight + INV_GAP / 2 - 2 : 0;
                }
                ds.marker.style.left = (col * (colW + INV_GAP)) + 'px';
                ds.marker.style.width = colW + 'px';
                ds.marker.style.top = Math.max(-2, y) + 'px';
                const edgeS = 70;
                if (e.clientY < edgeS) window.scrollBy(0, -14);
                else if (e.clientY > window.innerHeight - edgeS) window.scrollBy(0, 14);
                return;
            }
            const { list, item } = dragState;
            // Grouped lists (e.g. Investigation Set sections): an item can move into another list of the group.
            const group = list.getAttribute('data-sort-group');
            if (group) {
                const target = [...document.querySelectorAll(`[data-sort-group="${group}"]`)].find(l => {
                    const r = l.getBoundingClientRect();
                    return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top - 8 && e.clientY <= r.bottom + 8;
                });
                if (target && target !== item.parentElement) {
                    // first item that comes after the pointer in reading order (works for lists and 2-column grids)
                    const before = sortItemsOf(target).find(x => {
                        const r = x.getBoundingClientRect();
                        return e.clientY < r.top || (e.clientY <= r.bottom && e.clientX < r.left + r.width / 2);
                    });
                    if (before) before.before(item);
                    else target.appendChild(item);
                    const hint = target.querySelector(':scope > p');
                    if (hint) hint.remove();
                    dragState.moved = true;
                }
            }
            const siblings = sortItemsOf(item.parentElement);
            const over = siblings.find(s => {
                if (s === item) return false;
                const r = s.getBoundingClientRect();
                return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
            });
            if (over) {
                const r = over.getBoundingClientRect();
                const ir = item.getBoundingClientRect();
                const movingForward = siblings.indexOf(item) < siblings.indexOf(over);
                const sameRow = Math.abs(r.top - ir.top) < Math.min(r.height, ir.height) / 2;
                const past = sameRow
                    ? (movingForward ? e.clientX > r.left + r.width / 2 : e.clientX < r.left + r.width / 2)
                    : (movingForward ? e.clientY > r.top + r.height / 2 : e.clientY < r.top + r.height / 2);
                if (past) {
                    if (movingForward) over.after(item); else over.before(item);
                    dragState.moved = true;
                }
            }
            const edge = 70;
            if (e.clientY < edge) window.scrollBy(0, -14);
            else if (e.clientY > window.innerHeight - edge) window.scrollBy(0, 14);
        }, { passive: false });

        function endDrag(e) {
            if (!dragState || (e && e.pointerId !== dragState.pointerId)) return;
            if (dragState.board) {
                const { list, item, drop, marker } = dragState;
                item.classList.remove('swap-dragging');
                item.style.transform = '';
                document.body.classList.remove('is-dragging');
                if (marker) marker.remove();
                dragState = null;
                if (drop && e && e.type === 'pointerup' && drop.beforeId !== item.getAttribute('data-id')) {
                    moveInvPanel(list.getAttribute('data-patient-id'), item.getAttribute('data-id'), drop.col, drop.beforeId);
                } else {
                    renderApp();
                }
                return;
            }
            const { list, item, from } = dragState;
            item.classList.remove('dragging');
            document.body.classList.remove('is-dragging');
            const group = list.getAttribute('data-sort-group');
            if (group === 'invsets') {
                const moved = dragState.moved;
                dragState = null;
                if (moved) {
                    const layout = {};
                    document.querySelectorAll('[data-sort-group="invsets"]').forEach(l => {
                        layout[l.getAttribute('data-section')] = sortItemsOf(l).map(el => el.getAttribute('data-id'));
                    });
                    saveInvSetLayout(layout);
                }
                renderApp();
                return;
            }
            const items = sortItemsOf(list);
            const to = items.indexOf(item);
            const ids = items.map(el => el.getAttribute('data-id'));
            dragState = null;
            if (to !== from && to > -1) {
                handleReorder(list.getAttribute('data-sort-list'), list.getAttribute('data-patient-id'), from, to, ids);
            } else {
                renderApp();
            }
        }
        document.addEventListener('pointerup', endDrag);
        document.addEventListener('pointercancel', endDrag);

        // Investigations: two cards switch places.
        function swapInvPanels(patientId, a, b) {
            const allPatients = Store.getPatients();
            const note = dayNoteFor(allPatients, patientId);
            const list = note.investigations || [];
            if (list[a] && list[b] && a !== b) {
                [list[a], list[b]] = [list[b], list[a]];
                Store.savePatients(allPatients);
            }
            renderApp();
        }

        function moveItem(arr, from, to) {
            if (!arr || from < 0 || from >= arr.length) return;
            const [x] = arr.splice(from, 1);
            arr.splice(to, 0, x);
        }

        function handleReorder(key, patientId, from, to, ids) {

            if (key === 'inpatients' || key === 'consults') {
                const listKey = key === 'inpatients' ? 'inpatientIds' : 'consultIds';
                const records = Store.getDailyRecords();
                const day = getOrCreateDay(records, currentViewDate);
                const domIds = ids.filter(Boolean);
                day[listKey] = [...domIds, ...day[listKey].filter(id => !domIds.includes(id))];
                Store.saveDailyRecords(records);
            } else {
                const allPatients = Store.getPatients();
                if (key === 'issues') {
                    moveItem(dayNoteFor(allPatients, patientId).activeIssues, from, to);
                } else if (key === 'plan' || key === 'dcplan') {
                    moveItem(planList(dayNoteFor(allPatients, patientId), key), from, to);
                } else if (key === 'inv') {
                    moveItem(dayNoteFor(allPatients, patientId).investigations, from, to);
                } else if (key === 'medbg') {
                    const info = infoFor(allPatients, patientId);
                    moveItem(info.medicalBackground, from, to);
                    info.medicalBackground = starredFirst(info.medicalBackground);
                    const p = allPatients.find(x => x.id === patientId);
                    forwardMedBg(p, curKey(), { type: 'reorder', order: info.medicalBackground.map(m => m.id) });
                }
                Store.savePatients(allPatients);
            }
            renderApp();
        }

        /* =========================================================
           CLICK-TO-EDIT
           Clicking an item (data-edit-trigger) opens it for editing.
           Clicking anywhere else, pressing Escape, or "Done" closes it.
           Items left completely empty are removed when closed.
           ========================================================= */

        let editing = null;       // { section: 'issue' | 'plan' | 'medbg', idx, patientId, date }
        let pendingFocus = null;  // CSS selector inside the open editor to focus after render

        function isEditingItem(section, idx, patientId) {
            return !!editing && editing.section === section && editing.idx === idx &&
                editing.patientId === patientId &&
                (section === 'postdc' ? editing.date === currentViewDate : editing.key === curKey());
        }

        function startEditing(section, idx, focusSel = 'input[type="text"], textarea', patientId = activePatientId) {
            let newIdx = idx;
            if (editing && !(editing.section === section && editing.idx === idx)) {
                const removed = cleanupEditing();
                if (removed && removed.section === section && removed.idx < idx) newIdx = idx - 1;
            }
            editing = { section, idx: newIdx, patientId, date: currentViewDate, key: curKey() };
            pendingFocus = focusSel;
            renderApp();
        }

        function stopEditing() {
            if (!editing) return;
            cleanupEditing();
            editing = null;
            renderApp();
        }

        // Removes the item being edited if it was left empty. Returns what was removed, if anything.
        function cleanupEditing() {
            if (!editing) return null;
            const { section, idx, patientId, date } = editing;
            if (section === 'postdc') {
                const records = Store.getDailyRecords();
                const list = records[date] && records[date].postDc;
                if (list && list[idx] && !(list[idx].text || '').trim()) {
                    list.splice(idx, 1);
                    Store.saveDailyRecords(records);
                    return { section, idx };
                }
                return null;
            }
            const key = editing.key;
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === patientId);
            if (!p) return null;
            let removed = null;
            if (section === 'medbg') {
                const list = p.dayInfo && p.dayInfo[key] && p.dayInfo[key].medicalBackground;
                const m = list && list[idx];
                if (m && !(m.condition || '').trim() && !(m.treatment || '').trim()) {
                    list.splice(idx, 1);
                    forwardMedBg(p, key, { type: 'delete', id: m.id });
                    removed = { section, idx };
                }
            } else {
                const note = getDayNote(p, key);
                if (section === 'issue' && note && note.activeIssues[idx]) {
                    const ai = note.activeIssues[idx];
                    if (!(ai.issue || '').trim() && !(ai.treatments || []).some(t => (t.text || '').trim())) {
                        note.activeIssues.splice(idx, 1);
                        removed = { section, idx };
                    }
                } else if ((section === 'plan' || section === 'dcplan') && note) {
                    const list = planList(note, section);
                    if (list[idx] && !(list[idx].text || '').trim()) {
                        list.splice(idx, 1);
                        removed = { section, idx };
                    }
                }
            }
            if (removed) Store.savePatients(allPatients);
            return removed;
        }

        document.addEventListener('click', (e) => {
            if (!editing) return;
            if (e.target.closest('[data-editing], [data-edit-trigger], #modal-container')) return;
            stopEditing();
        });

        document.addEventListener('keydown', (e) => {
            if (!editing) return;
            if (e.key === 'Escape') { e.preventDefault(); stopEditing(); return; }
            if (e.key === 'Enter' && !e.shiftKey && e.target.matches('[data-editing] input[type="text"], [data-editing] textarea[data-enter]')) {
                e.preventDefault();
                const action = e.target.getAttribute('data-enter');
                if (action === 'add-treatment') {
                    addTreatmentLine(editing.patientId, editing.idx);
                } else if (action === 'add-plan') {
                    // Enter on a filled line starts a new one; Enter on an empty line finishes.
                    if (e.target.value.trim()) addPlanItem(editing.patientId, editing.section);
                    else stopEditing();
                } else {
                    stopEditing();
                }
            }
        });

        /* =========================================================
           MEDICAL BACKGROUND: edits flow forward in time only.
           Each entry has an id; an add / edit / delete / reorder made on a day
           is applied to that patient's later days, never earlier ones.
           ========================================================= */

        function mbId() {
            return 'mb_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        }

        // Older entries have no id: give matching entries across days the same id.
        function ensureMedBgIds(p) {
            const byKey = {};
            const fix = (list) => (list || []).forEach(m => {
                const k = (m.condition || '') + '|' + (m.treatment || '');
                if (!m.id) m.id = byKey[k] || mbId();
                if (!byKey[k]) byKey[k] = m.id;
            });
            fix(p.medicalBackground);
            Object.keys(p.dayInfo || {}).sort().forEach(d => fix(p.dayInfo[d].medicalBackground));
        }

        function forwardMedBg(p, fromDate, op) {
            if (!p || !p.dayInfo) return;
            sameTypeKeys(p.dayInfo, fromDate).filter(d => d > fromDate).forEach(d => {
                const info = p.dayInfo[d];
                if (!Array.isArray(info.medicalBackground)) info.medicalBackground = [];
                const list = info.medicalBackground;
                if (op.type === 'add') {
                    if (!list.some(x => x.id === op.entry.id)) list.push(clone(op.entry));
                } else if (op.type === 'update') {
                    const x = list.find(x => x.id === op.id);
                    if (x) x[op.field] = op.value;
                } else if (op.type === 'delete') {
                    info.medicalBackground = list.filter(x => x.id !== op.id);
                } else if (op.type === 'reorder') {
                    const rank = (id) => { const i = op.order.indexOf(id); return i < 0 ? 1e9 : i; };
                    list.sort((a, b) => rank(a.id) - rank(b.id));
                }
            });
        }

        function addMedicalBackground(patientId) {
            const allPatients = Store.getPatients();
            const info = infoFor(allPatients, patientId);
            if (!info) return;
            const entry = { id: mbId(), condition: '', treatment: '' };
            info.medicalBackground.push(entry);
            forwardMedBg(allPatients.find(x => x.id === patientId), curKey(), { type: 'add', entry });
            Store.savePatients(allPatients);
            isMedicalBgCollapsed = false;
            startEditing('medbg', info.medicalBackground.length - 1);
        }

        function updateMedicalBackgroundLive(patientId, idx, field, val) {
            const allPatients = Store.getPatients();
            const info = infoFor(allPatients, patientId);
            const m = info && info.medicalBackground[idx];
            if (!m) return;
            m[field] = val;
            forwardMedBg(allPatients.find(x => x.id === patientId), curKey(), { type: 'update', id: m.id, field, value: val });
            Store.savePatients(allPatients);
        }

        function deleteMedicalBackground(patientId, idx) {
            const allPatients = Store.getPatients();
            const info = infoFor(allPatients, patientId);
            const m = info && info.medicalBackground[idx];
            if (!m) return;
            info.medicalBackground.splice(idx, 1);
            forwardMedBg(allPatients.find(x => x.id === patientId), curKey(), { type: 'delete', id: m.id });
            Store.savePatients(allPatients);
            editing = null;
            renderApp();
        }

        /* =========================================================
           PHYSICIANS
           ========================================================= */

        // 20 vivid colours (no black / gray). `swatch` is the colour shown in the picker; cards use a
        // light tint (bg), a soft border and a dark text shade of the same hue. Ordered so the first
        // colours handed out are as different from each other as possible.
        const PHYSICIAN_PALETTE = [
            { id: 'red',        swatch: '#f44336', bg: '#fde3e1', border: '#f8a39c', text: '#a1180e' },
            { id: 'blue',       swatch: '#2196f3', bg: '#dceefe', border: '#90c9f9', text: '#0d4f8b' },
            { id: 'green',      swatch: '#43a047', bg: '#e0f2e1', border: '#9fd4a1', text: '#1f5e22' },
            { id: 'orange',     swatch: '#ff9800', bg: '#fff0d9', border: '#ffcc80', text: '#8a4b00' },
            { id: 'purple',     swatch: '#9c27b0', bg: '#f4e2f7', border: '#d9a4e2', text: '#6a1b7a' },
            { id: 'teal',       swatch: '#009688', bg: '#d7f2ef', border: '#80cbc4', text: '#00574e' },
            { id: 'pink',       swatch: '#e91e63', bg: '#fce1ea', border: '#f48fb1', text: '#9c0f40' },
            { id: 'yellow',     swatch: '#fbc02d', bg: '#fff7d1', border: '#ffe082', text: '#7a5b00' },
            { id: 'indigo',     swatch: '#3f51b5', bg: '#e1e4f5', border: '#9fa8da', text: '#283593' },
            { id: 'lime',       swatch: '#8bc34a', bg: '#eef7e3', border: '#c5e1a5', text: '#3e6b12' },
            { id: 'brown',      swatch: '#795548', bg: '#efe7e4', border: '#bcaaa4', text: '#4e342e' },
            { id: 'cyan',       swatch: '#00bcd4', bg: '#d6f5fa', border: '#80deea', text: '#00636f' },
            { id: 'deeporange', swatch: '#ff5722', bg: '#ffe6dd', border: '#ffab91', text: '#a3300b' },
            { id: 'deeppurple', swatch: '#673ab7', bg: '#ebe3f6', border: '#b39ddb', text: '#45218a' },
            { id: 'lightgreen', swatch: '#cddc39', bg: '#f8fadc', border: '#e6ee9c', text: '#5c6305' },
            { id: 'lightblue',  swatch: '#03a9f4', bg: '#dcf2fd', border: '#81d4fa', text: '#015a85' },
            { id: 'amber',      swatch: '#ffc107', bg: '#fff5d6', border: '#ffd54f', text: '#7a5800' },
            { id: 'magenta',    swatch: '#d81b9b', bg: '#fbe1f3', border: '#ef95d3', text: '#8c0f63' },
            { id: 'emerald',    swatch: '#10b981', bg: '#d6f5ea', border: '#6ee7b7', text: '#065f46' },
            { id: 'olive',      swatch: '#9e9d24', bg: '#f4f4d9', border: '#d4d36a', text: '#5a5a10' }
        ];
        // Colours are unique WITHIN A DAY: every physician / primary team on that day's lists gets a
        // different colour. Each name has a usual colour (remembered). Colours you choose yourself are
        // given first; anyone whose usual colour is already taken that day borrows a free one for that day.
        const PCOLOR_KEY = 'physician_colors_v2';
        const PCOLOR_PINS = 'physician_color_pins';
        let physicianColorCache = {};
        function usualColorIndex(key, prefs, avoid) {
            if (prefs[key] !== undefined && PHYSICIAN_PALETTE[prefs[key]]) return prefs[key];
            // New name: prefer a colour not used by anyone today, then the least-used colour overall.
            const counts = PHYSICIAN_PALETTE.map(() => 0);
            Object.values(prefs).forEach(i => { if (counts[i] !== undefined) counts[i]++; });
            const order = PHYSICIAN_PALETTE.map((_, i) => i).sort((a, b) => counts[a] - counts[b] || a - b);
            const idx = order.find(i => !avoid.has(i));
            prefs[key] = idx !== undefined ? idx : order[0];
            return prefs[key];
        }
        function dayNames(date) {
            const records = Store.getDailyRecords();
            const day = records[date] || {};
            const all = Store.getPatients();
            const names = [];
            const add = (n) => { const k = String(n || '').trim().toLowerCase(); if (k && !names.includes(k)) names.push(k); };
            (day.inpatientIds || []).forEach(id => { const p = all.find(x => x.id === id); if (p) add(getDayInfo(p, date).physician); });
            (day.physicians || []).forEach(add);
            (day.consultIds || []).forEach(id => { const p = all.find(x => x.id === id); if (p) add(getDayInfo(p, entryKey(date, 'consult')).consultant); });
            (day.consultPhysicians || []).forEach(add);
            return names;
        }
        function dayColorMap(date) {
            if (physicianColorCache[date]) return physicianColorCache[date];
            const pins = Store.get(PCOLOR_PINS, {});
            const names = dayNames(date);
            const ordered = [...names.filter(k => pins[k]), ...names.filter(k => !pins[k])];
            const prefs = Store.get(PCOLOR_KEY, {});
            const before = JSON.stringify(prefs);
            const map = {};
            const used = new Set();
            ordered.forEach(k => {
                let idx = usualColorIndex(k, prefs, used);
                if (used.has(idx)) {
                    const free = PHYSICIAN_PALETTE.findIndex((_, i) => !used.has(i));
                    idx = free === -1 ? idx : free;
                }
                map[k] = idx;
                used.add(idx);
            });
            if (JSON.stringify(prefs) !== before) Store.set(PCOLOR_KEY, prefs);
            physicianColorCache[date] = map;
            return map;
        }
        function physicianColorIndex(name, date = currentViewDate) {
            const key = String(name || '').trim().toLowerCase();
            if (!key) return -1;
            const map = dayColorMap(date);
            if (map[key] === undefined) {
                // A name not on that day's lists (e.g. just being typed): avoid the day's colours if possible.
                const prefs = Store.get(PCOLOR_KEY, {});
                const used = new Set(Object.values(map));
                let idx = usualColorIndex(key, prefs, used);
                Store.set(PCOLOR_KEY, prefs);
                if (used.has(idx)) {
                    const free = PHYSICIAN_PALETTE.findIndex((_, i) => !used.has(i));
                    if (free !== -1) idx = free;
                }
                map[key] = idx;
            }
            return map[key] % PHYSICIAN_PALETTE.length;
        }
        function getPhysicianColor(name, date = currentViewDate) {
            const i = physicianColorIndex(name, date);
            return i < 0 ? { bg: '#f8fafc', border: '#e2e8f0', text: '#64748b', swatch: '#94a3b8' } : PHYSICIAN_PALETTE[i];
        }

        // Tap a physician in the Physicians list to choose their colour.
        function openPhysicianColorPicker(name) {
            const key = String(name || '').trim().toLowerCase();
            const current = physicianColorIndex(name);
            const map = dayColorMap(currentViewDate);
            const usedBy = {};
            const display = {};
            dayNames(currentViewDate).forEach(k => { display[k] = k; });
            Object.entries(map).forEach(([k, i]) => { if (k !== key) usedBy[i] = k; });
            const container = document.getElementById('modal-container');

                        <div class="flex items-center justify-between">

                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="grid grid-cols-5 gap-3 justify-items-center">
                            ${PHYSICIAN_PALETTE.map((c, i) => `
                                <button onclick="setPhysicianColor(${jsArg(name)}, ${i})" class="relative w-11 h-11 rounded-full flex items-center justify-center transition hover:scale-110 ${i === current ? 'ring-4 ring-offset-2 ring-slate-300' : ''}" style="background-color: ${c.swatch}" title="${usedBy[i] !== undefined ? 'Used today by ' + esc(usedBy[i]) : ''}">
                                    ${i === current ? '<i class="fa-solid fa-check text-white text-lg"></i>' : ''}
                                    ${usedBy[i] !== undefined && i !== current ? '<span class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full bg-white border-2 border-slate-400"></span>' : ''}
                                </button>`).join('')}
                        </div>
                        <p class="text-[calc(11px*var(--ts,1))] text-slate-400"><span class="inline-block w-2.5 h-2.5 rounded-full bg-white border-2 border-slate-400 align-middle"></span> = in use by another name today. Choosing it gives that name a different colour today.</p>
                    </div>
                </div>`;
        }
        function setPhysicianColor(name, idx) {
            const key = String(name || '').trim().toLowerCase();
            const prefs = Store.get(PCOLOR_KEY, {});
            const pins = Store.get(PCOLOR_PINS, {});
            prefs[key] = idx;
            pins[key] = true;
            Store.set(PCOLOR_KEY, prefs);
            Store.set(PCOLOR_PINS, pins);
            closeModal();
            renderApp();
        }

        // Inpatients: the "physician" field and day.physicians. Consults: "consultant" and day.consultPhysicians
        // (on consults the "physician" field is the primary team).
        function physField(type) { return type === 'consult' ? 'consultant' : 'physician'; }
        function physListKey(type) { return type === 'consult' ? 'consultPhysicians' : 'physicians'; }
        function ensurePhysicianExists(drName, type = 'inpatient') {
            if (!drName || !drName.trim()) return;
            const trimmed = drName.trim();
            const records = Store.getDailyRecords();
            const day = getOrCreateDay(records, currentViewDate);
            const lk = physListKey(type);
            if (!day[lk].includes(trimmed)) {
                day[lk].push(trimmed);
                Store.saveDailyRecords(records);
            }
        }

        // Team / MRP (dashboard). Saved with the settings, so they go into backups too.

        /* =========================================================
           LIST PAGES (Inpatient + Consult share one design)

        const LIST_CFG = {

        function canonicalWard(value) {

            dayPatients.forEach(p => {

                if (!(d in counts)) { counts[d] = 0; order.push(d); }
                counts[d]++;

            (dayData[physListKey(type)] || []).forEach(d => {

            return order.map(name => ({ name, count: counts[name] }));
