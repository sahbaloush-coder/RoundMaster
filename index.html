                    res: `<span class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded-full bg-rose-100 text-rose-700"><i class="fa-solid fa-capsules"></i><i class="fa-solid fa-xmark text-[calc(10px*var(--ts,1))]"></i></span>`
                };
                const removeBtn = (r) => `<button onclick="removeRec(${pid}, '${type}', ${rid(r)})" class="text-slate-300 hover:text-rose-500" title="Delete from this patient's record"><i class="fa-solid fa-xmark text-[calc(11px*var(--ts,1))]"></i></button>`;
                const cell = (icon, inner, title) => `<div class="flex items-start gap-1.5 min-w-0 flex-1"><span class="shrink-0 w-5 pt-1 text-center text-[calc(11px*var(--ts,1))]" style="color: ${th.icon}" title="${title}">${icon}</span><div class="flex-1 min-w-0">${inner}</div></div>`;
                const pillCell = (pill, inner, title) => `<div class="flex items-start gap-1.5 min-w-0 flex-1"><span class="shrink-0 pt-0.5" title="${title}">${pill}</span><div class="flex-1 min-w-0">${inner}</div></div>`;
                const word = { cultures: 'cultures', pcr: 'PCR / RAT results', ua: 'urinalyses' }[type];
                const empty = `<div class="px-2 py-2 text-[calc(11px*var(--ts,1))] text-slate-400 italic">No ${word} yet.</div>`;
                const stacked = (inner) => `${rows.length === 0 ? empty : ''}<div class="divide-y divide-slate-100">${rows.map(r => `<div class="rec-row relative p-2 pr-6 space-y-1.5"><div class="absolute right-1.5 top-2">${removeBtn(r)}</div>${inner(r)}</div>`).join('')}</div>`;
                let body = '';
                if (type === 'cultures' && !phone) {
                    body = `
                    <div class="overflow-x-auto">
                        <table class="w-full min-w-[34rem] text-xs table-fixed">
                            <colgroup><col style="width: 13%"><col style="width: 15%"><col style="width: 14%"><col style="width: 15%"><col><col><col style="width: 1.3rem"></colgroup>
                            <thead>
                                <tr class="text-[calc(11px*var(--ts,1))]">
                                    <th class="px-1 py-1.5 text-left font-semibold truncate" style="color: ${th.text}" title="Source">${C.source} Source</th>
                                    <th class="px-1 py-1.5 text-left font-semibold truncate" style="color: ${th.text}" title="Date">${C.date} Date</th>
                                    <th class="px-1 py-1.5 text-left font-semibold truncate" style="color: ${th.text}" title="Status (e.g. treated, colonisation)">${C.status} Status</th>
                                    <th class="px-1 py-1.5 text-left font-semibold truncate" style="color: ${th.text}" title="Bug">${C.bug} Bug</th>
                                    <th class="px-1 py-1.5 text-left" title="Sensitive to">${C.sens}</th>
                                    <th class="px-1 py-1.5 text-left" title="Resistant to">${C.res}</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows.length === 0 ? `<tr><td colspan="7">${empty}</td></tr>` : ''}
                                ${rows.map(r => `
                                    <tr class="border-t border-slate-100 align-top">
                                        <td class="px-0.5 py-1">${srcBox(r, 'culture')}</td>
                                        <td class="px-0.5 py-1">${dateBox(r)}</td>
                                        <td class="px-0.5 py-1">${area(r, 'status', 'e.g. Treated')}</td>
                                        <td class="px-0.5 py-1">${area(r, 'organism', 'e.g. E. coli', 'italic')}</td>
                                        <td class="px-0.5 py-1">${area(r, 'sens', 'Sensitive', 'text-emerald-700')}</td>
                                        <td class="px-0.5 py-1">${area(r, 'res', 'Resistant', 'text-rose-700')}</td>
                                        <td class="px-0.5 py-1.5">${removeBtn(r)}</td>
                                    </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>`;
                } else if (type === 'cultures') {
                    // Phone: source + date / bug + status / sensitive + resistant, labelled by icon.
                    body = stacked(r => `
                        <div class="flex gap-2">${cell(C.source, srcBox(r, 'culture'), 'Source')}${cell(C.date, dateBox(r), 'Date')}</div>
                        <div class="flex gap-2">${cell(C.bug, area(r, 'organism', 'Bug', 'italic'), 'Bug')}${cell(C.status, area(r, 'status', 'Status'), 'Status')}</div>
                        <div class="flex gap-2">${pillCell(C.sens, area(r, 'sens', 'Sensitive', 'text-emerald-700'), 'Sensitive to')}${pillCell(C.res, area(r, 'res', 'Resistant', 'text-rose-700'), 'Resistant to')}</div>`);
                } else if (type === 'pcr') {
                    const resBtn = (r, val, label, on, off) => `<button onclick="setPcrResult(${pid}, ${rid(r)}, '${val}')" class="px-2 py-1 rounded-md text-[calc(11px*var(--ts,1))] font-bold border transition ${r.result === val ? on : off}">${label}</button>`;
                    body = stacked(r => `
                        <div class="flex gap-2">${cell(C.source, srcBox(r, 'source'), 'Source')}${cell(C.date, dateBox(r), 'Date')}</div>
                        <div class="flex gap-2 items-start">${cell(C.bug, area(r, 'bug', 'Bug / target', 'italic'), 'Bug')}
                            <div class="shrink-0 flex gap-1">
                                ${resBtn(r, 'pos', '<i class="fa-solid fa-plus"></i> Positive', 'bg-rose-600 text-white border-rose-600', 'bg-white text-rose-600 border-rose-200 hover:bg-rose-50')}
                                ${resBtn(r, 'neg', '<i class="fa-solid fa-minus"></i> Negative', 'bg-emerald-600 text-white border-emerald-600', 'bg-white text-emerald-700 border-emerald-200 hover:bg-emerald-50')}
                            </div>
                        </div>`);
                } else {
                    body = stacked(r => `
                        <div class="flex gap-2 items-start">${cell(C.date, dateBox(r), 'Date')}
                            <div class="flex-1 flex gap-1 pt-0.5">
                                ${[['poc', 'POC'], ['lab', 'Lab']].map(([v, label]) => `<button onclick="setUaKind(${pid}, ${rid(r)}, '${v}')" class="px-2.5 py-1 rounded-md text-[calc(11px*var(--ts,1))] font-bold border transition ${r.kind === v ? 'bg-amber-600 text-white border-amber-600' : 'bg-white text-amber-700 border-amber-200 hover:bg-amber-50'}">${label}</button>`).join('')}
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-1 pl-6">
                            ${UA_FLAGS.map(([k, label]) => `<button onclick="toggleUaFlag(${pid}, ${rid(r)}, '${k}')" class="px-2 py-1 rounded-md text-[calc(11px*var(--ts,1))] font-bold border transition ${(r.flags || {})[k] ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-slate-500 border-slate-200 hover:bg-amber-50'}">${(r.flags || {})[k] ? '<i class="fa-solid fa-check text-[calc(9px*var(--ts,1))]"></i> ' : ''}${label}</button>`).join('')}
                        </div>
                        <div class="pl-6">${area(r, 'note', 'Notes')}</div>`);
                }
                const addLabel = { cultures: 'Add culture', pcr: 'Add PCR / RAT', ua: 'Add urinalysis' }[type];
                return wrap(`
                    ${header(esc(def.title))}
                    <div class="${collapsed ? 'hidden' : ''}">
                        ${body}
                        <div class="p-2 border-t border-slate-100">
                            <button onclick="addRec(${pid}, '${type}')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold" style="background-color: ${th.head}; color: ${th.text}"><i class="fa-solid fa-plus"></i> ${addLabel}</button>
                        </div>
                    </div>
                `);
            }
            if (panel.type === 'image') {
                const src = imageSrc(p, panel);
                return wrap(`
                    ${header(titleInput('Name this image'))}
                    <div class="p-3 ${collapsed ? 'hidden' : ''}">
                        ${src ? `<img src="${esc(src)}" alt="${esc(panel.title || 'Investigation image')}" onclick="openImageViewer(${pid}, ${panelId})" class="max-h-72 w-auto mx-auto rounded-lg border border-slate-200 cursor-zoom-in">` : '<p class="text-xs text-slate-400 italic">No image.</p>'}
                    </div>
                `);
            }

            // Trend table: rows = parameters, columns = this day then the 4 days before it (DD/MM).
            const dates = Array.from({ length: TREND_DAYS }, (_, i) => addDays(currentViewDate, -i));
            const keys = dates.map(d => entryKey(d, currentEntryType));
            const sex = p.gender;
            // Each row: value key, label, unit (shown when the range doesn't carry it), range, calculated?, free-text?
            const rows = panel.type === 'labs'
                ? (panel.rows || []).map(name => {
                    const rec = recognizeLab(name); // typed labs take the format of the same lab in a set
                    const range = rec ? rec.range(sex) : null;
                    return { key: customLabKey(name), label: name, unit: rec && rec.unit && !(range && range.u) ? rec.unit : '', range, isCustom: true, from: rec ? rec.from : '' };
                })
                : panelSetRows(panel).map(r => {
                    const range = setRowRange(panel.type, r, sex);
                    const valueType = panel.type === 'ulytes' && panel.mode === '24h' ? 'ulytes24' : panel.type; // Spot and 24 hr trends kept apart
                    return { key: panel.type === 'custom' ? `${panel.setId}.${r.k}` : labKey(valueType, r.k), k: r.k, label: r.label, unit: r.unit && !(range && range.u) ? r.unit : '', range, calc: r.calc || null, kind: r.kind || '' };
                });
            return wrap(`
                ${header(esc(def.title))}
                <div class="${collapsed ? 'hidden' : ''}">
                    <div class="overflow-x-auto">
                        <table class="w-full text-xs">
                            <thead>
                                <tr class="text-slate-500">
                                    <th class="text-left font-semibold px-2 py-1.5 sticky left-0 bg-white"></th>
                                    ${dates.map((d, i) => `<th class="px-1 py-1.5 font-semibold text-center whitespace-nowrap" ${i === 0 ? `style="background-color: ${th.col}; color: ${th.text}"` : ''} title="${esc(fmtDate(d))}">${esc(fmtMD(d))}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody>
                                ${rows.map(({ key, k, label, unit, calc, isCustom, kind, range, from }) => {
                                    const rt = range ? rangeText(range) : '';
                                    const rangeAttr = range ? `data-range="${esc(JSON.stringify({ lo: range.lo, hi: range.hi }))}"` : '';
                                    return `
                                    <tr class="border-t border-slate-100">
                                        <td class="pl-1 pr-2 py-1 font-semibold text-slate-700 whitespace-nowrap sticky left-0 bg-white" ${from ? `title="Format from ${esc(from)}"` : ''}>
                                            <div class="flex items-start gap-1">
                                                ${isCustom ? `<button onclick="removeCustomLabRow(${pid}, ${panelId}, ${jsArg(label)})" class="shrink-0 w-3.5 leading-none pt-[3px] text-slate-300 hover:text-rose-500" title="Remove row"><i class="fa-solid fa-xmark text-[calc(10px*var(--ts,1))]"></i></button>`
                                                    : `<button onclick="removeCardComponent(${pid}, ${panelId}, ${jsArg(k)})" class="shrink-0 w-3.5 leading-none pt-[3px] text-slate-300 hover:text-rose-500" title="Remove from this card (this patient only)"><i class="fa-solid fa-xmark text-[calc(10px*var(--ts,1))]"></i></button>`}
                                                <div class="min-w-0">
                                                    <div>${esc(label)}${unit ? ` <span class="font-normal text-[calc(10px*var(--ts,1))] text-slate-400">${esc(unit)}</span>` : ''}</div>
                                                    ${rt ? `<div class="lab-range font-normal leading-none text-slate-400">${esc(rt)}</div>` : ''}
                                                </div>
                                            </div>
                                        </td>
                                        ${dates.map((d, i) => {
                                            const colStyle = i === 0 ? `style="background-color: ${th.col}"` : '';
                                            if (calc) {
                                                return `<td class="px-1 py-1 text-center font-bold ${i === 0 ? '' : 'text-slate-500'}" ${colStyle} ${i === 0 ? `data-calc="${calc}"` : ''}>${esc(calcValue(p, keys[i], calc)) || '<span class="text-slate-300">—</span>'}</td>`;
                                            }
                                            const v = labValue(p, keys[i], key);
                                            const fl = flagFor(range, v);
                                            if (i === 0) {
                                                return `<td class="px-1 py-0.5" ${colStyle}><input type="text" inputmode="${kind === 'text' ? 'text' : 'decimal'}" value="${esc(v || '')}" ${rangeAttr} oninput="setLabValue(${pid}, ${jsArg(key)}, this.value, this)" class="${kind === 'text' ? 'w-20' : 'w-14'} mx-auto block text-center bg-white border rounded-md px-1 py-1 font-semibold text-slate-900 focus:outline-none focus:ring-2" style="border-color: ${th.input}; ${flagStyle(fl)}"></td>`;
                                            }
                                            return `<td class="px-1 py-1 text-center text-slate-600" style="${flagStyle(fl)}">${v ? esc(v) : '<span class="text-slate-300">—</span>'}</td>`;
                                        }).join('')}
                                    </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                    ${panel.type === 'labs' ? `
                        <div class="flex items-center gap-2 p-2 border-t border-slate-100">
                            <input type="text" id="custom-lab-${esc(panel.id)}" onkeydown="if (event.key === 'Enter') { event.preventDefault(); addCustomLabRowFromInput(${pid}, ${panelId}); }" class="flex-1 min-w-0 text-xs border border-slate-200 rounded-lg px-2 py-1.5" placeholder="Add a lab (e.g. CRP)">
                            <button onclick="addCustomLabRowFromInput(${pid}, ${panelId})" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold">Add</button>
                        </div>
                    ` : ''}
                </div>
            `);
        }

        // Saves this day's value. Calculated cells (MAP, Balance) refresh without redrawing the page.
        function setLabValue(patientId, key, value, el) {
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === patientId);
            if (!p) return;
            if (!p.labs) p.labs = {};
            const k = curKey();
            if (!p.labs[k]) p.labs[k] = {};
            if (String(value).trim() === '') delete p.labs[k][key];
            else p.labs[k][key] = String(value).trim();
            Store.savePatients(allPatients);
            if (el) {
                const fl = el.dataset && el.dataset.range ? flagFor(JSON.parse(el.dataset.range), value) : '';
                el.style.color = fl ? FLAG_COLOR[fl] : '';
                el.style.fontWeight = fl ? '800' : '';
            }
            document.querySelectorAll('[data-calc]').forEach(cell => {
                const v = calcValue(p, curKey(), cell.getAttribute('data-calc'));
                cell.innerHTML = v ? esc(v) : '<span class="text-slate-300">—</span>';
            });
        }

        /* ----- Patient records: Cultures, PCR and Urinalysis -----
           Saved once per patient (p.recs[type]) instead of per day, so the whole history comes back
           whenever the card is added to any entry (inpatient or consult). Newest date at the top. */
        const REC_TYPES = ['cultures', 'pcr', 'ua'];
        const UA_FLAGS = [['blood', 'RBC'], ['wbc', 'WBC'], ['nit', 'Nit'], ['le', 'Est'], ['casts', 'Casts'], ['bug', 'Bug']];
        function newRec(type) {
            const base = { id: invId(), date: '' };
            if (type === 'cultures') return { ...base, culture: '', status: '', organism: '', sens: '', res: '' };
            if (type === 'pcr') return { ...base, source: '', bug: '', result: '' };
            return { ...base, flags: {}, note: '' };
        }
        function newCultureRow() { return newRec('cultures'); }
        function recHasContent(r) {
            return Object.entries(r || {}).some(([k, v]) => k !== 'id' && (v && typeof v === 'object' ? Object.values(v).some(Boolean) : String(v ?? '').trim()));
        }
        function patientRecs(p, type) {
            if (!p.recs) p.recs = {};
            if (!Array.isArray(p.recs[type])) p.recs[type] = [];
            return p.recs[type];
        }
        // Newest first; entries without a date yet (just added) stay at the top.
        function sortedRecs(p, type) {
            return [...((p.recs || {})[type] || [])].sort((a, b) => {
                const da = a.date || '9999', db = b.date || '9999';
                return da < db ? 1 : da > db ? -1 : 0;
            });
        }
        // One-time move of cultures saved inside day cards (older versions) into the patient's record.
        function migrateRecs() {
            const all = Store.getPatients();
            let changed = false;
            const key = (r) => `${(r.culture || '').trim().toLowerCase()}|${r.date || ''}|${(r.organism || '').trim().toLowerCase()}`;
            all.forEach(p => Object.keys(p.days || {}).sort().forEach(k => (p.days[k].investigations || []).forEach(panel => {
                if (!REC_TYPES.includes(panel.type) || !Array.isArray(panel.rows)) return;
                const list = patientRecs(p, panel.type);
                panel.rows.forEach(r => {
                    if (!recHasContent(r)) return;
                    const ex = list.find(x => x.id === r.id || (panel.type === 'cultures' && key(x) === key(r)));
                    if (ex) Object.assign(ex, clone(r), { id: ex.id });
                    else list.push(clone(r));
                });
                delete panel.rows;
                changed = true;
            })));
            if (changed) Store.savePatients(all);
        }

        /* Source colours (cultures and PCR): matched on what's written; anything else stays white. */
        const SOURCE_OPTIONS = ['Blood', 'Respiratory', 'Urine', 'CSF', 'Synovial fluid', 'Tissue', 'Swab', 'Stool'];
        const SOURCE_COLORS = [
            [/swab/i,                                                        { bg: '#ffe2c6', border: '#fb923c', fg: '#9a3412' }], // orange (Inflammation)
            [/blood|h(a)?emocult/i,                                          { bg: '#f7d9dd', border: '#d98f98', fg: '#7f1d1d' }], // red (CBC)
            [/resp|sputum|\bbal\b|\beta\b|trache|bronch|nasopharyn|\bnps\b/i, { bg: '#dbeafe', border: '#93c5fd', fg: '#1e40af' }], // blue (Blood Gas)
            [/urin|\bmsu\b|\bcsu\b/i,                                        { bg: '#fef3a0', border: '#facc15', fg: '#854d0e' }], // yellow (I/O)
            [/\bcsf\b|cerebrospinal/i,                                       { bg: '#b9f3fb', border: '#22d3ee', fg: '#0e7490' }], // cyan
            [/synov|joint/i,                                                 { bg: '#ece8e2', border: '#cbc2b4', fg: '#57534e' }], // light gray (Bone)
            [/tissue|biops/i,                                                { bg: '#fce1ef', border: '#f472b6', fg: '#9d174d' }], // pink
            [/stool|f(a)?ec(es|al)?\b|faeces/i,                              { bg: '#ead8c6', border: '#b88b62', fg: '#5c3d2e' }]  // brown
        ];
        function sourceColor(text) {
            const t = String(text || '').trim();
            if (!t) return null;
            const m = SOURCE_COLORS.find(([re]) => re.test(t));
            return m ? m[1] : null;
        }
        function sourceStyle(text, fallbackBorder) {
            const c = sourceColor(text);
            return c ? `background-color: ${c.bg}; border-color: ${c.border}; color: ${c.fg}` : `background-color: #ffffff; border-color: ${fallbackBorder}; color: #1e293b`;
        }
        function paintSource(el, fallbackBorder) { el.setAttribute('style', sourceStyle(el.value, fallbackBorder)); }

        function fitTextarea(el) {
            if (!el.offsetParent && el.offsetHeight === 0) return; // hidden (collapsed) - sized when shown
            el.style.height = 'auto';
            // scrollHeight leaves out the border, so add it back - otherwise a scroll bar appears.
            el.style.height = (el.scrollHeight + el.offsetHeight - el.clientHeight) + 'px';
        }
        // Styles for new text sizes can land a moment after a redraw; size the growing boxes again then.
        let refitTimers = [];
        function refitTextareasSoon() {
            refitTimers.forEach(clearTimeout);
            const run = () => {
                const a = document.activeElement;
                document.querySelectorAll('textarea.cult-input, textarea.auto-grow').forEach(el => { if (el !== a || !keyboardOpen()) fitTextarea(el); });
                layoutInvestigations();
            };
            requestAnimationFrame(run);
            refitTimers = [60, 300, 900].map(ms => setTimeout(run, ms));
        }
        window.addEventListener('orientationchange', () => setTimeout(refitTextareasSoon, 200));
        function autoGrow(el) {
            fitTextarea(el);
            if (el.closest && el.closest('.inv-board')) layoutInvestigations();
        }
        function updateRecField(patientId, type, rowId, field, value, rerender = false) {
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === patientId);
            const row = p && patientRecs(p, type).find(r => r.id === rowId);
            if (!row) return;
            row[field] = value;
            Store.savePatients(allPatients);
            if (rerender) renderApp(); // a new date re-sorts the list
        }
        function setPcrResult(patientId, rowId, val) {
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === patientId);
            const row = p && patientRecs(p, 'pcr').find(r => r.id === rowId);
            if (!row) return;
            row.result = row.result === val ? '' : val;
            Store.savePatients(allPatients);
            renderApp();
        }
        // Status text that means "negative": the bug / sensitivity boxes don't apply.
        function isNegativeStatus(text) {
            return /\bneg(ative)?\b|-\s?ve\b|\bno\s+growth|\bnormal\b|\bflora\b|\bsterile\b|\bnil\b/i.test(String(text || ''));
        }
        function applyNegativeStatus(el) {
            const row = el.closest('tr, .rec-row');
            if (!row) return;
            const neg = isNegativeStatus(el.value);
            row.querySelectorAll('[data-neg-off]').forEach(t => { t.disabled = neg; });
        }
        function setUaKind(patientId, rowId, kind) {
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === patientId);
            const row = p && patientRecs(p, 'ua').find(r => r.id === rowId);
            if (!row) return;
            row.kind = row.kind === kind ? '' : kind;
            Store.savePatients(allPatients);
            renderApp();
        }
        function toggleUaFlag(patientId, rowId, flag) {
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === patientId);
            const row = p && patientRecs(p, 'ua').find(r => r.id === rowId);
            if (!row) return;
            row.flags = row.flags || {};
            row.flags[flag] = !row.flags[flag];
            Store.savePatients(allPatients);
            renderApp();
        }
        function addRec(patientId, type) {
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === patientId);
            if (!p) return;
            const r = newRec(type);
            patientRecs(p, type).unshift(r);
            Store.savePatients(allPatients);
            renderApp();
            const card = [...document.querySelectorAll('.inv-card')].find(c => c.innerHTML.includes(r.id));
            const el = card && card.querySelector('input[list], textarea, .date-field-text');
            if (el) el.focus();
        }
        function removeRec(patientId, type, rowId) {
            const all = Store.getPatients();
            const p = all.find(x => x.id === patientId);
            const row = p && patientRecs(p, type).find(r => r.id === rowId);
            if (!row) return;
            const doRemove = () => {
                const a2 = Store.getPatients();
                const p2 = a2.find(x => x.id === patientId);
                p2.recs[type] = patientRecs(p2, type).filter(r => r.id !== rowId);
                Store.savePatients(a2);
                renderApp();
            };
            const name = { cultures: 'culture', pcr: 'PCR / RAT result', ua: 'urinalysis' }[type];
            if (recHasContent(row)) showConfirm({ title: `Delete this ${name}?`, messageHtml: "It is removed from this patient's record on every day.", confirmLabel: 'Delete', onConfirm: doRemove });
            else doRemove();
        }

        // Sticky-note tick on a card: include it in Extract Note or leave it out (this entry only).
        function toggleInvNote(patientId, panelId) {
            const allPatients = Store.getPatients();
            const { panel } = findPanel(allPatients, patientId, panelId);
            if (!panel) return;
            panel.noteOff = !panel.noteOff;
            Store.savePatients(allPatients);
            renderApp();
            showToast(panel.noteOff ? 'Left out of Extract Note' : 'Included in Extract Note');
        }

        function findPanel(allPatients, patientId, panelId) {
            const note = dayNoteFor(allPatients, patientId);
            if (!note.investigations) note.investigations = [];
            return { note, panel: note.investigations.find(x => x.id === panelId) };
        }

        function addInvPanel(type, setId) {
            const patientId = activePatientId;
            const allPatients = Store.getPatients();
            const note = dayNoteFor(allPatients, patientId);
            if (!note) return null;
            if (!note.investigations) note.investigations = [];
            const cs = type === 'custom' ? customSet(setId) : null;
            if (type === 'custom' && !cs) return null;
            const single = type !== 'text' && type !== 'image';
            let panel = single ? note.investigations.find(x => x.type === type && (type !== 'custom' || x.setId === setId)) : null;
            if (panel) {
                closeModal();
                const full = cs ? (cs.rows || []) : (TABLE_TYPES.includes(type) ? currentSetRows(type) : null);
                const missing = full && full.some(r => !panelSetRows(panel).some(x => x.k === r.k));
                if (missing) {
                    panel.set = restoredSetRows(panel, full);
                    panel.collapsed = false;
                    Store.savePatients(allPatients);
                    invBoxCollapsed = false;
                    renderApp();
                    showToast(`${cs ? cs.title : INV_TYPES[type].title}: removed components restored.`);
                } else {
                    showToast(`${cs ? cs.title : INV_TYPES[type].title} is already on this day.`);
                }
                return panel;
            }
            panel = { id: invId(), type };
            // The card keeps the set's rows as they are now; later edits to the set won't change it.
            if (TABLE_TYPES.includes(type)) panel.set = currentSetRows(type);
            if (type === 'ulytes') panel.mode = 'spot';
            if (cs) { panel.setId = cs.id; panel.title = cs.title; panel.set = clone(cs.rows || []); }
            const counts = [0, 0, 0];
            note.investigations.forEach((x, i) => { const c = (x.col ?? i % 3); counts[c] += 1; if (invPanelSpan(x) === 2 && c < 2) counts[c + 1] += 1; });
            panel.col = type === 'cultures' ? (counts[0] + counts[1] <= counts[1] + counts[2] ? 0 : 1) : counts.indexOf(Math.min(...counts));
            if (type === 'labs') panel.rows = [];
            if (type === 'text') { panel.title = ''; panel.text = ''; }
            if (REC_TYPES.includes(type)) {
                // The card shows the patient's whole record; start one empty entry if there's none yet.
                const pp = allPatients.find(x => x.id === patientId);
                if (pp && !patientRecs(pp, type).length) patientRecs(pp, type).push(newRec(type));
            }
            note.investigations.push(panel);
            Store.savePatients(allPatients);
            invBoxCollapsed = false;
            renderApp();
            return panel;
        }

        // The card's rows with any removed components put back, in the set's order (extra rows kept at the end).
        function restoredSetRows(panel, fullRows) {
            const have = panelSetRows(panel);
            const merged = fullRows.map(r => have.find(x => x.k === r.k) || clone(r));
            have.forEach(r => { if (!merged.some(x => x.k === r.k)) merged.push(r); });

        // Photos are shrunk (max 1600px, JPEG) before saving so they fit in the browser's storage.
        function handleInvImage(input) {
            const file = input.files && input.files[0];
            input.value = '';
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    const max = 1600;
                    const scale = Math.min(1, max / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
                    const allPatients = Store.getPatients();
                    const p = allPatients.find(x => x.id === activePatientId);
                    const note = dayNoteFor(allPatients, activePatientId);
                    if (!note.investigations) note.investigations = [];
                    if (!p.images) p.images = {};
                    const imageId = 'img_' + invId();
                    p.images[imageId] = dataUrl;
                    const panel = { id: invId(), type: 'image', title: '', imageId };
                    note.investigations.push(panel);
                    Store.savePatients(allPatients);
                    invBoxCollapsed = false;
                    renderApp();
                    const el = document.querySelector(`[data-id="${panel.id}"] input`);
                    if (el) { el.focus(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
                };
                img.onerror = () => alert('That file could not be read as an image.');
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        }

            // Open, filled memos show in full. Collapsed (filled) memos and empty ones sit side by side as chips;

        // Groups a patient's listed days into encounters (admissions / consult episodes).
        // A new encounter starts when the admission date changes, or (if unknown) after a gap of more than a day.
        // Groups a patient's entries into encounters. Inpatient and consult entries are grouped separately.
        // A new encounter starts when the admission / consult date changes, or (if unknown) after a gap of over a day.
        function encounterGroups(p) {
            const groups = [];
            ['inpatient', 'consult'].forEach(type => {
                const dates = listedDates(p.id, type);
                const field = type === 'consult' ? 'consultDate' : 'admissionDate';
                let cur = null, prevDate = null, prevAnchor = null;
                dates.forEach(d => {
                    const anchor = getDayInfo(p, entryKey(d, type))[field] || '';
                    const startNew = !cur || ((anchor && prevAnchor) ? anchor !== prevAnchor : daysBetween(prevDate, d) > 1);
                    if (startNew) {
                        cur = { type, dates: [] };
                        groups.push(cur);
                    }
                    cur.dates.push(d);
                    prevDate = d;
                    prevAnchor = anchor;
                });
            });
            // most recent first
            return groups.sort((a, b) => a.dates[a.dates.length - 1] < b.dates[b.dates.length - 1] ? 1 : -1);
        }

        // Colour coding by list type.
        const LIST_TYPE_STYLE = {

            const openGroup = profileEncounterIdx >= 0 ? groups[profileEncounterIdx] : null;
            const typeOf = (g) => g.type === 'consult' ? 'Consult' : 'Inpatient';

            return `
                <div class="flex-1 flex flex-col space-y-4 max-w-5xl mx-auto w-full">

                    <div class="bg-white p-5 rounded-2xl border border-maroon-200 shadow-sm flex flex-wrap items-center justify-between gap-4">

                        </div>
                        <div class="flex items-stretch gap-3 flex-wrap">
                            <div class="bg-slate-50 px-4 py-2.5 rounded-xl border border-slate-200/70 flex flex-col items-center justify-center min-w-[90px]">
                                <span class="block mb-1 text-[calc(12px*var(--ts,1))] font-semibold text-slate-500">Age</span>
                                <span class="text-[calc(17px*var(--ts,1))] font-bold text-slate-800">${esc(ageText({ ...info, dob: p.dob }, todayStr()) || '-')}</span>
                            </div>
                            <div class="bg-slate-50 px-4 py-2.5 rounded-xl border border-slate-200/70 flex flex-col items-center justify-center min-w-[90px]">
                                <span class="block mb-1 text-[calc(12px*var(--ts,1))] font-semibold text-slate-500">Gender</span>
                                <span class="px-2 py-0.5 rounded text-[calc(15px*var(--ts,1))] font-bold ${genderBg}">${esc(p.gender || 'M')}</span>
                            </div>
                            <div class="px-4 py-2.5 rounded-xl border border-slate-200/70 flex flex-col items-center justify-center min-w-[110px]" style="background-color: ${esc(gocBg)}; color: ${esc(gocColor)}">
                                <span class="block mb-1 text-[calc(12px*var(--ts,1))] font-semibold opacity-75">Goals of Care</span>
                                <span class="text-[calc(15px*var(--ts,1))] font-bold">${esc(info.goalsOfCare || '-')}</span>
                            </div>
                        </div>
                    </div>

                    ${renderEmrMemoBox(p, false, false) || `
                        <div><button onclick="openEmrMemoModal(${pid})" class="px-3 py-1.5 bg-pink-50 hover:bg-pink-100 text-pink-700 border border-pink-200 rounded-xl text-xs font-semibold transition inline-flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> EMR memo</button></div>
                    `}

                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="font-bold text-slate-800 text-sm">Medical Background</h3>
                            ${asOf ? `<span class="text-[calc(11px*var(--ts,1))] text-slate-400">Last documented ${esc(fmtDate(asOf))}</span>` : ''}
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            ${info.medicalBackground.length === 0 ? '<p class="text-xs text-slate-400 italic">No medical background recorded.</p>' : ''}
                            ${info.medicalBackground.map(mb => `
                                <div class="p-3 rounded-xl border text-xs ${mb.starred ? 'bg-yellow-100 border-yellow-300' : 'bg-slate-50 border-slate-100'}">
                                    <div class="font-semibold text-slate-800">${mb.starred ? '<i class="fa-solid fa-star text-yellow-500 mr-1"></i>' : ''}${esc(mb.condition || '-')}</div>
                                    ${mb.treatment ? `<div class="text-slate-600 mt-0.5">${esc(mb.treatment)}</div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
                            <h3 class="font-bold text-slate-800 text-sm">Encounters</h3>
                            <div class="flex items-center gap-3 text-[calc(11px*var(--ts,1))] font-semibold text-slate-500">
                                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full ${LIST_TYPE_STYLE.Inpatient.dot}"></span>Inpatient</span>
                                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full ${LIST_TYPE_STYLE.Consult.dot}"></span>Consult</span>

                            </div>
                        </div>
                        ${groups.length === 0 ? '<p class="text-xs text-slate-400 italic">Not on any list yet.</p>' : `
                            <div class="flex flex-wrap gap-2">
                                ${groups.map((g, i) => {
                                    const st = LIST_TYPE_STYLE[typeOf(g)];
                                    const first = g.dates[0], last = g.dates[g.dates.length - 1];
                                    const label = first === last ? fmtDate(first) : `${fmtDate(first)} → ${fmtDate(last)}`;
                                    return `
                                        <button onclick="selectEncounter(${i})" class="px-4 py-2 rounded-xl border text-sm font-semibold transition ${i === profileEncounterIdx ? st.active : st.chip}" title="${g.dates.length} day${g.dates.length === 1 ? '' : 's'}">
                                            <i class="fa-solid ${g.type === 'consult' ? 'fa-user-doctor' : 'fa-bed-pulse'} mr-1"></i>${esc(label)} <span class="opacity-70 font-medium text-xs ml-1">(${g.dates.length}d)</span>
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                            ${openGroup ? `
                                <div class="mt-3 pt-3 border-t border-slate-100 flex flex-wrap gap-2">
                                    ${openGroup.dates.slice().reverse().map(d => {
                                        const t = typeOf(openGroup);
                                        const st = LIST_TYPE_STYLE[t];
                                        return `
                                            <button onclick="router.navigate('patient_file', { patientId: ${pid}, date: ${jsArg(d)}, type: '${openGroup.type}' })" class="px-3 py-1.5 rounded-xl border text-xs font-semibold transition ${st.chip}">
                                                ${esc(fmtDate(d))} <span class="opacity-70 font-medium">· ${esc(t)}</span>
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                            ` : ''}
                        `}
                    </div>
                </div>
            `;
        }

        /* ---------- Investigation Sets (Settings): components, units & normal ranges ---------- */
        let openLabGroups = {};
        function toggleLabGroup(g) { openLabGroups[g] = !openLabGroups[g]; renderApp(); }

        // A set is referred to by its type ('cbc') or, for sets you made, 'cs:<id>'.
        function getSetRows(ref) {
            return ref.startsWith('cs:') ? clone((customSet(ref.slice(3)) || {}).rows || []) : currentSetRows(ref);
        }
        function saveSetRows(ref, rows) {
            saveLabSettings(s => {
                if (ref.startsWith('cs:')) {
                    const cs = (s.customSets || []).find(x => x.id === ref.slice(3));
                    if (cs) cs.rows = rows;
                } else {
                    if (!s.sets) s.sets = {};
                    s.sets[ref] = rows;
                }
            });
        }
        function deleteSetComponent(ref, k) {
            saveSetRows(ref, getSetRows(ref).filter(r => r.k !== k));
            renderApp();
        }
        function resetBuiltInSet(type) {
            showConfirm({ title: `Reset ${INV_TYPES[type].title}?`, messageHtml: 'The set goes back to its original components. Cards already added are not changed.', confirmLabel: 'Reset', onConfirm: () => {
                saveLabSettings(s => { if (s.sets) delete s.sets[type]; });
                renderApp();
            } });
        }
        function deleteCustomSet(id) {
            const cs = customSet(id);
            if (!cs) return;
            showConfirm({ title: `Delete "${cs.title}"?`, messageHtml: 'It will no longer be offered when adding investigations. Cards already added keep their rows and values.', confirmLabel: 'Delete', onConfirm: () => {
                saveLabSettings(s => { s.customSets = (s.customSets || []).filter(x => x.id !== id); });
                renderApp();
            } });
        }

        function setGroupHtml(ref, def, rows, extraActions) {
            const th = INV_THEMES[def.theme] || INV_THEMES.gray;
            const open = !!openLabGroups[ref];
            const type = ref.startsWith('cs:') ? 'custom' : ref;
            const rowHtml = (r) => {
                const key = labKey(type, r.k);
                const builtInRange = type !== 'custom' && !r.own && LAB_REF[key];
                let rangeHtml;
                if (r.calc) {
                    rangeHtml = `<span class="text-[calc(11px*var(--ts,1))] text-slate-400 italic">calculated</span>`;
                } else if (builtInRange) {
                    const refs = LAB_REF[key];
                    const sel = labUnitIndex(key);
                    rangeHtml = refs.map((rf, i) => {
                        const isSel = i === sel;
                        const rm = labRange(key, 'M', i);
                        const rfF = refs[i].loF !== undefined ? labRange(key, 'F', i) : null;
                        const txt = (rangeText({ ...rm, u: '' }) || 'no range') + (rfF ? ` · F ${rangeText({ ...rfF, u: '' })}` : '');
                        return `
                            <span class="inline-flex items-stretch rounded-lg border text-[calc(11px*var(--ts,1))] overflow-hidden ${isSel ? 'border-indigo-400 bg-indigo-50' : 'border-slate-200 bg-white'}">
                                <button onclick="setLabUnit('${key}', ${i})" class="px-2 py-1 font-semibold ${isSel ? 'text-indigo-700' : 'text-slate-500'}" title="${refs.length > 1 ? 'Use this unit' : ''}">
                                    ${refs.length > 1 ? `<i class="fa-${isSel ? 'solid fa-circle-dot' : 'regular fa-circle'} text-[calc(9px*var(--ts,1))] mr-1"></i>` : ''}${esc(rf.u || 'no unit')}
                                </button>
                                <button onclick="openLabRangeEditor('${key}', ${i})" class="px-2 py-1 border-l ${isSel ? 'border-indigo-200' : 'border-slate-200'} text-slate-600 hover:bg-white" title="Tap to edit the range">
                                    ${esc(txt)} <i class="fa-solid fa-pen text-[calc(8px*var(--ts,1))] opacity-50 ml-0.5"></i>
                                </button>
                            </span>`;
                    }).join('');
                } else {
                    const rg = ownRange(r);
                    const txt = [r.unit || 'no unit', rg ? rangeText({ ...rg, u: '' }) : 'no range'].join(' · ');
                    rangeHtml = `<button onclick="openComponentEditor(${jsArg(ref)}, ${jsArg(r.k)})" class="px-2 py-1 rounded-lg border border-slate-200 bg-white text-[calc(11px*var(--ts,1))] text-slate-600 hover:bg-slate-50">${esc(txt)} <i class="fa-solid fa-pen text-[calc(8px*var(--ts,1))] opacity-50 ml-0.5"></i></button>`;
                }
                return `
                    <div class="flex items-center gap-2 px-3 py-2">
                        <span class="w-20 shrink-0 text-xs font-bold text-slate-700 break-words">${esc(r.label)}</span>
                        <div class="flex flex-wrap gap-1.5 flex-1 min-w-0">${rangeHtml}</div>
                        <button onclick="deleteSetComponent(${jsArg(ref)}, ${jsArg(r.k)})" class="shrink-0 text-slate-300 hover:text-rose-500 px-1" title="Remove from this set (new cards only)"><i class="fa-solid fa-xmark text-xs"></i></button>
                    </div>`;
            };
            return `
                <div data-sort-item data-id="${esc(ref)}" class="flex rounded-2xl border overflow-hidden bg-white" style="border-color: ${th.border}">
                ${gripHandle('rounded-r-2xl', { bg: th.border + '66', fg: th.icon })}
                <div class="flex-1 min-w-0">
                    <button onclick="toggleLabGroup(${esc(JSON.stringify(ref))})" class="w-full flex items-center justify-between px-3 py-2 text-sm font-bold" style="background-color: ${th.head}; color: ${th.text}">
                        <span class="flex items-center gap-2 min-w-0"><i class="fa-solid ${def.icon}" style="color: ${th.icon}"></i><span class="truncate">${esc(def.title)}</span><span class="text-[calc(11px*var(--ts,1))] font-semibold opacity-60">(${rows.length})</span></span>
                        <i class="fa-solid fa-chevron-${open ? 'up' : 'down'} text-xs"></i>
                    </button>
                    ${open ? `
                        <div class="divide-y divide-slate-100">
                            ${rows.length ? rows.map(rowHtml).join('') : '<p class="px-3 py-2 text-xs text-slate-400 italic">No components.</p>'}
                        </div>
                        <div class="flex items-center justify-between gap-2 flex-wrap px-3 py-2 border-t border-slate-100 bg-slate-50/60">
                            <button onclick="openComponentEditor(${jsArg(ref)}, null)" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-white border border-slate-200 text-slate-700 hover:bg-slate-100"><i class="fa-solid fa-plus"></i> Add component</button>
                            <div class="flex items-center gap-1">${extraActions || ''}</div>
                        </div>
                    ` : ''}
                </div>
            </div>`;
        }

        // Order of the cards in Settings and in the "Add Investigation" window: built-in types by
        // name ('cbc') and your sets as 'cs:<id>'. Saved in lab_settings.order; new ones go at the end.
        // Sections the cards are grouped in (Settings and the Add window). Cards can be dragged between them.
        // Saved in lab_settings.layout = { daily: [...], acute: [...], ... }.
        const SET_SECTIONS = [['daily', 'Daily'], ['acute', 'Acute'], ['infections', 'Infections'], ['others', 'Others'], ['misc', 'Miscellaneous'], ['mine', 'My sets']];
        const DEFAULT_LAYOUT = {
            daily: ['vitals', 'io', 'cbc', 'lytes', 'glucose'],
            acute: ['critical', 'gas', 'coag'],
            infections: ['inflammation', 'cultures', 'ua', 'pcr'],
            others: ['bone', 'liver', 'iron', 'endocrine', 'ulytes'],
            misc: ['labs', 'text', 'image'],
            mine: []
        };
        const DEFAULT_SECTION = {};
        Object.entries(DEFAULT_LAYOUT).forEach(([sec, list]) => list.forEach(t => { DEFAULT_SECTION[t] = sec; }));
        function invSetLayout() {
            const all = [...INV_ORDER, ...customSets().map(cs => 'cs:' + cs.id)];
            const ls = Store.get('lab_settings', {});
            const saved = clone(ls.layout || {});
            // Layouts saved before "Miscellaneous" existed: Other Labs, Free Text and Image move there.
            if (ls.layout && !ls.layout.misc) Object.keys(saved).forEach(k => { saved[k] = (saved[k] || []).filter(r => !['labs', 'text', 'image'].includes(r)); });
            const oldOrder = ls.order || []; // order saved before sections existed
            const layout = {};
            const placed = new Set();
            SET_SECTIONS.forEach(([key]) => {
                layout[key] = (saved[key] || []).filter(r => all.includes(r) && !placed.has(r));
                layout[key].forEach(r => placed.add(r));
            });
            const defOrder = SET_SECTIONS.flatMap(([k]) => DEFAULT_LAYOUT[k]);
            const rank = (r) => { const i = oldOrder.indexOf(r); if (i >= 0) return i; const d = defOrder.indexOf(r); return 999 + (d < 0 ? 500 + all.indexOf(r) : d); };
            all.filter(r => !placed.has(r)).sort((a, b) => rank(a) - rank(b)).forEach(r => {
                layout[r.startsWith('cs:') ? 'mine' : (DEFAULT_SECTION[r] || 'others')].push(r);
            });
            return layout;
        }
        function invSetOrder() {
            const layout = invSetLayout();
            return SET_SECTIONS.flatMap(([key]) => layout[key]);
        }
        function saveInvSetLayout(layout) {
            saveLabSettings(s => { s.layout = layout; delete s.order; });
        }

        function renderLabSettingsBox() {
            const edited = editedSets();
            const itemHtml = (ref) => {
                if (ref.startsWith('cs:')) {
                    const cs = customSet(ref.slice(3));
                    return setGroupHtml(ref, { title: cs.title, icon: 'fa-table-list', theme: 'gray' }, cs.rows || [],
                        `<button onclick="openSetEditor(${jsArg(cs.id)})" class="px-2 py-1 text-[calc(11px*var(--ts,1))] font-semibold text-slate-500 hover:text-slate-800"><i class="fa-solid fa-pen"></i> Rename</button>
                         <button onclick="deleteCustomSet(${jsArg(cs.id)})" class="px-2 py-1 text-[calc(11px*var(--ts,1))] font-semibold text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i> Delete</button>`);
                }
                if (TABLE_TYPES.includes(ref)) {
                    return setGroupHtml(ref, INV_TYPES[ref], currentSetRows(ref),
                        edited[ref] ? `<button onclick="resetBuiltInSet('${ref}')" class="px-2 py-1 text-[calc(11px*var(--ts,1))] font-semibold text-slate-500 hover:text-slate-800">Reset</button>` : '');
                }
                // Cards without components (cultures, PCR, notes...) - only their place in the order.
                const d = INV_TYPES[ref], th = INV_THEMES[d.theme] || INV_THEMES.gray;
                return `
                    <div data-sort-item data-id="${esc(ref)}" class="flex rounded-2xl border overflow-hidden bg-white" style="border-color: ${th.border}">
                        ${gripHandle('rounded-r-2xl', { bg: th.border + '66', fg: th.icon })}
                        <div class="flex-1 min-w-0 flex items-center gap-2 px-3 py-2 text-sm font-bold" style="background-color: ${th.head}; color: ${th.text}">
                            <i class="fa-solid ${d.icon}" style="color: ${th.icon}"></i>${esc(d.title)}
                        </div>
                    </div>`;
            };
            const layout = invSetLayout();
            const sections = SET_SECTIONS.map(([key, label]) => `
                <div>
                    <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">${label}</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 items-start min-h-[2.75rem] rounded-2xl col-flow ${layout[key].length ? '' : 'border-2 border-dashed border-slate-200'}" style="--rows: ${Math.max(1, Math.ceil(layout[key].length / 2))}" data-sort-list="invsets" data-sort-group="invsets" data-section="${key}">
                        ${layout[key].map(itemHtml).join('')}
                        ${layout[key].length ? '' : `<p class="col-span-full text-[calc(11px*var(--ts,1))] text-slate-400 italic px-3 py-3">${key === 'mine' ? 'Use "New set", or drag a set here.' : 'Drag sets here.'}</p>`}
                    </div>
                </div>`).join('');
            const on = labSettings().useRanges;
            const toggle = `
                <button onclick="toggleUseRanges()" class="flex items-center gap-2 text-xs font-semibold ${on ? 'text-indigo-700' : 'text-slate-500'}" title="Colour values outside the normal range">
                    Use ranges
                    <span class="relative inline-block w-10 h-6 rounded-full transition ${on ? 'bg-indigo-600' : 'bg-slate-300'}">
                        <span class="absolute top-0.5 ${on ? 'left-[18px]' : 'left-0.5'} w-5 h-5 rounded-full bg-white shadow transition-all"></span>
                    </span>
                </button>
                <button onclick="openSetEditor(null)" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold transition"><i class="fa-solid fa-plus"></i> New set</button>`;
            return settingsCard('invsets', {
                title: 'Investigation Sets',
                icon: '<i class="fa-solid fa-microscope text-cyan-600"></i>',
                actions: toggle,
                body: `<div class="space-y-4">${sections}</div>`
            });
        }

        /* Component editor: name, unit, low, high (for components you added, or ones without a built-in range). */
        function openComponentEditor(ref, k) {
            const rows = getSetRows(ref);
            const r = k ? rows.find(x => x.k === k) : null;
            if (k && !r) return;
            const setTitle = ref.startsWith('cs:') ? (customSet(ref.slice(3)) || {}).title : INV_TYPES[ref].title;
            const val = (v) => (v === null || v === undefined) ? '' : esc(String(v));
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50" onclick="if (event.target === this) closeModal()">
                    <div class="bg-white rounded-3xl p-5 max-w-sm w-full shadow-2xl space-y-4">
                        <h3 class="text-base font-bold text-slate-800">${r ? 'Edit component' : 'Add component'} <span class="text-slate-400 font-semibold">· ${esc(setTitle || '')}</span></h3>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="block col-span-2"><span class="block text-[calc(11px*var(--ts,1))] font-medium text-slate-500 mb-1">Name</span>
                                <input id="ce-name" type="text" value="${val(r && r.label)}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="e.g. Amylase"></label>
                            <label class="block col-span-2"><span class="block text-[calc(11px*var(--ts,1))] font-medium text-slate-500 mb-1">Unit</span>
                                <input id="ce-unit" type="text" value="${val(r && r.unit)}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="e.g. U/L"></label>
                            <label class="block"><span class="block text-[calc(11px*var(--ts,1))] font-medium text-slate-500 mb-1">Low</span>
                                <input id="ce-lo" type="text" inputmode="decimal" value="${val(r && r.lo)}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="none"></label>
                            <label class="block"><span class="block text-[calc(11px*var(--ts,1))] font-medium text-slate-500 mb-1">High</span>
                                <input id="ce-hi" type="text" inputmode="decimal" value="${val(r && r.hi)}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="none"></label>
                        </div>
                        <p class="text-[calc(11px*var(--ts,1))] text-slate-400">Leave Low or High empty for no limit.</p>
                        <div class="flex justify-end gap-2">
                            <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-sm">Cancel</button>
                            <button onclick="saveComponent(${jsArg(ref)}, ${jsArg(k || '')})" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium">Save</button>
                        </div>
                    </div>
                </div>`;
            const el = document.getElementById('ce-name');
            if (el) el.focus();
        }
        // Reads a number box: null = empty, undefined = not a number.
        function readNumBox(el) {
            const t = String(el ? el.value : '').trim().replace(',', '.');
            if (t === '') return null;
            const n = parseFloat(t);
            return isNaN(n) ? undefined : n;
        }
        function saveComponent(ref, k) {
            const name = document.getElementById('ce-name').value.trim();
            if (!name) { document.getElementById('ce-name').focus(); return; }
            const unit = document.getElementById('ce-unit').value.trim();
            const lo = readNumBox(document.getElementById('ce-lo')), hi = readNumBox(document.getElementById('ce-hi'));
            if (lo === undefined || hi === undefined) { showToast('Please enter numbers only for Low and High'); return; }
            const rows = getSetRows(ref);
            if (k) {
                const r = rows.find(x => x.k === k);
                if (r) Object.assign(r, { label: name, unit, lo, hi });
            } else {
                if (rows.some(x => normLab(x.label) === normLab(name))) { showToast(`${name} is already in this set`); return; }
                rows.push({ k: 'u' + Date.now().toString(36), label: name, unit, lo, hi, own: true });
            }
            saveSetRows(ref, rows);
            openLabGroups[ref] = true;
            closeModal();
            renderApp();
        }

        /* New set (or rename one): a name and its components. */
        function setEditorRowHtml() {
            const inp = (cls, ph, mode = 'text') => `<input type="text" inputmode="${mode}" class="${cls} min-w-0 px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs" placeholder="${ph}">`;
            return `<div class="se-row grid grid-cols-[1fr_4.5rem_3.5rem_3.5rem_1.2rem] gap-1.5 items-center">
                ${inp('se-name', 'Lab name')}${inp('se-unit', 'Unit')}${inp('se-lo', 'Low', 'decimal')}${inp('se-hi', 'High', 'decimal')}
                <button onclick="this.parentElement.remove()" class="text-slate-300 hover:text-rose-500" title="Remove"><i class="fa-solid fa-xmark text-xs"></i></button>
            </div>`;
        }
        function addSetEditorRow() {
            const box = document.getElementById('se-rows');
            if (!box) return;
            box.insertAdjacentHTML('beforeend', setEditorRowHtml());
            const names = box.querySelectorAll('.se-name');
            names[names.length - 1].focus();
        }
        function openSetEditor(id, addAfter = false) {
            const cs = id ? customSet(id) : null;
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 overflow-y-auto" onclick="if (event.target === this) closeModal()">
                    <div class="bg-white rounded-3xl p-5 max-w-md w-full shadow-2xl space-y-4 my-8">
                        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-table-list text-slate-400"></i> ${cs ? 'Rename set' : 'New investigation set'}</h3>
                        <label class="block"><span class="block text-[calc(11px*var(--ts,1))] font-medium text-slate-500 mb-1">Set name</span>
                            <input id="se-title" type="text" value="${cs ? esc(cs.title) : ''}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold" placeholder="e.g. Pancreas"></label>
                        ${cs ? '' : `
                            <div>
                                <div class="grid grid-cols-[1fr_4.5rem_3.5rem_3.5rem_1.2rem] gap-1.5 text-[calc(10px*var(--ts,1))] font-semibold text-slate-400 mb-1 px-0.5"><span>Component</span><span>Unit</span><span>Low</span><span>High</span><span></span></div>

                                <p class="text-[calc(11px*var(--ts,1))] text-slate-400 mt-2">Unit and range are optional. You can add or remove components later in Settings.</p>
                            </div>`}
                        <div class="flex justify-end gap-2">
                            <button onclick="${addAfter ? 'openAddInvestigationModal()' : 'closeModal()'}" class="px-4 py-2 bg-slate-100 rounded-xl text-sm">${addAfter ? 'Back' : 'Cancel'}</button>
                            <button onclick="saveSetEditor(${jsArg(id || '')}, ${addAfter})" class="px-4 py-2 bg-slate-700 hover:bg-slate-800 text-white rounded-xl text-sm font-medium">${cs ? 'Save' : addAfter ? 'Create & add' : 'Create set'}</button>
                        </div>
                    </div>
                </div>`;
            const el = document.getElementById('se-title');
            if (el) el.focus();
        }
        function saveSetEditor(id, addAfter) {
            const title = document.getElementById('se-title').value.trim();
            if (!title) { document.getElementById('se-title').focus(); return; }
            if (id) {
                saveLabSettings(s => { const cs = (s.customSets || []).find(x => x.id === id); if (cs) cs.title = title; });
                closeModal();
                renderApp();
                return;
            }
            const rows = [];
            let bad = false;
            document.querySelectorAll('#se-rows .se-row').forEach((row, i) => {
                const name = row.querySelector('.se-name').value.trim();
                if (!name) return;
                const lo = readNumBox(row.querySelector('.se-lo')), hi = readNumBox(row.querySelector('.se-hi'));
                if (lo === undefined || hi === undefined) bad = true;
                if (rows.some(x => normLab(x.label) === normLab(name))) return;
                rows.push({ k: 'c' + i + Date.now().toString(36), label: name, unit: row.querySelector('.se-unit').value.trim(), lo: lo ?? null, hi: hi ?? null, own: true });
            });
            if (bad) { showToast('Please enter numbers only for Low and High'); return; }
            const newId = 'cs_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
            saveLabSettings(s => { s.customSets = [...(s.customSets || []), { id: newId, title, rows }]; });
            openLabGroups['cs:' + newId] = true;
            closeModal();
            if (addAfter) addInvPanel('custom', newId);
            else renderApp();
        }

        /* ---------- Settings boxes: each one can be collapsed (remembered on this device) ---------- */
        let settingsClosed = null;
        // Collapsed until you open them (settings_closed[id] === false means open).
        function settingsIsOpen(id) {
            if (!settingsClosed) settingsClosed = Store.get('settings_closed', {});
            return settingsClosed[id] === false;
        }
        function toggleSettingsBox(id) {
            const open = settingsIsOpen(id);
            settingsClosed[id] = open;
            Store.set('settings_closed', settingsClosed);
            renderApp();
        }
        function renderAutoTagSettings(settings) {
            const at = settings.autoTags || {};
            return `
                <div class="mt-4 pt-3 border-t border-slate-100 space-y-2">

                        <span class="font-normal text-slate-400">— added once when the rule is met; you can still remove or add them yourself</span></div>
                    ${Object.entries(AUTO_TAG_RULES).map(([rule, r]) => `

                </div>`;
        }
        function setAutoTag(rule, tagId) {
            const st = Store.getSettings();
            st.autoTags = { ...(st.autoTags || {}), [rule]: tagId || null };
            Store.saveSettings(st);
            renderApp();
        }

        function settingsCard(id, { title, icon = '', sub = '', actions = '', body = '', box = 'bg-white border border-slate-200', titleCls = 'text-slate-800', subCls = 'text-slate-400' }) {

            return `

                            ${sub && open ? `<p class="text-xs ${subCls} mt-1 max-w-xl font-normal">${sub}</p>` : ''}
                        </button>
                        ${actions ? `<div class="flex items-center gap-2 flex-wrap">${actions}</div>` : ''}

                    ${open ? `<div class="mt-4 space-y-3">${body}</div>` : ''}

        }

        function saveLabSettings(fn) {
            const s = Store.get('lab_settings', {});
            if (!s.units) s.units = clone(DEFAULT_LAB_UNITS);
            if (!s.overrides) s.overrides = {};
            fn(s);
            Store.set('lab_settings', s);
        }
        function toggleUseRanges() {
            saveLabSettings(s => { s.useRanges = s.useRanges === false; });
            renderApp();
        }
        function setLabUnit(key, i) {
            saveLabSettings(s => { s.units[key] = i; });
            renderApp();
        }

        function openLabRangeEditor(key, i) {
            const ref = LAB_REF[key][i];
            const cur = labRange(key, 'M', i).raw;
            const hasF = ref.loF !== undefined;
            const [g, k] = key.split('.');
            const label = (INV_TYPES[g].rows.find(r => r[0] === k) || [k, k])[1];
            const val = (v) => (v === null || v === undefined) ? '' : esc(String(v));
            const field = (id, name, v) => `
                <label class="block"><span class="block text-[calc(11px*var(--ts,1))] font-medium text-slate-500 mb-1">${name}</span>

                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50" onclick="if (event.target === this) closeModal()">

        function saveLabRange(key, i) {
            const u = LAB_REF[key][i].u;
            const read = (id) => {
                const el = document.getElementById(id);
                if (!el) return undefined;
                const t = el.value.trim().replace(',', '.');
                if (t === '') return null;
                const n = parseFloat(t);
                return isNaN(n) ? undefined : n;
            };
            const hasF = !!document.getElementById('lr-lof');
            const vals = { lo: read('lr-lo'), hi: read('lr-hi'), loF: hasF ? read('lr-lof') : null, hiF: hasF ? read('lr-hif') : null };
            if (Object.values(vals).some(v => v === undefined)) {
                showToast('Please enter numbers only');
                return;

            saveLabSettings(s => {
                if (!s.overrides[key]) s.overrides[key] = {};

            renderApp();

        /* ---------- Appearance ---------- */
        const CARD_SCALES = [[0.85, 'Small'], [1, 'Normal'], [1.12, 'Large'], [1.25, 'Extra large']];
        function getCardScale() { return Store.get('card_scale', 1); }

        function setCardScale(v) {
            Store.set('card_scale', v);
            applyCardScale();
            renderApp();
        }
        const TEXT_SCALES = [[0.9, 'Small'], [1, 'Normal'], [1.12, 'Large'], [1.25, 'Extra large'], [1.4, 'Huge']];
        function getTextScale() { return 1; } // one Size setting now (Settings → Appearance)
        function applyTextScale() { document.documentElement.style.setProperty('--ts', String(getTextScale())); }
        function setTextScale(v) {
            Store.set('text_scale', v);
            applyTextScale();
            renderApp();
        }
        function getTheme() { return Store.get('theme', 'light'); }
        function applyTheme() {
            const t = getTheme();
            const dark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', dark);
            // Phone status / navigation bar colour follows the app (dark bar in dark mode)
            let meta = document.querySelector('meta[name="theme-color"]');
            if (!meta) { meta = document.createElement('meta'); meta.name = 'theme-color'; document.head.appendChild(meta); }
            meta.content = dark ? '#0f1218' : '#f8fafc';
        }
        function setTheme(t) {
            Store.set('theme', t);
            applyTheme();
            renderApp();
        }
        try {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (getTheme() === 'system') applyTheme(); });
        } catch (e) {}

        const fmtBytes = (n) => n >= 1e9 ? (n / 1e9).toFixed(1) + ' GB' : n >= 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1e3)) + ' KB';
        function appDataSize() {
            let data = BigStore.size();
            try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(STORAGE_PREFIX)) data += (localStorage.getItem(k) || '').length; } } catch (e) {}
            return data;
        }
        // how full the app's storage is (0..1)
        function storageFill() {
            const q = BigStore.ok ? (storageEstimate && storageEstimate.quota) : 5e6;
            return q ? appDataSize() / q : 0;
        }
        function renderStorageMeter() {
            const data = appDataSize();
            const q = storageEstimate && storageEstimate.quota;
            const room = BigStore.ok ? (q ? fmtBytes(q) + ' available to the app' : 'Plenty of room') : 'About 5 MB (older storage)';
            const pct = BigStore.ok ? (q ? Math.min(100, data / q * 100) : 0) : Math.min(100, data / 5e6 * 100);
            return `
                <div class="p-3 rounded-2xl bg-white/70 border border-amber-200 sm:col-span-2">
                    <span class="block text-amber-700/70 mb-1">Storage used</span>
                    <span class="font-bold text-slate-800">Your data: ${fmtBytes(data)}</span>
                    <span class="text-slate-500"> · ${esc(room)}</span>
                    <div class="mt-2 h-1.5 rounded-full bg-amber-100 overflow-hidden"><div class="h-full rounded-full ${pct > 80 ? 'bg-rose-500' : 'bg-amber-500'}" style="width:${Math.max(pct, 1).toFixed(1)}%"></div></div>
                </div>`;
        }
        function renderSettingsView() {
            const settings = Store.getSettings();
            const backup = getBackupStatus();
            const protectionText = storagePersisted === true
                ? 'On — the browser will not clear this data on its own to free space.'
                : storagePersisted === false
                    ? 'Not granted — the browser may clear this data if the device runs low on space.'
                    : 'Not supported in this browser.';

            return `
                <div class="flex-1 flex flex-col space-y-6 max-w-4xl mx-auto w-full">
                    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-bold text-slate-800">Application Settings</h2>
                            <p class="text-xs text-slate-400 mt-1">Configure Wards, Goals of Care, Tags, Treatment Code, and backups.</p>
                        </div>
                        <button onclick="router.navigate('home')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-medium transition">Back to Home</button>
                    </div>

                    ${settingsCard('appearance', {
                        title: 'Appearance',
                        icon: '<i class="fa-solid fa-palette text-indigo-500"></i>',
                        sub: 'Dark mode keeps all your colours, on a dark background.',
                        body: `
                            <div class="inline-flex p-1 bg-slate-100 rounded-2xl gap-1 flex-wrap">
                                ${[['light', 'fa-sun', 'Light'], ['dark', 'fa-moon', 'Dark'], ['system', 'fa-circle-half-stroke', 'Match device']].map(([v, icon, label]) => `
                                    <button onclick="setTheme('${v}')" class="px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 transition ${getTheme() === v ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:text-slate-800'}">
                                        <i class="fa-solid ${icon}"></i> ${label}
                                    </button>`).join('')}
                            </div>
                            <div class="pt-2">
                                <span class="block text-xs font-semibold text-slate-600 mb-1.5">Size <span class="font-normal text-slate-400">— makes everything bigger or smaller together (text and boxes)</span></span>
                                <div class="inline-flex p-1 bg-slate-100 rounded-2xl gap-1 flex-wrap">
                                    ${CARD_SCALES.map(([v, label]) => `

                                            <span style="font-size: ${Math.round(13 * v)}px">A</span> ${label}
                                        </button>`).join('')}
                                </div>
                            </div>`
                    })}

                    ${settingsCard('backup', {
                        title: 'Data & Backup',
                        icon: '<i class="fa-solid fa-shield-halved text-amber-500"></i>',
                        box: 'bg-amber-50 border-2 border-amber-200',
                        titleCls: 'text-amber-900',
                        subCls: 'text-amber-800/70',
                        sub: 'All data is stored only in this browser on this device. Export a backup regularly and keep it somewhere safe.',

                            <button onclick="openExportModal()" class="px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-semibold transition flex items-center gap-1.5"><i class="fa-solid fa-file-export"></i> Export Backup</button>

                                    <span class="font-bold text-slate-800">${esc(protectionText)}</span>
                                </div>
                                ${renderStorageMeter()}
                            </div>`
                    })}

                    ${renderLabSettingsBox()}

                    ${[['wards', 'Wards', 'Add Ward', 'bg-indigo-50 hover:bg-indigo-100 text-indigo-600', 'fa-hospital text-indigo-400'],
                       ['goalsOfCare', 'Goals of Care', 'Add Goal', 'bg-purple-50 hover:bg-purple-100 text-purple-600', 'fa-hand-holding-heart text-purple-400'],
                       ['tags', 'Tags', 'Add Tag', 'bg-pink-50 hover:bg-pink-100 text-pink-600', 'fa-tags text-pink-400']].map(([key, title, addLabel, addCls, icon]) => settingsCard(key, {
