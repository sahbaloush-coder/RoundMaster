        function numOrNull(v) { return (v === null || v === undefined || v === '' || isNaN(Number(v))) ? null : Number(v); }
        // Range written on a component you added (null if it has none).
        function ownRange(r) {
            if (!r) return null;
            const lo = numOrNull(r.lo), hi = numOrNull(r.hi);
            return (lo === null && hi === null) ? null : { u: r.unit || '', lo, hi };
        }
        function setRowRange(type, r, sex) {
            const ref = labKey(type, r.k);
            return (type !== 'custom' && !r.own && LAB_REF[ref]) ? labRange(ref, sex) : ownRange(r);
        }

        /* ----- Recognising a lab typed in "Other Labs" (e.g. "lactic" -> Critical Labs > Lactic) ----- */
        const LAB_ALIASES = {
            'lytes.na': ['sodium'], 'lytes.k': ['potassium'], 'lytes.cr': ['creatinine', 'creat', 'scr'],
            'lytes.bun': ['urea'], 'lytes.hco3': ['bicarb', 'bicarbonate'], 'lytes.alb': ['alb', 'albumin'],
            'glucose.fasting': ['fbs', 'fbg', 'fasting glucose', 'fasting sugar'],
            'cbc.hgb': ['hb', 'hemoglobin', 'haemoglobin'], 'cbc.wbc': ['wcc', 'white cells'], 'cbc.plt': ['platelets', 'platelet', 'plts'],
            'cbc.neut': ['neutrophils', 'neut', 'anc'], 'cbc.lymph': ['lymphocytes', 'lymph', 'alc'], 'cbc.eos': ['eosinophils', 'eos'],
            'coag.ptt': ['aptt'], 'critical.lactate': ['lactate', 'lactic', 'lactic acid'],
            'critical.tropi': ['troponin', 'trop', 'troponin i', 'tni', 'hs trop', 'hstrop'],
            'inflammation.crp': ['c reactive protein'], 'inflammation.procal': ['procalcitonin', 'pct', 'procal'],
            'bone.ca': ['calcium'], 'bone.phos': ['phosphate', 'phosphorus', 'po4'], 'bone.mg': ['magnesium'],
            'bone.vitd': ['vitamin d', 'vit d', '25ohd', '25 oh d'], 'bone.alp': ['alkaline phosphatase', 'alk phos'],
            'liver.bili': ['bilirubin', 'tbili', 'tbil', 'total bilirubin', 'bili'], 'iron.fe': ['iron', 'serum iron'],
            'iron.tsat': ['tsat', 'transferrin saturation'], 'iron.ferritin': ['ferritin'],
            'bone.pth': ['parathyroid hormone', 'ipth', 'intact pth'], 'bone.pthrp': ['pthrp', 'pth rp', 'pth related peptide'],
            'endocrine.a1c': ['hba1c', 'a1c', 'glycated hemoglobin'], 'endocrine.ft4': ['ft4', 'free t4', 'free thyroxine'], 'endocrine.cortisol': ['cortisol', 'am cortisol']
        };
        function normLab(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
        // Returns { range(sex), unit, from } for a typed lab name that matches a lab in any set, or null.
        function recognizeLab(name) {
            const n = normLab(name);
            if (!n) return null;
            for (const type of TABLE_TYPES) {
                const rows = [...currentSetRows(type), ...defaultSetRows(type)];
                for (const r of rows) {
                    if (r.calc || r.kind === 'text') continue;
                    const key = labKey(type, r.k);
                    const names = [r.label, ...(r.own ? [] : (LAB_ALIASES[key] || []))].map(normLab);
                    if (names.includes(n)) return { range: (sex) => setRowRange(type, r, sex), unit: r.unit || '', from: INV_TYPES[type].title };
                }
            }
            for (const cs of customSets()) {
                const r = (cs.rows || []).find(x => normLab(x.label) === n);
                if (r) return { range: () => ownRange(r), unit: r.unit || '', from: cs.title };
            }
            return null;
        }

        function invId() { return 'inv_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
        function labKey(type, rowKey) { return `${type}.${rowKey}`; }
        function customLabKey(name) { return 'labs.' + String(name || '').trim().toLowerCase(); }
        function labValue(p, date, key) { return ((p.labs || {})[date] || {})[key]; }
        function fmtMD(dateStr) { const m = String(dateStr).match(/^\d{4}-(\d{2})-(\d{2})/); return m ? `${m[2]}/${m[1]}` : dateStr; } // DD/MM

        function num(v) {
            const n = parseFloat(String(v ?? '').replace(',', '.'));
            return isNaN(n) ? null : n;
        }
        // Calculated rows: MAP = (SBP + 2 x DBP) / 3, Balance = Intake - Output.
        function calcValue(p, date, calc) {
            if (calc === 'map') {
                const s = num(labValue(p, date, 'vitals.sbp')), d = num(labValue(p, date, 'vitals.dbp'));
                return (s !== null && d !== null) ? String(Math.round((s + 2 * d) / 3)) : '';
            }
            if (calc === 'bal') {
                const i = num(labValue(p, date, 'io.in')), o = num(labValue(p, date, 'io.out'));
                if (i === null && o === null) return '';
                const b = (i || 0) - (o || 0);
                return (b > 0 ? '+' : '') + String(Math.round(b));
            }
            return '';
        }

        /* ----- Photos: stored once per patient ----- */

        function imageSrc(p, panel) {
            return panel.image || ((p.images || {})[panel.imageId]) || '';
        }
        // Moves any photo saved inside a card (older version) into the patient's shared photo store.
        function normalizeImages(p) {
            Object.values(p.days || {}).forEach(n => (n.investigations || []).forEach(panel => {
                if (panel.type === 'image' && panel.image) {
                    if (!p.images) p.images = {};
                    const id = 'img_' + invId();
                    p.images[id] = panel.image;
                    panel.imageId = id;
                    delete panel.image;
                }
            }));
        }
        // Deletes photos no longer used by any day.
        function gcImages(p) {
            if (!p.images) return;
            const used = new Set();
            Object.values(p.days || {}).forEach(n => (n.investigations || []).forEach(panel => { if (panel.imageId) used.add(panel.imageId); }));
            Object.keys(p.images).forEach(id => { if (!used.has(id)) delete p.images[id]; });
        }

        // Add All to Tomorrow / Copy from previous: every card comes along, including free text and photos.
        // Cards already copied before are not added twice; trend tables merge their rows.
        function mergeInvestigationPanels(srcPanels, dstPanels) {
            // A new card keeps the layout of the card it came from (column, width, open/closed)
            // and its own list of rows, so the next day looks the same.
            const layoutOf = (sp, i) => {
                const o = { col: (sp.col !== undefined && sp.col !== null) ? sp.col : i % 3 };
                if (sp.span) o.span = sp.span;
                if (sp.collapsed) o.collapsed = true;
                return o;
            };
            const sameSet = (a, b) => a.type === b.type && (a.type !== 'custom' || a.setId === b.setId);
            (srcPanels || []).forEach((sp, i) => {
                if (REC_TYPES.includes(sp.type)) {
                    // Entries live on the patient, so only the card (and its place) comes along.
                    if (!dstPanels.some(x => x.type === sp.type)) dstPanels.push({ id: invId(), type: sp.type, ...layoutOf(sp, i) });
                    return;
                }
                if (sp.type === 'text' || sp.type === 'image') {
                    const origin = sp.originId || sp.id;
                    if (dstPanels.some(x => (x.originId || x.id) === origin)) return;
                    const copy = clone(sp);
                    copy.id = invId();
                    copy.originId = origin;
                    dstPanels.push(copy);
                    return;
                }
                const ex = dstPanels.find(x => sameSet(x, sp));
                if (!ex) {
                    const copy = clone(sp);
                    copy.id = invId();
                    Object.assign(copy, layoutOf(sp, i));
                    dstPanels.push(copy);
                } else if (sp.type === 'labs') {
                    ex.rows = ex.rows || [];
                    (sp.rows || []).forEach(r => { if (!ex.rows.some(x => x.toLowerCase() === r.toLowerCase())) ex.rows.push(r); });
                }
            });
        }

        function toggleInvBox() {
            invBoxCollapsed = !invBoxCollapsed;
            noteViewChoice('inv', !invBoxCollapsed);
            renderApp();
        }
        function toggleInvPanel(patientId, panelId) {
            const allPatients = Store.getPatients();
            const { panel } = findPanel(allPatients, patientId, panelId);
            if (!panel) return;
            panel.collapsed = !panel.collapsed;
            noteViewChoice('card:' + panelId, !panel.collapsed);
            Store.savePatients(allPatients);
            renderApp();
        }

        function renderInvestigationsBox(p, note, pid) {
            const panels = note.investigations || [];
            return `
                <div class="size-scale bg-white p-2.5 sm:p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex items-center justify-between ${invBoxCollapsed ? '' : 'mb-2 sm:mb-3'}">
                        <button onclick="toggleInvBox()" class="flex items-center gap-2 font-bold text-slate-900 text-[calc(14px*var(--ts,1))] sm:text-[calc(17px*var(--ts,1))]">
                            <i class="fa-solid fa-microscope text-cyan-600"></i> Investigations
                            <span class="text-[calc(11px*var(--ts,1))] text-slate-400 font-semibold">(${panels.length})</span>
                            <i class="fa-solid fa-chevron-${invBoxCollapsed ? 'down' : 'up'} text-xs text-slate-400"></i>
                        </button>
                        <div class="flex items-center gap-1.5">
                            ${panels.length && !invBoxCollapsed ? (() => {
                                const anyOpen = panels.some(x => !x.collapsed);
                                return `<button onclick="setAllInvCollapsed(${pid}, ${anyOpen})" class="px-2.5 py-1 sm:py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg sm:rounded-xl text-xs font-semibold transition flex items-center gap-1.5" title="${anyOpen ? 'Collapse all cards' : 'Expand all cards'}">
                                    <i class="fa-solid fa-${anyOpen ? 'down-left-and-up-right-to-center' : 'up-right-and-down-left-from-center'}"></i><span class="hidden sm:inline">${anyOpen ? 'Collapse all' : 'Expand all'}</span></button>`;
                            })() : ''}
                            <button onclick="openAddInvestigationModal()" class="px-2.5 sm:px-3 py-1 sm:py-1.5 bg-cyan-50 hover:bg-cyan-100 text-cyan-700 rounded-lg sm:rounded-xl text-xs font-semibold transition flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Add</button>
                        </div>
                    </div>
                    <div class="${invBoxCollapsed ? 'hidden' : ''}">
                        ${panels.length === 0 ? '<p class="text-xs text-slate-400 italic">No investigations added.</p>' : ''}
                        <datalist id="rec-sources">${SOURCE_OPTIONS.map(o => `<option value="${o}"></option>`).join('')}</datalist>
                        <div class="inv-board" data-sort-list="inv" data-board="1" data-patient-id="${esc(p.id)}">
                            ${panels.map((panel, i) => renderInvPanel(p, panel, pid, i)).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // 3 columns on wide landscape screens, 2 on tablets / portrait, 1 on phones.
        // (Uses the screen's orientation, so an on-screen keyboard doesn't reshuffle the cards.)
        function invColumnCount() {
            const w = window.innerWidth;
            if (w < 640) return 1;
            let landscape = w > window.innerHeight;
            try { if (screen.orientation && screen.orientation.type) landscape = screen.orientation.type.startsWith('landscape'); } catch (e) {}
            return (w >= 1100 && landscape) ? 3 : 2;
        }
        let lastInvCols = null;
        window.addEventListener('resize', () => {
            const n = invColumnCount();
            if (!dragState) layoutInvestigations();
            if (lastInvCols !== null && n !== lastInvCols && currentRoute === 'patient_file' && !dragState) {
                lastInvCols = n;
                const a = document.activeElement;
                if (!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'))) renderApp();
            }
            lastInvCols = n;
        });

        /* ----- Investigations board: each card has a column (0–2) and a place in that column. -----
           Cards are stacked per column (no gaps caused by other columns). A 2-wide card sits across
           its column and the next one, below whatever is above it in both. On 2-column screens the
           third column folds into the second; on phones everything is one column. */
        const INV_GAP = 12;
        function invPanelSpan(panel) {
            const s = panel.span || (panel.type === 'cultures' ? 2 : 1);
            return Math.min(s, invColumnCount());
        }
        function invPanelCol(panel, index) {
            const n = invColumnCount();
            const c = (panel.col !== undefined && panel.col !== null) ? panel.col : index % 3;
            return Math.max(0, Math.min(c, n - invPanelSpan(panel)));
        }
        function layoutInvestigations() {
            document.querySelectorAll('.inv-board').forEach(board => {
                const n = invColumnCount();
                const W = board.clientWidth;
                const colW = (W - INV_GAP * (n - 1)) / n;
                const heights = new Array(n).fill(0);
                board.querySelectorAll(':scope > .inv-card').forEach(card => {
                    const span = Math.min(+card.dataset.span || 1, n);
                    const col = Math.min(+card.dataset.col || 0, n - span);
                    const w = (colW * span + INV_GAP * (span - 1)) + 'px';
                    if (card.style.width !== w) {
                        card.style.width = w;
                        // text boxes were sized before the card got its width: size them again
                        card.querySelectorAll('textarea.cult-input, textarea.auto-grow').forEach(fitTextarea);
                    }
                    card.style.left = (col * (colW + INV_GAP)) + 'px';
                    const top = Math.max(...heights.slice(col, col + span));
                    card.style.top = top + 'px';
                    const h = card.offsetHeight;
                    for (let c = col; c < col + span; c++) heights[c] = top + h + INV_GAP;
                });
                board.style.height = Math.max(0, Math.max(...heights) - INV_GAP) + 'px';
            });
        }
        // Re-arrange the board whenever a card changes height after drawing (fonts / icons loading,
        // a box growing while you type, a photo loading...), so cards never overlap.
        let invResizeObs = null, invRelayoutQueued = false;
        function watchInvCards() {
            if (!window.ResizeObserver) return;
            if (!invResizeObs) {
                invResizeObs = new ResizeObserver(() => {
                    if (invRelayoutQueued || dragState) return;
                    invRelayoutQueued = true;
                    requestAnimationFrame(() => { invRelayoutQueued = false; layoutInvestigations(); });
                });
            }
            invResizeObs.disconnect();
            document.querySelectorAll('.inv-board > .inv-card').forEach(c => invResizeObs.observe(c));
        }
        try { document.fonts && document.fonts.ready.then(() => layoutInvestigations()); } catch (e) {}

        function setAllInvCollapsed(patientId, collapse) {
            const allPatients = Store.getPatients();
            const note = dayNoteFor(allPatients, patientId);
            (note.investigations || []).forEach(x => { x.collapsed = collapse; noteViewChoice('card:' + x.id, !collapse); });
            Store.savePatients(allPatients);
            renderApp();
        }
        function toggleInvSpan(patientId, panelId) {
            const allPatients = Store.getPatients();
            const { note, panel } = findPanel(allPatients, patientId, panelId);
            if (!panel) return;
            panel.span = invPanelSpan(panel) === 2 ? 1 : 2;
            // keep it inside the board
            const i = note.investigations.indexOf(panel);
            panel.col = Math.min(invPanelCol(panel, i), 3 - panel.span);
            Store.savePatients(allPatients);
            renderApp();
        }
        // Moves a card to column `col`, just before card `beforeId` (or to the bottom of that column).
        function moveInvPanel(patientId, panelId, col, beforeId) {
            const allPatients = Store.getPatients();
            const note = dayNoteFor(allPatients, patientId);
            const list = note.investigations || [];
            // Give every card a fixed column first, so moving one doesn't shift the others.
            list.forEach((x, i) => { if (x.col === undefined || x.col === null) x.col = i % 3; });
            const from = list.findIndex(x => x.id === panelId);
            if (from < 0) return;
            const [panel] = list.splice(from, 1);
            panel.col = Math.max(0, Math.min(col, 3 - invPanelSpan(panel)));
            let at = beforeId ? list.findIndex(x => x.id === beforeId) : -1;
            if (at < 0) {
                // bottom of the column: after the last card that occupies that column
                at = list.length;
                for (let i = list.length - 1; i >= 0; i--) {
                    const x = list[i], xs = invPanelSpan(x), xc = x.col;
                    if (col >= xc && col < xc + xs) { at = i + 1; break; }
                }
            }
            list.splice(at, 0, panel);
            Store.savePatients(allPatients);
            renderApp();
        }

        function renderInvPanel(p, panel, pid, index) {
            const def = panel.type === 'custom'
                ? { title: panel.title || (customSet(panel.setId) || {}).title || 'Lab set', icon: 'fa-table-list', theme: 'gray' }
                : (INV_TYPES[panel.type] || { title: panel.type, icon: 'fa-flask', theme: 'gray' });
            const th = INV_THEMES[def.theme] || INV_THEMES.gray;
            const panelId = jsArg(panel.id);
            const collapsed = !!panel.collapsed;
            const chevron = `<button onclick="toggleInvPanel(${pid}, ${panelId})" class="px-1 shrink-0" style="color: ${th.icon}" title="${collapsed ? 'Expand' : 'Collapse'}"><i class="fa-solid fa-chevron-${collapsed ? 'down' : 'up'} text-[calc(11px*var(--ts,1))]"></i></button>`;
            const header = (titleHtml) => `
                <div class="flex items-center justify-between gap-2 px-3 py-2 ${collapsed ? '' : 'border-b'}" style="background-color: ${th.head}; border-color: ${th.border}">
                    <div class="flex items-center gap-2 min-w-0 flex-1 font-bold text-sm" style="color: ${th.text}">
                        ${chevron}<i class="fa-solid ${def.icon}" style="color: ${th.icon}"></i>${titleHtml}
                    </div>
                    ${panel.type === 'ulytes' ? `<div class="flex gap-1 shrink-0">${[['spot', 'Spot'], ['24h', '24 hr']].map(([v, l]) => `<button onclick="setUlytesMode(${pid}, ${panelId}, '${v}')" class="px-2 py-0.5 rounded-md text-[calc(11px*var(--ts,1))] font-bold border transition" style="${(panel.mode || 'spot') === v ? `background-color: ${th.icon}; border-color: ${th.icon}; color: #fff` : `background-color: #fff; border-color: ${th.border}; color: ${th.text}`}">${l}</button>`).join('')}</div>` : ''}
                    ${panel.type === 'text' && invColumnCount() > 1 ? `<button onclick="toggleInvSpan(${pid}, ${panelId})" class="text-slate-400 hover:text-slate-700 px-1 shrink-0 text-[calc(11px*var(--ts,1))] font-bold" title="${invPanelSpan(panel) === 2 ? 'Make 1 column wide' : 'Make 2 columns wide'}"><i class="fa-solid fa-${invPanelSpan(panel) === 2 ? 'compress' : 'arrows-left-right'}"></i></button>` : ''}
                    <button onclick="removeInvPanel(${pid}, ${panelId})" class="text-slate-400 hover:text-rose-600 px-1.5 shrink-0" title="Remove from this day"><i class="fa-solid fa-xmark"></i></button>
                </div>`;
            const wrap = (inner) => `
                <div data-sort-item data-id="${esc(panel.id)}" data-idx="${index}" data-col="${invPanelCol(panel, index)}" data-span="${invPanelSpan(panel)}" class="inv-card flex rounded-xl border bg-white overflow-hidden min-w-0" style="border-color: ${th.border}">
                    ${gripHandle('rounded-r-lg', { bg: th.head, fg: th.icon })}
                    <div class="flex-1 min-w-0">${inner}</div>
                </div>`;
            const titleInput = (placeholder) => `
                <span class="flex items-center gap-1.5 min-w-0 flex-1">
                    <input type="text" value="${esc(panel.title || '')}" oninput="updateInvPanelField(${pid}, ${panelId}, 'title', this.value)" class="bg-transparent font-bold text-sm border-b border-dashed focus:outline-none min-w-0 w-full" style="color: ${th.text}; border-color: ${th.border}" placeholder="${placeholder}">
                    <i class="fa-solid fa-pen text-[calc(10px*var(--ts,1))] opacity-50"></i>
                </span>`;

            if (panel.type === 'text') {
                return wrap(`
                    ${header(titleInput('Title'))}
                    <div class="${collapsed ? 'hidden' : ''}">
                        <textarea oninput="updateInvPanelField(${pid}, ${panelId}, 'text', this.value)" onmouseup="layoutInvestigations()" ontouchend="layoutInvestigations()" rows="4" class="w-full p-3 text-sm text-slate-800 focus:outline-none resize-y" placeholder="Write here...">${esc(panel.text || '')}</textarea>
                    </div>
                `);
            }
            if (REC_TYPES.includes(panel.type)) {
                const type = panel.type;
                const rows = sortedRecs(p, type);
                const phone = invColumnCount() === 1;
                const rid = (r) => jsArg(r.id);
                const upd = (r, field, rerender = false) => `updateRecField(${pid}, '${type}', ${rid(r)}, '${field}', this.value${rerender ? ', true' : ''})`;
                // A negative culture (status like "no growth", "-ve", "flora") greys out bug / sensitive / resistant.
                const neg = (r) => type === 'cultures' && isNegativeStatus(r.status);
                const area = (r, field, ph, extra = '') => {
                    const dis = ['organism', 'sens', 'res'].includes(field) && type === 'cultures';
                    const statusHook = field === 'status' && type === 'cultures' ? ' applyNegativeStatus(this);' : '';
                    return `<textarea rows="1" ${dis ? `data-neg-off ${neg(r) ? 'disabled' : ''}` : ''} oninput="autoGrow(this); ${upd(r, field)};${statusHook}" class="cult-input disabled:bg-slate-100 disabled:text-slate-400 disabled:border-slate-200 disabled:cursor-not-allowed w-full min-w-0 resize-none bg-white border rounded-md px-1.5 py-1 text-[calc(11px*var(--ts,1))] font-semibold text-slate-800 focus:outline-none focus:ring-2 ${extra}" style="border-color: ${th.input}" placeholder="${ph}">${esc(r[field] || '')}</textarea>`;
                };
                const srcBox = (r, field) => `<input type="text" list="rec-sources" value="${esc(r[field] || '')}" oninput="paintSource(this, '${th.input}'); ${upd(r, field)}" class="w-full min-w-0 border rounded-md px-1.5 py-1 text-[calc(11px*var(--ts,1))] font-bold focus:outline-none focus:ring-2" style="${sourceStyle(r[field], th.input)}" placeholder="Source" title="Type or pick a source">`;
                const dateBox = (r) => dateField(r.date || '', `updateRecField(${pid}, '${type}', ${rid(r)}, 'date', this.value, true)`, { cls: 'compact-date w-full bg-white border rounded-md px-1 py-1 text-[calc(11px*var(--ts,1))] font-semibold text-slate-800', placeholder: 'Date' });
                const C = {
                    source: `<i class="fa-solid fa-vial"></i>`,
                    date: `<i class="fa-regular fa-calendar"></i>`,
                    bug: `<i class="fa-solid fa-bacterium"></i>`,
                    status: `<i class="fa-solid fa-circle-info"></i>`,
                    sens: `<span class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700"><i class="fa-solid fa-capsules"></i><i class="fa-solid fa-check text-[calc(10px*var(--ts,1))]"></i></span>`,
                    res: `<span class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded-full bg-rose-100 text-rose-700"><i class="fa-solid fa-capsules"></i><i class="fa-solid fa-xmark text-[calc(10px*var(--ts,1))]"></i></span>`
                };
                const removeBtn = (r) => `<button onclick="removeRec(${pid}, '${type}', ${rid(r)})" class="text-slate-300 hover:text-rose-500" title="Delete from this patient's record"><i class="fa-solid fa-xmark text-[calc(11px*var(--ts,1))]"></i></button>`;
                const cell = (icon, inner, title) => `<div class="flex items-start gap-1.5 min-w-0 flex-1"><span class="shrink-0 w-5 pt-1 text-center text-[calc(11px*var(--ts,1))]" style="color: ${th.icon}" title="${title}">${icon}</span><div class="flex-1 min-w-0">${inner}</div></div>`;
                const pillCell = (pill, inner, title) => `<div class="flex items-start gap-1.5 min-w-0 flex-1"><span class="shrink-0 pt-0.5" title="${title}">${pill}</span><div class="flex-1 min-w-0">${inner}</div></div>`;
                const word = { cultures: 'cultures', pcr: 'PCRs', ua: 'urinalyses' }[type];
                const empty = `<div class="px-2 py-2 text-[calc(11px*var(--ts,1))] text-slate-400 italic">No ${word} yet.</div>`;
                const stacked = (inner) => `${rows.length === 0 ? empty : ''}<div class="divide-y divide-slate-100">${rows.map(r => `<div class="rec-row relative p-2 pr-6 space-y-1.5"><div class="absolute right-1.5 top-2">${removeBtn(r)}</div>${inner(r)}</div>`).join('')}</div>`;
                let body = '';
                if (type === 'cultures' && !phone) {
                    body = `
                    <div class="overflow-x-auto">
                        <table class="w-full min-w-[34rem] text-xs table-fixed">
                            <colgroup><col style="width: 13%"><col style="width: 15%"><col style="width: 14%"><col style="width: 15%"><col><col><col style="width: 1.3rem"></colgroup>
                            <thead>
                                <tr class="text-[calc(11px*var(--ts,1))]">
                                    <th class="px-1 py-1.5 text-left font-semibold truncate" style="color: ${th.text}" title="Source">${C.source} Source</th>
                                    <th class="px-1 py-1.5 text-left font-semibold truncate" style="color: ${th.text}" title="Date">${C.date} Date</th>
                                    <th class="px-1 py-1.5 text-left font-semibold truncate" style="color: ${th.text}" title="Status (e.g. treated, colonisation)">${C.status} Status</th>
                                    <th class="px-1 py-1.5 text-left font-semibold truncate" style="color: ${th.text}" title="Bug">${C.bug} Bug</th>
                                    <th class="px-1 py-1.5 text-left" title="Sensitive to">${C.sens}</th>
                                    <th class="px-1 py-1.5 text-left" title="Resistant to">${C.res}</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows.length === 0 ? `<tr><td colspan="7">${empty}</td></tr>` : ''}
                                ${rows.map(r => `
                                    <tr class="border-t border-slate-100 align-top">
                                        <td class="px-0.5 py-1">${srcBox(r, 'culture')}</td>
                                        <td class="px-0.5 py-1">${dateBox(r)}</td>
                                        <td class="px-0.5 py-1">${area(r, 'status', 'e.g. Treated')}</td>
                                        <td class="px-0.5 py-1">${area(r, 'organism', 'e.g. E. coli', 'italic')}</td>
                                        <td class="px-0.5 py-1">${area(r, 'sens', 'Sensitive', 'text-emerald-700')}</td>
                                        <td class="px-0.5 py-1">${area(r, 'res', 'Resistant', 'text-rose-700')}</td>
                                        <td class="px-0.5 py-1.5">${removeBtn(r)}</td>
                                    </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>`;
                } else if (type === 'cultures') {
                    // Phone: source + date / bug + status / sensitive + resistant, labelled by icon.
                    body = stacked(r => `
                        <div class="flex gap-2">${cell(C.source, srcBox(r, 'culture'), 'Source')}${cell(C.date, dateBox(r), 'Date')}</div>
                        <div class="flex gap-2">${cell(C.bug, area(r, 'organism', 'Bug', 'italic'), 'Bug')}${cell(C.status, area(r, 'status', 'Status'), 'Status')}</div>
                        <div class="flex gap-2">${pillCell(C.sens, area(r, 'sens', 'Sensitive', 'text-emerald-700'), 'Sensitive to')}${pillCell(C.res, area(r, 'res', 'Resistant', 'text-rose-700'), 'Resistant to')}</div>`);
                } else if (type === 'pcr') {
                    const resBtn = (r, val, label, on, off) => `<button onclick="setPcrResult(${pid}, ${rid(r)}, '${val}')" class="px-2 py-1 rounded-md text-[calc(11px*var(--ts,1))] font-bold border transition ${r.result === val ? on : off}">${label}</button>`;
                    body = stacked(r => `
                        <div class="flex gap-2">${cell(C.source, srcBox(r, 'source'), 'Source')}${cell(C.date, dateBox(r), 'Date')}</div>
                        <div class="flex gap-2 items-start">${cell(C.bug, area(r, 'bug', 'Bug / target', 'italic'), 'Bug')}
                            <div class="shrink-0 flex gap-1">
                                ${resBtn(r, 'pos', '<i class="fa-solid fa-plus"></i> Positive', 'bg-rose-600 text-white border-rose-600', 'bg-white text-rose-600 border-rose-200 hover:bg-rose-50')}
                                ${resBtn(r, 'neg', '<i class="fa-solid fa-minus"></i> Negative', 'bg-emerald-600 text-white border-emerald-600', 'bg-white text-emerald-700 border-emerald-200 hover:bg-emerald-50')}
                            </div>
                        </div>`);
                } else {
                    body = stacked(r => `
                        <div class="flex gap-2 items-start">${cell(C.date, dateBox(r), 'Date')}
                            <div class="flex-1 flex gap-1 pt-0.5">
                                ${[['poc', 'POC'], ['lab', 'Lab']].map(([v, label]) => `<button onclick="setUaKind(${pid}, ${rid(r)}, '${v}')" class="px-2.5 py-1 rounded-md text-[calc(11px*var(--ts,1))] font-bold border transition ${r.kind === v ? 'bg-amber-600 text-white border-amber-600' : 'bg-white text-amber-700 border-amber-200 hover:bg-amber-50'}">${label}</button>`).join('')}
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-1 pl-6">
                            ${UA_FLAGS.map(([k, label]) => `<button onclick="toggleUaFlag(${pid}, ${rid(r)}, '${k}')" class="px-2 py-1 rounded-md text-[calc(11px*var(--ts,1))] font-bold border transition ${(r.flags || {})[k] ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-slate-500 border-slate-200 hover:bg-amber-50'}">${(r.flags || {})[k] ? '<i class="fa-solid fa-check text-[calc(9px*var(--ts,1))]"></i> ' : ''}${label}</button>`).join('')}
                        </div>
                        <div class="pl-6">${area(r, 'note', 'Notes')}</div>`);
                }
                const addLabel = { cultures: 'Add culture', pcr: 'Add PCR', ua: 'Add urinalysis' }[type];
                return wrap(`
                    ${header(esc(def.title))}
                    <div class="${collapsed ? 'hidden' : ''}">
                        ${body}
                        <div class="p-2 border-t border-slate-100">
                            <button onclick="addRec(${pid}, '${type}')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold" style="background-color: ${th.head}; color: ${th.text}"><i class="fa-solid fa-plus"></i> ${addLabel}</button>
                        </div>
                    </div>
                `);
            }
            if (panel.type === 'image') {
                const src = imageSrc(p, panel);
                return wrap(`
                    ${header(titleInput('Name this image'))}
                    <div class="p-3 ${collapsed ? 'hidden' : ''}">
                        ${src ? `<img src="${esc(src)}" alt="${esc(panel.title || 'Investigation image')}" onclick="openImageViewer(${pid}, ${panelId})" class="max-h-72 w-auto mx-auto rounded-lg border border-slate-200 cursor-zoom-in">` : '<p class="text-xs text-slate-400 italic">No image.</p>'}
                    </div>
                `);
            }

            // Trend table: rows = parameters, columns = this day then the 4 days before it (DD/MM).
            const dates = Array.from({ length: TREND_DAYS }, (_, i) => addDays(currentViewDate, -i));
            const keys = dates.map(d => entryKey(d, currentEntryType));
            const sex = p.gender;
            // Each row: value key, label, unit (shown when the range doesn't carry it), range, calculated?, free-text?
            const rows = panel.type === 'labs'
                ? (panel.rows || []).map(name => {
                    const rec = recognizeLab(name); // typed labs take the format of the same lab in a set
                    const range = rec ? rec.range(sex) : null;
                    return { key: customLabKey(name), label: name, unit: rec && rec.unit && !(range && range.u) ? rec.unit : '', range, isCustom: true, from: rec ? rec.from : '' };
                })
                : panelSetRows(panel).map(r => {
                    const range = setRowRange(panel.type, r, sex);
                    const valueType = panel.type === 'ulytes' && panel.mode === '24h' ? 'ulytes24' : panel.type; // Spot and 24 hr trends kept apart
                    return { key: panel.type === 'custom' ? `${panel.setId}.${r.k}` : labKey(valueType, r.k), k: r.k, label: r.label, unit: r.unit && !(range && range.u) ? r.unit : '', range, calc: r.calc || null, kind: r.kind || '' };
                });
            return wrap(`
                ${header(esc(def.title))}
                <div class="${collapsed ? 'hidden' : ''}">
                    <div class="overflow-x-auto">
                        <table class="w-full text-xs">
                            <thead>
                                <tr class="text-slate-500">
                                    <th class="text-left font-semibold px-2 py-1.5 sticky left-0 bg-white"></th>
                                    ${dates.map((d, i) => `<th class="px-1 py-1.5 font-semibold text-center whitespace-nowrap" ${i === 0 ? `style="background-color: ${th.col}; color: ${th.text}"` : ''} title="${esc(fmtDate(d))}">${esc(fmtMD(d))}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody>
                                ${rows.map(({ key, k, label, unit, calc, isCustom, kind, range, from }) => {
                                    const rt = range ? rangeText(range) : '';
                                    const rangeAttr = range ? `data-range="${esc(JSON.stringify({ lo: range.lo, hi: range.hi }))}"` : '';
                                    return `
                                    <tr class="border-t border-slate-100">
                                        <td class="pl-1 pr-2 py-1 font-semibold text-slate-700 whitespace-nowrap sticky left-0 bg-white" ${from ? `title="Format from ${esc(from)}"` : ''}>
                                            <div class="flex items-start gap-1">
                                                ${isCustom ? `<button onclick="removeCustomLabRow(${pid}, ${panelId}, ${jsArg(label)})" class="shrink-0 w-3.5 leading-none pt-[3px] text-slate-300 hover:text-rose-500" title="Remove row"><i class="fa-solid fa-xmark text-[calc(10px*var(--ts,1))]"></i></button>`
                                                    : `<button onclick="removeCardComponent(${pid}, ${panelId}, ${jsArg(k)})" class="shrink-0 w-3.5 leading-none pt-[3px] text-slate-300 hover:text-rose-500" title="Remove from this card (this patient only)"><i class="fa-solid fa-xmark text-[calc(10px*var(--ts,1))]"></i></button>`}
                                                <div class="min-w-0">
                                                    <div>${esc(label)}${unit ? ` <span class="font-normal text-[calc(10px*var(--ts,1))] text-slate-400">${esc(unit)}</span>` : ''}</div>
                                                    ${rt ? `<div class="lab-range font-normal leading-none text-slate-400">${esc(rt)}</div>` : ''}
                                                </div>
                                            </div>
                                        </td>
                                        ${dates.map((d, i) => {
                                            const colStyle = i === 0 ? `style="background-color: ${th.col}"` : '';
                                            if (calc) {
                                                return `<td class="px-1 py-1 text-center font-bold ${i === 0 ? '' : 'text-slate-500'}" ${colStyle} ${i === 0 ? `data-calc="${calc}"` : ''}>${esc(calcValue(p, keys[i], calc)) || '<span class="text-slate-300">—</span>'}</td>`;
                                            }
                                            const v = labValue(p, keys[i], key);
                                            const fl = flagFor(range, v);
                                            if (i === 0) {
                                                return `<td class="px-1 py-0.5" ${colStyle}><input type="text" inputmode="${kind === 'text' ? 'text' : 'decimal'}" value="${esc(v || '')}" ${rangeAttr} oninput="setLabValue(${pid}, ${jsArg(key)}, this.value, this)" class="${kind === 'text' ? 'w-20' : 'w-14'} mx-auto block text-center bg-white border rounded-md px-1 py-1 font-semibold text-slate-900 focus:outline-none focus:ring-2" style="border-color: ${th.input}; ${flagStyle(fl)}"></td>`;
                                            }
                                            return `<td class="px-1 py-1 text-center text-slate-600" style="${flagStyle(fl)}">${v ? esc(v) : '<span class="text-slate-300">—</span>'}</td>`;
                                        }).join('')}
                                    </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                    ${panel.type === 'labs' ? `
                        <div class="flex items-center gap-2 p-2 border-t border-slate-100">
                            <input type="text" id="custom-lab-${esc(panel.id)}" onkeydown="if (event.key === 'Enter') { event.preventDefault(); addCustomLabRowFromInput(${pid}, ${panelId}); }" class="flex-1 min-w-0 text-xs border border-slate-200 rounded-lg px-2 py-1.5" placeholder="Add a lab (e.g. CRP)">
                            <button onclick="addCustomLabRowFromInput(${pid}, ${panelId})" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold">Add</button>
                        </div>
                    ` : ''}
                </div>
            `);
        }

        // Saves this day's value. Calculated cells (MAP, Balance) refresh without redrawing the page.
        function setLabValue(patientId, key, value, el) {
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === patientId);
            if (!p) return;
            if (!p.labs) p.labs = {};
            const k = curKey();
            if (!p.labs[k]) p.labs[k] = {};
            if (String(value).trim() === '') delete p.labs[k][key];
            else p.labs[k][key] = String(value).trim();
            Store.savePatients(allPatients);
            if (el) {
                const fl = el.dataset && el.dataset.range ? flagFor(JSON.parse(el.dataset.range), value) : '';
                el.style.color = fl ? FLAG_COLOR[fl] : '';
                el.style.fontWeight = fl ? '800' : '';
            }
            document.querySelectorAll('[data-calc]').forEach(cell => {
                const v = calcValue(p, curKey(), cell.getAttribute('data-calc'));
                cell.innerHTML = v ? esc(v) : '<span class="text-slate-300">—</span>';
            });
        }

        /* ----- Patient records: Cultures, PCR and Urinalysis -----
           Saved once per patient (p.recs[type]) instead of per day, so the whole history comes back
           whenever the card is added to any entry (inpatient or consult). Newest date at the top. */
        const REC_TYPES = ['cultures', 'pcr', 'ua'];
        const UA_FLAGS = [['blood', 'RBC'], ['wbc', 'WBC'], ['nit', 'Nit'], ['le', 'Est'], ['casts', 'Casts'], ['bug', 'Bug']];
        function newRec(type) {
            const base = { id: invId(), date: '' };
            if (type === 'cultures') return { ...base, culture: '', status: '', organism: '', sens: '', res: '' };
            if (type === 'pcr') return { ...base, source: '', bug: '', result: '' };
            return { ...base, flags: {}, note: '' };
        }
        function newCultureRow() { return newRec('cultures'); }
        function recHasContent(r) {
            return Object.entries(r || {}).some(([k, v]) => k !== 'id' && (v && typeof v === 'object' ? Object.values(v).some(Boolean) : String(v ?? '').trim()));
        }
        function patientRecs(p, type) {
            if (!p.recs) p.recs = {};
            if (!Array.isArray(p.recs[type])) p.recs[type] = [];
            return p.recs[type];
        }
        // Newest first; entries without a date yet (just added) stay at the top.
        function sortedRecs(p, type) {
            return [...((p.recs || {})[type] || [])].sort((a, b) => {
                const da = a.date || '9999', db = b.date || '9999';
                return da < db ? 1 : da > db ? -1 : 0;
            });
        }
        // One-time move of cultures saved inside day cards (older versions) into the patient's record.
        function migrateRecs() {
            const all = Store.getPatients();
            let changed = false;
            const key = (r) => `${(r.culture || '').trim().toLowerCase()}|${r.date || ''}|${(r.organism || '').trim().toLowerCase()}`;
            all.forEach(p => Object.keys(p.days || {}).sort().forEach(k => (p.days[k].investigations || []).forEach(panel => {
                if (!REC_TYPES.includes(panel.type) || !Array.isArray(panel.rows)) return;
                const list = patientRecs(p, panel.type);
                panel.rows.forEach(r => {
                    if (!recHasContent(r)) return;
                    const ex = list.find(x => x.id === r.id || (panel.type === 'cultures' && key(x) === key(r)));
                    if (ex) Object.assign(ex, clone(r), { id: ex.id });
                    else list.push(clone(r));
                });
                delete panel.rows;
                changed = true;
            })));
            if (changed) Store.savePatients(all);
        }

        /* Source colours (cultures and PCR): matched on what's written; anything else stays white. */
        const SOURCE_OPTIONS = ['Blood', 'Respiratory', 'Urine', 'CSF', 'Synovial fluid', 'Tissue', 'Swab', 'Stool'];
        const SOURCE_COLORS = [
            [/swab/i,                                                        { bg: '#ffe2c6', border: '#fb923c', fg: '#9a3412' }], // orange (Inflammation)
            [/blood|h(a)?emocult/i,                                          { bg: '#f7d9dd', border: '#d98f98', fg: '#7f1d1d' }], // red (CBC)
            [/resp|sputum|\bbal\b|\beta\b|trache|bronch|nasopharyn|\bnps\b/i, { bg: '#dbeafe', border: '#93c5fd', fg: '#1e40af' }], // blue (Blood Gas)
            [/urin|\bmsu\b|\bcsu\b/i,                                        { bg: '#fef3a0', border: '#facc15', fg: '#854d0e' }], // yellow (I/O)
            [/\bcsf\b|cerebrospinal/i,                                       { bg: '#b9f3fb', border: '#22d3ee', fg: '#0e7490' }], // cyan
            [/synov|joint/i,                                                 { bg: '#ece8e2', border: '#cbc2b4', fg: '#57534e' }], // light gray (Bone)
            [/tissue|biops/i,                                                { bg: '#fce1ef', border: '#f472b6', fg: '#9d174d' }], // pink
            [/stool|f(a)?ec(es|al)?\b|faeces/i,                              { bg: '#ead8c6', border: '#b88b62', fg: '#5c3d2e' }]  // brown
        ];
        function sourceColor(text) {
            const t = String(text || '').trim();
            if (!t) return null;
            const m = SOURCE_COLORS.find(([re]) => re.test(t));
            return m ? m[1] : null;
        }
        function sourceStyle(text, fallbackBorder) {
            const c = sourceColor(text);
            return c ? `background-color: ${c.bg}; border-color: ${c.border}; color: ${c.fg}` : `background-color: #ffffff; border-color: ${fallbackBorder}; color: #1e293b`;
        }
        function paintSource(el, fallbackBorder) { el.setAttribute('style', sourceStyle(el.value, fallbackBorder)); }

        function fitTextarea(el) {
            if (!el.offsetParent && el.offsetHeight === 0) return; // hidden (collapsed) - sized when shown
            el.style.height = 'auto';
            // scrollHeight leaves out the border, so add it back - otherwise a scroll bar appears.
            el.style.height = (el.scrollHeight + el.offsetHeight - el.clientHeight) + 'px';
        }
        function autoGrow(el) {
            fitTextarea(el);
            if (el.closest && el.closest('.inv-board')) layoutInvestigations();
        }
        function updateRecField(patientId, type, rowId, field, value, rerender = false) {
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === patientId);
            const row = p && patientRecs(p, type).find(r => r.id === rowId);
            if (!row) return;
            row[field] = value;
            Store.savePatients(allPatients);
            if (rerender) renderApp(); // a new date re-sorts the list
        }
        function setPcrResult(patientId, rowId, val) {
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === patientId);
            const row = p && patientRecs(p, 'pcr').find(r => r.id === rowId);
            if (!row) return;
            row.result = row.result === val ? '' : val;
            Store.savePatients(allPatients);
            renderApp();
        }
        // Status text that means "negative": the bug / sensitivity boxes don't apply.
        function isNegativeStatus(text) {
            return /\bneg(ative)?\b|-\s?ve\b|\bno\s+growth|\bnormal\b|\bflora\b|\bsterile\b|\bnil\b/i.test(String(text || ''));
        }
        function applyNegativeStatus(el) {
            const row = el.closest('tr, .rec-row');
            if (!row) return;
            const neg = isNegativeStatus(el.value);
            row.querySelectorAll('[data-neg-off]').forEach(t => { t.disabled = neg; });
        }
        function setUaKind(patientId, rowId, kind) {
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === patientId);
            const row = p && patientRecs(p, 'ua').find(r => r.id === rowId);
            if (!row) return;
            row.kind = row.kind === kind ? '' : kind;
            Store.savePatients(allPatients);
            renderApp();
        }
        function toggleUaFlag(patientId, rowId, flag) {
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === patientId);
            const row = p && patientRecs(p, 'ua').find(r => r.id === rowId);
            if (!row) return;
            row.flags = row.flags || {};
            row.flags[flag] = !row.flags[flag];
            Store.savePatients(allPatients);
            renderApp();
        }
        function addRec(patientId, type) {
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === patientId);
            if (!p) return;
            const r = newRec(type);
            patientRecs(p, type).unshift(r);
            Store.savePatients(allPatients);
            renderApp();
            const card = [...document.querySelectorAll('.inv-card')].find(c => c.innerHTML.includes(r.id));
            const el = card && card.querySelector('input[list], textarea, .date-field-text');
            if (el) el.focus();
        }
        function removeRec(patientId, type, rowId) {
            const all = Store.getPatients();
            const p = all.find(x => x.id === patientId);
            const row = p && patientRecs(p, type).find(r => r.id === rowId);
            if (!row) return;
            const doRemove = () => {
                const a2 = Store.getPatients();
                const p2 = a2.find(x => x.id === patientId);
                p2.recs[type] = patientRecs(p2, type).filter(r => r.id !== rowId);
                Store.savePatients(a2);
                renderApp();
            };
            const name = { cultures: 'culture', pcr: 'PCR', ua: 'urinalysis' }[type];
            if (recHasContent(row)) showConfirm({ title: `Delete this ${name}?`, messageHtml: "It is removed from this patient's record on every day.", confirmLabel: 'Delete', onConfirm: doRemove });
            else doRemove();
        }

        function findPanel(allPatients, patientId, panelId) {
            const note = dayNoteFor(allPatients, patientId);
            if (!note.investigations) note.investigations = [];
            return { note, panel: note.investigations.find(x => x.id === panelId) };
        }

        function addInvPanel(type, setId) {
            const patientId = activePatientId;
            const allPatients = Store.getPatients();
            const note = dayNoteFor(allPatients, patientId);
            if (!note) return null;
            if (!note.investigations) note.investigations = [];
            const cs = type === 'custom' ? customSet(setId) : null;
            if (type === 'custom' && !cs) return null;
            const single = type !== 'text' && type !== 'image';
            let panel = single ? note.investigations.find(x => x.type === type && (type !== 'custom' || x.setId === setId)) : null;
            if (panel) {
                closeModal();
                const full = cs ? (cs.rows || []) : (TABLE_TYPES.includes(type) ? currentSetRows(type) : null);
                const missing = full && full.some(r => !panelSetRows(panel).some(x => x.k === r.k));
                if (missing) {
                    panel.set = restoredSetRows(panel, full);
                    panel.collapsed = false;
                    Store.savePatients(allPatients);
                    invBoxCollapsed = false;
                    renderApp();
                    showToast(`${cs ? cs.title : INV_TYPES[type].title}: removed components restored.`);
                } else {
                    showToast(`${cs ? cs.title : INV_TYPES[type].title} is already on this day.`);
                }
                return panel;
            }
            panel = { id: invId(), type };
            // The card keeps the set's rows as they are now; later edits to the set won't change it.
            if (TABLE_TYPES.includes(type)) panel.set = currentSetRows(type);
            if (type === 'ulytes') panel.mode = 'spot';
            if (cs) { panel.setId = cs.id; panel.title = cs.title; panel.set = clone(cs.rows || []); }
            const counts = [0, 0, 0];
            note.investigations.forEach((x, i) => { const c = (x.col ?? i % 3); counts[c] += 1; if (invPanelSpan(x) === 2 && c < 2) counts[c + 1] += 1; });
            panel.col = type === 'cultures' ? (counts[0] + counts[1] <= counts[1] + counts[2] ? 0 : 1) : counts.indexOf(Math.min(...counts));
            if (type === 'labs') panel.rows = [];
            if (type === 'text') { panel.title = ''; panel.text = ''; }
            if (REC_TYPES.includes(type)) {
                // The card shows the patient's whole record; start one empty entry if there's none yet.
                const pp = allPatients.find(x => x.id === patientId);
                if (pp && !patientRecs(pp, type).length) patientRecs(pp, type).push(newRec(type));
            }
            note.investigations.push(panel);
            Store.savePatients(allPatients);
            invBoxCollapsed = false;
            renderApp();
            return panel;
        }

        function restoredSetRows(panel, fullRows) {
            const have = panelSetRows(panel);
            const merged = fullRows.map(r => have.find(x => x.k === r.k) || clone(r));
            have.forEach(r => { if (!merged.some(x => x.k === r.k)) merged.push(r); });

        // Photos are shrunk (max 1600px, JPEG) before saving so they fit in the browser's storage.
        function handleInvImage(input) {
            const file = input.files && input.files[0];
            input.value = '';
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    const max = 1600;
                    const scale = Math.min(1, max / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
                    const allPatients = Store.getPatients();
                    const p = allPatients.find(x => x.id === activePatientId);
                    const note = dayNoteFor(allPatients, activePatientId);
                    if (!note.investigations) note.investigations = [];
                    if (!p.images) p.images = {};
                    const imageId = 'img_' + invId();
                    p.images[imageId] = dataUrl;
                    const panel = { id: invId(), type: 'image', title: '', imageId };
                    note.investigations.push(panel);
                    Store.savePatients(allPatients);
                    invBoxCollapsed = false;
                    renderApp();
                    const el = document.querySelector(`[data-id="${panel.id}"] input`);
                    if (el) { el.focus(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
                };
                img.onerror = () => alert('That file could not be read as an image.');
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        }

        // Groups a patient's listed days into encounters (admissions / consult episodes).
        // A new encounter starts when the admission date changes, or (if unknown) after a gap of more than a day.
        // Groups a patient's entries into encounters. Inpatient and consult entries are grouped separately.
        // A new encounter starts when the admission / consult date changes, or (if unknown) after a gap of over a day.
        function encounterGroups(p) {
            const groups = [];
            ['inpatient', 'consult'].forEach(type => {
                const dates = listedDates(p.id, type);
                const field = type === 'consult' ? 'consultDate' : 'admissionDate';
                let cur = null, prevDate = null, prevAnchor = null;
                dates.forEach(d => {
                    const anchor = getDayInfo(p, entryKey(d, type))[field] || '';
                    const startNew = !cur || ((anchor && prevAnchor) ? anchor !== prevAnchor : daysBetween(prevDate, d) > 1);
                    if (startNew) {
                        cur = { type, dates: [] };
                        groups.push(cur);
                    }
                    cur.dates.push(d);
                    prevDate = d;
                    prevAnchor = anchor;
                });
            });
            // most recent first
            return groups.sort((a, b) => a.dates[a.dates.length - 1] < b.dates[b.dates.length - 1] ? 1 : -1);
        }
