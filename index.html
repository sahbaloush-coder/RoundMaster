        /* ---------- Treatment courses: "D5/7" in a treatment line becomes a day-counter chip ---------- */
        const COURSE_RE = /\bD\s?(\d{1,3})\s*\/\s*(\d{1,3})\b/i;
        function parseCourse(text) {
            const m = String(text || '').match(COURSE_RE);
            return m ? { day: +m[1], total: +m[2] } : null;
        }
        // The treatment without its D#/n part — used to recognise the same treatment on other days.
        function courseStrip(text) {
            return String(text || '').replace(COURSE_RE, '').replace(/\s+/g, ' ').trim().toLowerCase();
        }
        function setCourseInText(text, day, total) {
            return String(text || '').replace(COURSE_RE, `D${day}/${total}`);
        }
        // Moves the day counter on by n days (used when a treatment is carried to a later day).
        function shiftCourseText(text, n) {
            const c = parseCourse(text);
            // never counts past the end: one day after the last day it just stays "completed"
            return (c && n) ? setCourseInText(text, Math.max(1, Math.min(c.total + 1, c.day + n)), c.total) : text;
        }
        // for the note: a finished course reads "D7/7 (completed)" instead of "D8/7"
        function courseNoteText(text) {
            const c = parseCourse(text);
            return c && c.day > c.total ? String(text).replace(COURSE_RE, `D${c.total}/${c.total} (completed)`) : String(text || '');
        }
        function courseChip(text, onclickJs) {
            const c = parseCourse(text);
            if (!c) return '';
            // running: amber · last day (completes today): green ✓ · any later day: red (finished on an earlier day)
            const past = c.day > c.total, last = c.day === c.total;
            const cls = past ? 'bg-rose-100 text-rose-700 border-rose-300' : last ? 'bg-emerald-100 text-emerald-800 border-emerald-400' : 'bg-amber-100 text-amber-800 border-amber-300';
            const title = past ? 'Course finished on an earlier day' : last ? 'Course completes today' : 'Tap to edit the day / total';
            return `<button onclick="event.stopPropagation(); ${onclickJs}" class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md border text-[0.85em] font-bold align-middle ${cls}" title="${title}">${last || past ? '<i class="fa-solid fa-check text-[0.85em]"></i>' : ''}D${Math.min(c.day, c.total)}/${c.total}</button>`;
        }
        // Treatment text with its D#/n shown as a chip.
        function treatmentHtml(text, onclickJs) {
            const s = String(text || '');
            const m = s.match(COURSE_RE);
            if (!m) return esc(s);
            return esc(s.slice(0, m.index)) + courseChip(s, onclickJs) + esc(s.slice(m.index + m[0].length));
        }

        function openCourseEditor(patientId, issueIdx, trtIdx) {
            const p = Store.getPatients().find(x => x.id === patientId);
            const note = p && getDayNote(p, curKey());
            const trt = note && note.activeIssues[issueIdx] && note.activeIssues[issueIdx].treatments[trtIdx];
            const c = trt && parseCourse(trt.text);
            if (!c) return;
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50" onclick="if (event.target === this) closeModal()">
                    <div class="bg-white rounded-3xl p-5 max-w-xs w-full shadow-2xl space-y-4">
                        <h3 class="text-base font-bold text-slate-800">${esc(courseStrip(trt.text) ? trt.text.replace(COURSE_RE, '').trim() : 'Course')}</h3>
                        <div class="flex items-end gap-2">
                            <label class="flex-1"><span class="block text-[calc(11px*var(--ts,1))] text-slate-500 mb-1">Day</span>
                                <input id="course-day" type="number" min="1" inputmode="numeric" value="${c.day}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-lg font-bold text-center"></label>
                            <span class="pb-2 text-xl font-bold text-slate-400">/</span>
                            <label class="flex-1"><span class="block text-[calc(11px*var(--ts,1))] text-slate-500 mb-1">Total days</span>
                                <input id="course-total" type="number" min="1" inputmode="numeric" value="${c.total}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-lg font-bold text-center"></label>
                        </div>
                        <p class="text-[calc(11px*var(--ts,1))] text-slate-400">Also updates this treatment on later days.</p>
                        <div class="flex justify-end gap-2">
                            <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-sm">Cancel</button>
                            <button onclick="saveCourse(${jsArg(patientId)}, ${issueIdx}, ${trtIdx})" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium">Save</button>
                        </div>
                    </div>
                </div>`;
        }
        function saveCourse(patientId, issueIdx, trtIdx) {
            const day = parseInt(document.getElementById('course-day').value, 10);
            const total = parseInt(document.getElementById('course-total').value, 10);
            if (!(day >= 1) || !(total >= 1)) { showToast('Please enter whole numbers'); return; }
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === patientId);
            const key = curKey();
            const issue = p.days[key].activeIssues[issueIdx];
            const trt = issue.treatments[trtIdx];
            trt.text = setCourseInText(trt.text, day, total);
            // Forward in time: the same treatment (same issue) on later days of this list.
            const strip = courseStrip(trt.text), title = String(issue.issue || '').trim().toLowerCase();
            sameTypeKeys(p.days, key).filter(k => k > key).forEach(k => {
                const dd = daysBetween(keyDate(key), keyDate(k));
                (p.days[k].activeIssues || []).filter(ai => String(ai.issue || '').trim().toLowerCase() === title).forEach(ai => {
                    (ai.treatments || []).forEach(t => {
                        if (parseCourse(t.text) && courseStrip(t.text) === strip) t.text = setCourseInText(t.text, Math.min(total + 1, day + dd), total);
                    });
                });
            });
            Store.savePatients(allPatients);
            closeModal();
            renderApp();
        }

        /* ---------- Treatment colour menu (paint brush) ---------- */
        let colorMenuFor = null; // "issueIdx-trtIdx" while the menu is open
        function toggleColorMenu(i, ti) {
            colorMenuFor = colorMenuFor === `${i}-${ti}` ? null : `${i}-${ti}`;
            renderApp();
        }
        function pickTreatmentColor(patientId, i, ti, name) {
            updateTreatmentColor(patientId, i, ti, name);
            colorMenuFor = null;
            renderApp();
        }
        function colorCodeOf(settings, name) {
            return settings.colorCodes.find(c => c.name.toLowerCase() === String(name || '').trim().toLowerCase());
        }

        function renderIssuesBox(note, settings, patientId, pid, isConsult = false) {
            const issues = note.activeIssues || [];
            const L = isConsult
                ? { title: 'Consult Details', empty: 'No consult details recorded.', ph: 'Consult detail...', untitled: 'Untitled detail', none: 'No lines yet', line: 'Detail line...', addLine: 'Add Line' }

            const ta = (attrs, value, cls, ph) => `<textarea rows="1" ${attrs} class="auto-grow resize-none w-full ${cls}" placeholder="${ph}">${esc(value || '')}</textarea>`;
            // Frame in the list's colour (orange = inpatient, indigo = consult); the items inside stay neutral.
            const A = isConsult
                ? { box: 'bg-indigo-50 border-indigo-300', title: 'text-indigo-900', icon: 'fa-user-doctor', iconCls: 'text-indigo-500', btn: 'bg-indigo-600 hover:bg-indigo-700', grip: 'bg-indigo-100 text-indigo-400', edit: 'border-indigo-400', soft: 'hover:bg-indigo-50 border-indigo-200 text-indigo-600' }
                : { box: 'bg-orange-50 border-orange-300', title: 'text-orange-900', icon: 'fa-bed-pulse', iconCls: 'text-orange-500', btn: 'bg-orange-600 hover:bg-orange-700', grip: 'bg-orange-100 text-orange-400', edit: 'border-orange-400', soft: 'hover:bg-orange-50 border-orange-200 text-orange-600' };
            return `
                <div class="size-scale ${A.box} p-2.5 sm:p-4 rounded-2xl border-2 shadow-sm min-w-0 ${issuesFill(isConsult) ? 'flex-1 flex flex-col justify-center' : ''}">

                                                <div class="relative shrink-0">

                                                            <button onclick="pickTreatmentColor(${pid}, ${i}, ${ti}, '')" class="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50 text-xs font-semibold text-slate-700 ${!code ? 'bg-slate-100' : ''}">

                                                            ${settings.colorCodes.map(c => `

                                                                    <span class="w-4 h-4 rounded-full shrink-0" style="background-color: ${esc(c.color)}"></span> ${esc(c.name)} ${code && code.name === c.name ? '<i class="fa-solid fa-check ml-auto"></i>' : ''}

                                        ${(issue.treatments || []).map((trt, ti) => {

                    ${note.resolvedIssues && note.resolvedIssues.length > 0 ? `

                                        <button onclick="deleteResolvedIssue(${pid}, ${idx})" class="text-slate-400 hover:text-rose-600 px-2 py-1" title="Delete"><i class="fa-solid fa-xmark"></i></button>

                        </div>
                    ` : ''}
                    ${isConsult ? `
                        <div class="mt-3">
                            <h4 class="font-bold text-indigo-900 text-[calc(14px*var(--ts,1))] sm:text-[calc(17px*var(--ts,1))] mb-1.5 px-1">Impression</h4>
                            <textarea rows="2" data-impression oninput="autoGrow(this); saveImpressionLive(${pid}, this.value)" class="auto-grow resize-none w-full bg-white border border-indigo-200 rounded-xl px-3 py-2 text-[calc(13px*var(--ts,1))] sm:text-[calc(15px*var(--ts,1))] font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-300" style="min-height: 4.5em" placeholder="Impression...">${esc(note.impression || '')}</textarea>
                        </div>` : ''}
                    </div>
                </div>
            `;
        }

        // Plan and Discharge Plan share this box. kind: 'plan' | 'dcplan'.
        const PLAN_KINDS = {
            plan:   { key: 'plan',   title: 'Plan',           icon: 'fa-clipboard-check', empty: 'No plan items recorded.',
                      box: 'bg-emerald-50 border-emerald-300', titleCls: 'text-emerald-900', iconCls: 'text-emerald-600', btn: 'bg-emerald-600 hover:bg-emerald-700',
                      item: 'border-emerald-200', edit: 'border-emerald-500', grip: 'bg-emerald-100 text-emerald-500', check: 'accent-emerald-600', emptyCls: 'text-emerald-700/60', ph: 'Plan item...' },
            dcplan: { key: 'dcPlan', title: 'Discharge Plan', icon: 'fa-house-medical', empty: 'No discharge plan yet.',
                      box: 'bg-lime-50 border-lime-500', titleCls: 'text-lime-900', iconCls: 'text-lime-700', btn: 'bg-lime-700 hover:bg-lime-800',
                      item: 'border-lime-300', edit: 'border-lime-600', grip: 'bg-lime-100 text-lime-700', check: 'accent-lime-700', emptyCls: 'text-lime-800/70', ph: 'Discharge plan item...' }
        };
        let dcPlanCollapsed = false;
        // Active Issues / Consult Details, Plan and the patient details bar: open unless you close them
        // (remembered per entry, and included in Collapse all / Expand all).
        let coreCollapsed = { issues: false, plan: false, details: false, pads: false };
        // Empty room beside / under boxes. Its size changes with the boxes around it, so it is a no-ink zone
        // (the pen can't write there). Ink written there by older versions still shows, and is put away by
        // "Collapse all" / brought back by "Expand all".
        // Folded record: Active Issues / Consult Details grows to the height of the folded Plan boxes beside it
        const issuesFill = (isConsult) => coreCollapsed.issues && coreCollapsed.plan && (isConsult || dcPlanCollapsed);
        const inkPad = (id) => `<div class="ink-pad" data-ink="pad:${id}" data-ink-pad></div>`;
        function noteCoreChoice(item, closed) {
            if (!viewEntryKey) return;
            const all = Store.get('entry_view', {});
            const v = all[viewEntryKey] || (all[viewEntryKey] = { open: [] });
            v.closed = (v.closed || []).filter(x => x !== item);
            if (closed) v.closed.push(item);
            Store.set('entry_view', all);
        }
        function toggleCoreBox(item) {
            coreCollapsed[item] = !coreCollapsed[item];
            noteCoreChoice(item, coreCollapsed[item]);
            renderApp();
        }
        function toggleDcPlanCollapse() { dcPlanCollapsed = !dcPlanCollapsed; noteViewChoice('dcplan', !dcPlanCollapsed); renderApp(); }

        function renderPlanBox(note, patientId, pid, kind = 'plan', isConsult = false) {
            const K = PLAN_KINDS[kind];
            const plan = note[K.key] || [];
            const isDc = kind === 'dcplan';
            const isSignOff = kind === 'plan' && isConsult; // consult entries: "Sign off" sits in the Plan box
            const collapsed = isDc ? dcPlanCollapsed : coreCollapsed.plan;
            const dc = note.discharge;
            const titleHtml = `<h3 class="font-bold ${K.titleCls} text-[calc(14px*var(--ts,1))] sm:text-[calc(17px*var(--ts,1))] flex items-center gap-2"><i class="fa-solid ${K.icon} ${K.iconCls}"></i> ${K.title}
                <span class="text-[calc(11px*var(--ts,1))] font-semibold opacity-50">(${plan.length})</span><i class="fa-solid fa-chevron-${collapsed ? 'down' : 'up'} text-xs opacity-50"></i>
                ${isDc && dc && collapsed ? `<span class="ml-1 px-2 py-0.5 rounded-md text-[calc(10px*var(--ts,1))] font-bold ${dc.to === 'expired' ? 'bg-red-800 text-white' : dc.to === 'transfer' ? 'bg-teal-700 text-white' : 'bg-green-800 text-white'}">${dc.to === 'expired' ? 'Expired' : dc.to === 'transfer' ? 'TOC' : 'Discharged'}</span>` : ''}
                ${isSignOff && dc && collapsed ? (dc.to === 'toc' ? `<span class="ml-1 px-2 py-0.5 rounded-md text-[calc(10px*var(--ts,1))] font-bold bg-teal-600 text-white">TOC</span>` : `<span class="ml-1 px-2 py-0.5 rounded-md text-[calc(10px*var(--ts,1))] font-bold bg-emerald-700 text-white">Signed off</span>`) : ''}</h3>`;
            return `
                <div class="size-scale ${K.box} p-2.5 sm:p-4 rounded-2xl border-2 shadow-sm min-w-0">
                    <div data-fit class="flex items-center justify-between gap-2 whitespace-nowrap ${collapsed ? '' : 'mb-2 sm:mb-3'}">
                        <button onclick="${isDc ? 'toggleDcPlanCollapse()' : "toggleCoreBox('plan')"}" class="text-left">${titleHtml}</button>
                        <div class="flex items-center gap-2 shrink-0 ${collapsed ? 'hidden' : ''}">
                            ${plan.length ? `<button onclick="clearPlan(${pid}, '${kind}')" title="Clear all" class="px-3 py-1.5 bg-white hover:bg-rose-50 text-rose-600 border border-rose-200 rounded-xl text-xs font-semibold transition flex items-center gap-1.5"><i class="fa-solid fa-trash"></i><span class="fit-label">Clear All</span></button>` : ''}
                            <button data-edit-trigger onclick="addPlanItem(${pid}, '${kind}')" title="Add" class="px-3 py-1.5 ${K.btn} text-white rounded-xl text-xs font-semibold transition flex items-center gap-1.5"><i class="fa-solid fa-plus"></i><span class="fit-label">Add</span></button>
                        </div>
                    </div>
                    <div class="${collapsed ? 'hidden' : ''}">
                    ${plan.length === 0 ? `<p class="text-xs ${K.emptyCls} italic">${K.empty}</p>` : ''}
                    <div class="space-y-2" data-sort-list="${kind}" data-patient-id="${esc(patientId)}">
                        ${plan.map((pl, idx) => isEditingItem(kind, idx, patientId) ? `
                            <div data-sort-item data-id="${esc(pl.id || '')}" data-editing class="flex items-stretch rounded-xl border-2 ${K.edit} bg-white overflow-hidden">
                                ${gripHandle('rounded-r-lg', K.grip)}
                                <div class="flex-1 min-w-0 flex items-center gap-2 p-2">
                                    <textarea rows="1" oninput="autoGrow(this); updatePlanTextLive(${pid}, ${idx}, this.value, '${kind}')" data-enter="add-plan" class="auto-grow resize-none flex-1 min-w-0 text-[calc(13px*var(--ts,1))] sm:text-[calc(15px*var(--ts,1))] bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 font-semibold text-slate-900" placeholder="${K.ph}">${esc(pl.text || '')}</textarea>
                                    <button onclick="deletePlanItem(${pid}, ${idx}, '${kind}')" class="text-slate-400 hover:text-rose-600 px-1.5" title="Delete"><i class="fa-solid fa-trash text-xs"></i></button>
                                    <button onclick="stopEditing()" class="px-3 py-1 ${K.btn} text-white rounded-lg text-[calc(11px*var(--ts,1))] font-semibold">Done</button>
                                </div>
                            </div>
                        ` : `
                            <div data-sort-item data-id="${esc(pl.id || '')}" class="flex items-stretch rounded-xl bg-white border ${K.item} overflow-hidden">
                                ${gripHandle('rounded-r-lg', K.grip)}
                                <label class="flex items-center px-3 cursor-pointer" onclick="event.stopPropagation()">
                                    <input type="checkbox" ${pl.completed ? 'checked' : ''} onchange="togglePlanItem(${pid}, ${idx}, '${kind}')" class="w-4 h-4 ${K.check} rounded border-slate-300">
                                </label>
                                <div data-edit-trigger onclick="startEditing('${kind}', ${idx})" class="edit-trigger flex-1 min-w-0 py-1.5 sm:py-2 pr-3 text-[calc(13px*var(--ts,1))] sm:text-[calc(15px*var(--ts,1))] font-semibold break-words ${pl.completed ? 'line-through text-slate-400' : 'text-slate-900'}" title="Click to edit">
                                    ${esc(pl.text) || '<span class="text-slate-400 italic font-medium">Empty item</span>'}

                    ${isDc ? `
                        <div class="flex justify-center pt-3">

                                    <i class="fa-solid fa-circle-check"></i> ${dc.to === 'expired' ? 'Discharged · Expired' : dc.to === 'transfer' ? 'Discharged · TOC' : 'Discharged · Home'}
                                </button>` : `
                                <button onclick="openDischargeModal(${pid})" class="px-5 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition bg-white hover:bg-green-50 text-green-800 border-2 border-green-700 shadow-sm">
                                    <i class="fa-solid fa-door-open"></i> Discharge
                                </button>`}
                        </div>` : ''}
                    ${isSignOff ? `
                        <div class="flex justify-center pt-3">
                            ${dc ? (dc.to === 'toc' ? `
                                <button onclick="reverseDischarge(${pid})" class="px-5 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition bg-teal-600 hover:bg-teal-700 text-white shadow-sm" title="Tap to reverse the transfer of care">
                                    <i class="fa-solid fa-circle-check"></i> TOC Acptd
                                </button>` : `
                                <button onclick="reverseDischarge(${pid})" class="px-5 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition bg-emerald-700 hover:bg-emerald-800 text-white shadow-sm" title="Tap to reverse the sign-off">
                                    <i class="fa-solid fa-circle-check"></i> Signed off
                                </button>`) : `
                                <div class="flex gap-2 flex-wrap justify-center">
                                <button onclick="openDischargeModal(${pid}, true)" class="px-5 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition bg-white hover:bg-emerald-50 text-emerald-800 border-2 border-emerald-600 shadow-sm">
                                    <i class="fa-solid fa-hand-point-right"></i> Sign off
                                </button>
                                <button onclick="openTocConfirm(${pid})" class="px-5 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition bg-white hover:bg-teal-50 text-teal-800 border-2 border-teal-600 shadow-sm" title="Accepted for transfer of care to the inpatient list">
                                    <i class="fa-solid fa-right-left"></i> TOC
                                </button>
                                </div>`}
                        </div>` : ''}
                    </div>
                </div>
            `;
        }


        /* =========================================================
           EXTRACT NOTE
           Builds the note from your Word form (inpatient and consult versions):
           black text = kept as written, blue = filled in from the entry, red = instructions (left out),
           green = fields you fill in each time (highlighted, editable, not saved).
           Lines are { parts: [{ t, ph }], b, u, i, center }; an empty parts list is a blank line.
           ========================================================= */
        const NT = (t) => ({ t: String(t ?? '') });
        const NB = (t) => ({ t: String(t ?? ''), b: true }); // bold words inside a line
        const NPH = (t) => ({ t, ph: true });
        const NL = (parts = [], fmt = {}) => ({ parts: Array.isArray(parts) ? parts : [parts], ...fmt });
        const NBLANK = () => NL([]);
        const NTEXT = (t, fmt) => NL([NT(t)], fmt);
        function withDot(t) {
            const s = String(t || '').trim();
            return s && !/[.!?:;]$/.test(s) ? s + '.' : s;
        }
        // Multi-line text becomes several lines.
        function textLines(t, fmt) {
            return String(t || '').split(/\r?\n/).map(x => x.trimEnd()).filter((x, i, a) => x || (i > 0 && i < a.length - 1)).map(x => x ? NTEXT(x, fmt) : NBLANK());
        }

        // Rows of a table card as shown (removed components left out): label, value key, calculated?
        function extractRows(panel) {
            if (panel.type === 'labs') return (panel.rows || []).map(name => ({ label: name, key: customLabKey(name) }));
            const valueType = panel.type === 'ulytes' && panel.mode === '24h' ? 'ulytes24' : panel.type;
            return panelSetRows(panel).map(r => ({
                label: r.label, unit: r.unit || '', calc: r.calc || null,
                key: panel.type === 'custom' ? `${panel.setId}.${r.k}` : labKey(valueType, r.k)
            }));
        }
        function extractValue(raw, key, row) {
            if (row.calc) return calcValue(raw, key, row.calc);
            const v = labValue(raw, key, row.key);
            return v === undefined || v === null ? '' : String(v).trim();
        }

        const COL = '\t';     // investigations: one tab space between columns of data
        const COL2 = '\t\t'; // vitals and I/O: two tab spaces
        // A table card as lines: card name (with today's and the day before's dates), then "label<tab>today<tab>day before".
        // noDash (Vitals, I/O): an empty value is left blank instead of "—", and the day-before column
        // is only shown when something was recorded that day.
        function tableCardLines(raw, panel, title, date, type, headFmt, noDash = false) {
            const key = entryKey(date, type), prevKey = entryKey(addDays(date, -1), type);
            const rows = extractRows(panel)
                .map(r => ({ r, now: extractValue(raw, key, r), prev: extractValue(raw, prevKey, r) }))
                .filter(x => x.now || x.prev);
            if (!rows.length) return [];
            const unit = (r) => r.unit ? (/^[%°]/.test(r.unit) ? '' : ' ') + r.unit : '';
            const empty = noDash ? '' : '—';
            // a day's date (and column) only appears when that day has a value in this card
            const showNow = rows.some(x => x.now), showPrev = rows.some(x => x.prev);
            const line = (cells) => { const c = [...cells]; if (noDash) while (c.length > 1 && !c[c.length - 1]) c.pop(); return c.join(noDash ? COL2 : COL); };
            return [
                headFmt(line([title, ...(showNow ? [`[${fmtMD(date)}]`] : []), ...(showPrev ? [`[${fmtMD(addDays(date, -1))}]`] : [])])),
                ...rows.map(({ r, now, prev }) => NTEXT(line([r.label, ...(showNow ? [now ? now + unit(r) : empty] : []), ...(showPrev ? [prev ? prev + unit(r) : empty] : [])])))
            ];
        }
        // [1] Clinical: "• Vitals" and "• I/O" blocks, only for cards on this entry. No units.
        //   Vitals: today and the day before (if recorded); BP as SBP/DBP(MAP); oxygen as "SpO2% on <supp O2>".
        //   I/O: "Intake⇥⇥Output⇥⇥Balance" header, then today's values.
        function extractClinical(raw, note, date, type) {
            const key = entryKey(date, type), prevKey = entryKey(addDays(date, -1), type);
            const blocks = [];
            const cards = note.investigations || [];
            const vit = cards.find(x => x.type === 'vitals');
            if (vit) {
                const rows = extractRows(vit);
                const has = (k) => rows.some(r => r.key === 'vitals.' + k);
                const val = (k, kk) => has(k) ? (labValue(raw, kk, 'vitals.' + k) || '').toString().trim() : '';
                const dayVals = (kk) => {
                    const out = {};
                    const sbp = val('sbp', kk), dbp = val('dbp', kk);
                    const map = has('map') ? calcValue(raw, kk, 'map') : '';
                    if (sbp || dbp) out.BP = `${sbp || '?'}/${dbp || '?'}${map ? `(${map})` : ''}`;
                    rows.forEach(r => {
                        const k = r.key.replace('vitals.', '');
                        if (['sbp', 'dbp', 'map', 'spo2', 'fio2'].includes(k)) return;
                        const v = r.calc ? calcValue(raw, kk, r.calc) : (labValue(raw, kk, r.key) || '').toString().trim();
                        if (v) out[r.label] = v;
                    });
                    const spo2 = val('spo2', kk), o2 = val('fio2', kk);
                    if (spo2 || o2) out.SpO2 = `${spo2 ? spo2 + '%' : '?'}${o2 ? ' on ' + o2 : ''}`;
                    return out;
                };
                const now = dayVals(key), prev = dayVals(prevKey);
                const order = ['BP', ...rows.filter(r => !['vitals.sbp', 'vitals.dbp', 'vitals.map', 'vitals.spo2', 'vitals.fio2'].includes(r.key)).map(r => r.label), 'SpO2'];
                const labels = order.filter(l => now[l] || prev[l]);
                if (labels.length) {
                    // a day's date (and column) only appears when that day has something recorded
                    const showNow = labels.some(l => now[l]), showPrev = labels.some(l => prev[l]);
                    const dates = [...(showNow ? [`[${fmtMD(date)}]`] : []), ...(showPrev ? [`[${fmtMD(addDays(date, -1))}]`] : [])];
                    const line = (cells) => { const c = [...cells]; while (c.length > 1 && !c[c.length - 1]) c.pop(); return c.join(COL2); };
                    blocks.push([
                        NL([NT('• '), NB('Vitals'), NT(dates.map(d => COL2 + d).join(''))]),
                        ...labels.map(l => NTEXT(line([l, ...(showNow ? [now[l] || ''] : []), ...(showPrev ? [prev[l] || ''] : [])])))
                    ]);
                }
            }
            const io = cards.find(x => x.type === 'io');
            if (io) {
                const vals = extractRows(io).map(r => ({ label: r.label, v: extractValue(raw, key, r) }));
                if (vals.some(x => x.v)) {
                    blocks.push([
                        NL([NT('• '), NB('I/O')]),
                        NTEXT(vals.map(x => x.label).join(COL2), { b: true, u: true }),
                        NTEXT(vals.map(x => x.v || '').join(COL2))
                    ]);
                }
            }
            return blocks;
        }

        function extractInvestigations(raw, note, date, type) {
            const key = entryKey(date, type), prevKey = entryKey(addDays(date, -1), type);
            const blocks = [];
            (note.investigations || []).forEach(panel => {
                if (panel.type === 'vitals' || panel.type === 'io' || panel.type === 'image') return; // vitals and I/O are under [1] Clinical
                const def = panel.type === 'custom'
                    ? { title: panel.title || (customSet(panel.setId) || {}).title || 'Lab set' }
                    : (INV_TYPES[panel.type] || { title: panel.type });
                const lines = [];
                const head = (name) => NL([NT('• '), NB(name)]);
                if (panel.type === 'text') {
                    if ((panel.text || '').trim()) {
                        lines.push(head((panel.title || '').trim() || 'Note'));
                        lines.push(...textLines(panel.text));
                    }
                } else if (panel.type === 'cultures') {
                    const pos = sortedRecs(raw, 'cultures').filter(r => (r.organism || '').trim() && !isNegativeStatus(r.status));
                    if (pos.length) {
                        lines.push(head('Cultures'));
                        // Source [Date]⇥⇥bug: status
                        pos.forEach(r => lines.push(NTEXT(`${[(r.culture || '').trim(), r.date ? `[${fmtDate(r.date)}]` : ''].filter(Boolean).join(' ')}${COL}${(r.organism || '').trim()}${(r.status || '').trim() ? ': ' + r.status.trim() : ''}`)));
                    }
                } else if (panel.type === 'pcr') {
                    const recs = sortedRecs(raw, 'pcr').filter(recHasContent);
                    if (recs.length) {
                        lines.push(head('PCR & RAT'));
                        // Source [Date]⇥⇥bug: Positive / Negative
                        recs.forEach(r => {
                            const res = r.result === 'pos' ? 'Positive' : r.result === 'neg' ? 'Negative' : '';
                            lines.push(NTEXT(`${[(r.source || '').trim(), r.date ? `[${fmtDate(r.date)}]` : ''].filter(Boolean).join(' ')}${COL}${[(r.bug || '').trim(), res].filter(Boolean).join(': ')}`));
                        });
                    }
                } else if (panel.type === 'ua') {
                    const recs = sortedRecs(raw, 'ua').filter(recHasContent);
                    if (recs.length) {
                        lines.push(head('Urinalysis'));
                        recs.forEach(r => {
                            const pos = UA_FLAGS.filter(([k]) => (r.flags || {})[k]).map(([, l]) => l);
                            // POC/Lab [Date] ⇥⇥Positive for: …
                            const kind = r.kind === 'poc' ? 'POC' : r.kind === 'lab' ? 'Lab' : '';
                            const uaHead = [kind, r.date ? `[${fmtDate(r.date)}]` : ''].filter(Boolean).join(' ') || 'Urinalysis';
                            lines.push(NTEXT(`${uaHead} ${COL}${pos.length ? 'Positive for: ' + pos.join(', ') : 'Negative'}`));
                        });
                    }
                } else {
                    const title = def.title + (panel.type === 'ulytes' ? (panel.mode === '24h' ? ' (24 hr)' : ' (Spot)') : '');
                    lines.push(...tableCardLines(raw, panel, title, date, type, (txt) => { const i = txt.indexOf(COL); return NL([NT('• '), NB(txt.slice(0, i)), NT(txt.slice(i))]); }));
                }
                if (lines.length) blocks.push(lines);
            });
            const out = [];
            blocks.forEach((b, i) => { if (i) out.push(NBLANK()); out.push(...b); });
            return out;
        }

        function issueLines(issue, n, dots = true) {
            const lines = [NL([NB(`[${n}] `), NB((issue.issue || '').trim() || 'Untitled')])];
            (issue.treatments || []).filter(t => (t.text || '').trim()).forEach(t => lines.push(NTEXT('• ' + (dots ? withDot(courseNoteText(t.text)) : courseNoteText(t.text).trim()))));
            return lines;
        }

        function buildNoteLines(patientId) {
            const raw = Store.getPatients().find(x => x.id === patientId);
            if (!raw) return [];
            const type = currentEntryType, date = currentViewDate, key = curKey();
            const p = effectivePatient(raw, key);
            const note = getDayNote(raw, key) || emptyNote();
            const H = { b: true, u: true };
            const L = [];
            const blank = (n = 1) => { for (let i = 0; i < n; i++) L.push(NBLANK()); };
            const ageRaw = ageText(p, date) || '';
            const age = ageRaw.replace(/^(\d+)\s*YO$/i, '$1-year-old');
            const gender = p.gender === 'F' ? 'female' : p.gender === 'M' ? 'male' : '';
            const mbList = (p.medicalBackground || []).filter(m => (m.condition || '').trim() || (m.treatment || '').trim());
            const mbText = (m) => {
                const cond = (m.condition || '').trim(), trt = (m.treatment || '').trim();
                return withDot(trt ? cond.replace(/[.;:,]+$/, '') + ': ' + trt : cond);
            };
            const issues = note.activeIssues || [];
            const resolved = note.resolvedIssues || [];
            const st = Store.getSettings();
            const TEAM = () => st.team ? NT(st.team) : NPH('Team');
            const MRP = () => st.mrp ? NT(st.mrp) : NPH('MRP');
            const header = (teamWord) => {
                L.push(NTEXT('________________________'));
                L.push(NTEXT(p.name || ''));
                L.push(NL([TEAM(), NT(teamWord), MRP()], { b: true, u: true, center: true }));
                blank();
                L.push(NTEXT('CASE SUMMARY', H));
                L.push(NL([NT('This is a '), NT(age || '—'), NT(', '), NT(gender || '—'), NT(', patient. Known case of:')]));
            };
            // Only the cards ticked for the note (sticky-note button on each card)
            const noteCards = { ...note, investigations: (note.investigations || []).filter(x => !x.noteOff) };
            const assessment = () => {
                L.push(NTEXT('ASSESSMENT', H));
                const clinical = extractClinical(raw, noteCards, date, type);
                const inv = extractInvestigations(raw, noteCards, date, type);
                // "[1] Clinical" always stays (the examination is clinical too); Vitals / I/O only when ticked and recorded
                L.push(NTEXT('[1] Clinical', { b: true }));
                // a blank line after each card; cards not on the entry (or empty) are left out with their space
                clinical.forEach(b => { L.push(...b); blank(); });
                L.push(NL([NPH('EXAMINATION')]));
                ['• Conscious, oriented and alert. GCS 15/15',
                 '• CVS: S1+S2 with no added sounds. No raised JVP noted',
                 '• Chest: equal breathing bilaterally with no additional sounds.',
                 '• Abdomen: soft and lax. Non tender.',
                 '• LL: no edema or signs of DVT'].forEach(t => L.push(NTEXT(t)));
                // no investigation card to show: the whole section (with its heading) is left out
                if (inv.length) {
                    blank();
                    L.push(NTEXT('[2] Investigations', { b: true }));
                    L.push(...inv);
                }
            };
            const resolvedSection = (dots, after) => {
                if (!resolved.length) return; // no resolved issues: the whole section is left out
                L.push(NTEXT('RESOLVED ISSUES', H));
                resolved.forEach((ri, i) => { if (i) blank(); L.push(...issueLines(ri, i + 1, dots)); });
                blank(after);
            };
            const bulletLines = (list) => (list || []).filter(x => (x.text || '').trim()).forEach(x => L.push(NTEXT('• ' + withDot(x.text))));

            if (type !== 'consult') {
                header(' Rounds with Dr. ');
                mbList.forEach(m => L.push(NTEXT('• ' + mbText(m))));
                blank();
                const inSummary = String(p.caseSummary || '').trim().replace(/\s*\n+\s*/g, ' ').replace(/[.\s]+$/, '');
                L.push(NL([NT(`Admitted on [${p.admissionDate ? fmtDate(p.admissionDate) : '—'}] as a case of `), inSummary ? NT(inSummary) : NPH('Summary'), NT('.')]));
                blank(2);
                L.push(NTEXT('ACTIVE ISSUES', H));
                issues.forEach((ai, i) => {
                    if (i) blank();
                    L.push(...issueLines(ai, i + 1));
                    L.push(NL([NT('↪ Update: '), NPH('UPDATE')], { i: true }));
                });
                blank();
                resolvedSection(true, 1);
                assessment();
                blank(2);
                L.push(NL([NT('PLAN as discussed with Dr. '), MRP()], H));
                bulletLines(note.plan);
                // no discharge plan: the section and its heading are left out
                if ((note.dcPlan || []).some(x => (x.text || '').trim())) {
                    blank();
                    L.push(NTEXT('DISCHARGE PLAN', H));
                    bulletLines(note.dcPlan);
                }
            } else {
                header(' Team with Dr. ');
                mbList.forEach(m => L.push(NTEXT('• ' + mbText(m))));
                blank();
                const summary = (p.caseSummary || '').trim();
                L.push(NTEXT(`[${p.admissionDate ? fmtDate(p.admissionDate) : '—'}].${summary ? ' ' + withDot(summary.replace(/\s*\n+\s*/g, ' ')) : ''}`));
                const first = issues[0] ? withDot(issues[0].issue || '') : '';
                L.push(NTEXT(`We were consulted on [${p.consultDate ? fmtDate(p.consultDate) : '—'}] for ${first || '—.'}`));
                blank(2);
                L.push(NTEXT('RELEVANT ISSUES', H));
                issues.forEach((ai, i) => { if (i) blank(); L.push(...issueLines(ai, i + 1)); });
                blank();
                L.push(NTEXT('UPDATES', H));
                L.push(...textLines(note.memo));
                blank();
                resolvedSection(false, 1);
                assessment();
                blank(2);
                L.push(NTEXT('IMPRESSION', H));
                const imp = textLines(note.impression);
                if (imp.length) L.push(...imp); else L.push(NL([NPH('Impression')]));
                blank();
                L.push(NL([NT('RECOMMENDATIONS as discussed with Dr. '), MRP()], H));
                bulletLines(note.plan);
                blank();
                L.push(NTEXT(note.discharge && note.discharge.to === 'signoff' ? 'We will sign off.' : note.discharge && note.discharge.to === 'toc' ? 'Accepted for transfer of care.' : 'We will follow.'));
            }
            return L;
        }

        function noteLinesHtml(lines) {
            return lines.map(l => {
                const style = [
                    'white-space: pre-wrap', 'min-height: 1.4em', 'tab-size: 12',
                    l.b ? 'font-weight: 700' : '', l.u ? 'text-decoration: underline' : '', l.i ? 'font-style: italic' : '',
                    l.center ? 'text-align: center' : ''
                ].filter(Boolean).join('; ');
                const inner = l.parts.length ? l.parts.map(pt => pt.ph
                    ? `<span class="note-ph" data-orig="${esc(pt.t)}">${esc(pt.t)}</span>`
                    : pt.b ? `<b>${esc(pt.t)}</b>` : esc(pt.t)).join('') : '<br>';
                return `<div style="${style}">${inner}</div>`;
            }).join('');
        }

        let noteExtractFor = null, noteExtractKey = null, noteDirty = false, noteCloseArmed = false, noteResetArmed = false;
        function savedNoteFor(patientId, key) {
            const p = Store.getPatients().find(x => x.id === patientId);
            const n = p && getDayNote(p, key);
            return n && n.savedNote && n.savedNote.html ? n.savedNote : null;
        }
        function openNoteExtract(patientId) {
            const p = Store.getPatients().find(x => x.id === patientId);
            noteExtractFor = patientId;
            noteExtractKey = curKey();
            noteDirty = false; noteCloseArmed = false; noteResetArmed = false;
            const saved = savedNoteFor(patientId, noteExtractKey);
            const body = saved ? saved.html : noteLinesHtml(buildNoteLines(patientId));
            const btn = 'w-10 h-10 shrink-0 rounded-xl text-base flex items-center justify-center transition';
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-2 sm:p-4 z-50">
                    <div class="bg-white rounded-3xl w-full max-w-3xl shadow-2xl flex flex-col" style="max-height: 92vh">
                        <div class="flex flex-wrap sm:flex-nowrap items-center justify-between gap-3 px-4 sm:px-5 py-3 border-b border-slate-100">
                            <div class="min-w-0 w-full sm:w-auto sm:flex-1">
                                <h3 class="text-base font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-file-lines text-slate-500"></i> Note · ${esc(p ? p.name : '')}</h3>
                                <p class="text-[calc(11px*var(--ts,1))] text-slate-500"><span class="sm:block">Press <b>Tab</b> (<b>Enter</b> on a phone) to move through the <span class="note-ph">placeholders</span>.</span> <span class="sm:block"><span class="note-user font-semibold">Amber text</span> is what you added yourself.</span></p>
                                <p id="note-saved-info" class="text-[calc(11px*var(--ts,1))] font-semibold text-indigo-600 mt-0.5"></p>
                            </div>
                            <div class="flex items-center justify-between gap-2 w-full sm:w-auto sm:flex-nowrap sm:self-stretch">
                                <span id="note-status" class="text-[calc(11px*var(--ts,1))] font-bold px-2 py-1 rounded-lg whitespace-nowrap"></span>
                                <div class="flex items-center gap-2 sm:self-end">
                                    <button id="note-save-btn" onclick="saveNoteForToday()" class="${btn} bg-indigo-600 hover:bg-indigo-700 text-white" title="Save for today"><i class="fa-solid fa-floppy-disk"></i></button>
                                    <button id="note-reset-btn" onclick="resetExtractedNote()" class="${btn} bg-white hover:bg-rose-50 text-rose-600 border border-rose-200" title="Reset note"><i class="fa-solid fa-rotate-left"></i></button>
                                    <button onclick="copyExtractedNote()" class="${btn} bg-slate-800 hover:bg-slate-900 text-white" title="Copy note"><i class="fa-solid fa-copy"></i></button>
                                    <button id="note-close-btn" onclick="closeNoteExtract()" class="${btn} bg-slate-100 hover:bg-slate-200 text-slate-700" title="Close"><i class="fa-solid fa-xmark"></i></button>
                                </div>
                            </div>
                        </div>
                        <div id="note-extract" contenteditable="true" spellcheck="false" class="note-doc flex-1 overflow-y-auto px-4 sm:px-6 py-4 text-[calc(14px*var(--ts,1))] leading-relaxed text-slate-900 focus:outline-none">${body}</div>
                    </div>
                </div>`;
            noteInitModel(saved);
            updateNoteFields();
            showNoteSavedInfo(saved);
            const box = document.getElementById('note-extract');
            box.addEventListener('input', (e) => {
                if (!e.isComposing) noteSync();
                updateNoteFields();
                setNoteDirty(true);
            });
            box.addEventListener('compositionend', () => setTimeout(() => { noteSync(); updateNoteFields(); }, 0));
            // Start on the first green field (on a keyboard device; phones would pop the keyboard up straight away)
            if (!saved && window.matchMedia && window.matchMedia('(pointer: fine)').matches) goToNoteField(1, true);
        }
        function showNoteSavedInfo(saved) {
            const el = document.getElementById('note-saved-info');
            if (!el) return;
            if (!saved) { el.textContent = ''; return; }
            const d = new Date(saved.at || Date.now());
            el.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Saved note for ${esc(fmtDate(keyDate(noteExtractKey)))} · ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}${noteDirty ? ' · <span class="text-amber-600">unsaved changes</span>' : ''} <span class="font-normal text-slate-400">(Reset note rebuilds it from the latest entry)</span>`;
        }
        function setNoteDirty(v) {
            noteDirty = v; noteCloseArmed = false;
            const c = document.getElementById('note-close-btn'); if (c) c.classList.remove('bg-amber-400', 'text-amber-950');
            const b = document.getElementById('note-save-btn');
            if (b) b.classList.toggle('ring-2', v), b.classList.toggle('ring-indigo-300', v);
            if (v) { const info = document.getElementById('note-saved-info'); if (info && info.textContent && !info.textContent.includes('unsaved')) info.insertAdjacentHTML('beforeend', ' · <span class="text-amber-600">unsaved changes</span>'); }
        }
        // Save for today: keeps this note (with your edits) on this patient's entry for this day only.
        function saveNoteForToday() {
            const box = document.getElementById('note-extract');
            if (!box || !noteExtractFor) return;
            const allPatients = Store.getPatients();
            const note = dayNoteFor(allPatients, noteExtractFor, noteExtractKey);
            if (!note) return;
            noteSync();
            note.savedNote = { html: box.innerHTML, model: packNoteModel(noteModel), at: Date.now() };
            Store.savePatients(allPatients);
            noteDirty = false;
            setNoteDirty(false);
            showNoteSavedInfo(note.savedNote);
            showToast('Note saved for ' + fmtDate(keyDate(noteExtractKey)));
        }
        // Reset note: drops every edit (and the saved copy) and rebuilds the note from the entry. Tap twice.
        function resetExtractedNote() {
            const b = document.getElementById('note-reset-btn');
            if (!noteResetArmed) {
                noteResetArmed = true;
                if (b) { b.classList.add('bg-rose-600', 'text-white'); b.classList.remove('text-rose-600'); }
                showToast('Tap reset again to clear all edits');
                setTimeout(() => { if (noteResetArmed && b && b.isConnected) { noteResetArmed = false; b.classList.remove('bg-rose-600', 'text-white'); b.classList.add('text-rose-600'); } }, 3000);
                return;
            }
            noteResetArmed = false;
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === noteExtractFor);
            const n = p && getDayNote(p, noteExtractKey);
            if (n && n.savedNote) { delete n.savedNote; Store.savePatients(allPatients); }
            openNoteExtract(noteExtractFor);
            showToast('Note reset');
        }
        function closeNoteExtract() {
            if (noteDirty && !noteCloseArmed) {
                noteCloseArmed = true;
                const c = document.getElementById('note-close-btn');
                if (c) c.classList.add('bg-amber-400', 'text-amber-950');
                showToast('Unsaved changes · tap ✕ again to close without saving');
                setTimeout(() => { noteCloseArmed = false; if (c && c.isConnected) c.classList.remove('bg-amber-400', 'text-amber-950'); }, 3000);
                return;
            }
            noteExtractFor = null; noteDirty = false;
            closeModal();
        }

        /* Your additions show in amber.
           The note keeps a model of its text where every character knows where it came from:
           the form (plain / bold), a placeholder (green until it's replaced), or you (amber).
           After each edit the new text is compared with the last one (anchored at the cursor),
           so only what really changed becomes "yours" - whatever the keyboard does behind the scenes
           (phone keyboards often delete and retype whole words). The page is then redrawn from the model. */
        const NK = { F: -1, B: -2, U: -3, NL: -4 };
        const NOTE_BASE_STYLE = 'white-space: pre-wrap; min-height: 1.4em; tab-size: 12';
        let noteModel = null;
        // Reads the note's text (lines joined by \n) and the cursor position; with collect=true also
        // works out where each character came from (used to build the model from the page).
        function readNote(box, collect = false) {
            const sel = window.getSelection();
            const an = sel.rangeCount ? sel.anchorNode : null, ao = sel.anchorOffset;
            const collapsed = !!(sel.rangeCount && sel.isCollapsed && an && box.contains(an));

            const day = getOrCreateDay(records, currentViewDate);
            const wasListed = day.inpatientIds.includes(patientId);
            const created = !((p.dayInfo || {})[iKey] || (p.days || {})[iKey]);
            const srcInfo = getDayInfo(p, cKey);
            mergeEntry(p, cKey, iKey);
            const inf = p.dayInfo[iKey];
            const tag = tocTagName();
            if (created) { inf.tags = [tag]; tocConvert(p, iKey, '', srcInfo.physician); }
            else { if (!(inf.tags || []).includes(tag)) inf.tags = [...(inf.tags || []), tag]; if (p.days[iKey]) tocConvert(p, iKey, inf.physician, srcInfo.physician); }
            if (!wasListed) day.inpatientIds.push(patientId);
            const rec = { to: 'toc', at: Date.now(), prevGoc: null, skipTomorrow: true, removedTomorrow: null, postDc: null, toc: { date: currentViewDate, wasListed, created } };
            const tomorrow = addDays(currentViewDate, 1), tday = records[tomorrow];
            if (tday && (tday.consultIds || []).includes(patientId)) { tday.consultIds = tday.consultIds.filter(id => id !== patientId); rec.removedTomorrow = { date: tomorrow, listKey: 'consultIds' }; }
            const note = p.days[cKey] || (p.days[cKey] = emptyNote());
            note.discharge = rec;
            Store.savePatients(allPatients);
            Store.saveDailyRecords(records);
            renderApp();
            showToast(`${p.name}: transfer of care · added to today's inpatient list`);
        }
        function reverseDischarge(patientId) {
            const cur = getDayNote(Store.getPatients().find(x => x.id === patientId) || {}, curKey());
            const isSign = !!(cur && cur.discharge && (cur.discharge.to === 'signoff' || cur.discharge.to === 'toc'));
            const isToc = !!(cur && cur.discharge && cur.discharge.to === 'toc');
            showConfirm({
                title: isToc ? 'Reverse transfer of care?' : isSign ? 'Reverse sign-off?' : 'Reverse discharge?',
                messageHtml: isToc ? 'Patient will be removed from inpatient list.'
                    : isSign ? 'Tomorrow\'s list and the Post D/C follow-up go back to how they were.' : 'Goals of care, tomorrow\'s list and the Post D/C follow-up go back to how they were.',

                onConfirm: () => {
                    const allPatients = Store.getPatients();
                    const note = dayNoteFor(allPatients, patientId);
                    const rec = note && note.discharge;
                    if (!rec) return;
                    const info = infoFor(allPatients, patientId);
                    if (rec.to === 'expired' && rec.prevGoc !== null) info.goalsOfCare = rec.prevGoc;
                    const records = Store.getDailyRecords();
                    if (rec.removedTomorrow) {
                        const day = getOrCreateDay(records, rec.removedTomorrow.date);
                        const lk = rec.removedTomorrow.listKey;
                        if (!day[lk].includes(patientId)) day[lk].push(patientId);
                    }
                    if (rec.toc) {
                        const p2 = allPatients.find(x => x.id === patientId), iKey = entryKey(rec.toc.date, 'inpatient');
                        if (!rec.toc.wasListed && records[rec.toc.date]) records[rec.toc.date].inpatientIds = (records[rec.toc.date].inpatientIds || []).filter(id => id !== patientId);
                        if (rec.toc.created) { if (p2.dayInfo) delete p2.dayInfo[iKey]; if (p2.days) delete p2.days[iKey]; if (p2.labs) delete p2.labs[iKey]; }
                        else if (p2.dayInfo && p2.dayInfo[iKey]) p2.dayInfo[iKey].tags = (p2.dayInfo[iKey].tags || []).filter(t => t !== tocTagName());
                    }

                        records[rec.postDc.date].postDc = (records[rec.postDc.date].postDc || []).filter(x => x.id !== rec.postDc.id);
                    }
                    delete note.discharge;
                    Store.saveDailyRecords(records);
                    Store.savePatients(allPatients);
                    renderApp();
                    showToast(isToc ? 'Transfer of care reversed' : isSign ? 'Sign-off reversed' : 'Discharge reversed');
                }
            });

            'bone.ca': ['calcium'], 'bone.phos': ['phosphate', 'phosphorus', 'po4'], 'bone.mg': ['magnesium'],
            'bone.vitd': ['vitamin d', 'vit d', '25ohd', '25 oh d'], 'bone.alp': ['alkaline phosphatase', 'alk phos'],
            'liver.bili': ['bilirubin', 'tbili', 'tbil', 'total bilirubin', 'bili'], 'iron.fe': ['iron', 'serum iron'],
            'iron.tsat': ['tsat', 'transferrin saturation'], 'iron.ferritin': ['ferritin'],
            'bone.pth': ['parathyroid hormone', 'ipth', 'intact pth'], 'bone.pthrp': ['pthrp', 'pth rp', 'pth related peptide'],
            'endocrine.a1c': ['hba1c', 'a1c', 'glycated hemoglobin'], 'endocrine.ft4': ['ft4', 'free t4', 'free thyroxine'], 'endocrine.cortisol': ['cortisol', 'am cortisol']
        };
        function normLab(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
        // Returns { range(sex), unit, from } for a typed lab name that matches a lab in any set, or null.
        function recognizeLab(name) {
            const n = normLab(name);
            if (!n) return null;
            for (const type of TABLE_TYPES) {
                const rows = [...currentSetRows(type), ...defaultSetRows(type)];
                for (const r of rows) {
                    if (r.calc || r.kind === 'text') continue;
                    const key = labKey(type, r.k);
                    const names = [r.label, ...(r.own ? [] : (LAB_ALIASES[key] || []))].map(normLab);
                    if (names.includes(n)) return { range: (sex) => setRowRange(type, r, sex), unit: r.unit || '', from: INV_TYPES[type].title };
                }
            }
            for (const cs of customSets()) {
                const r = (cs.rows || []).find(x => normLab(x.label) === n);
                if (r) return { range: () => ownRange(r), unit: r.unit || '', from: cs.title };
            }
            return null;
        }

        function invId() { return 'inv_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
        function labKey(type, rowKey) { return `${type}.${rowKey}`; }
        function customLabKey(name) { return 'labs.' + String(name || '').trim().toLowerCase(); }
        function labValue(p, date, key) { return ((p.labs || {})[date] || {})[key]; }
        function fmtMD(dateStr) { const m = String(dateStr).match(/^\d{4}-(\d{2})-(\d{2})/); return m ? `${m[2]}/${m[1]}` : dateStr; } // DD/MM

        function num(v) {
            const n = parseFloat(String(v ?? '').replace(',', '.'));
            return isNaN(n) ? null : n;
        }
        // Calculated rows: MAP = (SBP + 2 x DBP) / 3, Balance = Intake - Output.
        function calcValue(p, date, calc) {
            if (calc === 'map') {
                const s = num(labValue(p, date, 'vitals.sbp')), d = num(labValue(p, date, 'vitals.dbp'));
                return (s !== null && d !== null) ? String(Math.round((s + 2 * d) / 3)) : '';
            }
            if (calc === 'bal') {
                const i = num(labValue(p, date, 'io.in')), o = num(labValue(p, date, 'io.out'));
                if (i === null && o === null) return '';
                const b = (i || 0) - (o || 0);
                return (b > 0 ? '+' : '') + String(Math.round(b));
            }
            return '';
        }

        /* ----- Photos: stored once per patient ----- */

        function imageSrc(p, panel) {
            return panel.image || ((p.images || {})[panel.imageId]) || '';
        }
        // Moves any photo saved inside a card (older version) into the patient's shared photo store.
        function normalizeImages(p) {
            Object.values(p.days || {}).forEach(n => (n.investigations || []).forEach(panel => {
                if (panel.type === 'image' && panel.image) {
                    if (!p.images) p.images = {};
                    const id = 'img_' + invId();
                    p.images[id] = panel.image;
                    panel.imageId = id;
                    delete panel.image;
                }
            }));
        }
        // Deletes photos no longer used by any day.
        function gcImages(p) {
            if (!p.images) return;
            const used = new Set();
            Object.values(p.days || {}).forEach(n => (n.investigations || []).forEach(panel => { if (panel.imageId) used.add(panel.imageId); }));
            Object.keys(p.images).forEach(id => { if (!used.has(id)) delete p.images[id]; });
        }

        // Add All to Tomorrow / Copy from previous: every card comes along, including free text and photos.
        // Cards already copied before are not added twice; trend tables merge their rows.
        function mergeInvestigationPanels(srcPanels, dstPanels) {
            // A new card keeps the layout of the card it came from (column, width, open/closed)
            // and its own list of rows, so the next day looks the same.
            const layoutOf = (sp, i) => {
                const o = { col: (sp.col !== undefined && sp.col !== null) ? sp.col : i % 3 };
                if (sp.span) o.span = sp.span;
                if (sp.collapsed) o.collapsed = true;
                if (sp.noteOff) o.noteOff = true;
                return o;
            };
            const sameSet = (a, b) => a.type === b.type && (a.type !== 'custom' || a.setId === b.setId);
            (srcPanels || []).forEach((sp, i) => {
                if (REC_TYPES.includes(sp.type)) {
                    // Entries live on the patient, so only the card (and its place) comes along.
                    if (!dstPanels.some(x => x.type === sp.type)) dstPanels.push({ id: invId(), type: sp.type, ...layoutOf(sp, i) });
                    return;
                }
                if (sp.type === 'text' || sp.type === 'image') {
                    const origin = sp.originId || sp.id;
                    if (dstPanels.some(x => (x.originId || x.id) === origin)) return;
                    const copy = clone(sp);
                    copy.id = invId();
                    copy.originId = origin;
                    dstPanels.push(copy);
                    return;
                }
                const ex = dstPanels.find(x => sameSet(x, sp));
                if (!ex) {
                    const copy = clone(sp);
                    copy.id = invId();
                    Object.assign(copy, layoutOf(sp, i));
                    dstPanels.push(copy);
                } else if (sp.type === 'labs') {
                    ex.rows = ex.rows || [];
                    (sp.rows || []).forEach(r => { if (!ex.rows.some(x => x.toLowerCase() === r.toLowerCase())) ex.rows.push(r); });
                }
            });
        }

        function toggleInvBox() {
            invBoxCollapsed = !invBoxCollapsed;
            noteViewChoice('inv', !invBoxCollapsed);
            renderApp();
        }
        function toggleInvPanel(patientId, panelId) {
            const allPatients = Store.getPatients();
            const { panel } = findPanel(allPatients, patientId, panelId);
            if (!panel) return;
            panel.collapsed = !panel.collapsed;
            noteViewChoice('card:' + panelId, !panel.collapsed);
            Store.savePatients(allPatients);
            renderApp();
        }

        function renderInvestigationsBox(p, note, pid) {
            const panels = note.investigations || [];
            return `
                <div class="size-scale bg-white p-2.5 sm:p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex items-center justify-between ${invBoxCollapsed ? '' : 'mb-2 sm:mb-3'}">
                        <button onclick="toggleInvBox()" class="flex items-center gap-2 font-bold text-slate-900 text-[calc(14px*var(--ts,1))] sm:text-[calc(17px*var(--ts,1))]">
                            <i class="fa-solid fa-microscope text-cyan-600"></i> Investigations
                            <span class="text-[calc(11px*var(--ts,1))] text-slate-400 font-semibold">(${panels.length})</span>
                            <i class="fa-solid fa-chevron-${invBoxCollapsed ? 'down' : 'up'} text-xs text-slate-400"></i>

                                const anyOpen = panels.some(x => !x.collapsed);
                                return `<button onclick="setAllInvCollapsed(${pid}, ${anyOpen})" class="px-2.5 py-1 sm:py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg sm:rounded-xl text-xs font-semibold transition flex items-center gap-1.5" title="${anyOpen ? 'Collapse all cards' : 'Expand all cards'}">
                                    <i class="fa-solid fa-${anyOpen ? 'down-left-and-up-right-to-center' : 'up-right-and-down-left-from-center'}"></i><span class="hidden sm:inline">${anyOpen ? 'Collapse all' : 'Expand all'}</span></button>`;
                            })() : ''}

        // 3 columns on wide landscape screens, 2 on tablets / portrait, 1 on phones.
        // (Uses the screen's orientation, so an on-screen keyboard doesn't reshuffle the cards.)
        function invColumnCount() {
            const w = window.innerWidth;
            if (w < 640) return 1;
            let landscape = w > window.innerHeight;
            try { if (screen.orientation && screen.orientation.type) landscape = screen.orientation.type.startsWith('landscape'); } catch (e) {}
            return (w >= 1100 && landscape) ? 3 : 2;
        }
        let lastInvCols = null;
        window.addEventListener('resize', () => {
            const n = invColumnCount();
            if (!dragState) layoutInvestigations();
            if (lastInvCols !== null && n !== lastInvCols && currentRoute === 'patient_file' && !dragState) {
                lastInvCols = n;
                const a = document.activeElement;
                if (!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'))) renderApp();
            }
            lastInvCols = n;
        });

        /* ----- Investigations board: each card has a column (0–2) and a place in that column. -----
           Cards are stacked per column (no gaps caused by other columns). A 2-wide card sits across
           its column and the next one, below whatever is above it in both. On 2-column screens the
           third column folds into the second; on phones everything is one column. */
        const INV_GAP = 12;
        function invPanelSpan(panel) {
            const s = panel.span || (panel.type === 'cultures' ? 2 : 1);
            return Math.min(s, invColumnCount());
        }
        function invPanelCol(panel, index) {
            const n = invColumnCount();
            const c = (panel.col !== undefined && panel.col !== null) ? panel.col : index % 3;
            return Math.max(0, Math.min(c, n - invPanelSpan(panel)));
        }
        function layoutInvestigations() {
            document.querySelectorAll('.inv-board').forEach(board => {
                const n = invColumnCount();
                const W = board.clientWidth;
                const colW = (W - INV_GAP * (n - 1)) / n;
                const heights = new Array(n).fill(0);
                board.querySelectorAll(':scope > .inv-card').forEach(card => {
                    const span = Math.min(+card.dataset.span || 1, n);
                    const col = Math.min(+card.dataset.col || 0, n - span);
                    const w = (colW * span + INV_GAP * (span - 1)) + 'px';
                    if (card.style.width !== w) {
                        card.style.width = w;
                        // text boxes were sized before the card got its width: size them again
                        card.querySelectorAll('textarea.cult-input, textarea.auto-grow').forEach(fitTextarea);
                    }
                    card.style.left = (col * (colW + INV_GAP)) + 'px';
                    const top = Math.max(...heights.slice(col, col + span));
                    card.style.top = top + 'px';
                    const h = card.offsetHeight;
                    for (let c = col; c < col + span; c++) heights[c] = top + h + INV_GAP;
                });
                board.style.height = Math.max(0, Math.max(...heights) - INV_GAP) + 'px';
            });
            if (typeof inkLayoutSoon === 'function') inkLayoutSoon();
        }
        // Re-arrange the board whenever a card changes height after drawing (fonts / icons loading,
        // a box growing while you type, a photo loading...), so cards never overlap.
        let invResizeObs = null, invRelayoutQueued = false;
        function watchInvCards() {
            if (!window.ResizeObserver) return;
            if (!invResizeObs) {
                invResizeObs = new ResizeObserver(() => {
                    if (invRelayoutQueued || dragState) return;
                    invRelayoutQueued = true;
                    requestAnimationFrame(() => { invRelayoutQueued = false; layoutInvestigations(); });
                });
            }
            invResizeObs.disconnect();
            document.querySelectorAll('.inv-board > .inv-card').forEach(c => invResizeObs.observe(c));
        }
        try { document.fonts && document.fonts.ready.then(() => layoutInvestigations()); } catch (e) {}

        function setAllInvCollapsed(patientId, collapse) {
            const allPatients = Store.getPatients();
            const note = dayNoteFor(allPatients, patientId);
            (note.investigations || []).forEach(x => { x.collapsed = collapse; noteViewChoice('card:' + x.id, !collapse); });
            Store.savePatients(allPatients);
            renderApp();
        }
        function toggleInvSpan(patientId, panelId) {
            const allPatients = Store.getPatients();
            const { note, panel } = findPanel(allPatients, patientId, panelId);
            if (!panel) return;
            panel.span = invPanelSpan(panel) === 2 ? 1 : 2;
            // keep it inside the board
            const i = note.investigations.indexOf(panel);
            panel.col = Math.min(invPanelCol(panel, i), 3 - panel.span);
            Store.savePatients(allPatients);
            renderApp();
        }
        // Moves a card to column `col`, just before card `beforeId` (or to the bottom of that column).
        function moveInvPanel(patientId, panelId, col, beforeId) {
            const allPatients = Store.getPatients();
            const note = dayNoteFor(allPatients, patientId);
            const list = note.investigations || [];
            // Give every card a fixed column first, so moving one doesn't shift the others.
            list.forEach((x, i) => { if (x.col === undefined || x.col === null) x.col = i % 3; });
            const from = list.findIndex(x => x.id === panelId);
            if (from < 0) return;
            const [panel] = list.splice(from, 1);
            panel.col = Math.max(0, Math.min(col, 3 - invPanelSpan(panel)));
            let at = beforeId ? list.findIndex(x => x.id === beforeId) : -1;
            if (at < 0) {
                // bottom of the column: after the last card that occupies that column
                at = list.length;
                for (let i = list.length - 1; i >= 0; i--) {
                    const x = list[i], xs = invPanelSpan(x), xc = x.col;
                    if (col >= xc && col < xc + xs) { at = i + 1; break; }
                }
            }
            list.splice(at, 0, panel);
            Store.savePatients(allPatients);
            renderApp();
        }

        function renderInvPanel(p, panel, pid, index) {
            const def = panel.type === 'custom'

                    ${panel.type === 'text' && invColumnCount() > 1 ? `<button onclick="toggleInvSpan(${pid}, ${panelId})" class="text-slate-400 hover:text-slate-700 px-1 shrink-0 text-[calc(11px*var(--ts,1))] font-bold" title="${invPanelSpan(panel) === 2 ? 'Make 1 column wide' : 'Make 2 columns wide'}"><i class="fa-solid fa-${invPanelSpan(panel) === 2 ? 'compress' : 'arrows-left-right'}"></i></button>` : ''}
                    ${panel.type === 'image' ? '' : (() => { const on = !panel.noteOff; return `<button onclick="toggleInvNote(${pid}, ${panelId})" class="w-7 h-6 shrink-0 rounded-md border flex items-center justify-center text-[calc(11px*var(--ts,1))] transition" style="${on ? `background-color: ${th.icon}; border-color: ${th.icon}; color: #fff` : 'background-color: #fff; border-color: #cbd5e1; color: #cbd5e1'}" title="${on ? 'Included in Extract Note (tap to leave out)' : 'Left out of Extract Note (tap to include)'}"><i class="fa-solid fa-note-sticky"></i></button>`; })()}

                    ${gripHandle('rounded-r-lg', { bg: th.head, fg: th.icon })}

                </div>`;
            const titleInput = (placeholder) => `
                <span class="flex items-center gap-1.5 min-w-0 flex-1">
                    <input type="text" value="${esc(panel.title || '')}" oninput="updateInvPanelField(${pid}, ${panelId}, 'title', this.value)" class="bg-transparent font-bold text-sm border-b border-dashed focus:outline-none min-w-0 w-full" style="color: ${th.text}; border-color: ${th.border}" placeholder="${placeholder}">
                    <i class="fa-solid fa-pen text-[calc(10px*var(--ts,1))] opacity-50"></i>
                </span>`;

            if (panel.type === 'text') {
                return wrap(`
                    ${header(titleInput('Title'))}
                    <div class="${collapsed ? 'hidden' : ''}">
                        <textarea oninput="updateInvPanelField(${pid}, ${panelId}, 'text', this.value)" onmouseup="layoutInvestigations()" ontouchend="layoutInvestigations()" rows="4" class="w-full p-3 text-sm text-slate-800 focus:outline-none resize-y" placeholder="Write here...">${esc(panel.text || '')}</textarea>
                    </div>

            }
            if (REC_TYPES.includes(panel.type)) {
                const type = panel.type;
                const rows = sortedRecs(p, type);
                const phone = invColumnCount() === 1;
                const rid = (r) => jsArg(r.id);
                const upd = (r, field, rerender = false) => `updateRecField(${pid}, '${type}', ${rid(r)}, '${field}', this.value${rerender ? ', true' : ''})`;
                // A negative culture (status like "no growth", "-ve", "flora") greys out bug / sensitive / resistant.
                const neg = (r) => type === 'cultures' && isNegativeStatus(r.status);
                const area = (r, field, ph, extra = '') => {

                    return `<textarea rows="1" ${dis ? `data-neg-off ${neg(r) ? 'disabled' : ''}` : ''} oninput="autoGrow(this); ${upd(r, field)};${statusHook}" class="cult-input disabled:bg-slate-100 disabled:text-slate-400 disabled:border-slate-200 disabled:cursor-not-allowed w-full min-w-0 resize-none bg-white border rounded-md px-1.5 py-1 text-[calc(11px*var(--ts,1))] font-semibold text-slate-800 focus:outline-none focus:ring-2 ${extra}" style="border-color: ${th.input}" placeholder="${ph}">${esc(r[field] || '')}</textarea>`;

                const srcBox = (r, field) => `<input type="text" list="rec-sources" value="${esc(r[field] || '')}" oninput="paintSource(this, '${th.input}'); ${upd(r, field)}" class="w-full min-w-0 border rounded-md px-1.5 py-1 text-[calc(11px*var(--ts,1))] font-bold focus:outline-none focus:ring-2" style="${sourceStyle(r[field], th.input)}" placeholder="Source" title="Type or pick a source">`;
                const dateBox = (r) => dateField(r.date || '', `updateRecField(${pid}, '${type}', ${rid(r)}, 'date', this.value, true)`, { cls: 'compact-date w-full bg-white border rounded-md px-1 py-1 text-[calc(11px*var(--ts,1))] font-semibold text-slate-800', placeholder: 'Date' });
                const C = {
                    source: `<i class="fa-solid fa-vial"></i>`,
