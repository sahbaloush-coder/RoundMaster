        /* =========================================================
           EXTRACT NOTE
           Builds the note from your Word form (inpatient and consult versions):
           black text = kept as written, blue = filled in from the entry, red = instructions (left out),
           green = fields you fill in each time (highlighted, editable, not saved).
           Lines are { parts: [{ t, ph }], b, u, i, center }; an empty parts list is a blank line.
           ========================================================= */
        const NT = (t) => ({ t: String(t ?? '') });
        const NB = (t) => ({ t: String(t ?? ''), b: true }); // bold words inside a line
        const NPH = (t) => ({ t, ph: true });
        const NL = (parts = [], fmt = {}) => ({ parts: Array.isArray(parts) ? parts : [parts], ...fmt });
        const NBLANK = () => NL([]);
        const NTEXT = (t, fmt) => NL([NT(t)], fmt);
        function withDot(t) {
            const s = String(t || '').trim();
            return s && !/[.!?:;]$/.test(s) ? s + '.' : s;
        }
        // Multi-line text becomes several lines.
        function textLines(t, fmt) {
            return String(t || '').split(/\r?\n/).map(x => x.trimEnd()).filter((x, i, a) => x || (i > 0 && i < a.length - 1)).map(x => x ? NTEXT(x, fmt) : NBLANK());
        }

        // Rows of a table card as shown (removed components left out): label, value key, calculated?
        function extractRows(panel) {
            if (panel.type === 'labs') return (panel.rows || []).map(name => ({ label: name, key: customLabKey(name) }));
            const valueType = panel.type === 'ulytes' && panel.mode === '24h' ? 'ulytes24' : panel.type;
            return panelSetRows(panel).map(r => ({
                label: r.label, unit: r.unit || '', calc: r.calc || null,
                key: panel.type === 'custom' ? `${panel.setId}.${r.k}` : labKey(valueType, r.k)
            }));
        }
        function extractValue(raw, key, row) {
            if (row.calc) return calcValue(raw, key, row.calc);
            const v = labValue(raw, key, row.key);
            return v === undefined || v === null ? '' : String(v).trim();
        }

        const COL = '\t\t'; // two tab spaces between columns of data
        // A table card as lines: card name (with today's and the day before's dates), then "label<tab>today<tab>day before".
        // noDash (Vitals, I/O): an empty value is left blank instead of "—", and the day-before column
        // is only shown when something was recorded that day.
        function tableCardLines(raw, panel, title, date, type, headFmt, noDash = false) {
            const key = entryKey(date, type), prevKey = entryKey(addDays(date, -1), type);
            const rows = extractRows(panel)
                .map(r => ({ r, now: extractValue(raw, key, r), prev: extractValue(raw, prevKey, r) }))
                .filter(x => x.now || x.prev);
            if (!rows.length) return [];
            const unit = (r) => r.unit ? (/^[%°]/.test(r.unit) ? '' : ' ') + r.unit : '';
            const empty = noDash ? '' : '—';
            const showPrev = !noDash || rows.some(x => x.prev);
            const line = (cells) => { const c = [...cells]; if (noDash) while (c.length > 1 && !c[c.length - 1]) c.pop(); return c.join(COL); };
            return [
                headFmt(line([title, `[${fmtMD(date)}]`, ...(showPrev ? [`[${fmtMD(addDays(date, -1))}]`] : [])])),
                ...rows.map(({ r, now, prev }) => NTEXT(line([r.label, now ? now + unit(r) : empty, ...(showPrev ? [prev ? prev + unit(r) : empty] : [])])))
            ];
        }
        // [1] Clinical: "• Vitals" and "• I/O" blocks, only for cards on this entry. No units.
        //   Vitals: today and the day before (if recorded); BP as SBP/DBP(MAP); oxygen as "SpO2% on <supp O2>".
        //   I/O: "Intake⇥⇥Output⇥⇥Balance" header, then today's values.
        function extractClinical(raw, note, date, type) {
            const key = entryKey(date, type), prevKey = entryKey(addDays(date, -1), type);
            const blocks = [];
            const cards = note.investigations || [];
            const vit = cards.find(x => x.type === 'vitals');
            if (vit) {
                const rows = extractRows(vit);
                const has = (k) => rows.some(r => r.key === 'vitals.' + k);
                const val = (k, kk) => has(k) ? (labValue(raw, kk, 'vitals.' + k) || '').toString().trim() : '';
                const dayVals = (kk) => {
                    const out = {};
                    const sbp = val('sbp', kk), dbp = val('dbp', kk);
                    const map = has('map') ? calcValue(raw, kk, 'map') : '';
                    if (sbp || dbp) out.BP = `${sbp || '?'}/${dbp || '?'}${map ? `(${map})` : ''}`;
                    rows.forEach(r => {
                        const k = r.key.replace('vitals.', '');
                        if (['sbp', 'dbp', 'map', 'spo2', 'fio2'].includes(k)) return;
                        const v = r.calc ? calcValue(raw, kk, r.calc) : (labValue(raw, kk, r.key) || '').toString().trim();
                        if (v) out[r.label] = v;
                    });
                    const spo2 = val('spo2', kk), o2 = val('fio2', kk);
                    if (spo2 || o2) out.SpO2 = `${spo2 ? spo2 + '%' : '?'}${o2 ? ' on ' + o2 : ''}`;
                    return out;
                };
                const now = dayVals(key), prev = dayVals(prevKey);
                const order = ['BP', ...rows.filter(r => !['vitals.sbp', 'vitals.dbp', 'vitals.map', 'vitals.spo2', 'vitals.fio2'].includes(r.key)).map(r => r.label), 'SpO2'];
                const labels = order.filter(l => now[l] || prev[l]);
                if (labels.length) {
                    const showPrev = labels.some(l => prev[l]);
                    const line = (cells) => { const c = [...cells]; while (c.length > 1 && !c[c.length - 1]) c.pop(); return c.join(COL); };
                    blocks.push([
                        NL([NT('• '), NB('Vitals'), NT(COL + `[${fmtMD(date)}]` + (showPrev ? COL + `[${fmtMD(addDays(date, -1))}]` : ''))]),
                        ...labels.map(l => NTEXT(line([l, now[l] || '', ...(showPrev ? [prev[l] || ''] : [])])))
                    ]);
                }
            }
            const io = cards.find(x => x.type === 'io');
            if (io) {
                const vals = extractRows(io).map(r => ({ label: r.label, v: extractValue(raw, key, r) }));
                if (vals.some(x => x.v)) {
                    blocks.push([
                        NL([NT('• '), NB('I/O')]),
                        NTEXT(vals.map(x => x.label).join(COL), { b: true, u: true }),
                        NTEXT(vals.map(x => x.v || '').join(COL))
                    ]);
                }
            }
            return blocks;
        }

        function extractInvestigations(raw, note, date, type) {
            const key = entryKey(date, type), prevKey = entryKey(addDays(date, -1), type);
            const blocks = [];
            (note.investigations || []).forEach(panel => {
                if (panel.type === 'vitals' || panel.type === 'io' || panel.type === 'image') return; // vitals and I/O are under [1] Clinical
                const def = panel.type === 'custom'
                    ? { title: panel.title || (customSet(panel.setId) || {}).title || 'Lab set' }
                    : (INV_TYPES[panel.type] || { title: panel.type });
                const lines = [];
                const head = (name) => NL([NT('• '), NB(name)]);
                if (panel.type === 'text') {
                    if ((panel.text || '').trim()) {
                        lines.push(head((panel.title || '').trim() || 'Note'));
                        lines.push(...textLines(panel.text));
                    }
                } else if (panel.type === 'cultures') {
                    const pos = sortedRecs(raw, 'cultures').filter(r => (r.organism || '').trim() && !isNegativeStatus(r.status));
                    if (pos.length) {
                        lines.push(head('Cultures'));
                        // Source [Date]⇥⇥bug: status
                        pos.forEach(r => lines.push(NTEXT(`${[(r.culture || '').trim(), r.date ? `[${fmtDate(r.date)}]` : ''].filter(Boolean).join(' ')}${COL}${(r.organism || '').trim()}${(r.status || '').trim() ? ': ' + r.status.trim() : ''}`)));
                    }
                } else if (panel.type === 'pcr') {
                    const recs = sortedRecs(raw, 'pcr').filter(recHasContent);
                    if (recs.length) {
                        lines.push(head('PCR'));
                        // Source [Date]⇥⇥bug: Positive / Negative
                        recs.forEach(r => {
                            const res = r.result === 'pos' ? 'Positive' : r.result === 'neg' ? 'Negative' : '';
                            lines.push(NTEXT(`${[(r.source || '').trim(), r.date ? `[${fmtDate(r.date)}]` : ''].filter(Boolean).join(' ')}${COL}${[(r.bug || '').trim(), res].filter(Boolean).join(': ')}`));
                        });
                    }
                } else if (panel.type === 'ua') {
                    const recs = sortedRecs(raw, 'ua').filter(recHasContent);
                    if (recs.length) {
                        lines.push(head('Urinalysis'));
                        recs.forEach(r => {
                            const pos = UA_FLAGS.filter(([k]) => (r.flags || {})[k]).map(([, l]) => l);
                            // POC/Lab [Date] ⇥⇥Positive for: …
                            const kind = r.kind === 'poc' ? 'POC' : r.kind === 'lab' ? 'Lab' : '';
                            const uaHead = [kind, r.date ? `[${fmtDate(r.date)}]` : ''].filter(Boolean).join(' ') || 'Urinalysis';
                            lines.push(NTEXT(`${uaHead} ${COL}${pos.length ? 'Positive for: ' + pos.join(', ') : 'Negative'}`));
                        });
                    }
                } else {
                    const title = def.title + (panel.type === 'ulytes' ? (panel.mode === '24h' ? ' (24 hr)' : ' (Spot)') : '');
                    lines.push(...tableCardLines(raw, panel, title, date, type, (txt) => { const i = txt.indexOf(COL); return NL([NT('• '), NB(txt.slice(0, i)), NT(txt.slice(i))]); }));
                }
                if (lines.length) blocks.push(lines);
            });
            const out = [];
            blocks.forEach((b, i) => { if (i) out.push(NBLANK()); out.push(...b); });
            return out;
        }

        function issueLines(issue, n, dots = true) {
            const lines = [NL([NB(`[${n}] `), NB((issue.issue || '').trim() || 'Untitled')])];
            (issue.treatments || []).filter(t => (t.text || '').trim()).forEach(t => lines.push(NTEXT('• ' + (dots ? withDot(t.text) : t.text.trim()))));
            return lines;
        }

        function buildNoteLines(patientId) {
            const raw = Store.getPatients().find(x => x.id === patientId);
            if (!raw) return [];
            const type = currentEntryType, date = currentViewDate, key = curKey();
            const p = effectivePatient(raw, key);
            const note = getDayNote(raw, key) || emptyNote();
            const H = { b: true, u: true };
            const L = [];
            const blank = (n = 1) => { for (let i = 0; i < n; i++) L.push(NBLANK()); };
            const ageRaw = ageText(p, date) || '';
            const age = ageRaw.replace(/^(\d+)\s*YO$/i, '$1-year-old');
            const gender = p.gender === 'F' ? 'female' : p.gender === 'M' ? 'male' : '';
            const mbList = (p.medicalBackground || []).filter(m => (m.condition || '').trim() || (m.treatment || '').trim());
            const mbText = (m) => {
                const cond = (m.condition || '').trim(), trt = (m.treatment || '').trim();
                return withDot(trt ? cond.replace(/[.;:,]+$/, '') + ': ' + trt : cond);
            };
            const issues = note.activeIssues || [];
            const resolved = note.resolvedIssues || [];
            const st = Store.getSettings();
            const TEAM = () => st.team ? NT(st.team) : NPH('Team');
            const MRP = () => st.mrp ? NT(st.mrp) : NPH('MRP');
            const header = (teamWord) => {
                L.push(NTEXT('________________________'));
                L.push(NTEXT(p.name || ''));
                L.push(NL([TEAM(), NT(teamWord), MRP()], { b: true, u: true, center: true }));
                blank();
                L.push(NTEXT('CASE SUMMARY', H));
                L.push(NL([NT('This is a '), NT(age || '—'), NT(', '), NT(gender || '—'), NT(', patient. Known case of:')]));
            };
            const assessment = () => {
                L.push(NTEXT('ASSESSMENT', H));
                L.push(NTEXT('[1] Clinical', { b: true }));
                // a blank line after each card; cards not on the entry (or empty) are left out with their space
                extractClinical(raw, note, date, type).forEach(b => { L.push(...b); blank(); });
                L.push(NL([NPH('EXAMINATION')]));
                ['• Conscious, oriented and alert. GCS 15/15',
                 '• CVS: S1+S2 with no added sounds. No raised JVP noted',
                 '• Chest: equal breathing bilaterally with no additional sounds.',
                 '• Abdomen: soft and lax. Non tender.',
                 '• LL: no edema or signs of DVT'].forEach(t => L.push(NTEXT(t)));
                blank();
                L.push(NTEXT('[2] Investigations', { b: true }));
                L.push(...extractInvestigations(raw, note, date, type));
            };
            const resolvedSection = (dots, after) => {
                if (!resolved.length) return; // no resolved issues: the whole section is left out
                L.push(NTEXT('RESOLVED ISSUES', H));
                resolved.forEach((ri, i) => { if (i) blank(); L.push(...issueLines(ri, i + 1, dots)); });
                blank(after);
            };
            const bulletLines = (list) => (list || []).filter(x => (x.text || '').trim()).forEach(x => L.push(NTEXT('• ' + withDot(x.text))));

            if (type !== 'consult') {
                header(' Rounds with Dr. ');
                mbList.forEach(m => L.push(NTEXT('• ' + mbText(m))));
                blank();
                const inSummary = String(p.caseSummary || '').trim().replace(/\s*\n+\s*/g, ' ').replace(/[.\s]+$/, '');
                L.push(NL([NT(`Admitted on [${p.admissionDate ? fmtDate(p.admissionDate) : '—'}] as a case of `), inSummary ? NT(inSummary) : NPH('Summary'), NT('.')]));
                blank(2);
                L.push(NTEXT('ACTIVE ISSUES', H));
                issues.forEach((ai, i) => {
                    if (i) blank();
                    L.push(...issueLines(ai, i + 1));
                    L.push(NL([NT('↪ Update: '), NPH('UPDATE')], { i: true }));
                });
                blank();
                resolvedSection(true, 1);
                assessment();
                blank(2);
                L.push(NL([NT('PLAN as discussed with Dr. '), MRP()], H));
                bulletLines(note.plan);
                blank();
                L.push(NTEXT('DISCHARGE PLAN', H));
                bulletLines(note.dcPlan);
            } else {
                header(' Team with Dr. ');
                mbList.forEach(m => L.push(NTEXT('• ' + mbText(m))));
                blank();
                const summary = (p.caseSummary || '').trim();
                L.push(NTEXT(`[${p.admissionDate ? fmtDate(p.admissionDate) : '—'}].${summary ? ' ' + withDot(summary.replace(/\s*\n+\s*/g, ' ')) : ''}`));
                const first = issues[0] ? withDot(issues[0].issue || '') : '';
                L.push(NTEXT(`We were consulted on [${p.consultDate ? fmtDate(p.consultDate) : '—'}] for ${first || '—.'}`));
                blank(2);
                L.push(NTEXT('RELEVANT ISSUES', H));
                issues.forEach((ai, i) => { if (i) blank(); L.push(...issueLines(ai, i + 1)); });
                blank();
                L.push(NTEXT('UPDATES', H));
                L.push(...textLines(note.memo));
                blank();
                resolvedSection(false, 1);
                assessment();
                blank(2);
                L.push(NTEXT('IMPRESSION', H));
                const imp = textLines(note.impression);
                if (imp.length) L.push(...imp); else L.push(NL([NPH('Impression')]));
                blank();
                L.push(NL([NT('RECOMMENDATIONS as discussed with Dr. '), MRP()], H));
                bulletLines(note.plan);
                blank();
                L.push(NTEXT(note.discharge && note.discharge.to === 'signoff' ? 'We will sign off.' : 'We will follow.'));
            }
            return L;
        }

        function noteLinesHtml(lines) {
            return lines.map(l => {
                const style = [
                    'white-space: pre-wrap', 'min-height: 1.4em', 'tab-size: 12',
                    l.b ? 'font-weight: 700' : '', l.u ? 'text-decoration: underline' : '', l.i ? 'font-style: italic' : '',
                    l.center ? 'text-align: center' : ''
                ].filter(Boolean).join('; ');
                const inner = l.parts.length ? l.parts.map(pt => pt.ph
                    ? `<span class="note-ph" data-orig="${esc(pt.t)}">${esc(pt.t)}</span>`
                    : pt.b ? `<b>${esc(pt.t)}</b>` : esc(pt.t)).join('') : '<br>';
                return `<div style="${style}">${inner}</div>`;
            }).join('');
        }

        let noteExtractFor = null;
        function openNoteExtract(patientId) {
            const lines = buildNoteLines(patientId);
            const p = Store.getPatients().find(x => x.id === patientId);
            noteExtractFor = patientId;
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-2 sm:p-4 z-50">
                    <div class="bg-white rounded-3xl w-full max-w-3xl shadow-2xl flex flex-col" style="max-height: 92vh">
                        <div class="flex items-center justify-between gap-3 px-4 sm:px-5 py-3 border-b border-slate-100 flex-wrap">
                            <div>
                                <h3 class="text-base font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-file-lines text-slate-500"></i> Note · ${esc(p ? p.name : '')}</h3>
                                <p class="text-[calc(11px*var(--ts,1))] text-slate-400">Fill in the <span class="note-ph">green</span> fields: tap one, then <b>Tab</b> (or <b>Enter</b> on a phone / tablet) moves to the next. Once all are filled, Tab types a tab space and Enter starts a new line.</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <span id="note-status" class="text-[calc(11px*var(--ts,1))] font-bold px-2 py-1 rounded-lg"></span>
                                <button onclick="copyExtractedNote()" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-sm font-semibold flex items-center gap-2"><i class="fa-solid fa-copy"></i> Copy</button>
                                <button onclick="noteExtractFor = null; closeModal()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm">Close</button>
                            </div>
                        </div>
                        <div id="note-extract" contenteditable="true" spellcheck="false" oninput="updateNoteFields()" class="note-doc flex-1 overflow-y-auto px-4 sm:px-6 py-4 text-[calc(14px*var(--ts,1))] leading-relaxed text-slate-900 focus:outline-none">${noteLinesHtml(lines)}</div>
                    </div>
                </div>`;
            updateNoteFields();
            // Start on the first green field (on a keyboard device; phones would pop the keyboard up straight away)
            if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) goToNoteField(1, true);
        }

        /* Green fields: filled ones turn back to normal black text; the counter shows how many are left. */
        function noteFieldFilled(ph) {
            const t = ph.textContent.trim();
            return !!t && t !== ph.getAttribute('data-orig');
        }
        function updateNoteFields() {
            const box = document.getElementById('note-extract');
            if (!box) return;
            const all = [...box.querySelectorAll('.note-ph')];
            all.forEach(ph => ph.classList.toggle('filled', noteFieldFilled(ph)));
            const left = all.filter(ph => !noteFieldFilled(ph)).length;
            const st = document.getElementById('note-status');
            if (st) {
                st.textContent = left ? `${left} field${left === 1 ? '' : 's'} left` : '✓ Note complete';
                st.className = `text-[calc(11px*var(--ts,1))] font-bold px-2 py-1 rounded-lg ${left ? 'bg-green-100 text-green-800' : 'bg-slate-800 text-white'}`;
            }
        }
        function selectNoteField(ph) {
            const range = document.createRange();
            range.selectNodeContents(ph);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
            ph.scrollIntoView({ block: 'nearest' });
        }
        // Moves to the next (dir 1) or previous (dir -1) green field from the cursor; wraps around.
        function goToNoteField(dir, fromStart = false, unfilledOnly = false) {
            const box = document.getElementById('note-extract');
            if (!box) return;
            const every = [...box.querySelectorAll('.note-ph')];
            const all = unfilledOnly ? every.filter(ph => !noteFieldFilled(ph) || ph === noteFieldAtCaret()) : every;
            if (!all.length) return;
            const sel = window.getSelection();
            let cur = -1;
            if (!fromStart && sel.rangeCount && box.contains(sel.anchorNode)) {
                const node = sel.anchorNode;
                const inPh = (node.nodeType === 1 ? node : node.parentElement).closest('.note-ph');
                if (inPh) cur = all.indexOf(inPh);
                else {
                    // cursor in normal text: the next field is the first one after it
                    const r = sel.getRangeAt(0);
                    const after = all.findIndex(ph => r.comparePoint(ph, 0) >= 0);
                    cur = after === -1 ? all.length - 0.5 : after - 0.5;
                }
            }
            let i = dir > 0 ? Math.floor(cur) + 1 : Math.ceil(cur) - 1;
            if (fromStart) i = 0;
            if (i >= all.length) i = 0;
            if (i < 0) i = all.length - 1;
            box.focus();
            selectNoteField(all[i]);
        }
        // Tab (keyboards) or Enter (phones / tablets) jumps to the next green field while any are left.
        // Once the note is complete both keys work normally again.
        function isTouchDevice() {
            try { return window.matchMedia('(pointer: coarse)').matches; } catch (e) { return false; }
        }
        function noteFieldsLeft() {
            const box = document.getElementById('note-extract');
            return box ? [...box.querySelectorAll('.note-ph')].filter(ph => !noteFieldFilled(ph)).length : 0;
        }
        function noteFieldAtCaret() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return null;
            const n = sel.anchorNode;
            return n ? (n.nodeType === 1 ? n : n.parentElement).closest('#note-extract .note-ph') : null;
        }
        function caretAfter(node) {
            const r = document.createRange();
            if (node.classList && node.classList.contains('note-ph')) {
                // Put the cursor inside plain text after the field, so what you type next isn't added to the field.
                let nxt = node.nextSibling;
                if (!nxt || nxt.nodeType !== 3) { nxt = document.createTextNode('\u200B'); node.after(nxt); }
                r.setStart(nxt, nxt.data.startsWith('\u200B') ? 1 : 0);
            } else {
                r.setStartAfter(node);
            }
            r.collapse(true);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(r);
        }
        function noteJumpKey(e, isShiftTab) {
            updateNoteFields();
            if (noteFieldsLeft() > 0) {
                e.preventDefault();
                goToNoteField(isShiftTab ? -1 : 1, false, !isShiftTab);
                return;
            }
            // Just finished the last field: step out of it once; after that the key works normally.
            const ph = noteFieldAtCaret();
            if (ph) { e.preventDefault(); caretAfter(ph); }
        }
        document.addEventListener('keydown', (e) => {
            if (!e.target.closest || !e.target.closest('#note-extract')) return;
            if (e.key === 'Tab') {
                updateNoteFields();
                if (noteFieldsLeft() > 0) { noteJumpKey(e, e.shiftKey); return; }
                // Note complete: Tab types a tab space in the text (the Tab that finishes the last field just steps out of it).
                e.preventDefault();
                const ph = noteFieldAtCaret();
                if (ph) { caretAfter(ph); return; }
                const sel = window.getSelection();
                if (!sel.rangeCount) return;
                const r = sel.getRangeAt(0);
                r.deleteContents();
                const t = document.createTextNode('\t');
                r.insertNode(t);
                caretAfter(t);
            }
            else if (e.key === 'Enter' && !e.shiftKey && isTouchDevice()) noteJumpKey(e, false);
        });
        // Some phone keyboards don't send a usable Enter key event; catch the new line instead.
        document.addEventListener('beforeinput', (e) => {
            if (e.inputType !== 'insertParagraph' && e.inputType !== 'insertLineBreak') return;
            if (!e.target.closest || !e.target.closest('#note-extract') || !isTouchDevice()) return;
            noteJumpKey(e, false);
        });
        // Tapping a green field that still shows its label selects it, so typing replaces it.
        document.addEventListener('click', (e) => {
            const ph = e.target.closest && e.target.closest('#note-extract .note-ph');
            if (!ph || ph.textContent !== ph.getAttribute('data-orig')) return;
            const range = document.createRange();
            range.selectNodeContents(ph);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        });

        async function copyExtractedNote() {
            const box = document.getElementById('note-extract');
            if (!box) return;
            const unfilled = [...box.querySelectorAll('.note-ph')].filter(x => !noteFieldFilled(x)).length;
            // Copy without the green highlighting.
            const clone = box.cloneNode(true);
            clone.querySelectorAll('.note-ph').forEach(x => x.replaceWith(document.createTextNode(x.textContent)));
            const html = `<div style="font-family: Calibri, Arial, sans-serif; font-size: 11pt">${clone.innerHTML.replace(/\u200B/g, '')}</div>`;
            const text = [...clone.children].map(d => d.textContent).join('\n').replace(/\u200B/g, '');
            let ok = false;
            try {
                if (navigator.clipboard && window.ClipboardItem) {
                    await navigator.clipboard.write([new ClipboardItem({
                        'text/html': new Blob([html], { type: 'text/html' }),
                        'text/plain': new Blob([text], { type: 'text/plain' })
                    })]);
                    ok = true;
                }
            } catch (e) {}
            if (!ok) {
                try {
                    // Fallback: copy from a hidden copy of the note (keeps bold / underline where supported).
                    const tmp = document.createElement('div');
                    tmp.innerHTML = html;
                    tmp.style.cssText = 'position: fixed; left: -9999px; top: 0;';
                    document.body.appendChild(tmp);
                    const range = document.createRange();
                    range.selectNodeContents(tmp);
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                    ok = document.execCommand('copy');
                    sel.removeAllRanges();
                    tmp.remove();
                } catch (e) {}
            }
            if (!ok) { showToast('Copy was blocked: select the text and copy it manually.'); return; }
            showToast(unfilled ? `Copied · ${unfilled} green field${unfilled === 1 ? '' : 's'} not filled in` : 'Note copied');
        }

        /* ----- Discharge -----
           Saved on the entry as note.discharge = { to: 'home'|'expired', prevGoc, removedTomorrow: {date, listKey} | null,
           skipTomorrow, postDc: { date, id } | null }, so every step can be undone. */
        let dcDraft = null;
        function openDischargeModal(patientId, signOff = false) {
            dcDraft = { patientId, to: signOff ? 'signoff' : '', signOff, removeTomorrow: true, addPostDc: false };
            renderDischargeModal();
        }
        function renderDischargeModal() {
            const d = dcDraft;
            if (!d) return;
            const p = Store.getPatients().find(x => x.id === d.patientId);
            const choice = (field, val, label, on) => `<button onclick="dcDraft.${field} = ${JSON.stringify(val).replace(/"/g, "'")}; renderDischargeModal()" class="flex-1 px-3 py-2 rounded-xl text-sm font-bold border-2 transition ${d[field] === val ? on : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">${label}</button>`;
            const typed = (document.getElementById('dc-postdc-text') || {}).value;
            if (typed !== undefined) d.text = typed;
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50" onclick="if (event.target === this) { dcDraft = null; closeModal(); }">
                    <div class="bg-white rounded-3xl p-5 max-w-sm w-full shadow-2xl space-y-4 border-t-4 border-green-700">
                        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid ${d.signOff ? 'fa-hand-point-right' : 'fa-door-open'} text-green-700"></i> ${d.signOff ? 'Sign off' : 'Discharge'} ${esc(p ? p.name : '')}</h3>
                        <div class="${d.signOff ? 'hidden' : ''}">
                            <span class="block text-xs font-semibold text-slate-500 mb-1.5">Discharged to</span>
                            <div class="flex gap-2">
                                ${choice('to', 'home', '<i class="fa-solid fa-house"></i> Home', 'bg-green-700 text-white border-green-700')}
                                ${choice('to', 'expired', '<i class="fa-solid fa-heart-crack"></i> Expired', 'bg-red-800 text-white border-red-800')}
                            </div>

        function confirmDischarge() {
            const d = dcDraft;
            if (!d || !d.to) return;
            const text = ((document.getElementById('dc-postdc-text') || {}).value || d.text || '').trim();
            if (d.addPostDc && !text) { showToast('Type the follow-up, or choose No'); return; }
            const type = currentEntryType;
            const key = curKey();
            const allPatients = Store.getPatients();
            const p = allPatients.find(x => x.id === d.patientId);
            const note = dayNoteFor(allPatients, d.patientId);
            const info = infoFor(allPatients, d.patientId);
            const rec = { to: d.to, at: Date.now(), prevGoc: null, skipTomorrow: !!d.removeTomorrow, removedTomorrow: null, postDc: null };
            if (d.to === 'expired') {
                const goc = (Store.getSettings().goalsOfCare.find(g => g.name.toLowerCase() === 'expired') || { name: 'Expired' }).name;
                rec.prevGoc = info.goalsOfCare || '';
                info.goalsOfCare = goc;
            }
            const records = Store.getDailyRecords();
            const listKey = type === 'consult' ? 'consultIds' : 'inpatientIds';
            if (d.removeTomorrow) {
                const tomorrow = addDays(currentViewDate, 1);
                const day = records[tomorrow];
                if (day && (day[listKey] || []).includes(d.patientId)) {
                    day[listKey] = day[listKey].filter(id => id !== d.patientId);
                    rec.removedTomorrow = { date: tomorrow, listKey }; // that entry's notes are kept, so undo brings them back
                }
            }
            if (d.addPostDc) {
                const day = getOrCreateDay(records, currentViewDate);
                const id = 'pdc_' + Date.now().toString(36);
                day.postDc.push({ id, text: `${p.name}: ${text}`, completed: false, patientId: p.id });
                rec.postDc = { date: currentViewDate, id };
            }
            note.discharge = rec;
            Store.saveDailyRecords(records);
            Store.savePatients(allPatients);
            dcDraft = null;
            closeModal();
            renderApp();
            showToast(d.to === 'signoff' ? 'Signed off' : d.to === 'expired' ? 'Marked as expired' : 'Discharged home');
        }
        function reverseDischarge(patientId) {
            const cur = getDayNote(Store.getPatients().find(x => x.id === patientId) || {}, curKey());
            const isSign = !!(cur && cur.discharge && cur.discharge.to === 'signoff');
            showConfirm({
                title: isSign ? 'Reverse sign-off?' : 'Reverse discharge?',
                messageHtml: isSign ? 'Tomorrow\'s list and the Post D/C follow-up go back to how they were.' : 'Goals of care, tomorrow\'s list and the Post D/C follow-up go back to how they were.',
                confirmLabel: 'Reverse',
                onConfirm: () => {
                    const allPatients = Store.getPatients();
                    const note = dayNoteFor(allPatients, patientId);
                    const rec = note && note.discharge;
                    if (!rec) return;
                    const info = infoFor(allPatients, patientId);
                    if (rec.to === 'expired' && rec.prevGoc !== null) info.goalsOfCare = rec.prevGoc;
                    const records = Store.getDailyRecords();
                    if (rec.removedTomorrow) {
                        const day = getOrCreateDay(records, rec.removedTomorrow.date);
                        const lk = rec.removedTomorrow.listKey;
                        if (!day[lk].includes(patientId)) day[lk].push(patientId);
                    }
                    if (rec.postDc && records[rec.postDc.date]) {
                        records[rec.postDc.date].postDc = (records[rec.postDc.date].postDc || []).filter(x => x.id !== rec.postDc.id);
                    }
                    delete note.discharge;
                    Store.saveDailyRecords(records);
                    Store.savePatients(allPatients);
                    renderApp();
                    showToast(isSign ? 'Sign-off reversed' : 'Discharge reversed');
                }
            });
        }

        function labSettings() {

            return { units: s.units || DEFAULT_LAB_UNITS, overrides: s.overrides || {}, useRanges: s.useRanges !== false };
        }
        function labUnitIndex(key) {
            const refs = LAB_REF[key] || [];
            const i = labSettings().units[key];
            return (i !== undefined && refs[i]) ? i : 0;
        }
        // The range in use for a lab (chosen unit, your edits, patient sex). null if the lab has none.
        function labRange(key, sex, unitIdx) {
            const refs = LAB_REF[key];
            if (!refs) return null;
            const i = unitIdx !== undefined ? unitIdx : labUnitIndex(key);
            const base = refs[i];
            const ov = ((labSettings().overrides[key] || {})[base.u]) || {};
            const r = { ...base, ...ov };
            const female = sex === 'F';
            const pick = (v, vf) => (female && vf !== undefined && vf !== null && vf !== '') ? vf : v;
            const num = (v) => (v === null || v === undefined || v === '') ? null : Number(v);
            return { u: base.u, lo: num(pick(r.lo, r.loF)), hi: num(pick(r.hi, r.hiF)), raw: r };
        }
        function fmtNum(v) { return v === null ? '' : String(+Number(v).toFixed(2)); }

            else if (hi !== null) t = `<${fmtNum(hi)}`;
            else if (lo !== null) t = `>${fmtNum(lo)}`;
            return [t, r.u].filter(Boolean).join(' ');

            const v = parseFloat(String(value ?? '').replace(',', '.'));
            if (isNaN(v) || !/^\s*[<>]?\s*-?[\d.,]+/.test(String(value))) return '';

            const hi = (r.hi === null || r.hi === undefined || r.hi === '') ? null : Number(r.hi);
            if (hi !== null && hi > 0 && v > 5 * hi) return 'crit';
            if (hi !== null && v > hi) return 'high';
            if (lo !== null && v < lo) return 'low';
            return '';

        const TABLE_TYPES = ['vitals', 'io', 'lytes', 'glucose', 'cbc', 'gas', 'coag', 'critical', 'inflammation', 'bone', 'liver', 'iron', 'endocrine', 'ulytes'];
        function defaultSetRows(type) {
            return ((INV_TYPES[type] || {}).rows || []).map(([k, label, unit, calc, kind]) => {
                const r = { k, label, unit: unit || '' };

        function customSet(id) { return customSets().find(x => x.id === id); }

        const LEGACY_ROWS = { liver: [['ast', 'AST'], ['alt', 'ALT'], ['ggt', 'GGT'], ['bili', 'Bili T']], bone: [['ca', 'Ca'], ['phos', 'Phos'], ['mg', 'Mg'], ['vitd', 'Vit D'], ['alp', 'ALP']] };
        function panelSetRows(panel) {
