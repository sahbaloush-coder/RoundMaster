            forwardMedBg(allPatients.find(x => x.id === patientId), curKey(), { type: 'add', entry });
            Store.savePatients(allPatients);
            isMedicalBgCollapsed = false;
            startEditing('medbg', info.medicalBackground.length - 1);
        }

        function updateMedicalBackgroundLive(patientId, idx, field, val) {
            const allPatients = Store.getPatients();
            const info = infoFor(allPatients, patientId);
            const m = info && info.medicalBackground[idx];
            if (!m) return;
            m[field] = val;
            forwardMedBg(allPatients.find(x => x.id === patientId), curKey(), { type: 'update', id: m.id, field, value: val });
            Store.savePatients(allPatients);
        }

        function deleteMedicalBackground(patientId, idx) {
            const allPatients = Store.getPatients();
            const info = infoFor(allPatients, patientId);
            const m = info && info.medicalBackground[idx];
            if (!m) return;
            info.medicalBackground.splice(idx, 1);
            forwardMedBg(allPatients.find(x => x.id === patientId), curKey(), { type: 'delete', id: m.id });
            Store.savePatients(allPatients);
            editing = null;
            renderApp();
        }

        /* =========================================================
           PHYSICIANS
           ========================================================= */

        // 20 vivid colours (no black / gray). `swatch` is the colour shown in the picker; cards use a
        // light tint (bg), a soft border and a dark text shade of the same hue. Ordered so the first
        // colours handed out are as different from each other as possible.
        const PHYSICIAN_PALETTE = [
            { id: 'red',        swatch: '#f44336', bg: '#fde3e1', border: '#f8a39c', text: '#a1180e' },
            { id: 'blue',       swatch: '#2196f3', bg: '#dceefe', border: '#90c9f9', text: '#0d4f8b' },
            { id: 'green',      swatch: '#43a047', bg: '#e0f2e1', border: '#9fd4a1', text: '#1f5e22' },
            { id: 'orange',     swatch: '#ff9800', bg: '#fff0d9', border: '#ffcc80', text: '#8a4b00' },
            { id: 'purple',     swatch: '#9c27b0', bg: '#f4e2f7', border: '#d9a4e2', text: '#6a1b7a' },
            { id: 'teal',       swatch: '#009688', bg: '#d7f2ef', border: '#80cbc4', text: '#00574e' },
            { id: 'pink',       swatch: '#e91e63', bg: '#fce1ea', border: '#f48fb1', text: '#9c0f40' },
            { id: 'yellow',     swatch: '#fbc02d', bg: '#fff7d1', border: '#ffe082', text: '#7a5b00' },
            { id: 'indigo',     swatch: '#3f51b5', bg: '#e1e4f5', border: '#9fa8da', text: '#283593' },
            { id: 'lime',       swatch: '#8bc34a', bg: '#eef7e3', border: '#c5e1a5', text: '#3e6b12' },
            { id: 'brown',      swatch: '#795548', bg: '#efe7e4', border: '#bcaaa4', text: '#4e342e' },
            { id: 'cyan',       swatch: '#00bcd4', bg: '#d6f5fa', border: '#80deea', text: '#00636f' },
            { id: 'deeporange', swatch: '#ff5722', bg: '#ffe6dd', border: '#ffab91', text: '#a3300b' },
            { id: 'deeppurple', swatch: '#673ab7', bg: '#ebe3f6', border: '#b39ddb', text: '#45218a' },
            { id: 'lightgreen', swatch: '#cddc39', bg: '#f8fadc', border: '#e6ee9c', text: '#5c6305' },
            { id: 'lightblue',  swatch: '#03a9f4', bg: '#dcf2fd', border: '#81d4fa', text: '#015a85' },
            { id: 'amber',      swatch: '#ffc107', bg: '#fff5d6', border: '#ffd54f', text: '#7a5800' },
            { id: 'magenta',    swatch: '#d81b9b', bg: '#fbe1f3', border: '#ef95d3', text: '#8c0f63' },
            { id: 'emerald',    swatch: '#10b981', bg: '#d6f5ea', border: '#6ee7b7', text: '#065f46' },
            { id: 'olive',      swatch: '#9e9d24', bg: '#f4f4d9', border: '#d4d36a', text: '#5a5a10' }
        ];
        // Colours are unique WITHIN A DAY: every physician / primary team on that day's lists gets a
        // different colour. Each name has a usual colour (remembered). Colours you choose yourself are
        // given first; anyone whose usual colour is already taken that day borrows a free one for that day.
        const PCOLOR_KEY = 'physician_colors_v2';
        const PCOLOR_PINS = 'physician_color_pins';
        let physicianColorCache = {};
        function usualColorIndex(key, prefs, avoid) {
            if (prefs[key] !== undefined && PHYSICIAN_PALETTE[prefs[key]]) return prefs[key];
            // New name: prefer a colour not used by anyone today, then the least-used colour overall.
            const counts = PHYSICIAN_PALETTE.map(() => 0);
            Object.values(prefs).forEach(i => { if (counts[i] !== undefined) counts[i]++; });
            const order = PHYSICIAN_PALETTE.map((_, i) => i).sort((a, b) => counts[a] - counts[b] || a - b);
            const idx = order.find(i => !avoid.has(i));
            prefs[key] = idx !== undefined ? idx : order[0];
            return prefs[key];
        }
        function dayNames(date) {
            const records = Store.getDailyRecords();
            const day = records[date] || {};
            const all = Store.getPatients();
            const names = [];
            const add = (n) => { const k = String(n || '').trim().toLowerCase(); if (k && !names.includes(k)) names.push(k); };
            (day.inpatientIds || []).forEach(id => { const p = all.find(x => x.id === id); if (p) add(getDayInfo(p, date).physician); });
            (day.physicians || []).forEach(add);
            (day.consultIds || []).forEach(id => { const p = all.find(x => x.id === id); if (p) add(getDayInfo(p, entryKey(date, 'consult')).consultant); });
            (day.consultPhysicians || []).forEach(add);
            return names;
        }
        function dayColorMap(date) {
            if (physicianColorCache[date]) return physicianColorCache[date];
            const pins = Store.get(PCOLOR_PINS, {});
            const names = dayNames(date);
            const ordered = [...names.filter(k => pins[k]), ...names.filter(k => !pins[k])];
            const prefs = Store.get(PCOLOR_KEY, {});
            const before = JSON.stringify(prefs);
            const map = {};
            const used = new Set();
            ordered.forEach(k => {
                let idx = usualColorIndex(k, prefs, used);
                if (used.has(idx)) {
                    const free = PHYSICIAN_PALETTE.findIndex((_, i) => !used.has(i));
                    idx = free === -1 ? idx : free;
                }
                map[k] = idx;
                used.add(idx);

            if (JSON.stringify(prefs) !== before) Store.set(PCOLOR_KEY, prefs);
            physicianColorCache[date] = map;
            return map;

        function physicianColorIndex(name, date = currentViewDate) {

                const prefs = Store.get(PCOLOR_KEY, {});
                const used = new Set(Object.values(map));
                let idx = usualColorIndex(key, prefs, used);
                Store.set(PCOLOR_KEY, prefs);
                if (used.has(idx)) {
                    const free = PHYSICIAN_PALETTE.findIndex((_, i) => !used.has(i));

                        <div class="list-side flex flex-col min-w-0">
                        ${`
                            <div class="bg-white p-3 sm:p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col ${physiciansCollapsed() ? '' : 'space-y-3'}">
                                <div class="flex items-center justify-between flex-wrap gap-x-2 gap-y-1.5">
                                    <button onclick="togglePhysiciansBox()" class="font-bold text-slate-800 text-sm flex items-center gap-2 whitespace-nowrap">
                                        Physicians (${phys.length})
                                        <i class="fa-solid fa-chevron-${physiciansCollapsed() ? 'down' : 'up'} text-[calc(10px*var(--ts,1))] text-slate-400"></i>
                                    </button>
                                    <div class="flex items-center gap-1">
                                        <button onclick="refreshPhysiciansFromPatients('${type}')" class="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs transition" title="Update: keep only physicians assigned to patients"><i class="fa-solid fa-rotate"></i></button>
                                        <button onclick="openAddPhysicianModal('${type}')" class="px-2 py-1 ${cfg.accentSoft} rounded-lg text-xs font-semibold transition whitespace-nowrap"><i class="fa-solid fa-plus"></i> Add</button>
                                    </div>
                                </div>
                                <div class="space-y-2 ${physiciansCollapsed() ? 'hidden' : ''}">

                                        const drCol = getPhysicianColor(dr.name);
                                        return `
                                            <div class="p-3 rounded-xl border flex items-center justify-between text-sm shadow-xs font-bold" style="background-color: ${drCol.bg}; border-color: ${drCol.border}; color: ${drCol.text}">
                                                <button onclick="openPhysicianColorPicker(${jsArg(dr.name)})" class="min-w-0 break-words text-left flex items-center gap-2 hover:underline" title="Tap to choose colour">
                                                    <span class="w-3 h-3 rounded-full shrink-0 border border-white/70" style="background-color: ${drCol.swatch}"></span>${esc(dr.name)}
                                                </button>
                                                <div class="flex items-center space-x-2">
                                                    <span class="px-2.5 py-0.5 rounded-full font-extrabold text-xs bg-white/80 text-slate-800">${dr.count}</span>
                                                    <button onclick="removePhysicianFromList(${jsArg(dr.name)}, '${type}')" class="text-rose-600 hover:text-rose-800 text-xs" title="Remove"><i class="fa-solid fa-trash"></i></button>
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        `}
                            <!-- free space under the physicians: pen notes (on a phone they show under the patient list instead) -->
                            <div class="flex-1 min-h-0" data-ink="side:notes"></div>
                        </div>

                        <div class="list-main lg:col-span-3 flex flex-col space-y-4 min-w-0">
                            <div class="flex items-center justify-between">
                                <h3 class="font-bold text-slate-800 text-sm">${cfg.title}</h3>
                                <button onclick="openAddPatientModal('${type}')" class="px-3 py-1.5 ${cfg.accentBtn} text-white rounded-xl text-xs font-medium transition flex items-center gap-1.5 shadow-sm">
                                    <i class="fa-solid fa-plus"></i> Add Patient
                                </button>
                            </div>

                            <div class="space-y-3" id="${type}-list-container" data-sort-list="${cfg.sortKey}">
                                ${dayPatients.length === 0 ? `
                                    <div class="bg-white p-8 rounded-2xl border border-dashed border-slate-300 text-center">
                                        <p class="text-slate-400 text-sm">${cfg.empty}</p>
                                        <button onclick="openAddPatientModal('${type}')" class="mt-3 px-4 py-2 ${cfg.accentSoft} rounded-xl text-xs font-semibold transition">Add First Patient</button>
                                    </div>
                                ` : ''}
                                ${cards}
                            </div>

                            ${renderPostDcBox(dayData, cfg.tone)}
                            <div data-ink-alt="side:notes" style="height:0"></div>
                        </div>
                    </div>
                    <!-- bottom of the list: ink written here stays below the cards, however they open or close -->
                    <div data-ink="foot" class="flex-1" style="min-height: 75vh; margin-top: 0"></div>
                </div>
            `;
        }

        function renderListCard(p, type, settings) {
            const cfg = LIST_CFG[type];
            const isConsult = type === 'consult';
            const id = jsArg(p.id);
            // Inpatient cards count from the admission date, consult cards from the consult date.
            const cardDate = p[cfg.dateField] || '';
            const diffDays = cardDate ? Math.abs(daysBetween(cardDate, currentViewDate)) : null;
            const note = getDayNote(p, entryKey(currentViewDate, type));
            const todayIssues = (note || {}).activeIssues || [];
            const dailyMemo = ((note || {}).memo || '').trim();
            const emrMemo = (p.emrMemo || '').trim();
            const caseSummary = (p.caseSummary || '').trim();
            const missing = missingDetails(p, isConsult);
            const hideDetails = hideCardDetails(type);
            const pTags = displayTags(p, p.tags, currentViewDate, type);

            const wardObj = settings.wards.find(w => w.name.toLowerCase() === (p.ward || '').toLowerCase());
            const wardBg = wardObj ? wardObj.color : '#f8fafc';
            const wardColor = wardObj && wardObj.fontColor ? wardObj.fontColor : '#1e293b';
            const gocObj = settings.goalsOfCare.find(g => g.name.toLowerCase() === (p.goalsOfCare || '').toLowerCase());
            const gocBg = gocObj ? gocObj.color : '#f8fafc';
            const gocColor = gocObj && gocObj.fontColor ? gocObj.fontColor : '#1e293b';
            const cardDr = isConsult ? p.consultant : p.physician; // the card takes the physician's colour
            const drColor = getPhysicianColor(cardDr);
            const genderBg = p.gender === 'F' ? 'bg-pink-100 text-pink-700' : 'bg-blue-100 text-blue-700';
            const memoBtn = (onclick, label, icon, text, on, off) => `
                <button onclick="${onclick}" title="${esc(text || 'Add ' + label.toLowerCase())}" class="px-2.5 py-1 rounded-lg text-[calc(11px*var(--ts,1))] font-medium transition flex items-center gap-1.5 shadow-xs border ${text ? on : off}">
                    <i class="fa-solid ${icon}"></i> ${label}
                </button>`;

            return `
                <div data-sort-item data-id="${esc(p.id)}" class="size-scale flex rounded-2xl border-2 shadow-sm relative transition" style="background-color: ${cardDr ? drColor.bg : '#ffffff'}; border-color: ${cardDr ? drColor.border : '#e2e8f0'}">
                    ${gripHandle('rounded-r-2xl', cardDr ? { bg: 'rgba(255,255,255,0.45)', fg: drColor.border } : 'bg-slate-100 text-slate-400')}
                    <div class="flex-1 min-w-0 p-3 sm:p-4 flex flex-col space-y-2.5">
                        <div class="lc-head flex flex-col lg:flex-row lg:flex-wrap items-center lg:justify-between gap-1.5">
                            <div class="lc-name flex items-center justify-center lg:justify-start gap-1.5 flex-wrap">
                                ${entryTypeBadge(type)}
                                ${isEditingMode ? `
                                    <input type="text" value="${esc(p.name)}" onchange="updatePatientField(${id}, 'name', this.value)" class="font-extrabold text-slate-900 text-[calc(28px*var(--ts,1))] bg-slate-50 border border-slate-300 rounded px-2 py-1 w-56">
                                ` : `
                                    <a href="javascript:void(0)" onclick="router.navigate('patient_file', { patientId: ${id}, date: ${jsArg(currentViewDate)} })" class="font-extrabold text-slate-900 ${cfg.accentText} text-[calc(22px*var(--ts,1))] sm:text-[calc(28px*var(--ts,1))] leading-tight">${esc(p.name)}</a>
                                `}
                                ${missing.length ? `
                                    <button onclick="openDetailsEditor(${id})" class="px-2.5 py-0.5 rounded-lg text-xs font-bold bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100 flex items-center gap-1.5" title="Missing: ${esc(missing.join(', '))}">
                                        <span class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-rose-500 text-white text-[calc(10px*var(--ts,1))] font-black">!</span> ${missing.length} missing
                                    </button>
                                ` : ''}
                                <div class="flex items-center space-x-1">
                                    ${pTags.map(tagName => {
                                        const tObj = settings.tags.find(t => t.name === tagName);
                                        return `<span class="px-2.5 py-0.5 rounded-lg text-xs font-semibold shadow-xs" style="background-color: ${esc(tObj ? tObj.color : '#e0f2fe')}; color: ${esc(tObj && tObj.fontColor ? tObj.fontColor : '#1e3a8a')}">${esc(tagName)}</span>`;
                                    }).join('')}
                                </div>
                                ${isEditingMode ? `
                                    <div class="relative">
                                        <button onclick="toggleTagDropdown(${id})" class="px-2.5 py-1 rounded-lg text-xs font-semibold border border-slate-300 bg-white text-slate-700 flex items-center gap-1 shadow-xs">
                                            <span>Tags (${pTags.length})</span> <i class="fa-solid fa-chevron-down text-[calc(10px*var(--ts,1))]"></i>
                                        </button>
                                        <div id="tag-dropdown-${esc(p.id)}" class="hidden absolute left-0 mt-1 w-48 bg-white border border-slate-200 rounded-xl shadow-lg z-20 p-2 space-y-1 max-h-48 overflow-y-auto text-slate-800">
                                            ${settings.tags.map(t => `
                                                <label class="flex items-center space-x-2 p-1.5 hover:bg-slate-50 rounded cursor-pointer text-xs">
                                                    <input type="checkbox" ${pTags.includes(t.name) ? 'checked' : ''} onchange="togglePatientTag(${id}, ${jsArg(t.name)})" class="rounded text-indigo-600">
                                                    <span class="px-2 py-0.5 rounded text-[calc(11px*var(--ts,1))] font-semibold" style="background-color: ${esc(t.color)}; color: ${esc(t.fontColor)}">${esc(t.name)}</span>
                                                </label>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>

                            <!-- Small info chips: MRN, age, gender, admitted/consult date, day count (centred on phones) -->
                            <div class="lc-chips flex items-center justify-center lg:justify-end gap-1 flex-wrap text-[calc(11px*var(--ts,1))]">
                                <div class="flex items-center gap-0.5 bg-white/70 px-1.5 py-0.5 rounded-lg border border-slate-200">
                                    <span class="text-[calc(9px*var(--ts,1))] text-slate-400">MRN</span>
                                    ${isEditingMode ? `
                                        <input type="text" value="${esc(p.mrn)}" onchange="updatePatientField(${id}, 'mrn', this.value)" class="w-16 bg-white border border-slate-200 rounded px-1 text-[calc(11px*var(--ts,1))] font-medium text-slate-800">
                                    ` : `<span class="font-bold text-slate-700">${esc(p.mrn || '-')}</span>`}
                                </div>
                                <div class="flex items-center gap-0.5 bg-white/70 px-1.5 py-0.5 rounded-lg border border-slate-200">
                                    ${isEditingMode ? `
                                        <span class="text-[calc(9px*var(--ts,1))] text-slate-400">DOB</span>${dateField(p.dob || '', `updatePatientField(${id}, 'dob', this.value)`, { cls: 'compact-date bg-white border border-slate-200 rounded px-1 text-[calc(11px*var(--ts,1))] font-semibold text-slate-800' })}
                                    ` : `<span class="font-bold text-slate-700" title="${p.dob ? 'DOB ' + esc(fmtDate(p.dob)) : 'Date of birth missing'}">${ageText(p, currentViewDate) ? esc(ageText(p, currentViewDate)) : 'Age'}${p.dob ? '' : ' ' + MISSING_MARK}</span>`}
                                </div>
                                ${isEditingMode ? `
                                    <select onchange="updatePatientField(${id}, 'gender', this.value); renderApp()" class="border border-slate-200 rounded-lg px-1 py-0.5 text-[calc(11px*var(--ts,1))] font-bold ${genderBg}">
                                        <option value="M" ${p.gender !== 'F' ? 'selected' : ''}>M</option>
                                        <option value="F" ${p.gender === 'F' ? 'selected' : ''}>F</option>
                                    </select>
                                ` : `<span class="px-2 py-0.5 rounded-lg font-bold text-[calc(11px*var(--ts,1))] ${genderBg}">${esc(p.gender || 'M')}</span>`}
                                <div class="flex items-center gap-0.5 bg-white/70 px-1.5 py-0.5 rounded-lg border border-slate-200">
                                    <span class="text-[calc(9px*var(--ts,1))] text-slate-400">${cfg.admShort}</span>
                                    ${isEditingMode
                                        ? dateField(cardDate, `updatePatientField(${id}, '${cfg.dateField}', this.value)`, { cls: 'compact-date bg-white border border-slate-200 rounded px-1 text-[calc(11px*var(--ts,1))] font-semibold text-slate-800' })
                                        : `<span class="font-semibold text-slate-700">${cardDate ? esc(fmtDate(cardDate)) : MISSING_MARK}</span>`}
                                </div>
                                <div class="${cfg.dayChip} px-1.5 py-0.5 rounded-lg font-bold">Day ${diffDays !== null ? diffDays : '-'}</div>
                            </div>
                        </div>

                        <div class="pt-2 border-t border-black/5 space-y-2">
                            <!-- Location (small boxes, left) with the physician / primary team right beside it, then goals of care -->
                            <div class="flex items-stretch gap-1.5 flex-wrap text-xs">
                                <div class="px-2 py-1 rounded-lg border border-slate-200/60 shadow-xs flex items-center justify-center min-w-[2.5rem] text-center" style="background-color: ${esc(wardBg)}; color: ${esc(wardColor)}" title="Ward">
                                    ${isEditingMode ? `
                                        <input type="text" list="ward-options" value="${esc(p.ward || '')}" onchange="setWardField(${id}, this.value)" class="w-14 bg-white/90 border rounded px-0.5 text-[calc(11px*var(--ts,1))] font-bold text-slate-800 text-center" placeholder="Ward">
                                    ` : `<span class="font-bold">${orMissing(p.ward)}</span>`}
                                </div>
                                <div class="bg-white/70 px-2 py-1 rounded-lg border border-slate-200/60 flex items-center justify-center min-w-[2.5rem] text-center" title="Room">
                                    ${isEditingMode ? `
                                        <input type="text" value="${esc(p.room || '')}" onchange="updatePatientField(${id}, 'room', this.value)" class="w-12 bg-white border rounded px-0.5 text-[calc(11px*var(--ts,1))] font-bold text-slate-800 text-center" placeholder="Room">
                                    ` : `<span class="font-bold text-slate-800">${orMissing(p.room)}</span>`}
                                </div>
                                <div class="bg-white/70 px-2 py-1 rounded-lg border border-slate-200/60 flex items-center justify-center min-w-[2.5rem] text-center" title="Bed">
                                    ${isEditingMode ? `
                                        <input type="text" value="${esc(p.bed || '')}" onchange="updatePatientField(${id}, 'bed', this.value)" class="w-10 bg-white border rounded px-0.5 text-[calc(11px*var(--ts,1))] font-bold text-slate-800 text-center" placeholder="Bed">
                                    ` : `<span class="font-bold text-slate-800">${orMissing(p.bed)}</span>`}
                                </div>
                                <div class="px-2.5 py-1 rounded-lg border border-slate-200 bg-slate-100 text-slate-700 shadow-xs flex items-center gap-1.5 font-bold" title="${cfg.physLabel}">
                                    <span class="text-[calc(9px*var(--ts,1))] uppercase font-semibold opacity-75">${isConsult ? 'Team' : 'Dr'}</span>
                                    ${isEditingMode ? `
                                        <input type="text" value="${esc(p.physician || '')}" onchange="onPhysicianNameChanged(${id}, this.value)" class="w-24 bg-white/90 border rounded px-1 text-[calc(11px*var(--ts,1))] font-bold text-slate-800" placeholder="${cfg.physPlaceholder}">
                                    ` : `<span>${orMissing(p.physician)}</span>`}
                                </div>
                                ${isConsult ? `
                                <div class="px-2.5 py-1 rounded-lg border border-slate-200 bg-slate-100 text-slate-700 shadow-xs flex items-center gap-1.5 font-bold" title="Physician">
                                    <span class="text-[calc(9px*var(--ts,1))] uppercase font-semibold opacity-75">Dr</span>
                                    ${isEditingMode ? `
                                        <input type="text" value="${esc(p.consultant || '')}" onchange="onConsultantNameChanged(${id}, this.value)" class="w-24 bg-white/90 border rounded px-1 text-[calc(11px*var(--ts,1))] font-bold text-slate-800" placeholder="Physician">
                                    ` : `<span>${orMissing(p.consultant)}</span>`}
                                </div>` : ''}
                                <div class="px-2.5 py-1 rounded-lg border shadow-xs flex items-center font-bold" style="background-color: ${esc(gocBg)}; color: ${esc(gocColor)}" title="Goals of care">
                                    ${isEditingMode ? `
                                        <select onchange="updatePatientField(${id}, 'goalsOfCare', this.value); renderApp()" class="bg-white/90 border rounded px-1 text-[calc(11px*var(--ts,1))] font-bold text-slate-800">
                                            <option value="" ${!p.goalsOfCare ? 'selected' : ''}>-</option>
                                            ${settings.goalsOfCare.map(g => `<option value="${esc(g.name)}" ${p.goalsOfCare === g.name ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}
                                        </select>
                                    ` : `<span>${orMissing(p.goalsOfCare)}</span>`}
                                </div>
                            </div>

                            ${hideDetails ? (isEditingMode ? `
                                <div class="flex justify-end">
                                    <button onclick="deletePatientFromDay(${id}, '${type}')" class="p-2 bg-rose-50 text-rose-700 hover:bg-rose-100 rounded-xl text-xs shadow-xs" title="Remove from this day's list"><i class="fa-solid fa-trash"></i></button>
                                </div>` : '') : `
                            <div class="grid grid-cols-1 md:grid-cols-12 gap-2 items-start">
                                <div class="md:col-span-8 bg-white/60 p-2.5 rounded-xl border border-slate-200/70 text-xs space-y-1">
                                    ${isConsult ? `
                                        <span class="font-bold text-slate-500 block uppercase tracking-wider text-[calc(10px*var(--ts,1))]">Impression</span>
                                        ${!note ? '<p class="text-slate-400 italic">No notes for this day yet</p>'
                                            : String(note.impression || '').trim() ? `<div class="font-semibold text-slate-800 bg-white px-2 py-1.5 rounded-lg border border-slate-200/80 whitespace-pre-line break-words">${esc(String(note.impression).trim())}</div>`
                                            : '<p class="text-slate-400 italic">No impression yet</p>'}` : `
                                    <span class="font-bold text-slate-500 block uppercase tracking-wider text-[calc(10px*var(--ts,1))]">${cfg.issuesLabel}</span>
                                    ${!note ? '<p class="text-slate-400 italic">No notes for this day yet</p>' : (todayIssues.length === 0 ? `<p class="text-slate-400 italic">${cfg.issuesEmpty}</p>` : '')}
                                    ${todayIssues.map(ai => `
                                        <div class="font-semibold text-slate-800 bg-white px-2 py-1 rounded-lg border border-slate-200/80">• ${esc(ai.issue || 'Untitled')}</div>
                                    `).join('')}`}
                                </div>
                                <div class="list-memos md:col-span-4 flex items-center gap-1.5 justify-end flex-wrap md:flex-col md:flex-nowrap md:items-stretch md:justify-start md:ml-auto md:w-40">
                                    ${(() => { // signed off / transferred / discharged today: not on tomorrow's list
                                        const dcx = note && note.discharge; if (!dcx) return '';
                                        const [lbl, cls, ic] = dcx.to === 'signoff' ? ['Signed off', 'bg-emerald-700', 'fa-hand-point-right'] : dcx.to === 'toc' ? ['TOC Acptd', 'bg-teal-600', 'fa-right-left']
                                            : dcx.to === 'transfer' ? ['Discharged · TOC', 'bg-teal-700', 'fa-right-left'] : dcx.to === 'expired' ? ['Expired', 'bg-red-800', 'fa-heart-crack'] : ['Discharged', 'bg-green-800', 'fa-house'];
                                        return `<span class="px-2.5 py-1 rounded-lg text-[calc(11px*var(--ts,1))] font-bold text-white text-center ${cls}" title="Not carried to tomorrow's list"><i class="fa-solid ${ic}"></i> ${lbl}</span>`;
                                    })()}
                                    ${memoBtn(`openCaseSummaryModal(${esc(JSON.stringify(p.id))})`, 'Case Summary', 'fa-file-lines', caseSummary, 'bg-sky-500 text-white border-sky-500 hover:bg-sky-600', 'bg-sky-50 text-sky-700 border-sky-200 hover:bg-sky-100')}
                                    ${memoBtn(`openMemoModal(${esc(JSON.stringify(p.id))})`, isConsult ? 'Updates' : 'Memo', 'fa-note-sticky', dailyMemo, 'bg-amber-400 text-amber-950 border-amber-400 hover:bg-amber-500', 'bg-amber-50 text-amber-800 border-amber-200 hover:bg-amber-100')}
                                    ${memoBtn(`openEmrMemoModal(${esc(JSON.stringify(p.id))})`, 'EMR Memo', 'fa-file-medical', emrMemo, 'bg-pink-500 text-white border-pink-500 hover:bg-pink-600', 'bg-pink-50 text-pink-700 border-pink-200 hover:bg-pink-100')}
                                    ${isEditingMode ? `
                                        <button onclick="deletePatientFromDay(${id}, '${type}')" class="p-2 bg-rose-50 text-rose-700 hover:bg-rose-100 rounded-xl text-xs shadow-xs" title="Remove from this day's list"><i class="fa-solid fa-trash"></i></button>
                                    ` : ''}
                                </div>
                            </div>`}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPostDcBox(dayData, T = LIST_CFG.inpatient.tone) {
            return `
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mt-6">
                    <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
                        <h4 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-list-check ${T.icon}"></i> Post D/C Follow Ups
                        </h4>
                        <div class="flex items-center gap-2">
                            ${dayData.postDc.length ? `
                                <button onclick="addPostDcToTomorrow()" class="px-2.5 py-1.5 ${T.soft} rounded-lg text-xs font-semibold transition flex items-center gap-1.5" title="Copy unfinished follow-ups to tomorrow's list"><i class="fa-solid fa-calendar-plus"></i> Add All to Tomorrow</button>
                            ` : ''}
                            <button data-edit-trigger onclick="addPostDcItem()" class="px-3 py-1.5 ${T.soft} rounded-lg text-xs font-semibold transition flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Add</button>
                        </div>
                    </div>
                    <div class="space-y-2">
                        ${dayData.postDc.length === 0 ? '<p class="text-xs text-slate-400 italic">No post-discharge follow-ups listed.</p>' : ''}
                        ${dayData.postDc.map((item, idx) => isEditingItem('postdc', idx, null) ? `
                            <div data-editing class="flex items-center p-2 rounded-xl bg-white border-2 ${T.edit} gap-2">
                                <input type="text" value="${esc(item.text || '')}" oninput="updatePostDcTextLive(${idx}, this.value)" data-enter="done" class="text-sm flex-1 min-w-0 bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-slate-800" placeholder="Follow-up task...">
                                <button onclick="deletePostDcItem(${idx})" class="text-slate-400 hover:text-rose-600 px-1.5" title="Delete"><i class="fa-solid fa-trash text-xs"></i></button>
                                <button onclick="stopEditing()" class="px-3 py-1 ${T.btn} text-white rounded-lg text-[calc(11px*var(--ts,1))] font-semibold">Done</button>
                            </div>
                        ` : `
                            <div class="flex items-center rounded-xl bg-slate-50 border border-slate-200/80 overflow-hidden">
                                <label class="flex items-center px-3 py-2 cursor-pointer" onclick="event.stopPropagation()">
                                    <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="togglePostDcItem(${idx})" class="w-4 h-4 ${T.check} rounded border-slate-300">
                                </label>
                                <div data-edit-trigger onclick="startEditing('postdc', ${idx}, 'input[type=&quot;text&quot;]', null)" class="edit-trigger flex-1 min-w-0 py-2 pr-3 text-sm break-words ${item.completed ? 'line-through text-slate-400' : 'text-slate-700'}" title="Click to edit">
                                    ${esc(item.text) || '<span class="text-slate-400 italic">Empty item</span>'}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderAllPatientsView() {
            const allPatients = Store.getPatients();
            const searchTerm = window.searchQuery || '';

            return `
                <div class="flex-1 flex flex-col space-y-4">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
                        <div class="flex items-center space-x-3 flex-1 max-w-md">
                            <div class="relative w-full">
                                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-search"></i></span>
                                <input type="text" placeholder="Search by name or MRN..." value="${esc(searchTerm)}" oninput="onPatientSearch(this.value)" class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-maroon-400">
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="toggleAllPatientsDetails()" class="h-8 sm:h-auto px-2.5 sm:px-4 sm:py-2 ${allpHideDetails() ? 'bg-maroon-700 text-white' : 'bg-maroon-50 text-maroon-700 hover:bg-maroon-100'} rounded-lg sm:rounded-xl font-medium text-sm transition flex items-center gap-2" title="${allpHideDetails() ? 'Show details' : 'Hide details'}">
                                <i class="fa-solid fa-${allpHideDetails() ? 'eye' : 'eye-slash'}"></i><span class="hidden sm:inline">${allpHideDetails() ? 'Show details' : 'Hide details'}</span>
                            </button>
                            <div class="text-xs font-semibold text-slate-500">Total: ${allPatients.length}</div>
                        </div>
                    </div>

                    <div id="all-patients-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2.5 items-start">
                        ${renderAllPatientsGrid(searchTerm)}
                    </div>
                </div>
            `;
        }

        // Only the result cards are redrawn while typing, so the search box keeps focus.
        function renderAllPatientsGrid(searchTerm) {
            const term = (searchTerm || '').toLowerCase();
            const filtered = Store.getPatients().filter(p =>
                (p.name || '').toLowerCase().includes(term) || (p.mrn || '').toLowerCase().includes(term)
            );
            filtered.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

            if (filtered.length === 0) {
                return `<div class="col-span-full bg-white p-8 rounded-2xl border border-dashed border-slate-300 text-center text-sm text-slate-400">No patients match your search.</div>`;
            }

            const hide = allpHideDetails();
            return filtered.map(p => {
                const info = latestInfo(p);
                return `
                <div class="size-scale bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between space-y-2 hover:border-maroon-300 transition relative">
                    <div>
                        <div class="flex items-center justify-between gap-2 mb-1">
                            <h3 class="font-bold text-slate-800 text-sm truncate">${esc(p.name)}</h3>
                            <span class="shrink-0 text-[calc(11px*var(--ts,1))] bg-maroon-50 text-maroon-700 font-semibold px-2 py-0.5 rounded-md">MRN: ${esc(p.mrn || '-')}</span>
                        </div>
                        <p class="text-xs font-semibold text-slate-600">${esc(ageText({ ...info, dob: p.dob }, todayStr()) || '-')} <span class="text-slate-300 mx-1">|</span> <span class="px-1.5 py-0.5 rounded font-bold text-[calc(11px*var(--ts,1))] ${p.gender === 'F' ? 'bg-pink-100 text-pink-700' : 'bg-blue-100 text-blue-700'}">${esc(p.gender || 'M')}</span> <span class="text-slate-300 mx-1">|</span> ${(() => {
                            if (!info.goalsOfCare) return '-';
                            const g = (Store.getSettings().goalsOfCare || []).find(x => x.name.toLowerCase() === String(info.goalsOfCare).toLowerCase());
                            return `<span class="px-1.5 py-0.5 rounded font-bold text-[calc(11px*var(--ts,1))] border border-black/5" style="background-color: ${esc(g ? g.color : '#f8fafc')}; color: ${esc(g && g.fontColor ? g.fontColor : '#1e293b')}">${esc(info.goalsOfCare)}</span>`;
                        })()}</p>
                        ${info.medicalBackground.length > 0 && !hide ? `
                            <div class="mt-2 space-y-1 text-[calc(11px*var(--ts,1))]">
                                ${info.medicalBackground.map(mb => `
                                    <div class="px-2 py-1 rounded-md flex items-start gap-1.5 ${mb.starred ? 'bg-yellow-100 border border-yellow-300 text-slate-800 font-semibold' : 'bg-slate-50 text-slate-600'}">
                                        ${mb.starred ? '<i class="fa-solid fa-star text-yellow-500 text-[calc(10px*var(--ts,1))] mt-0.5"></i>' : '<span class="text-slate-300">•</span>'}
                                        <span class="min-w-0 break-words">${esc(mb.condition)}${mb.treatment ? `<span class="font-normal text-slate-500">: ${esc(mb.treatment)}</span>` : ''}</span>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                        <div class="mt-1.5 ${hide ? 'hidden' : ''}">
                            ${renderEmrMemoBox(p, true, false) || `<button onclick="openEmrMemoModal(${jsArg(p.id)})" class="text-[calc(11px*var(--ts,1))] font-semibold text-pink-600 hover:text-pink-800"><i class="fa-solid fa-plus"></i> EMR memo</button>`}
                        </div>
                    </div>
                    <div class="flex items-center justify-between gap-1.5 pt-1.5 border-t border-slate-100 flex-wrap">
                        <div class="flex items-center gap-1.5">
                            <span class="text-[calc(11px*var(--ts,1))] font-semibold text-slate-500">Copy to:</span>
                            <button onclick="copyPatientToList(${jsArg(p.id)}, 'inpatient')" class="px-2 py-1 bg-orange-50 text-orange-600 hover:bg-orange-100 border border-orange-200 rounded-lg text-[calc(11px*var(--ts,1))] font-semibold transition" title="Add to today's inpatient list">Inpt</button>
                            <button onclick="copyPatientToList(${jsArg(p.id)}, 'consult')" class="px-2 py-1 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 border border-indigo-200 rounded-lg text-[calc(11px*var(--ts,1))] font-semibold transition" title="Add to today's consult list">Cnslt</button>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button onclick="router.navigate('patient_profile', { patientId: ${jsArg(p.id)} })" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-[calc(11px*var(--ts,1))] font-medium transition">View Record</button>
                            <button onclick="openDeletePatientModal(${jsArg(p.id)})" class="px-2 py-1 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg text-[calc(11px*var(--ts,1))] font-medium transition" title="Delete Patient"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            `;
            }).join('');
        }

        // All Patients: hide medical background and memos on the cards (remembered on this device).
        function allpHideDetails() { return !!Store.get('hide_allp_details', false); }
        function toggleAllPatientsDetails() { Store.set('hide_allp_details', !allpHideDetails()); renderApp(); }

        function onPatientSearch(val) {
            window.searchQuery = val;
            const grid = document.getElementById('all-patients-grid');
            if (grid) grid.innerHTML = renderAllPatientsGrid(val);
        }

        function getCareFlags(patientId, date = currentViewDate, type = currentEntryType) {
            const day = readDay(date);
            return day.careFlags[careKey(patientId, type)] || { vitalsDone: false, labsDone: false, planDone: false };
        }

        function renderPatientFileView() {
            const allPatients = Store.getPatients();
            const rawPatient = allPatients.find(p => p.id === activePatientId);
            if (!rawPatient) {
                return `
                    <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center space-y-3">
                        <p class="text-slate-500">Patient not found. The record may have been deleted.</p>
                        <button onclick="router.navigate('all_patients')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-medium">Go to All Patients</button>
                    </div>
                `;
            }

            // Daily entries exist only for days the patient is on a list. Snap to the nearest such day.
            // Work on this entry type; if the patient isn't on that list at all, use the other one.
            let entryDates = listedDates(rawPatient.id, currentEntryType);
            if (entryDates.length === 0) {
                const other = currentEntryType === 'consult' ? 'inpatient' : 'consult';
                if (listedDates(rawPatient.id, other).length) {
                    currentEntryType = other;
                    entryDates = listedDates(rawPatient.id, other);
                }
            }
            if (entryDates.length === 0) {
                return renderPatientProfileView();
            }
            if (!entryDates.includes(currentViewDate)) {
                const earlier = entryDates.filter(d => d < currentViewDate);
                currentViewDate = earlier.length ? earlier[earlier.length - 1] : entryDates[0];
            }
            const entryIdx = entryDates.indexOf(currentViewDate);
            const prevEntry = entryIdx > 0 ? entryDates[entryIdx - 1] : null;
            const nextEntry = entryIdx < entryDates.length - 1 ? entryDates[entryIdx + 1] : null;

            const patient = effectivePatient(rawPatient, curKey());
            const isConsult = currentEntryType === 'consult';
            patient.tags = displayTags(rawPatient, patient.tags, currentViewDate, currentEntryType);
            if (editingTile === '@first') editingTile = missingFields(patient, isConsult).find(f => TEXT_TILES.includes(f)) || null;
            const settings = Store.getSettings();
            const pTags = Array.isArray(patient.tags) ? patient.tags : [];
            const flags = getCareFlags(patient.id);

            const wardObj = settings.wards.find(w => w.name.toLowerCase() === (patient.ward || '').toLowerCase());
            const wardBg = wardObj ? wardObj.color : '#f8fafc';
            const wardColor = wardObj && wardObj.fontColor ? wardObj.fontColor : '#1e293b';

            const gocObj = settings.goalsOfCare.find(g => g.name.toLowerCase() === (patient.goalsOfCare || '').toLowerCase());
            const gocBg = gocObj ? gocObj.color : '#f8fafc';
            const gocColor = gocObj && gocObj.fontColor ? gocObj.fontColor : '#1e293b';

            const drColor = getPhysicianColor(isConsult ? patient.consultant : patient.physician);
            const genderBg = patient.gender === 'F' ? 'bg-pink-100 text-pink-700' : 'bg-blue-100 text-blue-700';

            const diffDays = admissionDayNumber(patient);
            const pid = jsArg(patient.id);

            const existingNote = getDayNote(rawPatient, curKey());
            const note = existingNote || emptyNote();
            const prevDate = previousNoteDate(rawPatient, curKey());
            // Opening an entry: boxes open on the first visit, otherwise only the ones you chose to open.
            const vk = rawPatient.id + '|' + curKey();
            if (vk !== viewEntryKey) {
                viewEntryKey = vk;
                if (applyEntryView(rawPatient, curKey())) Store.savePatients(allPatients);
            }

            // Shown when this patient has no note for the selected day.
            const noNoteBanner = existingNote ? '' : `
                <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
                    <div class="text-sm text-amber-900">
                        <strong>No notes for ${esc(fmtDate(currentViewDate))} yet.</strong>
                        ${prevDate ? `<span class="block text-xs text-amber-800 mt-0.5">Most recent note: ${esc(fmtDate(prevDate))}</span>` : ''}
                    </div>
                    <div class="flex items-center gap-2 flex-wrap">
                        ${prevDate ? `
                            <button onclick="copyNoteFromPrevious(${pid})" class="px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-semibold transition flex items-center gap-1.5" title="Copies active issues with their treatments, and unfinished plan items">
                                <i class="fa-solid fa-copy"></i> Copy from ${esc(fmtDate(prevDate))}
                            </button>
                        ` : ''}
                        <button onclick="startBlankNote(${pid})" class="px-3 py-2 bg-white hover:bg-amber-100 text-amber-900 border border-amber-300 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
                            <i class="fa-solid fa-file"></i> Start blank
                        </button>
                    </div>
                </div>
            `;

            const anyOpen = recordAnyOpen(rawPatient, note, isConsult);
            return `
                <div class="flex-1 flex flex-col space-y-4">
                    <!-- STICKY TOP BAR: name, tags, MRN, entry navigation, daily care -->
                    <div class="rec-sticky sm:sticky sm:top-0 z-30 bg-slate-50/95 backdrop-blur-md pb-2 sm:pb-3 shadow-sm">
                        <div class="rec-head-box rec-head bg-white p-3 sm:p-4 rounded-2xl border border-slate-200 shadow-sm">
                            <div class="rh-name flex items-center justify-center gap-2 flex-wrap">
                                ${entryTypeBadge(currentEntryType)}
                                ${renderHeaderName(patient, pid)}
                                ${renderHeaderTags(patient, settings, pid)}
                                ${renderHeaderMrn(patient, pid)}
                            </div>
                            <div class="rh-nav flex items-center gap-1.5">
                                <button ${prevEntry ? `onclick="goToNoteDate(${jsArg(prevEntry)})"` : 'disabled'} class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center transition ${prevEntry ? 'hover:bg-slate-200 text-slate-600' : 'text-slate-300 cursor-not-allowed'}" title="Previous entry"><i class="fa-solid fa-chevron-left"></i></button>
                                <select onchange="goToNoteDate(this.value)" class="px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-lg font-semibold text-slate-700 text-[calc(13px*var(--ts,1))] focus:outline-none focus:ring-2 focus:ring-indigo-500" title="Days this patient is on a list">
                                    ${entryDates.slice().reverse().map(d => `<option value="${esc(d)}" ${d === currentViewDate ? 'selected' : ''}>${esc(fmtDate(d))}</option>`).join('')}
                                </select>
                                <button ${nextEntry ? `onclick="goToNoteDate(${jsArg(nextEntry)})"` : 'disabled'} class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center transition ${nextEntry ? 'hover:bg-slate-200 text-slate-600' : 'text-slate-300 cursor-not-allowed'}" title="Next entry"><i class="fa-solid fa-chevron-right"></i></button>
                            </div>
                            <div class="rh-care">${renderCareBox(flags, pid, isConsult)}</div>
                        </div>
                    </div>

                    <!-- Collapse / Expand all: its own slim row between the header and the details (never overlapping them) -->
                    <div class="rec-collapse-row flex justify-center" style="margin-top: 0.35rem; margin-bottom: -0.4rem;">
                        <button onclick="setRecordCollapsed(${anyOpen})" class="px-3 py-1 rounded-full bg-white border border-slate-200 text-slate-500 hover:text-slate-800 hover:bg-slate-100 text-[calc(11px*var(--ts,1))] font-semibold shadow-xs flex items-center gap-1.5 transition" title="${anyOpen ? 'Collapse all boxes' : 'Expand all boxes'}">
                            <i class="fa-solid fa-${anyOpen ? 'down-left-and-up-right-to-center' : 'up-right-and-down-left-from-center'}"></i> ${anyOpen ? 'Collapse all' : 'Expand all'}
                        </button>
                    </div>

                    <div class="flex flex-col space-y-4">
                        ${renderDetailsBanner(patient, settings, { wardBg, wardColor, gocBg, gocColor, drColor, genderBg, diffDays, isConsult })}

                        ${noNoteBanner}

                        <div class="mb-row ${isMedicalBgCollapsed ? 'mb-fold' : ''} flex items-start gap-2 sm:gap-3">
                            <div class="flex-1 min-w-0">${renderMedBgBox(patient, pid)}</div>
                            ${(() => { const chips = renderMemoRow(rawPatient, note, pid, isConsult, patient.caseSummary, 'chips'); return chips ? `<div class="size-scale shrink-0 self-stretch flex flex-col items-stretch gap-1.5 sm:gap-2">${chips}${inkPad('mb')}</div>` : ''; })()}
                        </div>

                        ${renderMemoRow(rawPatient, note, pid, isConsult, patient.caseSummary, 'boxes')}

                        <!-- ACTIVE ISSUES + PLAN: side by side on wide landscape screens, stacked otherwise -->
                        <div class="issues-plan-grid ipg-stretch">
                            <div class="flex flex-col min-w-0">
                                ${renderIssuesBox(note, settings, rawPatient.id, pid, isConsult)}
                                ${issuesFill(isConsult) ? '' : inkPad('issues')}
                            </div>
                            <div class="flex flex-col min-w-0">
                                <div class="flex flex-col gap-4 min-w-0">
                                    ${renderPlanBox(note, rawPatient.id, pid, 'plan', isConsult)}
                                    ${isConsult ? '' : renderPlanBox(note, rawPatient.id, pid, 'dcplan')}
                                </div>
                                ${inkPad('plan')}
                            </div>
                        </div>

                        ${renderInvestigationsBox(rawPatient, note, pid)}

                        <div class="flex justify-center pt-2 pb-4">
                            <button onclick="openNoteExtract(${pid})" class="px-6 py-2.5 rounded-2xl bg-slate-800 hover:bg-slate-900 text-white text-sm font-bold shadow-md flex items-center gap-2 transition">
                                <i class="fa-solid fa-file-lines"></i> Extract Note
                            </button>
                        </div>
                        <!-- bottom of the record: ink written here stays at the bottom, however the boxes above open or close -->
                        <div data-ink="foot" class="flex-1" style="min-height: 75vh; margin-top: 0"></div>
                    </div>
                </div>
            `;
        }

        // Inpatients: Daily Care (Vitals / Labs / Plan). Consults: Review / Plan.
        // Daily Care (green, like the Plan box). Inpatients: Vitals / Labs / Plan. Consults: Review / Plan.
        function renderCareBox(flags, pid, isConsult) {
            const btn = (flag, icon, label) => `
                <button onclick="toggleCareFlag(${pid}, '${flag}')" class="px-1.5 sm:px-3 py-1 sm:py-1.5 rounded-lg text-[calc(10.5px*var(--ts,1))] sm:text-xs font-bold transition flex items-center gap-1 ${flags[flag] ? 'bg-emerald-600 text-white shadow-sm' : 'bg-white text-emerald-800 border border-emerald-200 hover:bg-emerald-100'}">
                    <i class="fa-solid ${icon}"></i> ${label}
                </button>`;
            return `
                <div class="bg-emerald-50 border-2 border-emerald-300 p-1 sm:p-1.5 rounded-xl flex items-center gap-1 sm:gap-1.5 shadow-xs">
                    <span class="care-label hidden sm:inline text-[calc(10px*var(--ts,1))] font-bold text-emerald-800 uppercase tracking-wider px-1">DAILY CARE</span>
                    ${isConsult
                        ? btn('reviewDone', 'fa-magnifying-glass', 'Review') + btn('planDone', 'fa-clipboard-list', 'Plan')
                        : btn('vitalsDone', 'fa-heart-pulse', 'Vitals') + btn('labsDone', 'fa-flask', 'Labs') + btn('planDone', 'fa-clipboard-list', 'Plan')}
                </div>`;
        }

        /* ---------- Details banner (ward, room, bed, age, gender, admission, goals of care, physician) ---------- */

        // Opens one detail box for editing. From a list card (patientId given) it opens the record
        // with the first missing box ready.
        function openDetailsEditor(patientId, field) {
            if (patientId) {
                router.navigate('patient_file', { patientId, date: currentViewDate, editTile: field || '@first' });
            } else {
                editingTile = field || '@first';
                if (coreCollapsed.details) { coreCollapsed.details = false; noteCoreChoice('details', false); }
                renderApp();
            }
        }

        function missingFields(p, isConsult = false) {
            return requiredFor(isConsult).filter(([f]) => !String(p[f] || '').trim()).map(([f]) => f);
        }
        const TEXT_TILES = ['ward', 'room', 'bed', 'physician', 'consultant', 'name', 'mrn', 'dob', 'admissionDate', 'consultDate'];

        function commitTile(patientId, field, value) {
            if (editingTile !== field) return;
            editingTile = null;
            let v = String(value ?? '');
            if (field === 'ward') v = canonicalWard(v);
            else v = v.trim();
            updatePatientField(patientId, field, v);
            renderApp();
        }
        function cancelTile() {
            editingTile = null;
            renderApp();
        }
        // Saves a dropdown / date box straight away (no edit mode needed).
        function setDetailNow(patientId, field, value) {
            updatePatientField(patientId, field, value);
            renderApp();
        }

        document.addEventListener('keydown', (e) => {
            if (!editingTile || !e.target.matches('[data-tile-input]')) return;
            if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
            else if (e.key === 'Escape') { e.preventDefault(); cancelTile(); }
        });
        document.addEventListener('click', (e) => {
            if (!editingTile) return;
            if (e.target.closest('[data-tile-editing], [data-tile-trigger], #modal-container')) return;
            editingTile = null;
            renderApp();
        });

        // Small badge showing which list an entry belongs to.
        function entryTypeBadge(type, size = 'w-8 h-8 text-sm') {
            return type === 'consult'
                ? `<span class="${size} shrink-0 rounded-lg bg-indigo-100 text-indigo-600 inline-flex items-center justify-center" title="Consult entry"><i class="fa-solid fa-user-doctor"></i></span>`
                : `<span class="${size} shrink-0 rounded-lg bg-orange-100 text-orange-600 inline-flex items-center justify-center" title="Inpatient entry"><i class="fa-solid fa-bed-pulse"></i></span>`;
        }

        // Header pieces of the record: name, tags and MRN, each tappable.
        function renderHeaderName(patient, pid) {
            if (editingTile === 'name') {
                return `<span data-tile-editing><input data-tile-input type="text" value="${esc(patient.name)}" onblur="commitTile(${pid}, 'name', this.value)" class="font-extrabold text-slate-900 text-[calc(24px*var(--ts,1))] bg-white border-2 border-indigo-300 rounded-lg px-2 py-0.5 w-56"></span>`;
            }
            return `<span data-tile-trigger onclick="openDetailsEditor(null, 'name')" class="rec-name font-extrabold text-slate-900 text-[calc(20px*var(--ts,1))] sm:text-[calc(26px*var(--ts,1))] cursor-pointer hover:text-indigo-600" title="Tap to edit">${esc(patient.name)}</span>`;
        }
        function renderHeaderMrn(patient, pid) {
            if (editingTile === 'mrn') {
                return `<span data-tile-editing class="text-xs font-semibold text-slate-500">MRN: <input data-tile-input type="text" value="${esc(patient.mrn)}" onblur="commitTile(${pid}, 'mrn', this.value)" class="w-24 bg-white border-2 border-indigo-300 rounded px-1.5 py-0.5 text-xs font-semibold text-slate-800"></span>`;
            }
            return `<span data-tile-trigger onclick="openDetailsEditor(null, 'mrn')" class="text-xs bg-slate-100 hover:bg-slate-200 cursor-pointer px-2.5 py-1 rounded-lg text-slate-500 font-semibold" title="Tap to edit">MRN: ${esc(patient.mrn || '-')}</span>`;
        }
        function renderHeaderTags(patient, settings, pid) {
            const pTags = Array.isArray(patient.tags) ? patient.tags : [];
            const chips = pTags.map(tagName => {
                const t = settings.tags.find(x => x.name === tagName);
                return `<span class="px-2.5 py-1 rounded-lg text-xs font-semibold shadow-xs" style="background-color: ${esc(t ? t.color : '#e0f2fe')}; color: ${esc(t && t.fontColor ? t.fontColor : '#1e40af')}">${esc(tagName)}</span>`;
            }).join('');
            return `
                <div class="relative" ${editingTile === 'tags' ? 'data-tile-editing' : ''}>
                    <div data-tile-trigger onclick="${editingTile === 'tags' ? 'cancelTile()' : "openDetailsEditor(null, 'tags')"}" class="flex items-center gap-1 cursor-pointer rounded-lg hover:bg-slate-50 p-0.5" title="Tap to choose tags">
                        ${chips || '<span class="px-2 py-1 rounded-lg text-xs font-semibold text-slate-400 border border-dashed border-slate-300">+ Tag</span>'}
                    </div>
                    ${editingTile === 'tags' ? `
                        <div class="absolute left-0 top-full mt-1 w-52 bg-white border border-slate-200 rounded-xl shadow-lg z-40 p-2 space-y-1">
                            ${settings.tags.map(t => `
                                <label class="flex items-center gap-2 p-1.5 hover:bg-slate-50 rounded cursor-pointer text-xs">
                                    <input type="checkbox" ${pTags.includes(t.name) ? 'checked' : ''} onchange="togglePatientTag(${pid}, ${jsArg(t.name)})" class="rounded text-indigo-600">

        // Details banner: every box is edited on its own. Dropdowns and dates open with one tap.
        // Compact grid: 2 rows on phones (4 boxes per row for inpatients, 5 for consults), one row on wide screens.
        function renderDetailsBanner(patient, settings, c) {
            const pid = jsArg(patient.id);
            const isConsult = !!c.isConsult;
            const cfg = isConsult ? LIST_CFG.consult : LIST_CFG.inpatient;

            const ageBox = dateBox('dob', 'Age', `
                <span class="${V} text-slate-800" title="${patient.dob ? 'DOB ' + esc(fmtDate(patient.dob)) : 'Tap to set date of birth'}">${ageText(patient, currentViewDate) ? esc(ageText(patient, currentViewDate)) : ''}${patient.dob ? '' : ' ' + MISSING_MARK}</span>`);
            const admittedBox = dateBox('admissionDate', 'Admitted on', `
                <span class="text-[calc(12px*var(--ts,1))] sm:text-[calc(15px*var(--ts,1))] font-bold text-slate-800 leading-tight">${patient.admissionDate ? esc(fmtDate(patient.admissionDate)) : (isConsult ? '—' : MISSING_MARK)}</span>
                <span class="text-[calc(10px*var(--ts,1))] sm:text-[calc(12px*var(--ts,1))] font-bold ${isConsult ? 'text-indigo-600' : 'text-orange-600'} leading-tight">${patient.admissionDate ? `Day ${c.diffDays}` : ''}</span>`);
            const consultBox = isConsult ? dateBox('consultDate', 'Consult date', `
                <span class="text-[calc(12px*var(--ts,1))] sm:text-[calc(15px*var(--ts,1))] font-bold text-indigo-800 leading-tight">${patient.consultDate ? esc(fmtDate(patient.consultDate)) : MISSING_MARK}</span>`,
                { cls: 'bg-indigo-50', labelCls: 'text-indigo-600' }) : '';

            // Folded: one slim line with the essentials
            const loc = [patient.ward, patient.room, patient.bed].map(v => String(v || '').trim());
            // ward, gender and goals of care as small coloured chips (colours from Settings), the rest as text

                esc(ageText(patient, currentViewDate) || ''),
                patient.gender ? chip(patient.gender, c.genderBg) : '',
                patient.admissionDate ? 'Day ' + esc(c.diffDays) : '',
                patient.goalsOfCare ? chip(patient.goalsOfCare, '', `background-color: ${esc(c.gocBg)}; color: ${esc(c.gocColor)}`) : '',
                (isConsult ? patient.consultant : patient.physician) ? 'Dr ' + esc(isConsult ? patient.consultant : patient.physician) : ''].filter(Boolean);
            return `
                <div class="size-scale bg-white ${dcol ? 'px-3 py-2' : 'p-2.5 sm:p-4'} rounded-2xl border border-slate-200 shadow-sm">

                    <button onclick="toggleCoreBox('details')" class="w-full flex items-center gap-2 text-left ${dcol ? '' : 'mb-2'}">

                        <i class="fa-solid fa-chevron-${dcol ? 'down' : 'up'} text-[calc(10px*var(--ts,1))] text-slate-400 shrink-0"></i>
                        ${dcol ? `<span class="min-w-0 truncate text-[calc(12px*var(--ts,1))] font-semibold text-slate-700">${brief.join('<span class="text-slate-300 font-normal mx-1.5">┃</span>')}</span>` : ''}

                            <button data-tile-trigger onclick="${firstText ? `openDetailsEditor(null, '${firstText}')` : ''}" class="px-2.5 py-1 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-[calc(11px*var(--ts,1))] sm:text-xs font-semibold hover:bg-rose-100 flex items-center gap-2 text-left">

                    <div class="det-grid grid ${dcol ? 'hidden' : ''} ${isConsult ? 'grid-cols-5 lg:grid-cols-10' : 'grid-cols-4 lg:grid-cols-8'} gap-1.5 sm:gap-2.5 text-center" style="--n: ${isConsult ? 10 : 8}">
                        ${textBox('ward', 'Ward', `<span class="${V}">${orMissing(patient.ward)}</span>`, { cls: '', style: `background-color: ${esc(c.wardBg)}; color: ${esc(c.wardColor)}`, labelCls: 'opacity-75' })}
                        ${textBox('room', 'Room', `<span class="${V} text-slate-800">${orMissing(patient.room)}</span>`)}
                        ${textBox('bed', 'Bed', `<span class="${V} text-slate-800">${orMissing(patient.bed)}</span>`)}
                        ${ageBox}
                        ${selectBox('gender', 'Gender', `<span class="px-2 py-0.5 rounded text-[calc(13px*var(--ts,1))] sm:text-[calc(15px*var(--ts,1))] font-bold ${c.genderBg}">${esc(patient.gender || 'M')}</span>`, ['M', 'F'])}
                        ${admittedBox}
                        ${consultBox}
                        ${selectBox('goalsOfCare', 'Goals of Care', `<span class="${V}">${orMissing(patient.goalsOfCare)}</span>`, settings.goalsOfCare.map(g => g.name), { cls: '', style: `background-color: ${esc(c.gocBg)}; color: ${esc(c.gocColor)}`, labelCls: 'opacity-75' })}
                        ${isConsult
                            ? textBox('physician', cfg.physLabel, `<span class="${V} block text-slate-800">${orMissing(patient.physician)}</span>`)
                              + textBox('consultant', 'Physician', `<span class="${V} block">${orMissing(patient.consultant)}</span>`, { cls: '', style: `background-color: ${c.drColor.bg}; border-color: ${c.drColor.border}; color: ${c.drColor.text}`, labelCls: 'opacity-75' })
                            : textBox('physician', cfg.physLabel, `<span class="${V} block">${orMissing(patient.physician)}</span>`, { cls: '', style: `background-color: ${c.drColor.bg}; border-color: ${c.drColor.border}; color: ${c.drColor.text}`, labelCls: 'opacity-75' })}
                    </div>

        }

        /* ---------- Medical background ---------- */

        // Star / un-star a background entry. Starred entries move to the top; applies to later days too.
        function toggleMedBgStar(patientId, idx) {
            const allPatients = Store.getPatients();
            const info = infoFor(allPatients, patientId);
            const m = info && info.medicalBackground[idx];
            if (!m) return;
            m.starred = !m.starred;
            info.medicalBackground = starredFirst(info.medicalBackground);
            const p = allPatients.find(x => x.id === patientId);
            forwardMedBg(p, curKey(), { type: 'update', id: m.id, field: 'starred', value: m.starred });
            forwardMedBg(p, curKey(), { type: 'reorder', order: info.medicalBackground.map(x => x.id) });
            Store.savePatients(allPatients);
            if (editing && editing.section === 'medbg') editing.idx = info.medicalBackground.findIndex(x => x.id === m.id);
            renderApp();
        }

        function renderMedBgBox(patient, pid) {
            const list = patient.medicalBackground || [];
            return `
                <div class="size-scale bg-white p-2.5 sm:p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <div data-fit class="flex items-center justify-between gap-2 whitespace-nowrap ${isMedicalBgCollapsed ? '' : 'mb-3'}">
                        <div class="flex items-center space-x-2 cursor-pointer" onclick="toggleMedicalBackgroundCollapse()">
                            <h3 class="font-bold text-slate-800 text-[calc(13px*var(--ts,1))] sm:text-sm">Medical Background</h3>
                            <span class="text-[calc(11px*var(--ts,1))] text-slate-400 font-semibold">(${list.length})</span>

                        </div>

                    <div class="${isMedicalBgCollapsed ? 'hidden' : ''}">
                        ${list.length === 0 ? '<p class="text-[calc(11px*var(--ts,1))] sm:text-xs text-slate-400 italic">No medical background recorded.</p>' : ''}
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" data-sort-list="medbg" data-patient-id="${esc(patient.id)}">
                            ${list.map((mb, idx) => isEditingItem('medbg', idx, patient.id) ? `
                                <div data-sort-item data-id="${esc(mb.id || '')}" data-editing class="flex rounded-xl border-2 border-indigo-300 ${mb.starred ? 'bg-yellow-50' : 'bg-white'} overflow-hidden">
                                    ${gripHandle('rounded-r-lg', mb.starred ? 'bg-yellow-200 text-yellow-600' : 'bg-indigo-50 text-indigo-300')}
                                    <div class="flex-1 min-w-0 p-2.5 space-y-1.5">
                                        <textarea rows="1" oninput="autoGrow(this); updateMedicalBackgroundLive(${pid}, ${idx}, 'condition', this.value)" data-enter="done" class="auto-grow resize-none w-full font-semibold text-slate-800 text-[calc(11px*var(--ts,1))] sm:text-xs bg-white border border-slate-300 rounded-lg px-2 py-1.5" placeholder="Condition">${esc(mb.condition || '')}</textarea>
                                        <textarea rows="1" oninput="autoGrow(this); updateMedicalBackgroundLive(${pid}, ${idx}, 'treatment', this.value)" data-enter="done" class="auto-grow resize-none w-full text-slate-600 text-[calc(11px*var(--ts,1))] sm:text-xs bg-white border border-slate-300 rounded-lg px-2 py-1.5" placeholder="Medications / Treatment">${esc(mb.treatment || '')}</textarea>
                                        <div class="flex items-center justify-between pt-0.5">
                                            <div class="flex items-center gap-2">
                                                <button onclick="deleteMedicalBackground(${pid}, ${idx})" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-[calc(11px*var(--ts,1))] font-semibold"><i class="fa-solid fa-trash"></i> Delete</button>
                                                <button onclick="toggleMedBgStar(${pid}, ${idx})" class="w-7 h-7 rounded-full flex items-center justify-center transition ${mb.starred ? 'bg-yellow-300 text-yellow-800' : 'bg-slate-100 text-slate-400 hover:bg-yellow-100 hover:text-yellow-600'}" title="${mb.starred ? 'Remove highlight' : 'Highlight as important'}"><i class="fa-${mb.starred ? 'solid' : 'regular'} fa-star text-xs"></i></button>
                                            </div>

                                <div data-sort-item data-id="${esc(mb.id || '')}" class="flex rounded-xl border overflow-hidden ${mb.starred ? 'bg-yellow-100 border-yellow-300' : 'bg-slate-50 border-slate-200/80'}">

                                    <div data-edit-trigger onclick="startEditing('medbg', ${idx})" class="${mb.starred ? 'cursor-text hover:bg-yellow-50' : 'edit-trigger'} flex-1 min-w-0 p-2.5 sm:p-3 text-[calc(11px*var(--ts,1))] sm:text-xs" title="Click to edit">
                                        <div class="font-semibold text-slate-800 break-words">${esc(mb.condition) || '<span class="text-slate-400 italic font-normal">Condition</span>'}</div>
                                        ${mb.treatment ? `<div class="text-slate-600 mt-0.5 break-words">${esc(mb.treatment)}</div>` : ''}
